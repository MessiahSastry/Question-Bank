
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - 'quiz.html'
      - 'online-class.html'
      - 'firebase-site/online-class-teacher.html'
      - 'firebase-site/online-class.html'
      - 'firebase.json'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy latest quiz.html
        run: cp quiz.html firebase-site/quiz.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage the current online-class student page
        run: cp online-class.html firebase-site/online-class.html

      - name: Validate online-class code before Hosting deployment
        run: |
          npm --prefix zoom-functions run check
          npm --prefix zoom-functions test

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STPATRICKS_QUESTIONBANK }}
          channelId: live
          projectId: stpatricks-questionbank
