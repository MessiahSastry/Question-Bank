
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - 'quiz.html'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy latest quiz.html
        run: cp quiz.html firebase-site/quiz.html

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STPATRICKS_QUESTIONBANK }}
          channelId: live
          projectId: stpatricks-questionbank
