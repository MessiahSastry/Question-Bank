name: Validate Zoom integration (no deployment)

on:
  pull_request:
    paths:
      - 'zoom-functions/**'
      - 'online-class-teacher.html'
      - 'online-class.html'
      - 'scripts/check-online-class.js'
      - 'firebase-site/online-class-teacher.html'
      - 'firebase-site/online-class.html'
      - 'firebase.json'
      - '.github/workflows/zoom-pr-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all Zoom modules, both pages and Hosting configuration
        run: npm --prefix zoom-functions run check
      - name: Install locked Zoom dependencies
        run: npm --prefix zoom-functions ci --ignore-scripts --no-audit --no-fund
      - name: Verify Firebase SDK compatibility without production access
        run: npm --prefix zoom-functions run smoke
      - name: Test attendance, authorization, SDK access and reconnect handling
        run: npm --prefix zoom-functions test
