name: Deploy Zoom functions (isolated)

on:
  push:
    branches: [main]
    paths:
      - 'zoom-functions/**'
      - '.github/workflows/firebase-functions-zoom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-zoom-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate using the existing Firebase deployment identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STPATRICKS_QUESTIONBANK }}

      - name: Identify deployment service account (email only, no secret values)
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          const credentials = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!credentials.client_email) throw new Error('No deployment service account identity found');
          console.log('GitHub deployment service account: ' + credentials.client_email);
          NODE

      - name: Install Zoom function dependencies
        run: npm --prefix zoom-functions install --no-audit --no-fund

      - name: Validate Zoom function syntax
        run: npm --prefix zoom-functions run check

      - name: Deploy Zoom functions only (never the default functions or Hosting)
        run: npx --yes firebase-tools@latest deploy --only functions:zoom --project stpatricks-questionbank --non-interactive
