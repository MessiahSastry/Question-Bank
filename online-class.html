<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online Class (Zoom) | St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body { background:#f4f8fc; margin:0; font-family:'Segoe UI', Arial, sans-serif; color:#0f2a49; }
    /* Header (match quiz style) */
    #main-header{
      background:linear-gradient(90deg,#1762a7,#0f3d6b);
      color:#fff;
      border-bottom-left-radius:28px; border-bottom-right-radius:28px;
      min-height:86px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:15px 10px 18px 10px; box-sizing:border-box; position:fixed; top:0; left:0; width:100vw; z-index:100;
    }
    .school-title{ font-size:1.7em; font-weight:bold; margin:0; }
    .subtitle{ font-size:1.04em; color:#e0eaff; margin-top:4px; }

    /* Card container */
    .container {
      background:#fff; max-width:520px; margin:28px auto 0 auto;
      box-shadow:0 4px 16px #0f3d6b22; border-radius:18px; padding:24px 20px 20px 20px;
      margin-top:110px;
    }
    .title { font-size:1.28em; color:#1762a7; font-weight:bold; text-align:center; margin:-6px 0 10px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    label { font-weight:600; color:#185496; }
    input, select, button {
      width:100%; padding:12px; border-radius:10px; border:1.3px solid #bcd6ef; font-size:1.02em; box-sizing:border-box;
    }
    input, select { background:#f7fafd; color:#12416c; }
    button {
      background:#1762a7; color:#fff; border:none; font-weight:700; cursor:pointer;
      box-shadow:0 2px 10px #1762a733; letter-spacing:.02em;
    }
    button.ghost{ background:#fff; color:#1762a7; border:1px solid #1762a7; box-shadow:none; }
    .muted{ color:#51729d; } .small{ font-size:.95em; } .success{ color:#126c30; } .danger{ color:#c82333; }
    .hint { font-size:.92em; color:#6b89b3; margin-top:4px; }
    .info-line { margin:6px 0; color:#175799; }
    .countdown { font-weight:700; color:#d63031; }

    /* Spinner */
    #page-spinner{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.15);
      z-index:9999; align-items:center; justify-content:center;
    }
    #page-spinner > div{
      background:#fff; padding:28px 24px; border-radius:16px; box-shadow:0 4px 24px #0f3d6b25; display:flex; flex-direction:column; align-items:center;
    }

    /* Auth Modal (matching quiz) */
    #quiz-auth-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0007;
      z-index: 200; display: flex; align-items: center; justify-content: center;
    }
    #quiz-auth-modal-inner {
      background: #fff; padding: 32px 26px 24px 26px; border-radius: 18px;
      box-shadow: 0 4px 24px #0f3d6b22; max-width: 97vw; min-width: 320px; width: 380px; text-align: left;
    }
    .form-group { margin-bottom: 18px; display:flex; flex-direction:column; align-items:stretch; }
    .form-group label { font-weight: 600; color: #185496; margin-bottom: 7px; font-size: 1.11em; display: block; }
    .custom-dropdown, #quiz-auth-modal input[type="tel"], #quiz-auth-modal input.pin-input {
      background: #f7fafd; border: 1.3px solid #bcd6ef; border-radius: 6px; padding: 10px 12px; font-size: 1.09em; color: #12416c; width: 100%; margin-bottom: 0; box-sizing: border-box;
    }
    .selected-option { background: transparent !important; border: none !important; font-size: 1.09em; padding: 0 !important; color: #12416c !important; cursor: default; text-align: left; outline: none; min-height: 28px; }
    .dropdown-options { display:none; }
    .pin-wrap{ position:relative; }
    .pin-input{ padding-right:40px; }
    .pin-eye{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:transparent; border:none; cursor:pointer; color:#185496; font-size:1.05em; }
    #quiz-auth-modal button:not(.pin-eye) {
      width: 100%; background: #1762a7; color: #fff; border: none; border-radius: 7px; padding: 14px 0; font-weight: bold; font-size: 1.13em; cursor: pointer; margin-top: 16px; margin-bottom: 4px; box-shadow: 0 2px 10px #1762a733; letter-spacing: 0.04em;
    }
    #quiz-auth-modal h2 { color:#1762a7; font-size:1.36em; margin-bottom:18px; text-align:center; font-weight:bold; }

    /* Join button area */
    .join-area { margin-top: 14px; display:flex; gap:10px; flex-wrap:wrap; }
    .join-btn { flex:1 1 100%; font-size:1.12em; padding:13px; border-radius:9px; }
  </style>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
  <!-- Spinner -->
  <div id="page-spinner">
    <div>
      <i class="fa fa-spinner fa-spin" style="font-size:2.2em;color:#1762a7;margin-bottom:10px;"></i>
      <div style="color:#1762a7;font-weight:bold;">Loading…</div>
    </div>
  </div>

  <!-- Header -->
  <header id="main-header">
    <h1 class="school-title">St. Patrick's School</h1>
    <div class="subtitle">IIT & NEET FOUNDATION</div>
  </header>

  <!-- Auth Modal (same look as quiz, but class/section are locked) -->
  <div id="quiz-auth-modal" style="display:flex;">
    <div id="quiz-auth-modal-inner">
      <h2>Student Access</h2>

      <div class="form-group">
        <label>Class:</label>
        <div class="custom-dropdown">
          <span id="selected-class" class="selected-option">Loading…</span>
        </div>
      </div>

      <div class="form-group">
        <label>Section:</label>
        <div class="custom-dropdown">
          <span id="selected-section" class="selected-option">Loading…</span>
        </div>
      </div>

      <div class="form-group">
        <label for="student-phone">Phone Number:</label>
        <input type="tel" id="student-phone" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="tel"
               placeholder="Enter 10-digit number">
      </div>

      <div id="student-name-msg" style="margin:6px 0 0 0; font-size:1.07em; min-height:24px;"></div>

      <!-- Activate (first time) -->
      <div id="activate-pane" style="display:none;">
        <div class="form-group">
          <label for="pin1">Set PIN (6 digits):</label>
          <div class="pin-wrap">
            <input type="password" id="pin1" class="pin-input" maxlength="6" inputmode="numeric" placeholder="6 digit pin">
            <button id="pin1-eye" class="pin-eye" type="button" aria-label="Show PIN"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label for="pin2">Confirm PIN:</label>
          <div class="pin-wrap">
            <input type="password" id="pin2" class="pin-input" maxlength="6" inputmode="numeric" placeholder="6 digit pin">
            <button id="pin2-eye" class="pin-eye" type="button" aria-label="Show PIN"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <button id="activate-btn" type="button">Activate</button>
      </div>

      <!-- Login (returning) -->
      <div id="login-pane" style="display:none;">
        <div class="form-group">
          <label for="pin-login">Enter PIN:</label>
          <div class="pin-wrap">
            <input type="password" id="pin-login" class="pin-input" maxlength="6" inputmode="numeric" placeholder="6 digit pin">
            <button id="pin-login-eye" class="pin-eye" type="button" aria-label="Show PIN"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <button id="login-btn" type="button">Login</button>
      </div>

      <div id="otp-status-msg" style="color:#c82333;margin:9px 0 0 0;font-size:1em;display:none;"></div>
    </div>
  </div>

  <!-- Page Body -->
  <div class="container">
    <div class="title">Online Class (Zoom)</div>
    <div id="meeting-info" class="muted small">Loading meeting…</div>

    <div class="info-line"><b>Class:</b> <span id="info-class">-</span> &nbsp; <b>Section:</b> <span id="info-section">-</span></div>
    <div class="info-line"><b>Subject:</b> <span id="info-subject">-</span></div>
    <div class="info-line"><b>Topic:</b> <span id="info-topic">-</span></div>
    <div class="info-line"><b>Teacher:</b> <span id="info-teacher">-</span></div>
    <div class="info-line"><b>Scheduled:</b> <span id="info-when">-</span></div>
    <div class="info-line"><b>Status:</b> <span id="info-status">Checking…</span></div>

    <div class="join-area">
      <button id="join-btn" class="join-btn" disabled><i class="fa fa-video"></i> &nbsp; Join on Zoom</button>
    </div>

    <div id="status" class="hint" style="min-height:22px;margin-top:8px;"></div>
  </div>

  <script>
    // ================= CONFIG =================
    const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.appspot.com",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ================ UTILS ===================
    const $ = s => document.querySelector(s);
    function showSpin(on){ $('#page-spinner').style.display = on ? 'flex' : 'none'; }
    function fmt(d){ try{ return new Date(d).toLocaleString(); }catch(e){ return d; } }
    function b64(s){ try{ return btoa(unescape(encodeURIComponent(s||""))); }catch(e){ return ""; } }
    function getAcademicYear(startMonthIdx=5){
      const now=new Date(); const y=now.getFullYear(); const m=now.getMonth();
      const startYear=(m>=startMonthIdx)?y:(y-1); const nextShort=String((startYear+1)%100).padStart(2,'0');
      return `${startYear}-${nextShort}`;
    }
    function getActiveAcademicYear(){
      const q = new URLSearchParams(location.search).get('year');
      if (q && /^\d{4}-\d{2}$/.test(q)) return q;
      const stored = localStorage.getItem('sp_selectedYear');
      if (stored && /^\d{4}-\d{2}$/.test(stored)) return stored;
      return getAcademicYear();
    }
    function setStatus(t,isErr){ const el=$('#status'); el.textContent=t||''; el.className='hint '+(isErr?'danger':'success'); }

    // ============= STATE ===============
    const usp = new URLSearchParams(location.search);
    const meetingId = usp.get('m') || '';
    const academicYear = getActiveAcademicYear();
    let meeting = null;
    let zoomWebUrl = '';
    let className='', sectionName='', subject='', topic='', teacherName='', startAt=null;
    let classDocId='', sectionDocId='', studentDocId='', studentName='', parentPhone='';
    let heartbeatTimer = null;
    let sessionRef = null;
    let firstBeat = true;

    // ======= Modal helpers =======
    function attachPinToggle(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const btn   = document.getElementById(buttonId);
      if (!input || !btn) return;
      btn.onclick = () => {
        const nowHidden = input.type === 'password';
        input.type = nowHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', nowHidden ? 'Hide PIN' : 'Show PIN');
        const icon = btn.querySelector('i');
        if (icon) { icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash'); }
        input.focus();
      };
    }

    // Resolve class/section doc IDs from names
    async function resolveClassSectionIds(year, className, sectionName){
      const classesRef = db.collection('years').doc(year).collection('classes');
      const cSnap = await classesRef.where('name','==',className).limit(1).get();
      if (cSnap.empty) throw new Error('Class not found in year');
      const cDoc = cSnap.docs[0];
      const sSnap = await cDoc.ref.collection('sections').where('name','==',sectionName).limit(1).get();
      if (sSnap.empty) throw new Error('Section not found in class');
      return { classDocId: cDoc.id, sectionDocId: sSnap.docs[0].id };
    }

    // ======= Meeting Load =======
    async function loadMeeting(){
      if (!meetingId) { $('#meeting-info').textContent='Invalid link. Meeting id missing.'; return; }
      showSpin(true);
      try {
        const mDoc = await db.collection('meetings').doc(meetingId).get();
        if (!mDoc.exists) { $('#meeting-info').textContent='Meeting not found or expired.'; showSpin(false); return; }
        meeting = mDoc.data()||{};
        className   = (meeting.class||'').trim();
        sectionName = (meeting.section||'').trim();
        subject     = (meeting.subject||'').trim();
        topic       = (meeting.topic||'').trim();
        teacherName = (meeting.teacherName||'').trim();
        startAt     = meeting.startAt && meeting.startAt.toDate ? meeting.startAt.toDate() : null;
        zoomWebUrl  = (meeting.zoomWebUrl||meeting.zoomJoinUrl||'').trim();

        // Fill UI
        $('#meeting-info').textContent = 'Please authenticate below to join.';
        $('#info-class').textContent = className || '-';
        $('#info-section').textContent = sectionName || '-';
        $('#info-subject').textContent = subject || '-';
        $('#info-topic').textContent = topic || '-';
        $('#info-teacher').textContent = teacherName || '-';
        $('#info-when').textContent = startAt ? fmt(startAt) : '-';

        // Lock visible class/section in modal
        $('#selected-class').textContent = className || '(unknown)';
        $('#selected-section').textContent = sectionName || '(unknown)';

        // Resolve ids
        const ids = await resolveClassSectionIds(academicYear, className, sectionName);
        classDocId = ids.classDocId; sectionDocId = ids.sectionDocId;

        // Enable countdown gating
        setupCountdown();

      } catch(e){
        $('#meeting-info').textContent = 'Error loading meeting. '+(e&&e.message?e.message:e);
      } finally {
        showSpin(false);
      }
    }

    // ======= Student Lookup (by phone) =======
    async function fetchAndShowStudentName(){
      const phIn = ($('#student-phone').value || '');
      const ph = phIn.replace(/\D/g,'').slice(0,10);
      if (ph !== phIn) $('#student-phone').value = ph;
      const msg = $('#student-name-msg');
      msg.textContent = '';
      $('#activate-pane').style.display = 'none';
      $('#login-pane').style.display = 'none';

      if (!(classDocId && sectionDocId && ph.length===10)) return;

      try{
        const stuSnap = await db.collection('years').doc(academicYear)
          .collection('classes').doc(classDocId)
          .collection('sections').doc(sectionDocId)
          .collection('students').where('parentPhone','==',ph).limit(1).get();

        if (stuSnap.empty){
          msg.style.color = '#c82333'; msg.textContent = "No student found for given details."; return;
        }
        const stuDoc = stuSnap.docs[0];
        studentDocId = stuDoc.id;
        const data = stuDoc.data()||{};
        parentPhone = ph;
        studentName = (data.name||'Student').trim();
        msg.style.color = '#126c30'; msg.style.fontWeight='700'; msg.textContent = `Welcome, ${studentName}`;

        // Check secret existence
        const secretRef = db.collection('years').doc(academicYear)
          .collection('classes').doc(classDocId)
          .collection('sections').doc(sectionDocId)
          .collection('studentSecrets').doc(studentDocId);
        const secDoc = await secretRef.get();
        const activated = !!(secDoc.exists && (secDoc.data()?.pinPlain));

        if (activated) {
          $('#activate-pane').style.display = 'none';
          $('#login-pane').style.display = '';
        } else {
          $('#activate-pane').style.display = '';
          $('#login-pane').style.display = 'none';
        }

      }catch(e){
        msg.style.color = '#c82333'; msg.textContent = 'Error fetching student.';
        console.error('fetch student error', e);
      }
    }

    // ======= Countdown & gating =======
    function setupCountdown(){
      const statusEl = $('#info-status');
      const joinBtn = $('#join-btn');

      function update(){
        if (!startAt) { statusEl.textContent='No start time.'; joinBtn.disabled = true; return; }
        const now = Date.now();
        const startMs = startAt.getTime();
        const openAt = startMs - 10*60*1000; // 10 minutes before
        if (now < openAt){
          const rem = openAt - now;
          const m = Math.floor(rem/60000), s = Math.floor((rem%60000)/1000);
          statusEl.innerHTML = `Join opens in <span class="countdown">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>`;
          joinBtn.disabled = true;
        } else {
          statusEl.textContent = 'Join is open';
          joinBtn.disabled = false;
        }
      }
      update();
      setInterval(update, 1000);
    }

    // ======= Heartbeat/session logging =======
    async function ensureParticipantDoc(){
      if (!(meetingId && studentDocId)) return;
      const partRef = db.collection('meetings').doc(meetingId).collection('participants').doc(studentDocId);
      await partRef.set({
        name: studentName || 'Student',
        phone: parentPhone || '',
        class: className, section: sectionName,
        firstJoinAt: firebase.firestore.FieldValue.serverTimestamp(),
        joinCount: firebase.firestore.FieldValue.increment(1)
      }, { merge: true });
    }

    async function startHeartbeat(){
      if (heartbeatTimer) return;
      // open session subdoc
      const sessionsCol = db.collection('meetings').doc(meetingId)
        .collection('participants').doc(studentDocId)
        .collection('sessions');
      sessionRef = await sessionsCol.add({
        startedAt: firebase.firestore.FieldValue.serverTimestamp(),
        endedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      firstBeat = true;

      heartbeatTimer = setInterval(async ()=>{
        try{
          const partRef = db.collection('meetings').doc(meetingId).collection('participants').doc(studentDocId);
          await partRef.set({ lastSeenAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
          if (sessionRef) {
            await sessionRef.set({ endedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
          }
        }catch(e){ /* ignore transient */ }
      }, 30000); // 30s
    }

    async function stopHeartbeat(){
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer=null; }
      try{
        if (sessionRef){
          await sessionRef.set({ endedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
        }
      }catch(e){}
    }

    window.addEventListener('beforeunload', stopHeartbeat);
    document.addEventListener('visibilitychange', ()=>{
      if (document.hidden) { stopHeartbeat(); }
      else if (studentDocId) { startHeartbeat(); }
    });

    // ======= PIN Activate & Login (NO LOCKOUT) =======
    function getShared(){ return { ph: ($('#student-phone').value||'').trim() }; }
    function showError(t){ const s=$('#otp-status-msg'); s.style.display=''; s.style.color='#c82333'; s.textContent=t; }
    function showOk(t){ const s=$('#otp-status-msg'); s.style.display=''; s.style.color='#126c30'; s.textContent=t; }

    function attachPINEyes(){
      attachPinToggle('pin1','pin1-eye');
      attachPinToggle('pin2','pin2-eye');
      attachPinToggle('pin-login','pin-login-eye');
    }

    // Activate (first time)
    async function handleActivate(){
      const { ph } = getShared();
      const pin1 = ($('#pin1').value||'').trim();
      const pin2 = ($('#pin2').value||'').trim();

      if (ph.length!==10) return showError('Enter 10-digit phone.');
      if (pin1.length!==6 || /\D/.test(pin1)) return showError('PIN must be 6 digits.');
      if (pin1!==pin2) return showError('PIN and Confirm PIN must match.');
      if (!(classDocId && sectionDocId && studentDocId)) return showError('Re-enter phone to fetch your name.');

      showOk('Saving…');
      try{
        const secretRef = db.collection('years').doc(academicYear)
          .collection('classes').doc(classDocId)
          .collection('sections').doc(sectionDocId)
          .collection('studentSecrets').doc(studentDocId);
        const stuRef = db.collection('years').doc(academicYear)
          .collection('classes').doc(classDocId)
          .collection('sections').doc(sectionDocId)
          .collection('students').doc(studentDocId);

        await secretRef.set({ pinPlain: pin1, parentPhone: ph, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
        await stuRef.set({ registered: true }, { merge:true });

        $('#activate-pane').style.display='none';
        $('#login-pane').style.display='none';
        $('#quiz-auth-modal').style.display='none';
        setStatus('Activation successful. You can join when the button opens.', false);

        await ensureParticipantDoc();
        await startHeartbeat();

      }catch(e){
        showError(e&&e.message?e.message:'Activation failed.');
      }
    }

    // Login (returning)
    async function handleLogin(){
      const { ph } = getShared();
      const pin = ($('#pin-login').value||'').trim();

      if (ph.length!==10) return showError('Enter 10-digit phone.');
      if (pin.length!==6 || /\D/.test(pin)) return showError('PIN must be 6 digits.');
      if (!(classDocId && sectionDocId && studentDocId)) return showError('Re-enter phone to fetch your name.');

      showOk('Verifying…');
      try{
        const secretRef = db.collection('years').doc(academicYear)
          .collection('classes').doc(classDocId)
          .collection('sections').doc(sectionDocId)
          .collection('studentSecrets').doc(studentDocId);
        const secDoc = await secretRef.get();
        const ok = !!(secDoc.exists && (secDoc.data()?.pinPlain) === pin);

        if (ok){
          $('#activate-pane').style.display='none';
          $('#login-pane').style.display='none';
          $('#quiz-auth-modal').style.display='none';
          setStatus('Verified. You can join when the button opens.', false);

          await ensureParticipantDoc();
          await startHeartbeat();
        } else {
          showError('Wrong PIN. Try again.'); // NO LOCKOUT
        }
      }catch(e){
        showError(e&&e.message?e.message:'Login failed.');
      }
    }

    // ======= Join =======
    function joinZoom(){
      if (!zoomWebUrl){ setStatus('Zoom link not available. Contact teacher.', true); return; }
      try{
        const u = new URL(zoomWebUrl);
        u.searchParams.set('prefer','1');
        u.searchParams.set('un', b64(studentName || 'Student'));
        location.href = u.toString();
      }catch(e){
        location.href = zoomWebUrl;
      }
    }

    // ======= Wiring =======
    window.onload = function(){
      // Make sure header/container are outside modal
      try{
        const modal = $('#quiz-auth-modal');
        const header = $('#main-header');
        const container = $('.container');
        if (modal && header && modal.contains(header)) document.body.appendChild(header);
        if (modal && container && modal.contains(container)) document.body.appendChild(container);
      }catch(e){}

      // Inputs
      const phoneEl = $('#student-phone');
      ['input','change','blur','paste'].forEach(evt => phoneEl.addEventListener(evt, fetchAndShowStudentName));
      attachPINEyes();
      $('#activate-btn').onclick = handleActivate;
      $('#login-btn').onclick = handleLogin;
      $('#join-btn').onclick = joinZoom;

      // Load meeting
      loadMeeting();
    };
  </script>
</body>
</html>
