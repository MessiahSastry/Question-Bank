      cursor:pointer;

    .custom-dropdown{

      color:#fff;

      getSubjectsForBoard(boardName) {
        const b = (boardName || '').trim();

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'app-toast';
      t.textContent = msg;
      document.body.appendChild(t);

      setTimeout(() => {
        t.style.transition = 'opacity .35s';
        t.style.opacity = '0';
      }, 1200);

      setTimeout(() => t.remove(), 1700);
    }

    function chapterBoardSlug(boardName) {
      return (boardName || '')
        .toString()
        .trim()
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function loadBoardChapterFile(boardName) {
      const board = (boardName || '').trim();
      if (!board || board === 'Other') return Promise.resolve(false);

      const slug = chapterBoardSlug(board);
      if (!slug) return Promise.resolve(false);

      const fileName = `chapters-${slug}.js`;

      if (window.__loadedChapterBoardFiles[fileName]) {
        return Promise.resolve(true);
      }

      return new Promise((resolve) => {
        const existing = document.querySelector(`script[data-chapter-file="${fileName}"]`);
        if (existing) {
          existing.addEventListener('load', () => {
            window.__loadedChapterBoardFiles[fileName] = true;
            resolve(true);
          }, { once: true });
          existing.addEventListener('error', () => resolve(false), { once: true });
          return;
        }

        const s = document.createElement('script');
        s.src = fileName;
        s.async = true;
        s.setAttribute('data-chapter-file', fileName);

        s.onload = () => {
          window.__loadedChapterBoardFiles[fileName] = true;
          resolve(true);
        };

        s.onerror = () => resolve(false);

        document.head.appendChild(s);
      });
    }

    function getBoardChapterData(boardName) {
      const board = (boardName || '').trim();
      if (!board) return {};

      const registry = window.BOARD_CHAPTERS || window.boardChapters || {};
      if (registry && typeof registry === 'object' && registry[board]) {
        return registry[board];
      }

      const globalKey = `CHAPTERS_${board.toUpperCase().replace(/[^A-Z0-9]+/g, '_')}`;
      if (window[globalKey] && typeof window[globalKey] === 'object') {
        return window[globalKey];
      }

      return {};
    }

    function loadQuickQuizForm() {

            <div id="subject-other-wrap" style="display:none; margin-top:10px;">
              <label style="font-size:0.95em;">Type Subject Name:</label>
              <input type="text" id="subject-other-input" placeholder="Enter Subject Name">
            </div>
          </div>

                    <div class="form-group">

document
  .getElementById('generate-quiz-btn')
  .addEventListener('click', function() {
    const l1 =
      parseInt(
        document.getElementById('lvl1')?.value || '0',
        10
      ) || 0;

    const l2 =
      parseInt(
        document.getElementById('lvl2')?.value || '0',
        10
      ) || 0;

    const l3 =
      parseInt(
        document.getElementById('lvl3')?.value || '0',
        10
      ) || 0;

    const total = l1 + l2 + l3;

    const rawBoard =
      document.getElementById('board-value')?.value || '';

    const otherBoard =
      (
        document.getElementById('board-other-input')?.value || ''
      ).trim();

    const finalBoard =
      rawBoard === 'Other'
        ? otherBoard
        : rawBoard;

    const rawSubject =
      document.getElementById('subject-value')?.value || '';

    const otherSubject =
      (
        document.getElementById('subject-other-input')?.value || ''
      ).trim();

    const finalSubject =
      rawSubject === 'Other'
        ? otherSubject
        : rawSubject;

    const params = {
      academicYear:
        localStorage.getItem('sp_selectedYear') || '',

      class:
        document.getElementById('class-value')?.value || '',

      board: finalBoard,
      subject: finalSubject,

      chapter:
        (
          document.getElementById('chapter-value')?.value || ''
        ).trim(),

      questionType:
        document.getElementById('qtype-value')?.value || '',

      l1,
      l2,
      l3,
      total,

      quizId: makeQuickQuizId()
    };

    if (
      !params.academicYear ||
      !params.class ||
      !params.board ||
      !params.subject ||
      !params.chapter ||
      !params.questionType
    ) {
      toast(
        'Please select academic year and fill all fields.'
      );
      return;
    }

    if (total <= 0) {
      toast('Please enter at least 1 question.');
      return;
    }

    pendingQuizMeta = params;

    const jsonPanel =
      document.getElementById('quiz-json-panel');

    const jsonInput =
      document.getElementById('quiz-json-input');

    const linkArea =
      document.getElementById('quiz-link-area');

    const status =
      document.getElementById('save-quiz-status');

    if (jsonPanel) {
      jsonPanel.hidden = false;
      jsonPanel.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }

    if (jsonInput) {
      jsonInput.value = '';
    }

    if (linkArea) {
      linkArea.hidden = true;
    }

    if (status) {
      status.textContent =
        'Gemini is opening. Copy its JSON result and paste it here.';
      status.style.color = '#185496';
    }

    const prompt =
      buildGeminiQuizPrompt(params);

    openGeminiWithPrompt(prompt);
  });

    const status =
      document.getElementById('save-quiz-status');

    const rawJson =
      (
        document.getElementById('quiz-json-input')?.value || ''
      ).trim();

    if (!pendingQuizMeta) {
      toast('Generate the quiz questions first.');
      return;
    }

    if (!rawJson) {
      toast('Paste the Gemini JSON first.');
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = 'Saving Quiz...';

    if (status) {
      status.style.color = '#185496';
      status.textContent =
        'Checking the questions and saving the quiz...';
    }

    try {
      const parsedData =
        parseGeminiQuizJson(rawJson);

      const normalizedQuestions =
        validateAndNormalizeQuizData(
          parsedData,
          pendingQuizMeta
        );

      await saveQuizToFirestore(
        pendingQuizMeta,
        normalizedQuestions
      );

      const studentLink =
        buildStudentQuizLink(pendingQuizMeta);

      const linkInput =
        document.getElementById('generated-quiz-link');

      const linkArea =
        document.getElementById('quiz-link-area');

      if (linkInput) {
        linkInput.value = studentLink;
      }

      if (linkArea) {
        linkArea.hidden = false;
      }

      if (status) {
        status.style.color = '#126c30';
        status.textContent =
          'Quiz saved successfully. Copy and share the student link.';
      }

      toast('Quiz saved successfully.');

    } catch (error) {
      console.error('Quiz saving failed:', error);

      if (status) {
        status.style.color = '#c82333';
        status.textContent =
          error?.message || 'Unable to save the quiz.';
      }

    } finally {
      saveButton.disabled = false;
      saveButton.textContent =
        'Save Quiz and Create Student Link';
    }
  });

    function setupCustomDropdown(dropdownId, inputId, callback) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;

      const selected = dropdown.querySelector('.selected-option');
      const options = dropdown.querySelector('.dropdown-options');
      const input = document.getElementById(inputId);

      selected.onclick = (e) => {
        e.stopPropagation();
        toggleDropdown(dropdownId);
      };

      optionsContainerListener(options, selected, input, dropdown, callback);
    }

    function optionsContainerListener(options, selected, input, dropdown, callback) {
      options.querySelectorAll('div[data-value]').forEach(option => {
        option.onclick = () => {
          selected.textContent = option.textContent;
          input.value = option.dataset.value;
          dropdown.classList.remove('open');
          if (callback) callback(input.value);
        };
      });
    }

    function toggleDropdown(dropdownId) {
      const currentDropdown = document.getElementById(dropdownId);
      if (!currentDropdown) return;

      const currentlyOpen = currentDropdown.classList.contains('open');

      document.querySelectorAll('.custom-dropdown.open').forEach(d => {
        if (d.id !== dropdownId) d.classList.remove('open');
      });

      if (!currentlyOpen) currentDropdown.classList.add('open');
    }

    function syncOtherToggles() {
      const boardVal = document.getElementById('board-value')?.value || '';
      const subjectVal = document.getElementById('subject-value')?.value || '';

      const boardWrap = document.getElementById('board-other-wrap');
      const boardOther = document.getElementById('board-other-input');

      const subjectWrap = document.getElementById('subject-other-wrap');
      const subjectOther = document.getElementById('subject-other-input');

      const subjectSelected = document.querySelector('#subject-dropdown .selected-option');
      const subjectHidden = document.getElementById('subject-value');

      const boardIsOther = (boardVal === 'Other');
      const subjectIsOther = (subjectVal === 'Other');

      if (boardWrap) boardWrap.style.display = boardIsOther ? 'block' : 'none';
      if (!boardIsOther && boardOther) boardOther.value = '';

      const showSubjectOther = boardIsOther || subjectIsOther;
      if (subjectWrap) subjectWrap.style.display = showSubjectOther ? 'block' : 'none';
      if (!showSubjectOther && subjectOther) subjectOther.value = '';

      if (boardIsOther && subjectHidden && subjectHidden.value !== 'Other') {
        subjectHidden.value = 'Other';
        if (subjectSelected) subjectSelected.textContent = 'Other';
      }
    }

    function syncTotal() {
      const l1 = parseInt(document.getElementById('lvl1')?.value || '0', 10) || 0;
      const l2 = parseInt(document.getElementById('lvl2')?.value || '0', 10) || 0;
      const l3 = parseInt(document.getElementById('lvl3')?.value || '0', 10) || 0;
      const total = document.getElementById('lvl-total');
      if (total) total.value = String(l1 + l2 + l3);

    function updateSubjectDropdown(selectedBoard) {
      const subjectDropdown = document.getElementById('subject-dropdown');
      if (!subjectDropdown) return;

      const subjectOptions = subjectDropdown.querySelector('.dropdown-options');
      const subjectSelected = subjectDropdown.querySelector('.selected-option');
      const subjectInput = document.getElementById('subject-value');

      const newSubjects = quickQuizConfig.getSubjectsForBoard(selectedBoard);
      const newSubjectsWithOther = Array.from(new Set([...(newSubjects || []), "Other"]));

      subjectOptions.innerHTML = newSubjectsWithOther
        .map(s => `<div data-value="${s}">${s}</div>`)
        .join('');

      subjectSelected.textContent = newSubjectsWithOther[0] || 'Select Subject';
      subjectInput.value = newSubjectsWithOther[0] || '';

      optionsContainerListener(
        subjectOptions,
        subjectSelected,
        subjectInput,
        subjectDropdown,
        (newSubject) => {
          syncOtherToggles();
          const selectedClass = document.getElementById('class-value')?.value || '';
          updateChapterDropdown(selectedClass, newSubject);
        }
      );
    }

    async function updateChapterDropdown(selectedClass, selectedSubject) {
      const chapterDropdown = document.getElementById('chapter-dropdown');
      if (!chapterDropdown) return;

      const chapterOptions = chapterDropdown.querySelector('.dropdown-options');
      const chapterSelected = chapterDropdown.querySelector('.selected-option');
      const chapterInput = document.getElementById('chapter-value');

      const resetChapterDropdown = (msg = 'Select Chapter') => {
        chapterOptions.innerHTML = `<div data-value="">${msg}</div>`;
        chapterSelected.textContent = msg;
        chapterInput.value = '';
      };

      const rawBoard = document.getElementById('board-value')?.value || '';
      const otherBoard = (document.getElementById('board-other-input')?.value || '').trim();
      const finalBoard = (rawBoard === 'Other') ? (otherBoard || 'Other') : rawBoard;

      const otherSubject = (document.getElementById('subject-other-input')?.value || '').trim();
      const finalSubject = (selectedSubject === 'Other')
        ? (otherSubject || 'Other')
        : (selectedSubject || '');

      if (!finalBoard || !finalSubject || finalBoard === 'Other' || finalSubject === 'Other') {
        resetChapterDropdown('Select Chapter');
        return;
      }

      await loadBoardChapterFile(finalBoard);
      const boardData = getBoardChapterData(finalBoard);

      let chapters = [];

      if (Array.isArray(boardData?.[finalSubject])) {
        chapters = boardData[finalSubject];
      } else if (Array.isArray(boardData?.[selectedClass]?.[finalSubject])) {
        chapters = boardData[selectedClass][finalSubject];
      } else if (Array.isArray(boardData?.[selectedClass?.trim()]?.[finalSubject])) {
        chapters = boardData[selectedClass.trim()][finalSubject];
      }

      const uniqueChapters = Array.from(new Set((chapters || []).filter(Boolean)));

      if (!uniqueChapters.length) {
        resetChapterDropdown('No chapters available');
        return;
      }

      chapterOptions.innerHTML = uniqueChapters
        .map(ch => `<div data-value="${String(ch).replace(/"/g, '&quot;')}">${ch}</div>`)
        .join('');

      chapterSelected.textContent = uniqueChapters[0];
      chapterInput.value = uniqueChapters[0];

      optionsContainerListener(
        chapterOptions,
        chapterSelected,
        chapterInput,
        chapterDropdown
      );
    }

function parseGeminiQuizJson(rawText) {
  let text =
    String(rawText || '').trim();

  text = text
    .replace(/^```json\s*/i, '')
    .replace(/^```\s*/i, '')
    .replace(/\s*```$/i, '')
    .trim();

  const firstBrace =
    text.indexOf('{');

  const lastBrace =
    text.lastIndexOf('}');

  if (
    firstBrace !== -1 &&
    lastBrace > firstBrace
  ) {
    text =
      text.slice(firstBrace, lastBrace + 1);
  }

  try {
    return JSON.parse(text);
  } catch (error) {
    throw new Error(
      'The pasted Gemini content is not valid JSON. Copy only the complete JSON object.'
    );
  }
}

function normalizeQuestionLevel(value) {
  const text =
    String(value || '')
      .trim()
      .toLowerCase();

  if (
    text === '1' ||
    text === 'l1' ||
    text === 'level1' ||
    text === 'level 1'
  ) {
    return 'Level 1';
  }

  if (
    text === '2' ||
    text === 'l2' ||
    text === 'level2' ||
    text === 'level 2'
  ) {
    return 'Level 2';
  }

  if (
    text === '3' ||
    text === 'l3' ||
    text === 'level3' ||
    text === 'level 3'
  ) {
    return 'Level 3';
  }

  throw new Error(
    'Every question must contain Level 1, Level 2 or Level 3.'
  );
}

function normalizeCorrectAnswer(value) {
  if (
    typeof value === 'number' &&
    Number.isInteger(value)
  ) {
    if (value >= 0 && value <= 3) {
      return String.fromCharCode(65 + value);
    }

    if (value >= 1 && value <= 4) {
      return String.fromCharCode(64 + value);
    }
  }

  const text =
    String(value || '')
      .trim()
      .toUpperCase();

  if (/^[A-D]$/.test(text)) {
    return text;
  }

  const match =
    text.match(/\b([A-D])\b/);

  if (match) {
    return match[1];
  }

  throw new Error(
    'Every correct answer must be A, B, C or D.'
  );
}

function validateAndNormalizeQuizData(
  quizData,
  params
) {
  if (
    !quizData ||
    !Array.isArray(quizData.questions)
  ) {
    throw new Error(
      'The JSON must contain a questions array.'
    );
  }

  if (
    quizData.questions.length !== params.total
  ) {
    throw new Error(
      `Expected ${params.total} questions, but Gemini returned ${quizData.questions.length}.`
    );
  }

  const levelCounts = {
    'Level 1': 0,
    'Level 2': 0,
    'Level 3': 0
  };

  const normalizedQuestions =
    quizData.questions.map(function(question, index) {
      const questionText =
        String(question?.question || '').trim();

      if (!questionText) {
        throw new Error(
          `Question ${index + 1} has no question text.`
        );
      }

      if (
        !Array.isArray(question?.options) ||
        question.options.length !== 4
      ) {
        throw new Error(
          `Question ${index + 1} must have exactly four options.`
        );
      }

      const options =
        question.options.map(function(option) {
          return String(option || '')
            .replace(/^[A-D][\)\.\:\-]\s*/i, '')
            .trim();
        });

      if (options.some(option => !option)) {
        throw new Error(
          `Question ${index + 1} contains an empty option.`
        );
      }

      const answer =
        normalizeCorrectAnswer(question.answer);

      const level =
        normalizeQuestionLevel(question.level);

      levelCounts[level]++;

      let finalQuestionText =
        questionText;

      if (
        !/\(Level\s+[123]\)\s*$/i.test(
          finalQuestionText
        )
      ) {
        finalQuestionText += ` (${level})`;
      }

      return {
        question: finalQuestionText,
        options,
        answer,
        level
      };
    });

  if (levelCounts['Level 1'] !== params.l1) {
    throw new Error(
      `Expected ${params.l1} Level 1 questions, but found ${levelCounts['Level 1']}.`
    );
  }

  if (levelCounts['Level 2'] !== params.l2) {
    throw new Error(
      `Expected ${params.l2} Level 2 questions, but found ${levelCounts['Level 2']}.`
    );
  }

  if (levelCounts['Level 3'] !== params.l3) {
    throw new Error(
      `Expected ${params.l3} Level 3 questions, but found ${levelCounts['Level 3']}.`
    );
  }

  return normalizedQuestions;
}

async function saveQuizToFirestore(
  params,
  questions
) {
  if (!auth.currentUser) {
    throw new Error(
      'Teacher login is required before saving the quiz.'
    );
  }

  const quizDocument = {
    quizId: params.quizId,
    title: `${params.subject} - ${params.chapter}`,

    academicYear: params.academicYear,
    class: params.class,
    board: params.board,
    subject: params.subject,
    chapter: params.chapter,
    questionType: params.questionType,

    level:
      `L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`,

    totalQuestions: questions.length,
    questions,

    createdBy: auth.currentUser.uid,

    createdAt:
      firebase.firestore.FieldValue.serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp(),

    status: 'active'
  };

  await db
    .collection('quizzes')
    .doc(params.quizId)
    .set(quizDocument);
}

function buildStudentQuizLink(params) {
  const url =
    new URL('quiz.html', window.location.href);

  url.search = '';
  url.hash = '';

  url.searchParams.set(
    'quiz',
    params.quizId
  );

  url.searchParams.set(
    'year',
    params.academicYear
  );

  return url.toString();
}
