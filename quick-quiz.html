<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick Quiz | St.Patrick's School</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3d6b">
  <link rel="apple-touch-icon" href="scimentra-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    :root{
      --header-height:90px;
    }

    html{
      height:-webkit-fill-available;
    }

    body{
      margin:0;
      padding:0;
      font-family:'Inter','Segoe UI',Arial,sans-serif;
      background-color:#f4f8fc;
      min-height:100vh;
      height:auto;
      overflow-y:auto;
    }

    body::after{
      content:"St. Patrcik's School\A IIT & NEET FOUNDATION";
      white-space:pre;
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      font-size:5vw;
      font-weight:bold;
      color:rgba(15,61,107,0.04);
      z-index:-1;
      text-align:center;
      pointer-events:none;
      line-height:1.2;
    }

    .page-wrapper{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    #main-header{
      background:linear-gradient(90deg,#1762a7,#0f3d6b);
      color:#fff;
      border-bottom-left-radius:28px;
      border-bottom-right-radius:28px;
      min-height:var(--header-height);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:15px 10px 18px 10px;
      box-sizing:border-box;
      flex-shrink:0;
      position:sticky;
      top:0;
      z-index:1200;
    }

    #main-header .school-title{
      font-size:1.8em;
      font-weight:bold;
      margin:0;
    }

    #main-header .subtitle{
      font-size:1.05em;
      color:#e0eaff;
      margin-top:5px;
    }

    main{
      flex-grow:1;
      display:flex;
      flex-direction:column;
    }

    .review-container{
      width:100%;
      max-width:800px;
      margin:20px auto;
      background:#fff;
      border-radius:16px;
      box-shadow:0 4px 18px rgba(0,27,68,0.1);
      display:flex;
      flex-direction:column;
      overflow:visible;
    }

    .setup-form-container{
      padding:25px 30px;
    }

    .setup-form-container h2{
      text-align:center;
      color:#0f3d6b;
      margin-top:0;
      margin-bottom:20px;
    }

    .setup-form-container .form-group{
      margin-bottom:15px;
    }

    .setup-form-container label{
      font-weight:600;
      margin-bottom:5px;
      color:#185496;
      display:block;
    }

    .setup-form-container input[type="text"],
    .setup-form-container input[type="number"]{
      width:100%;
      padding:10px 12px;
      border-radius:6px;
      border:1.3px solid #bcd6ef;
      font-size:1em;
      background:#f7fafd;
      box-sizing:border-box;
    }

       .setup-form-container button[type="submit"],
    .setup-form-container button[type="button"]{
      background:linear-gradient(90deg,#1762a7,#0f3d6b);
      color:#fff;
      font-weight:bold;
      cursor:pointer;
      padding:12px 0;
      margin-top:16px;
      width:100%;
      border-radius:10px;
      border:none;
      font-size:1.05em;
      box-shadow:0 6px 16px rgba(15,61,107,0.18);
    }

    .custom-dropdown{
      position:relative;
    }

    .selected-option{
      padding:10px 12px;
      color:#12416c;
      background:#f7fafd;
      border-radius:6px;
      border:1.3px solid #bcd6ef;
      cursor:pointer;
      user-select:none;
    }

    .dropdown-options{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:0;
      background:#fff;
      border:1.3px solid #bcd6ef;
      border-top:none;
      border-radius:0 0 6px 6px;
      box-shadow:0 6px 15px rgba(0,27,68,0.1);
      z-index:2000;
      max-height:min(280px,45vh);
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
    }

    .custom-dropdown.open .dropdown-options{
      display:block;
    }

    .dropdown-options div[data-value]{
      padding:10px 15px;
      cursor:pointer;
    }

    .dropdown-options div[data-value]:hover{
      background:#e0eaff;
    }

    .level-box{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:2px;
    }

    .level-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .level-row .label{
      min-width:90px;
      font-weight:600;
      color:#0f3d6b;
    }

    .level-row.total-row .label{
      font-weight:800;
    }

    .level-input,
    .total-input{
      width:72px !important;
      text-align:center;
      padding:10px 12px !important;
      border-radius:14px !important;
      outline:none;
      font-size:18px !important;
      font-weight:700 !important;
      box-shadow:0 1px 0 rgba(0,0,0,0.03) inset;
    }

    .level-input{
      border:2px solid #cfe0f1 !important;
      background:#f4fbff !important;
    }

    .total-input{
      border:2px solid #cfd3d8 !important;
      background:#f6f6f6 !important;
      font-weight:800 !important;
    }

    .helper-note{
      margin-top:12px;
      font-size:12px;
      color:#5b6b7a;
      line-height:1.5;
      text-align:center;
    }

    .app-toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:24px;
      background:#0f3d6b;
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      box-shadow:0 4px 16px rgba(0,0,0,.2);
      z-index:100000;
      font-weight:600;
      font-size:14px;
      opacity:0.98;
    }

    @media (max-width:768px){
      .review-container{
        max-width:calc(100% - 20px);
        margin:15px auto;
      }

      .setup-form-container{
        padding:20px 16px;
      }

      #main-header .school-title{
        font-size:1.55em;
      }

      #main-header .subtitle{
        font-size:0.95em;
      }
    }
  </style>
</head>
<body>
  <script src="chapters.js"></script>

  <div class="page-wrapper">
    <header id="main-header">
      <h1 class="school-title">St. Patrick's School</h1>
      <div class="subtitle">IIT & NEET FOUNDATION</div>
    </header>

    <main>
      <div id="quiz-container" class="review-container">
        <div class="setup-form-container">
          <h2>Quick Quiz</h2>
          <p>Loading...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const quickQuizConfig = {
      classes: [
        "3rd Class", "4th Class", "5th Class", "6th Class",
        "7th Class", "8th Class", "9th Class", "10th Class", "11th Class", "12th Class"
      ],
      boards: [
        "CBSE",
        "ICSE",
        "Olympiad",
        "IIT & NEET Foundation",
        "JEE Mains",
        "JEE Advance",
        "NEET",
        "AP State Board (SCERT)",
        "Other"
      ],
      boardSubjectMappings: {
        "CBSE": [
          "English",
          "Hindi",
          "Mathematics",
          "Science",
          "Social Science",
          "Computer Science / IT",
          "Sanskrit",
          "Physical Education",
          "General Knowledge",
          "Environmental Studies",
          "Other"
        ],
        "ICSE": [
          "English Language",
          "English Literature",
          "Second Language",
          "Mathematics",
          "Physics",
          "Chemistry",
          "Biology",
          "History & Civics",
          "Geography",
          "Computer Applications",
          "Environmental Education",
          "Commercial Studies / Economics",
          "Other"
        ],
        "Olympiad": [
          "Mathematics",
          "Science",
          "English",
          "Reasoning",
          "General Knowledge",
          "Cyber / Computer"
        ],
        "IIT & NEET Foundation": [
          "Math IIT",
          "Physics IIT & NEET",
          "Chemistry IIT & NEET",
          "Biology NEET",
          "Reasoning IIT & NEET"
        ],
        "JEE Mains": [
          "Physics (Mains)",
          "Chemistry (Mains)",
          "Mathematics (Mains)"
        ],
        "JEE Advance": [
          "Physics (Advance)",
          "Chemistry (Advance)",
          "Mathematics (Advance)"
        ],
        "NEET": [
          "Physics (NEET)",
          "Chemistry (NEET)",
          "Biology (NEET)"
        ],
        "AP State Board (SCERT)": [
          "Telugu",
          "Hindi",
          "English",
          "Mathematics",
          "Physical Science",
          "Biological Science",
          "Social Studies",
          "General Science",
          "Computer / ICT",
          "Other"
        ],
        "Other": [
          "Other"
        ]
      },
      questionTypes: [
        "MCQ (Single)",
        "MCQ (Multiple)",
        "Assertion and Reason"
      ],
      getSubjectsForBoard(boardName) {
        const b = (boardName || '').trim();
        const map = this.boardSubjectMappings || {};
        return Array.isArray(map[b]) ? map[b] : (Array.isArray(map["Other"]) ? map["Other"] : []);
      }
    };

    window.__loadedChapterBoardFiles = window.__loadedChapterBoardFiles || {};

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'app-toast';
      t.textContent = msg;
      document.body.appendChild(t);

      setTimeout(() => {
        t.style.transition = 'opacity .35s';
        t.style.opacity = '0';
      }, 1200);

      setTimeout(() => t.remove(), 1700);
    }

    function chapterBoardSlug(boardName) {
      return (boardName || '')
        .toString()
        .trim()
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function loadBoardChapterFile(boardName) {
      const board = (boardName || '').trim();
      if (!board || board === 'Other') return Promise.resolve(false);

      const slug = chapterBoardSlug(board);
      if (!slug) return Promise.resolve(false);

      const fileName = `chapters-${slug}.js`;

      if (window.__loadedChapterBoardFiles[fileName]) {
        return Promise.resolve(true);
      }

      return new Promise((resolve) => {
        const existing = document.querySelector(`script[data-chapter-file="${fileName}"]`);
        if (existing) {
          existing.addEventListener('load', () => {
            window.__loadedChapterBoardFiles[fileName] = true;
            resolve(true);
          }, { once: true });
          existing.addEventListener('error', () => resolve(false), { once: true });
          return;
        }

        const s = document.createElement('script');
        s.src = fileName;
        s.async = true;
        s.setAttribute('data-chapter-file', fileName);

        s.onload = () => {
          window.__loadedChapterBoardFiles[fileName] = true;
          resolve(true);
        };

        s.onerror = () => resolve(false);

        document.head.appendChild(s);
      });
    }

    function getBoardChapterData(boardName) {
      const board = (boardName || '').trim();
      if (!board) return {};

      const registry = window.BOARD_CHAPTERS || window.boardChapters || {};
      if (registry && typeof registry === 'object' && registry[board]) {
        return registry[board];
      }

      const globalKey = `CHAPTERS_${board.toUpperCase().replace(/[^A-Z0-9]+/g, '_')}`;
      if (window[globalKey] && typeof window[globalKey] === 'object') {
        return window[globalKey];
      }

      return {};
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadQuickQuizForm();
    });

    function loadQuickQuizForm() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '<div class="setup-form-container"></div>';
      const formContainer = container.querySelector('.setup-form-container');

      const classesHTML = quickQuizConfig.classes.map(c => `<div data-value="${c}">${c}</div>`).join('');
      const boardsHTML = quickQuizConfig.boards.map(b => `<div data-value="${b}">${b}</div>`).join('');

      const initialBoard = quickQuizConfig.boards[0] || 'Other';
      const initialSubjects = quickQuizConfig.getSubjectsForBoard(initialBoard);
      const initialSubjectsWithOther = Array.from(new Set([...(initialSubjects || []), "Other"]));
      const subjectsHTML = initialSubjectsWithOther.map(s => `<div data-value="${s}">${s}</div>`).join('');
      const qTypesHTML = quickQuizConfig.questionTypes.map(q => `<div data-value="${q}">${q}</div>`).join('');

      formContainer.innerHTML = `
        <h2>Quick Quiz</h2>

        <form id="quick-quiz-form">
          <div class="form-group">
            <label>Class:</label>
            <div id="class-dropdown" class="custom-dropdown">
              <input type="hidden" id="class-value" value="${quickQuizConfig.classes[0] || ''}">
              <div class="selected-option">${quickQuizConfig.classes[0] || 'Select Class'}</div>
              <div class="dropdown-options">${classesHTML}</div>
            </div>
          </div>

          <div class="form-group">
            <label>Name of the Board:</label>
            <div id="board-dropdown" class="custom-dropdown">
              <input type="hidden" id="board-value" value="${initialBoard}">
              <div class="selected-option">${initialBoard}</div>
              <div class="dropdown-options">${boardsHTML}</div>
            </div>

            <div id="board-other-wrap" style="display:none; margin-top:10px;">
              <label style="font-size:0.95em;">Type Board Name:</label>
              <input type="text" id="board-other-input" placeholder="Enter Board Name">
            </div>
          </div>

          <div class="form-group">
            <label>Subject:</label>
            <div id="subject-dropdown" class="custom-dropdown">
              <input type="hidden" id="subject-value" value="${initialSubjectsWithOther[0] || ''}">
              <div class="selected-option">${initialSubjectsWithOther[0] || 'Select Subject'}</div>
              <div class="dropdown-options">${subjectsHTML}</div>
            </div>

            <div id="subject-other-wrap" style="display:none; margin-top:10px;">
              <label style="font-size:0.95em;">Type Subject Name:</label>
              <input type="text" id="subject-other-input" placeholder="Enter Subject Name">
            </div>
          </div>

                    <div class="form-group">
            <label>Chapter Name:</label>
            <input type="text" id="chapter-value" placeholder="Type Chapter Name">
          </div>

          <div class="form-group">
            <label>Question Type:</label>
            <div id="qtype-dropdown" class="custom-dropdown">
              <input type="hidden" id="qtype-value" value="${quickQuizConfig.questionTypes[0]}">
              <div class="selected-option">${quickQuizConfig.questionTypes[0]}</div>
              <div class="dropdown-options">${qTypesHTML}</div>
            </div>
          </div>

          <div class="form-group">
            <label>Questions by Level:</label>
            <div class="level-box">
              <div class="level-row">
                <div class="label">Level 1</div>
                <input type="number" id="lvl1" class="level-input" min="0" value="0">
              </div>

              <div class="level-row">
                <div class="label">Level 2</div>
                <input type="number" id="lvl2" class="level-input" min="0" value="0">
              </div>

              <div class="level-row">
                <div class="label">Level 3</div>
                <input type="number" id="lvl3" class="level-input" min="0" value="0">
              </div>

              <div class="level-row total-row">
                <div class="label">Total</div>
                <input type="number" id="lvl-total" class="total-input" value="0" readonly>
              </div>
            </div>
          </div>

                    <button type="button" id="generate-quiz-btn">Generate Quiz</button>

          <div class="helper-note">
            </div>
        </form>
      `;

      setupCustomDropdowns();
      syncOtherToggles();
      syncTotal();

      updateChapterDropdown(
        document.getElementById('class-value')?.value || '',
        document.getElementById('subject-value')?.value || ''
      );

      document.getElementById('board-other-input')?.addEventListener('input', () => {
        updateChapterDropdown(
          document.getElementById('class-value')?.value || '',
          document.getElementById('subject-value')?.value || ''
        );
      });

      document.getElementById('subject-other-input')?.addEventListener('input', () => {
        const selectedClass = document.getElementById('class-value')?.value || '';
        const rawSubject = document.getElementById('subject-value')?.value || '';
        const otherSubject = (document.getElementById('subject-other-input')?.value || '').trim();
        const finalSubject = (rawSubject === 'Other') ? (otherSubject || 'Other') : rawSubject;
        updateChapterDropdown(selectedClass, finalSubject);
      });

      ['lvl1', 'lvl2', 'lvl3'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', syncTotal);
      });

            document.getElementById('generate-quiz-btn').addEventListener('click', function () {
        const l1 = parseInt(document.getElementById('lvl1')?.value || '0', 10) || 0;
        const l2 = parseInt(document.getElementById('lvl2')?.value || '0', 10) || 0;
        const l3 = parseInt(document.getElementById('lvl3')?.value || '0', 10) || 0;
        const total = l1 + l2 + l3;

        const rawBoard = document.getElementById('board-value')?.value || '';
        const otherBoard = (document.getElementById('board-other-input')?.value || '').trim();
        const finalBoard = (rawBoard === 'Other') ? (otherBoard || 'Other') : rawBoard;

        const rawSubject = document.getElementById('subject-value')?.value || '';
        const otherSubject = (document.getElementById('subject-other-input')?.value || '').trim();
        const finalSubject = (rawSubject === 'Other') ? (otherSubject || 'Other') : rawSubject;

        const params = {
          class: document.getElementById('class-value')?.value || '',
          board: finalBoard,
          subject: finalSubject,
          chapter: (document.getElementById('chapter-value')?.value || '').trim(),
          questionType: document.getElementById('qtype-value')?.value || '',
          l1,
          l2,
          l3,
          total
        };

        if (!params.class || !params.board || !params.subject || !params.chapter || !params.questionType) {
          toast('Please fill all fields.');
          return;
        }

        if (total <= 0) {
          toast('Please enter at least 1 question.');
          return;
        }

        const prompt = buildGeminiQuizPrompt(params);
        openGeminiWithPrompt(prompt);
      });
   }
    function setupCustomDropdowns() {
      setupCustomDropdown('class-dropdown', 'class-value', (selectedClass) => {
        const selectedSubject = document.getElementById('subject-value')?.value || '';
        updateChapterDropdown(selectedClass, selectedSubject);
      });

      setupCustomDropdown('board-dropdown', 'board-value', (selectedBoard) => {
        updateSubjectDropdown(selectedBoard);
        syncOtherToggles();

        const selectedClass = document.getElementById('class-value')?.value || '';
        const selectedSubject = document.getElementById('subject-value')?.value || '';
        updateChapterDropdown(selectedClass, selectedSubject);
      });

      setupCustomDropdown('subject-dropdown', 'subject-value', (selectedSubject) => {
        syncOtherToggles();

        const selectedClass = document.getElementById('class-value')?.value || '';
        const finalSubject = (selectedSubject === 'Other')
          ? ((document.getElementById('subject-other-input')?.value || '').trim() || 'Other')
          : selectedSubject;

        updateChapterDropdown(selectedClass, finalSubject);
      });

     
      setupCustomDropdown('qtype-dropdown', 'qtype-value');
    }

    function setupCustomDropdown(dropdownId, inputId, callback) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;

      const selected = dropdown.querySelector('.selected-option');
      const options = dropdown.querySelector('.dropdown-options');
      const input = document.getElementById(inputId);

      selected.onclick = (e) => {
        e.stopPropagation();
        toggleDropdown(dropdownId);
      };

      optionsContainerListener(options, selected, input, dropdown, callback);
    }

    function optionsContainerListener(options, selected, input, dropdown, callback) {
      options.querySelectorAll('div[data-value]').forEach(option => {
        option.onclick = () => {
          selected.textContent = option.textContent;
          input.value = option.dataset.value;
          dropdown.classList.remove('open');
          if (callback) callback(input.value);
        };
      });
    }

    function toggleDropdown(dropdownId) {
      const currentDropdown = document.getElementById(dropdownId);
      if (!currentDropdown) return;

      const currentlyOpen = currentDropdown.classList.contains('open');

      document.querySelectorAll('.custom-dropdown.open').forEach(d => {
        if (d.id !== dropdownId) d.classList.remove('open');
      });

      if (!currentlyOpen) currentDropdown.classList.add('open');
    }

    function syncOtherToggles() {
      const boardVal = document.getElementById('board-value')?.value || '';
      const subjectVal = document.getElementById('subject-value')?.value || '';

      const boardWrap = document.getElementById('board-other-wrap');
      const boardOther = document.getElementById('board-other-input');

      const subjectWrap = document.getElementById('subject-other-wrap');
      const subjectOther = document.getElementById('subject-other-input');

      const subjectSelected = document.querySelector('#subject-dropdown .selected-option');
      const subjectHidden = document.getElementById('subject-value');

      const boardIsOther = (boardVal === 'Other');
      const subjectIsOther = (subjectVal === 'Other');

      if (boardWrap) boardWrap.style.display = boardIsOther ? 'block' : 'none';
      if (!boardIsOther && boardOther) boardOther.value = '';

      const showSubjectOther = boardIsOther || subjectIsOther;
      if (subjectWrap) subjectWrap.style.display = showSubjectOther ? 'block' : 'none';
      if (!showSubjectOther && subjectOther) subjectOther.value = '';

      if (boardIsOther && subjectHidden && subjectHidden.value !== 'Other') {
        subjectHidden.value = 'Other';
        if (subjectSelected) subjectSelected.textContent = 'Other';
      }
    }

    function syncTotal() {
      const l1 = parseInt(document.getElementById('lvl1')?.value || '0', 10) || 0;
      const l2 = parseInt(document.getElementById('lvl2')?.value || '0', 10) || 0;
      const l3 = parseInt(document.getElementById('lvl3')?.value || '0', 10) || 0;
      const total = document.getElementById('lvl-total');
      if (total) total.value = String(l1 + l2 + l3);
    }

    function updateSubjectDropdown(selectedBoard) {
      const subjectDropdown = document.getElementById('subject-dropdown');
      if (!subjectDropdown) return;

      const subjectOptions = subjectDropdown.querySelector('.dropdown-options');
      const subjectSelected = subjectDropdown.querySelector('.selected-option');
      const subjectInput = document.getElementById('subject-value');

      const newSubjects = quickQuizConfig.getSubjectsForBoard(selectedBoard);
      const newSubjectsWithOther = Array.from(new Set([...(newSubjects || []), "Other"]));

      subjectOptions.innerHTML = newSubjectsWithOther
        .map(s => `<div data-value="${s}">${s}</div>`)
        .join('');

      subjectSelected.textContent = newSubjectsWithOther[0] || 'Select Subject';
      subjectInput.value = newSubjectsWithOther[0] || '';

      optionsContainerListener(
        subjectOptions,
        subjectSelected,
        subjectInput,
        subjectDropdown,
        (newSubject) => {
          syncOtherToggles();
          const selectedClass = document.getElementById('class-value')?.value || '';
          updateChapterDropdown(selectedClass, newSubject);
        }
      );
    }

    async function updateChapterDropdown(selectedClass, selectedSubject) {
      const chapterDropdown = document.getElementById('chapter-dropdown');
      if (!chapterDropdown) return;

      const chapterOptions = chapterDropdown.querySelector('.dropdown-options');
      const chapterSelected = chapterDropdown.querySelector('.selected-option');
      const chapterInput = document.getElementById('chapter-value');

      const resetChapterDropdown = (msg = 'Select Chapter') => {
        chapterOptions.innerHTML = `<div data-value="">${msg}</div>`;
        chapterSelected.textContent = msg;
        chapterInput.value = '';
      };

      const rawBoard = document.getElementById('board-value')?.value || '';
      const otherBoard = (document.getElementById('board-other-input')?.value || '').trim();
      const finalBoard = (rawBoard === 'Other') ? (otherBoard || 'Other') : rawBoard;

      const otherSubject = (document.getElementById('subject-other-input')?.value || '').trim();
      const finalSubject = (selectedSubject === 'Other')
        ? (otherSubject || 'Other')
        : (selectedSubject || '');

      if (!finalBoard || !finalSubject || finalBoard === 'Other' || finalSubject === 'Other') {
        resetChapterDropdown('Select Chapter');
        return;
      }

      await loadBoardChapterFile(finalBoard);
      const boardData = getBoardChapterData(finalBoard);

      let chapters = [];

      if (Array.isArray(boardData?.[finalSubject])) {
        chapters = boardData[finalSubject];
      } else if (Array.isArray(boardData?.[selectedClass]?.[finalSubject])) {
        chapters = boardData[selectedClass][finalSubject];
      } else if (Array.isArray(boardData?.[selectedClass?.trim()]?.[finalSubject])) {
        chapters = boardData[selectedClass.trim()][finalSubject];
      }

      const uniqueChapters = Array.from(new Set((chapters || []).filter(Boolean)));

      if (!uniqueChapters.length) {
        resetChapterDropdown('No chapters available');
        return;
      }

      chapterOptions.innerHTML = uniqueChapters
        .map(ch => `<div data-value="${String(ch).replace(/"/g, '&quot;')}">${ch}</div>`)
        .join('');

      chapterSelected.textContent = uniqueChapters[0];
      chapterInput.value = uniqueChapters[0];

      optionsContainerListener(
        chapterOptions,
        chapterSelected,
        chapterInput,
        chapterDropdown
      );
    }

       function buildGeminiQuizPrompt(params) {
      const cls = params.class || '';
      const board = params.board || '';
      const subj = params.subject || '';
      const chap = params.chapter || '';
      const total = params.total || 0;
      const rawType = params.questionType || 'MCQ (Single)';

      let qtype = rawType;
      if (qtype === 'Assertion and Reason') qtype = 'Assertion and Reason (MCQ Single)';

      const selectedBoard = (board || '').trim().toLowerCase();

      const isCbse = selectedBoard === 'cbse';
      const isIcse = selectedBoard === 'icse';
      const isFoundation = selectedBoard === 'iit & neet foundation';
      const isOlympiad = selectedBoard === 'olympiad';
      const isJeeMains = selectedBoard === 'jee mains';
      const isJeeAdvance = selectedBoard === 'jee advance';
      const isNeet = selectedBoard === 'neet';
      const isApState = selectedBoard === 'ap state board (scert)';

      const requestLine =
        isJeeMains
          ? `Create a JEE Main style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
          : isJeeAdvance
            ? `Create a JEE Advanced style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
            : isNeet
              ? `Create a NEET style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
              : isOlympiad
                ? `Create an Olympiad style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
                : isFoundation
                  ? `Create an IIT & NEET Foundation style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
                  : isCbse
                    ? `Create a CBSE style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
                    : isIcse
                      ? `Create an ICSE style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
                      : isApState
                        ? `Create an AP State Board (SCERT) style interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`
                        : `Create an interactive quiz with ${total} questions. Distribution: L1:${params.l1}, L2:${params.l2}, L3:${params.l3}`;

      const header = `
Class: ${cls}
Board: ${board}
Subject: ${subj}
Chapter: ${chap}
Question Type: ${qtype}
${requestLine}
`.trim();

      const foundationLevels = `
Use these Level definitions STRICTLY (Foundation/IIT-NEET mode):
- Level 1: Foundation Easy & Medium
  • Basic conceptual/recall/direct application aligned to Foundation style (not board textbook drill).
  • Single concept, avoid multi-step reasoning; competitive-exam style but simple/focused.
- Level 2: Foundation Difficult & Very Difficult
  • Moderate application; 1–2 steps or combine 2 related ideas.
  • 'Tricky' Foundation practice style; higher challenge than L1; not full Olympiad.
- Level 3: Challenging & Olympiad/NTSE/IIT Foundation Advanced
  • Multi-step logical reasoning, combining ≥2 concepts, non-standard twists/novel approaches.
  • Do NOT create direct single-step/formula/memory questions for Level 3.
  • Inspired by Olympiad/NTSE/IIT-Foundation papers but adapted to this class & syllabus.
  • Keep within the class syllabus; no higher-class methods required.
`.trim();

      const cbseLevels = `
Important
*All questions should be directly from CBSE text book*
*All questions should cover entire chapter concepts*
*Don’t forget to give strictly-from-textbook items (using NCERT exact data/numbering).*

Use these Level definitions STRICTLY (CBSE mode):
- Level 1: Knowledge/Recall (direct textbook/comprehension)
- Level 2: Application/Interpretation (within CBSE chapter)
- Level 3: HOTS (analysis/evaluation/synthesis as per CBSE)
`.trim();

      const icseLevels = `
Important
*All questions should be directly from ICSE syllabus content and prescribed textbook concepts.*
*All questions should cover entire chapter concepts.*
*Questions should reflect ICSE style: concept-rich, detailed, and language-accurate.*

Use these Level definitions STRICTLY (ICSE mode):
- Level 1: Knowledge/Recall (direct concept/text understanding)
- Level 2: Application/Interpretation
- Level 3: Analytical/HOTS
`.trim();

      const apStateLevels = `
Important
*All questions should be directly from AP State Board (SCERT) textbook content.*
*All questions should cover entire chapter concepts.*
*Questions should follow AP State textbook style and terminology.*

Use these Level definitions STRICTLY (AP State Board mode):
- Level 1: Knowledge/Recall
- Level 2: Application/Interpretation
- Level 3: Higher-order thinking
`.trim();

      const olympiadLevels = `
Important
*Questions should follow Olympiad style for the selected class and subject.*
*Questions should test reasoning, conceptual clarity, tricky application, and higher-order thinking.*
*Avoid purely textbook-direct and memory-only questions unless required as a base concept.*

Use these Level definitions STRICTLY (Olympiad mode):
- Level 1: Strong concept-based direct questions
- Level 2: Tricky application and reasoning
- Level 3: Advanced Olympiad-style multi-step thinking
`.trim();

      const jeeMainsLevels = `
Important
*Questions should follow JEE Main style for the selected subject.*
*Questions should be objective, concept-based, application-oriented, and exam-relevant.*
*Questions must resemble JEE Main standard, not Foundation or school textbook style.*

Use these Level definitions STRICTLY (JEE Main mode):
- Level 1: Direct formula/concept application
- Level 2: Standard JEE Main application
- Level 3: Moderate multi-concept JEE Main level
`.trim();

      const jeeAdvanceLevels = `
Important
*Questions should follow JEE Advanced style for the selected subject.*
*Questions should be deeper, multi-concept, analytical, and challenging.*
*Questions must resemble JEE Advanced standard, not Foundation or textbook-direct style.*

Use these Level definitions STRICTLY (JEE Advanced mode):
- Level 1: Strong concept-based application
- Level 2: Multi-step analytical problems
- Level 3: Challenging JEE Advanced style multi-concept reasoning
`.trim();

      const neetLevels = `
Important
*Questions should follow NEET exam style for the selected subject.*
*Questions should be objective, syllabus-based, concept-accurate, and exam-relevant.*
*Biology questions should remain closely aligned to NCERT/NEET style wherever applicable.*

Use these Level definitions STRICTLY (NEET mode):
- Level 1: Direct NCERT/concept-based questions
- Level 2: Standard NEET application questions
- Level 3: Higher-difficulty NEET-style concept integration
`.trim();

      const levelBlock =
        isCbse ? cbseLevels :
        isIcse ? icseLevels :
        isApState ? apStateLevels :
        isFoundation ? foundationLevels :
        isOlympiad ? olympiadLevels :
        isJeeMains ? jeeMainsLevels :
        isJeeAdvance ? jeeAdvanceLevels :
        isNeet ? neetLevels :
        foundationLevels;

      const strictAccuracy = `
STRICT ACCURACY (applies to all):
• Ensure every question is clear, unambiguous, and correct.
• Double-check all facts, calculations, options, and answers.
• If any issue is found, fix it before output.
• Use ONLY content from the selected class, board, subject, and chapter.
• Keep the standard of questions strictly according to the selected board and level.
• Do not reduce the difficulty standard of Level 2 or Level 3.
`.trim();

      const interactiveQuizRules = `
INTERACTIVE QUIZ RULES:
• Create an INTERACTIVE QUIZ experience, not a written question paper.
• Do NOT format the output as Q1, Q2, A), B), C), D), or Answer Key.
• Do NOT generate it like a worksheet, exam paper, or plain question list.
• Make it behave like Gemini's interactive quiz mode:
  - one question at a time
  - clickable options
  - next question flow
  - score/progress based quiz experience
• Follow the question count exactly:
  - Level 1 questions: ${params.l1}
  - Level 2 questions: ${params.l2}
  - Level 3 questions: ${params.l3}
• Total questions must be exactly ${total}.
• Cover only the selected chapter.
• Keep the quiz classroom-ready and engaging.
• VERY IMPORTANT: Append the difficulty level at the end of every question exactly in this format:
  - (Level 1)
  - (Level 2)
  - (Level 3)
• Example format:
  Which of the following numbers is an irrational number? (Level 1)
• Do not show the level separately above or below.
• The level must be part of the question text itself.
`.trim();

      const mcqSingleRules = `
Question Type Rules: MCQ (Single)
• Each question must have only one correct answer.
• Randomize the correct answer positions naturally.
• Questions must match the selected board standard and level standard exactly.
${isJeeMains ? '• Questions must match JEE Main standard: objective, concept-based, application-oriented, and exam-relevant.' : ''}
${isJeeAdvance ? '• Questions must match JEE Advanced standard: deeper, multi-concept, analytical, tricky, and non-routine.' : ''}
${isNeet ? '• Questions must match NEET standard: objective, syllabus-accurate, and exam-relevant.' : ''}
${isOlympiad ? '• Questions must match Olympiad standard: reasoning-heavy, concept-rich, and tricky.' : ''}
${isFoundation ? '• Questions must match IIT & NEET Foundation standard: concept-based and progressively challenging, but suitable for the selected class.' : ''}
`.trim();

      const mcqMultipleRules = `
Question Type Rules: MCQ (Multiple)
• Some questions must have more than one correct answer.
• The difficulty and concept standard must match the selected board and level.
• Spread correct options naturally and avoid repeated patterns.
• If helpful, present them as multi-select interactive questions.
${isJeeAdvance ? '• Questions must strongly reflect JEE Advanced multiple-correct style: analytical, tricky, multi-concept, and non-routine.' : ''}
${isOlympiad ? '• Multiple-correct questions should emphasize reasoning, careful concept checking, and tricky distinctions.' : ''}
${isFoundation ? '• Multiple-correct questions should be suitable for IIT & NEET Foundation level of the selected class.' : ''}
`.trim();

      const assertionReasonRules = `
Question Type Rules: Assertion and Reason
• Every question must contain both Assertion and Reason.
• Each question must have only one correct answer.
• Keep the statements meaningful, concept-based, and board-standard.
• Avoid trivial or vague assertion-reason pairs.
• Present them as interactive quiz questions, not as written exam formatting.
`.trim();

      let typeRules = mcqSingleRules;
      if (rawType === 'MCQ (Multiple)') typeRules = mcqMultipleRules;
      if (rawType === 'Assertion and Reason') typeRules = assertionReasonRules;

      return `
${header}

${levelBlock}

${strictAccuracy}

${interactiveQuizRules}

${typeRules}

Final instruction:
Create this as an interactive quiz inside Gemini, not as a typed question paper.
`.trim();
    }

              function openGeminiWithPrompt(prompt) {
  const geminiUrl = 'https://gemini.google.com/';

  try {
    navigator.clipboard.writeText(prompt);
    toast('Prompt copied. Opening Gemini...');
  } catch (e) {
    toast('Opening Gemini...');
  }

  window.open(geminiUrl, '_blank', 'noopener,noreferrer');
}
