function createDropdown(containerId, options, placeholder) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const optionsHTML = options.map(opt => `<div data-value="${opt}">${opt}</div>`).join('');
  container.innerHTML = `<div class="selected-option">${placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
  container.dataset.value = '';
  container.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.custom-dropdown.open').forEach(d => { if (d !== container) d.classList.remove('open'); });
    container.classList.toggle('open');
    if (e.target.dataset.value) {
      container.querySelector('.selected-option').textContent = e.target.dataset.value;
      container.dataset.value = e.target.dataset.value;
      container.classList.remove('open');
      container.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
}
function formatDate(dateStr) {
  if (!dateStr) return '';
  const [d, m, y] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

// Convert minutes to "H½ hours" style (e.g., 90 -> "1½ hours")
function formatDuration(minutes) {
  const m = parseInt(minutes, 10);
  if (isNaN(m) || m <= 0) return '';
  const h = Math.floor(m / 60);
  const r = m % 60;
  const HALF = '\u00BD'; // ½

  if (r === 0 && h > 0) {
    return h === 1 ? '1 hour' : `${h} hours`;
  }
  if (r === 30) {
    if (h === 0) return `${HALF} hour`;   // "½ hour"
    return `${h}${HALF} hours`;           // "1½ hours", "2½ hours", ...
  }
  // Fallback for non-half-hour cases
  return `${m} min`;
}

  };

  rows.forEach(row => {
    const key = String(row.querySelector('.sec-key')?.value || '').trim().toUpperCase();
    if (!key) return;

    const title = '';
    const mode  = String(row.querySelector('.sec-mode')?.value || 'all');

    cfg[key] = { mode, q, m, any, total };

// Detect “Section A/B/C/D” anchor positions (only detection, no marks parsing)
async function detectSectionAnchors(srcBytes) {
  const anchors = []; // {pageIndex, letter, x, y}

  // IMPORTANT: PDF.js may detach buffers when using workers.
  // So always pass a COPY to PDF.js, never the original buffer used by pdf-lib.
  const bytes = (srcBytes instanceof Uint8Array) ? srcBytes : new Uint8Array(srcBytes);
  const pdfjsBytes = new Uint8Array(bytes); // copy

  const pdf = await pdfjsLib.getDocument({ data: pdfjsBytes }).promise;

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();

    for (const item of (tc.items || [])) {
      const str = (item.str || '').trim();
      if (!str) continue;

      // Match: "Section A", "SECTION A", "Section-A", "SectionA" (loose)
      const m = str.match(/section\s*[-:]?\s*([A-Z])\b/i);
      if (!m) continue;

      const letter = (m[1] || '').toUpperCase();
      const t = item.transform || [];
      const x = t[4] || 0;
      const y = t[5] || 0;

      // keep first occurrence per section per page
      const exists = anchors.some(a => a.pageIndex === (p - 1) && a.letter === letter);
      if (!exists) anchors.push({ pageIndex: (p - 1), letter, x, y });
    }
  }
  return anchors;
}

// Draw a black capsule ribbon (no image) + texts; also masks original line
function drawSectionRibbon(outPage, pageW, pageH, yAnchor, letter, cfg, fontBold) {
  const marginX = 35;
  const barW = pageW - (marginX * 2);
  const barH = 14;
  const barY = Math.max(0, yAnchor - 2);

  // 1) Mask old line area
  outPage.drawRectangle({
    x: marginX,
    y: barY - 2,
    width: barW,
    height: barH + 4,
    color: PDFLib.rgb(1, 1, 1)
  });

  // 2) White capsule with black border
  const r = barH / 2;
  const borderWidth = 1.2;

  // Outer black capsule
  outPage.drawRectangle({
    x: marginX + r,
    y: barY,
    width: barW - (2 * r),
    height: barH,
    color: PDFLib.rgb(0, 0, 0)
  });

  outPage.drawEllipse({
    x: marginX + r,
    y: barY + r,
    xScale: r,
    yScale: r,
    color: PDFLib.rgb(0, 0, 0)
  });

  outPage.drawEllipse({
    x: marginX + barW - r,
    y: barY + r,
    xScale: r,
    yScale: r,
    color: PDFLib.rgb(0, 0, 0)
  });

  // Inner white capsule
  const inX = marginX + borderWidth;
  const inY = barY + borderWidth;
  const inW = barW - (2 * borderWidth);
  const inH = barH - (2 * borderWidth);
  const inR = Math.max(0, r - borderWidth);

  outPage.drawRectangle({
    x: inX + inR,
    y: inY,
    width: inW - (2 * inR),
    height: inH,
    color: PDFLib.rgb(1, 1, 1)
  });

  outPage.drawRectangle({
    x: inX,
    y: inY + inR,
    width: inW,
    height: inH - (2 * inR),
    color: PDFLib.rgb(1, 1, 1)
  });

  outPage.drawEllipse({
    x: inX + inR,
    y: inY + inR,
    xScale: inR,
    yScale: inR,
    color: PDFLib.rgb(1, 1, 1)
  });

  outPage.drawEllipse({
    x: inX + inW - inR,
    y: inY + inR,
    xScale: inR,
    yScale: inR,
    color: PDFLib.rgb(1, 1, 1)
  });

  outPage.drawEllipse({
    x: inX + inR,
    y: inY + inH - inR,
    xScale: inR,
    yScale: inR,
    color: PDFLib.rgb(1, 1, 1)
  });

  outPage.drawEllipse({
    x: inX + inW - inR,
    y: inY + inH - inR,
    xScale: inR,
    yScale: inR,
    color: PDFLib.rgb(1, 1, 1)
  });

  // 3) Texts
  const sc = cfg?.[letter] || {};
  const mode = (sc.mode || 'all');

  const q = sc.q || 0;
  const m = sc.m || 0;

  const any = sc.any || 0;
  const totalQ = sc.total || 0;

  let leftText = `Section ${letter}: Answer all the questions`;
  let rightText = '';

  if (mode === 'any' && any > 0 && totalQ > 0 && m > 0) {
    leftText = `Section ${letter}: Answer any ${any} out of ${totalQ} questions`;
    const totMarks = any * m;
    rightText = `${any} × ${m} = ${totMarks} Marks`;
  } else if (q > 0 && m > 0) {
    leftText = `Section ${letter}: Answer all the questions`;
    const totMarks = q * m;
    rightText = `${q} × ${m} = ${totMarks} Marks`;
  }

  const fontSize = 11;

  outPage.drawText(leftText, {
    x: marginX + 14,
    y: barY + 3,
    size: fontSize,
    font: fontBold,
    color: PDFLib.rgb(0, 0, 0)
  });

  if (rightText) {
    const rw = fontBold.widthOfTextAtSize(rightText, fontSize);
    outPage.drawText(rightText, {
      x: marginX + barW - 14 - rw,
      y: barY + 3,
      size: fontSize,
      font: fontBold,
      color: PDFLib.rgb(0, 0, 0)
    });
  }
}
// Apply ribbons to one page based on detected anchors
function applySectionRibbonsToPage(outPage, pageIndex, pageW, pageH, anchors, cfg, fontBold, scaleFactor = 1) {
  const list = (anchors || []).filter(a => a.pageIndex === pageIndex);
  for (const a of list) {
    const yScaled = (a.y || 0) * scaleFactor;   // IMPORTANT: page-1 is scaled
    drawSectionRibbon(outPage, pageW, pageH, yScaled, a.letter, cfg, fontBold);
  }
}

async function process(mode = 'download') {
  const showSpinner = () => document.getElementById('spinner-overlay').style.display = "flex";
  const hideSpinner = () => document.getElementById('spinner-overlay').style.display = "none";

  showSpinner();
  try {
    const fileInput = document.getElementById('pdfFile');
    const pdfFile = fileInput && fileInput.files ? fileInput.files[0] : null;
    if (!pdfFile) { hideSpinner(); return alert("Please select a PDF to brand!"); }

async function showInlinePreview(url) {
  const wrap = document.getElementById('previewWrap');
  const frame = document.getElementById('pdfPreview');
  const canvas = document.getElementById('pdfCanvas');
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!wrap) return;

  if (isMobile && canvas) {
    // Mobile: render first page into canvas (feed ArrayBuffer to PDF.js)
    if (frame) { frame.removeAttribute('src'); frame.style.display = 'none'; }
    canvas.style.display = 'block';

    try {
      // Convert blob URL -> ArrayBuffer (more reliable on mobile)
      const resp = await fetch(url);
      const buffer = await resp.arrayBuffer();

      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      const page = await pdf.getPage(1);

      const containerWidth = canvas.parentElement.clientWidth;
      const v1 = page.getViewport({ scale: 1 });
      const scale = containerWidth / v1.width;
      const viewport = page.getViewport({ scale });

      // Retina-friendly sizing
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = Math.round(viewport.width) + 'px';
      canvas.style.height = Math.round(viewport.height) + 'px';
      canvas.width = Math.round(viewport.width * dpr);
      canvas.height = Math.round(viewport.height * dpr);

      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      await page.render({ canvasContext: ctx, viewport }).promise;
    } catch (err) {
      console.warn('Mobile canvas preview failed:', err);
      canvas.style.display = 'none';
    }
  } else {
    // Desktop: iframe preview
    if (canvas) canvas.style.display = 'none';
    if (frame) { frame.style.display = 'block'; frame.src = url; }
  }
  wrap.style.display = 'block';
}

// Plus / Minus controls for first-page scale
(function () {
  const slider = document.getElementById('scale1Input');
  const minus  = document.getElementById('scale1Minus');
  const plus   = document.getElementById('scale1Plus');
  if (!slider || !minus || !plus) return;

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  const bump = (delta) => {
    const min = Number(slider.min) || 85;
    const max = Number(slider.max) || 100;
    const step = Number(slider.step) || 1;
    let next = Number(slider.value || 100) + delta * step;
    next = clamp(next, min, max);
    if (next !== Number(slider.value)) {
      slider.value = String(next);
      // Update label
      const lbl = document.getElementById('scale1Value');
      if (lbl) lbl.textContent = next + '%';
      // Reuse the same preview logic by firing the input event
      slider.dispatchEvent(new Event('input', { bubbles: true }));
    }
  };

  minus.addEventListener('click', () => bump(-1));
  plus.addEventListener('click',  () => bump(+1));
})();
