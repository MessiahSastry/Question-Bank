<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload & Brand | St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --primary-blue: #0f3d6b;
      --secondary-blue: #1762a7;
      --light-blue-bg: #f4f8fc;
      --border-color: #bcd6ef;
      --text-dark: #12416c;
      --text-light: #54656f;
    }
    html { height: -webkit-fill-available; }
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f8fc;
      min-height: 100vh;
      height: -webkit-fill-available;
    }
    .page-wrapper {
      display: flex; flex-direction: column; min-height: 100vh;
    }
    #main-header {
      background: linear-gradient(90deg, #1762a7, #0f3d6b);
      color: #fff;
      border-bottom-left-radius: 28px; border-bottom-right-radius: 28px;
      min-height: 84px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 15px 10px 18px 10px;
      box-sizing: border-box; flex-shrink: 0;
      position: sticky; top: 0; z-index: 10;
    }
    #main-header .school-title { font-size: 1.8em; font-weight: bold; margin: 0;}
    #main-header .subtitle { font-size: 1.05em; color: #e0eaff; margin-top: 5px; }
    main {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    .form-container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto 22px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 27, 68, 0.11);
      padding: 28px 18px 24px 18px;
      flex-shrink: 0;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    .form-group { margin-bottom: 17px; }
    .form-group label {
      font-weight: 600;
      color: #185496;
      display: block;
      margin-bottom: 7px;
      font-size: 1em;
    }
    .form-group input[type="text"],
    .form-group input[type="file"],
    .form-group input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1.3px solid #bcd6ef;
      font-size: 1em;
      background: #f7fafd;
      box-sizing: border-box;
      height: 42px;
    }
    .form-group input[type="file"] { padding: 7px 4px; height: auto; background: none; }
    .submit-btn {
      background: linear-gradient(90deg, #1762a7, #0f3d6b);
      color: #fff; font-weight: bold; cursor: pointer; padding: 13px 0;
      margin-top: 18px; width: 100%; border-radius: 8px; border: none; font-size: 1.09em;
      box-shadow: 0 2px 10px #0f3d6b0a;
    }
    .submit-btn:active { transform: scale(0.98);}
    #downloadLink {
      display: none; margin-top:18px; color: #0f3d6b;
      text-decoration: underline; font-weight:bold; text-align: center;
    }
    @media (max-width: 600px) {
      main { padding-top: 14px; }
      .form-container { padding: 15px 5vw 18px 5vw; border-radius: 12px; }
    }
    .custom-dropdown {
      position: relative;
      border: 1.3px solid #bcd6ef;
      border-radius: 6px;
      background: #f7fafd;
      font-size: 1em;
      color: #12416c;
      height: 42px;
      cursor: pointer;
      padding: 10px 12px;
    }
    .custom-dropdown .dropdown-options {
      display: none;
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: white;
      border: 1px solid #bcd6ef;
      border-top: none;
      z-index: 100;
      max-height: 180px;
      overflow-y: auto;
      border-radius: 0 0 6px 6px;
      box-shadow: 0 6px 15px rgba(0, 27, 68, 0.1);
    }
    .custom-dropdown.open .dropdown-options {
      display: block;
    }
    .dropdown-options div[data-value] {
      padding: 10px;
    }
    .dropdown-options div[data-value]:hover {
      background: #e0eaff;
    }
    @keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
  /* lightweight helpers for sticker preview */
.preview-toolbar label { font-weight:600; color:#185496; font-size:0.95em; }
</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>
  <div class="page-wrapper">
    <header id="main-header">
      <h1 class="school-title">St. Patrick's School</h1>
      <div class="subtitle">IIT & NEET FOUNDATION</div>
    </header>
    <main>
      <div class="form-container">
        <h2>Upload & Brand Question Paper</h2>
        <div class="form-group">
          <label>Question Paper PDF (from Examin8):</label>
          <input type="file" id="pdfFile" accept="application/pdf">
        </div>
        <div class="form-group">
          <label>Exam Name:</label>
          <input type="text" id="examName">
        </div>
        <div class="form-group">
          <label>Class:</label>
          <div id="class-dropdown" class="custom-dropdown"></div>
        </div>
        <div class="form-group">
          <label>Subject:</label>
          <div id="subject-dropdown" class="custom-dropdown"></div>
        </div>
        <div class="form-group">
          <label>Date (YYYY-MM-DD):</label>
          <input type="text" id="date" placeholder="DD-MM-YYYY" readonly>
        </div>
        <div class="form-group">
          <label>Time (minutes):</label>
          <input type="text" id="time">
        </div>
        <div class="form-group">
          <label>Max Marks:</label>
          <input type="text" id="maxMarks">
        </div>
        <button class="submit-btn" id="previewBtn">Preview Header</button>
<a id="downloadLink">Download Branded PDF</a>

<!-- Movable header preview panel -->
<div id="previewPanel" style="display:none; margin:16px auto 0; max-width:820px; background:#fff; border:1px dashed #bcd6ef; border-radius:10px; padding:14px;">
  <div class="preview-toolbar" style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px;">
    <label style="font-weight:600; color:#185496; font-size:0.95em;">
      Position (from top, pt): <input type="number" id="posTopPt" value="24" min="0" max="200" step="1" style="width:90px;">
    </label>
    <label style="font-weight:600; color:#185496; font-size:0.95em;">
      Scale: <input type="range" id="scaleSlider" min="80" max="125" value="100"> <span id="scaleVal">100%</span>
    </label>
    <label style="font-weight:600; color:#185496; font-size:0.95em;"><input type="checkbox" id="whiteUnderlay" checked> White underlay behind header</label>
    <label style="font-weight:600; color:#185496; font-size:0.95em;"><input type="checkbox" id="applyAllPages" checked> Apply to all pages</label>
    <span id="applyAllPagesNote" style="color:#54656f; font-size:0.9em;">(uncheck to place on first page only)</span>
    <button class="submit-btn" id="downloadBtn" style="max-width:260px; padding:10px 16px;">Download Branded PDF</button>
  </div>
 <div class="preview-canvas-wrap" id="previewWrap" style="position:relative; margin:0 auto; background:#fafafa; border:1px solid #e7eef7; overflow:hidden; width:100%; max-width:700px;">
    <img id="previewPage" class="preview-page" alt="PDF Page Preview (size only)" style="width:100%; display:block; background:#fff;">
    <img id="headerSticker" alt="Header Sticker (drag up/down)" style="position:absolute; left:0; right:0; margin:0 auto; cursor:grab; outline:1px dashed #1762a7; user-select:none;">
  </div>
</div>
      </div>
    </main>
  </div>

<script>
window.PDFLib = PDFLib;

/* ---- Config + small helpers (kept compatible with your UI) ---- */
const config = {
  classes: ["3rd Class","4th Class","5th Class","6th Class","7th Class","8th Class","9th Class","10th Class"],
  subjectMappings: {
    "3rd Class":["Telugu","Hindi","English","Math","Science","Social"],
    "4th Class":["Telugu","Hindi","English","Math","Science","Social"],
    "5th Class":["Telugu","Hindi","English","Math","Science","Social"],
    "6th Class":["Telugu","Hindi","English 1","English 2","Math 1","Math 2","Physics","Chemistry","Biology","Social"],
    "7th Class":["Telugu","Hindi","English 1","English 2","Math 1","Math 2","Physics","Chemistry","Biology","Social"],
    "8th Class":["Telugu","Hindi","English 1","English 2","Math 1","Math 2","Physics","Chemistry","Biology","Social"],
    "9th Class":["Telugu","Hindi","English 1","English 2","Math 1","Math 2","Physics","Chemistry","Biology","Social"],
    "10th Class":["Telugu","Hindi","English 1","English 2","Math 1","Math 2","Physics","Chemistry","Biology","Social"]
  }
};
function createDropdown(containerId, options, placeholder){
  const el = document.getElementById(containerId); if(!el) return;
  const optionsHTML = options.map(o=>`<div data-value="${o}">${o}</div>`).join('');
  el.innerHTML = `<div class="selected-option">${placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
  el.dataset.value = '';
  el.onclick = (e)=>{
    e.stopPropagation();
    document.querySelectorAll('.custom-dropdown.open').forEach(d=>{ if(d!==el) d.classList.remove('open'); });
    el.classList.toggle('open');
    if(e.target.dataset.value){
      el.querySelector('.selected-option').textContent = e.target.dataset.value;
      el.dataset.value = e.target.dataset.value;
      el.classList.remove('open');
      el.dispatchEvent(new Event('change',{bubbles:true}));
    }
  };
}
function formatDate(dstr){ if(!dstr) return ''; const [d,m,y]=dstr.split('-'); return `${d}/${m}/${y}`; }
function formatDuration(minutes){
  const m = parseInt(minutes,10); if(isNaN(m)||m<=0) return '';
  const h = Math.floor(m/60), r = m%60, HALF = '\u00BD';
  if(r===0 && h>0) return h===1?'1 hour':`${h} hours`;
  if(r===30) return h===0?`${HALF} hour`:`${h}${HALF} hours`;
  return `${m} min`;
}
function dataURLToUint8Array(dataURL){
  const b64 = dataURL.split(',')[1]; const bin = atob(b64);
  const len = bin.length; const bytes = new Uint8Array(len);
  for (let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

/* ---- Global state for preview ---- */
let gPdfBytes = null;
let gPdfDoc = null;
let gFirstPageWpt = 595;   // default A4 portrait width
let gFirstPageHpt = 842;   // default A4 portrait height
let gStickerDataURL = null;
let gStickerWpt = 0, gStickerHpt = 0;
let gScale = 1.0;       // 1.0 = 100%
let gTopFromTopPt = 0; // from top in points (user control)

/* ---- Build a single bitmap for the ENTIRE header (logos+titles+info box) ---- */
async function buildHeaderStickerBitmapForPreview(){
  // inputs
  const schoolName = "St. Patrick's School";
  const examName = document.getElementById('examName').value.trim();
  const className = document.getElementById('class-dropdown').dataset.value || '';
  const subject = (document.getElementById('subject-dropdown').dataset.value || '').toUpperCase();
  const date = document.getElementById('date').value;
  const time = document.getElementById('time').value.trim();
  const maxMarks = document.getElementById('maxMarks').value.trim();

  // full usable width; taller to avoid clipping; top→down layout
  const stickerWidthPt = Math.max(420, Math.min(gFirstPageWpt - 90, gFirstPageWpt));
  const stickerHeightPt = 220;

  // high-DPI canvas
  const SCALE = 2;
  const cw = Math.round(stickerWidthPt * SCALE);
  const ch = Math.round(stickerHeightPt * SCALE);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cw,ch);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';

  // paddings & sizes (pt)
  const padTopPt = 12, lineGapPt = 6;
  const titlePt = 24, subPt = 15, examPt = 15;
  const logoHpt = 50, infoHpt = 55;

  // logos
  const logo1 = new Image(); logo1.src = 'schoollogo1.png';
  const logo2 = new Image(); logo2.src = 'schoollogo2.png';
  await Promise.all([
    new Promise(r=>{logo1.onload=r; logo1.onerror=r;}),
    new Promise(r=>{logo2.onload=r; logo2.onerror=r;})
  ]);

  // running Y (top→down)
  let yPt = padTopPt;

  // 1) Title
  ctx.fillStyle = '#1a2d80';
  ctx.font = `${titlePt*SCALE}px "Times New Roman", Times, serif`;
  ctx.fillText(schoolName, cw/2, Math.round((yPt + titlePt)*SCALE));
  yPt += titlePt + lineGapPt;

  // 2) Subtitle
  ctx.fillStyle = '#154078';
  ctx.font = `${subPt*SCALE}px "Times New Roman", Times, serif`;
  ctx.fillText('IIT & NEET FOUNDATION', cw/2, Math.round((yPt + subPt)*SCALE));
  yPt += subPt + lineGapPt;

  // 3) Exam name
  ctx.fillStyle = '#1f1f29';
  ctx.font = `${examPt*SCALE}px "Times New Roman", Times, serif`;
  ctx.fillText(examName, cw/2, Math.round((yPt + examPt)*SCALE));
  yPt += examPt + 8;

  // 4) Logos row
  const lHpx = Math.round(logoHpt * SCALE);
  const l1ratio = logo1.width/Math.max(1,logo1.height);
  const l2ratio = logo2.width/Math.max(1,logo2.height);
  const l1w = Math.round(lHpx*l1ratio), l2w = Math.round(lHpx*l2ratio);
  const lYpx = Math.round(yPt*SCALE);
  const leftPadPx = 8*SCALE, rightPadPx = 8*SCALE;
  ctx.drawImage(logo1, leftPadPx, lYpx, l1w, lHpx);
  ctx.drawImage(logo2, cw - rightPadPx - l2w, lYpx, l2w, lHpx);
  yPt += logoHpt + 12;

  // 5) Info box (full width minus 50pt margins)
  const boxXpt = 50, boxWpt = Math.max(200, stickerWidthPt - 100);
  const boxYpt = yPt, boxHpt = infoHpt;

  ctx.strokeStyle = '#000'; ctx.lineWidth = 2*SCALE;
  ctx.strokeRect(Math.round(boxXpt*SCALE), Math.round(boxYpt*SCALE), Math.round(boxWpt*SCALE), Math.round(boxHpt*SCALE));

  const midXpx = cw/2;
  ctx.fillStyle = '#1b3b88';
  ctx.font = `${12.5*SCALE}px "Times New Roman", Times, serif`;
  ctx.textAlign = 'left';
  ctx.fillText(`Class: ${className}`, Math.round((boxXpt+18)*SCALE), Math.round((boxYpt+boxHpt-18)*SCALE));

  ctx.textAlign = 'center';
  ctx.fillStyle = '#123066';
  ctx.font = `${17*SCALE}px "Times New Roman", Times, serif`;
  ctx.fillText(subject, midXpx, Math.round((boxYpt+boxHpt-17)*SCALE));

  ctx.textAlign = 'right';
  ctx.fillStyle = '#1b3b88';
  ctx.font = `${12.5*SCALE}px "Times New Roman", Times, serif`;
  ctx.fillText(`Date: ${formatDate(date)}`, Math.round((boxXpt+boxWpt-18)*SCALE), Math.round((boxYpt+boxHpt-18)*SCALE));

  const timeStr = formatDuration(Number(time));
  ctx.textAlign = 'left';
  ctx.fillStyle = '#263c59';
  ctx.fillText(`Time: ${timeStr}`, Math.round((boxXpt+18)*SCALE), Math.round((boxYpt+18)*SCALE));

  ctx.textAlign = 'right';
  ctx.fillText(`Max Marks: ${maxMarks}`, Math.round((boxXpt+boxWpt-18)*SCALE), Math.round((boxYpt+18)*SCALE));

  // finalize
  gStickerDataURL = c.toDataURL('image/png');
  gStickerWpt = stickerWidthPt;
  gStickerHpt = stickerHeightPt;
  return gStickerDataURL;
}

/* ---- Preview flow ---- */
function showPreviewSizeBox(){
  // fit a page image box proportionally (no actual PDF raster; we show a size proxy)
  const wrap = document.getElementById('previewWrap');
  const pageImg = document.getElementById('previewPage');
  const targetWpx = wrap.clientWidth || 700;
  const scale = targetWpx / gFirstPageWpt; // px per point
  const targetHpx = Math.round(gFirstPageHpt * scale);
  pageImg.style.height = `${targetHpx}px`;
  wrap.style.height = `${targetHpx}px`;
  return scale;
}

function attachStickerInteractions(pxPerPt){
  const sticker = document.getElementById('headerSticker');
  const posInput = document.getElementById('posTopPt');
  const scaleSlider = document.getElementById('scaleSlider');
  const scaleVal = document.getElementById('scaleVal');

  // apply current values
  sticker.style.transform = `scale(${gScale})`;
  scaleVal.textContent = `${Math.round(gScale*100)}%`;

  // position from top in px (preview)
  function refreshStickerPosition(){
    const yPx = Math.max(0, Math.round(gTopFromTopPt * pxPerPt));
    sticker.style.top = `${yPx}px`;
  }
  refreshStickerPosition();

  // drag vertical only
  let dragging = false, startY = 0, startTopPt = 0;
  sticker.onmousedown = (e)=>{ dragging=true; startY=e.clientY; startTopPt=gTopFromTopPt; e.preventDefault(); };
  window.onmousemove = (e)=>{
    if(!dragging) return;
    const dyPx = e.clientY - startY;
    const dyPt = dyPx / pxPerPt;
    gTopFromTopPt = Math.max(0, Math.min(400, Math.round(startTopPt + dyPt)));
    posInput.value = gTopFromTopPt;
    refreshStickerPosition();
  };
  window.onmouseup = ()=> dragging=false;

  // slider/number
  posInput.oninput = ()=>{ gTopFromTopPt = Math.max(0, parseInt(posInput.value||'0',10)); refreshStickerPosition(); };
  scaleSlider.oninput = ()=>{
    gScale = parseInt(scaleSlider.value,10)/100;
    sticker.style.transform = `scale(${gScale})`;
    scaleVal.textContent = `${scaleSlider.value}%`;
  };
}

async function handlePreview(){
  const file = document.getElementById('pdfFile').files[0];
  if(!file){ alert('Please select a PDF to brand!'); return; }

  // load original PDF (once)
  gPdfBytes = await file.arrayBuffer();
  gPdfDoc = await PDFLib.PDFDocument.load(gPdfBytes);
  const first = gPdfDoc.getPage(0);
  const sz = first.getSize(); gFirstPageWpt = sz.width; gFirstPageHpt = sz.height;

  await buildHeaderStickerBitmapForPreview();

  // set sticker src and show panel
  const sticker = document.getElementById('headerSticker');
  sticker.src = gStickerDataURL;

  document.getElementById('previewPanel').style.display = 'block';
  const pxPerPt = showPreviewSizeBox();

  // set sticker width in preview to match gStickerWpt scaled to px
  const stickerWpx = Math.round(gStickerWpt * pxPerPt);
  sticker.style.width = `${stickerWpx}px`;

  attachStickerInteractions(pxPerPt);
}

/* ---- Export (burn image into PDF) ---- */
async function handleDownload(){
  if(!gPdfDoc || !gStickerDataURL){ alert('Please click Preview Header first.'); return; }

  const whiteUnderlay = document.getElementById('whiteUnderlay').checked;
  const applyAll = document.getElementById('applyAllPages').checked;

  // embed sticker image
  const stickerBytes = dataURLToUint8Array(gStickerDataURL);
  const pdfDoc = await PDFLib.PDFDocument.load(gPdfBytes); // start from original again
  const stickerImg = await pdfDoc.embedPng(stickerBytes);

  // scaled dimensions in PDF points
  const wPt = gStickerWpt * gScale;
  const hPt = gStickerHpt * gScale;

  const placeOnPage = (page)=>{
    const { width, height } = page.getSize();
    const x = (width - wPt)/2;
    const y = height - gTopFromTopPt - hPt; // from top down
    if(whiteUnderlay){
      page.drawRectangle({ x, y, width:wPt, height:hPt, color: PDFLib.rgb(1,1,1) });
    }
    page.drawImage(stickerImg, { x, y, width:wPt, height:hPt });
  };

  if(applyAll){
    pdfDoc.getPages().forEach(placeOnPage);
  } else {
    placeOnPage(pdfDoc.getPage(0));
  }

  const out = await pdfDoc.save();
  const blob = new Blob([out], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url; a.download = 'QuestionPaper_Branded.pdf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  window.open(url,'_blank');
}

/* ---- Wire up UI ---- */
document.getElementById('previewBtn').addEventListener('click', handlePreview);
document.getElementById('downloadBtn').addEventListener('click', handleDownload);

flatpickr("#date",{ dateFormat:"d-m-Y", allowInput:false, defaultDate:"today" });
createDropdown('class-dropdown', config.classes, 'Select Class');
createDropdown('subject-dropdown', [], 'Select Subject');
document.getElementById('class-dropdown').addEventListener('change', ()=>{
  const sel = document.getElementById('class-dropdown').dataset.value;
  const subs = config.subjectMappings[sel] || [];
  createDropdown('subject-dropdown', subs, 'Select Subject');
});
</script>
<div id="spinner-overlay" style="display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,0.80);align-items:center;justify-content:center;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <div class="spinner" style="width:52px;height:52px;border:6px solid #1762a7;border-top:6px solid #bcd6ef;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <div style="font-size:1.1em;color:#1762a7;font-weight:600;">Branding PDF, please wait...</div>
  </div>
</div>
</body>
</html>
