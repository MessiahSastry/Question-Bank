  <style>
    :root {
      --header-height: 90px;
      --chat-bar-height: 65px;
      --brand1:#1762a7;
      --brand2:#0f3d6b;
      --accent:#ff9933;
      --green:#28a745;
      --line:#e6eff8;
      --card:#fff;
      --text:#2f4866;
      --ink:#0f2840;
    }

    html { height:-webkit-fill-available; }
    body {
      margin:0; padding:0; font-family:'Inter','Segoe UI',Arial,sans-serif;
      background:#f4f8fc; min-height:100vh; height:auto; overflow-y:auto;
    }
    body::after{
      content:"St. Patrick's\\A IIT & NEET FOUNDATION";
      white-space:pre; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);

    /* Site header (hidden in this workspace, but keep for consistency) */
    #main-header{
      background:linear-gradient(90deg,var(--brand1),var(--brand2)); color:#fff;
      border-bottom-left-radius:28px; border-bottom-right-radius:28px;
      min-height:var(--header-height); display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:15px 10px 18px; box-sizing:border-box; flex-shrink:0; position:sticky; top:0; z-index:1200;
    }
    #main-header .school-title{ font-size:1.8em; font-weight:bold; margin:0; }
    #main-header .subtitle{ font-size:1.05em; color:#e0eaff; margin-top:5px; }

    .page-wrapper{ display:flex; flex-direction:column; height:100%; }
    main{ flex-grow:1; display:flex; flex-direction:column; }
    @media (hover:hover) and (pointer:fine){ main{ overflow:visible; } }

    /* ===== Popup Workspace (matches AI-gen chat workspace) ===== */
    .review-container{
      width:100%; max-width:900px; margin:auto; background:#fff; border-radius:16px;
      box-shadow:0 4px 18px rgba(0,27,68,0.1);
      display:flex; flex-direction:column; flex-grow:1; overflow:visible;
      margin-top:20px; margin-bottom:20px; min-height:calc(100vh - 40px);

    .chat-ui-bar{
      background:linear-gradient(90deg,var(--brand1),var(--brand2));

    }
    .chat-header-line{ width:100%; }
    .actions-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%; margin-top:4px; }

    .btn{ display:inline-block; width:100%; padding:10px 0; border-radius:8px; border:1.5px solid transparent; font-weight:700; font-size:.95em; cursor:pointer; }
    .action-saffron{ background:var(--accent); color:#fff; }
    .action-green{ background:var(--green); color:#fff; }
    .action-outline{ background:#fff; color:var(--brand2); border-color:var(--brand2); }

    /* Full-width thin strip toggle (matches AI-gen) */
    .strip-cta{
      display:block; width:100vw; margin:12px 0 8px;
      margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
      padding:12px 16px; background:linear-gradient(90deg,var(--brand1),var(--brand2));
      color:#fff; border:0; border-radius:0; font-weight:700; text-align:center;
      box-shadow:0 2px 8px rgba(0,0,0,.12);
    }

    /* Paste panel (popup style) */
    .paste-zone{ background:#ffffff; border:1px solid #bcd6ef; border-radius:10px; margin:10px 15px 0 15px; display:none; }
    .pz-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--line); }
    .pz-body{ padding:0 12px 12px; }
    #paste-answers-text{ width:100%; box-sizing:border-box; border:0; outline:0; min-height:45vh; height:45vh; font-size:15px; line-height:1.4; }
    .pz-note{ font-size:12px; color:#5b6b7a; margin-top:6px; }

    /* Batches list (compact cards) */
    .batches{ padding:10px 15px 0; }
    .batch-card{ border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; margin-bottom:10px; }
    .batch-head{ display:flex; align-items:center; justify-content:space-between; color:var(--ink); font-weight:800; margin-bottom:4px; }

    .batch-btn.primary{ background:var(--brand2); color:#fff; }

    /* Questions preview → chat-style AI bubbles */
    .chat-messages-area{ flex-grow:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; }
    .ai-question-item{
      background:#fff; color:#222; float:left; text-align:left; max-width:85%;
      margin-bottom:12px; padding:12px 16px; border-radius:14px; font-size:.95em; line-height:1.5em;

    /* Bottom sticky controls */
    .chat-input-bar{ background:linear-gradient(90deg,var(--brand1),var(--brand2)); color:#fff; padding:12px 15px; }
    .footer-actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    #batch-progress{ font-weight:600; margin-bottom:8px; }

    /* Confirmation modal (reuse AI-gen styles) */
    .confirmation-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:3000; padding:15px; box-sizing:border-box; }
    .confirmation-modal{
      background:#fff; padding:25px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.3); width:min(560px,92vw); max-height:85vh; display:flex; flex-direction:column;
    }
    .confirmation-modal h3{ margin:0 0 10px; font-size:1.2em; color:var(--brand2); }
    .confirmation-modal p{ flex:1 1 auto; overflow:auto; margin:0; white-space:pre-wrap; color:#333; }
    .confirmation-modal .modal-buttons{ margin-top:12px; display:flex; gap:10px; justify-content:flex-end; }

    /* Workspace behavior (match AI-gen) */
    body.chat-lock { overflow:hidden; height:100vh; }

<script>
  // Pull and consume the Bank→AnswerKey payload once
  function __consumeBankPayload() {
    try {
      const raw = sessionStorage.getItem('answerKeyPayload');
      const p = raw ? JSON.parse(raw) : null;
      if (!p || p.source !== 'bank') return null;
      sessionStorage.removeItem('answerKeyPayload');
      return p;
    } catch (_) { return null; }
  }
</script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    /* ---------- CONFIG ---------- */
    const API_BASE_URL = 'https://question-bank-lqsu.onrender.com'; // (unused here, safe to keep)
    const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.appspot.com",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    /* ---------- STATE ---------- */
    let currentUserProfile = null;
    let sessionParams = { class:'', subject:'', chapter:'', questionType:'', questionIds:[] };
    let selectedQuestions = [];            // [{id, question, options[], metaLine, ...}]
    let batches = [];                      // [[q,q,...], ...] groups of 15
    let currentBatchIndex = 0;
    let savedAnswers = new Map();          // id -> {answer, explanation}
    let batchSaved = new Set();            // batchIndex that has been saved

    /* ---------- INIT ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      auth.onAuthStateChanged(async (user) => {
        if (!user) { location.href = 'login.html'; return; }
        currentUserProfile = { uid:user.uid, email:user.email, name:user.displayName };

        // Hide site header & lock body (popup workspace like AI-gen)
        document.body.classList.add('chat-lock');
        const hdr = document.getElementById('main-header'); if (hdr) hdr.style.display = 'none';

        // get IDs from history.state or ?ids=
        const st = history.state || {};
        const urlParams = new URLSearchParams(location.search);
        const qpIds = (urlParams.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);

        sessionParams = st.sessionParams || {
          class: st.class || urlParams.get('class') || '',
          subject: st.subject || urlParams.get('subject') || '',
          chapter: st.chapter || urlParams.get('chapter') || '',
          questionType: st.questionType || urlParams.get('questionType') || 'MCQ (Single)'
        };
        const passedIds = (st.questionIds && st.questionIds.length) ? st.questionIds : qpIds;

        const __p = (typeof __consumeBankPayload === 'function') ? __consumeBankPayload() : null;

if (__p) {
  sessionParams = {
    class: __p.meta?.class || '',
    subject: __p.meta?.subject || '',
    chapter: __p.meta?.chapter || '',
    questionType: __p.meta?.questionType || 'MCQ (Single)',
    questionIds: []
  };

  selectedQuestions = (__p.questions || []).map((q, i) => ({
    id: q.id || ('local_' + (i + 1)),
    questionNumber: i + 1,
    question: q.question || '',
    options: Array.isArray(q.options) ? q.options.slice(0,4) : [],
    parsedAnswer: q.answer || ''
  }));
  sessionParams.questionIds = selectedQuestions.map(x => x.id);
} else {
  await loadSelection(passedIds);
}
        renderHeaderInfo();
        makeBatches(15);
        renderBatches();
        renderBatchProgress();
        renderQuestionPreviewForBatch();

        // Wire actions
        byId('btn-open-chatgpt').onclick = openChatGptForCurrentBatch;
        byId('btn-next-batch').onclick   = () => gotoBatch(currentBatchIndex + 1);
        byId('btn-prev-batch').onclick   = () => gotoBatch(currentBatchIndex - 1);
        byId('btn-parse-save').onclick   = parseAndSaveCurrentBatch;
        byId('btn-save-all').onclick     = saveAllToFirestore;
        byId('btn-download').onclick     = downloadAnswerKey;
        byId('btn-change-selection').onclick = () => history.back();

        const togg = byId('ai-toggle-paste-btn');
        const pz   = byId('paste-zone');
        togg.onclick = () => {
          const open = getComputedStyle(pz).display !== 'none';
          pz.style.display = open ? 'none' : 'block';
          togg.textContent = open ? 'Show Paste Panel' : 'Hide Paste Panel';
          togg.setAttribute('aria-expanded', String(!open));
          if (!open) byId('paste-answers-text')?.focus();
        };
      });
    });

    /* ---------- LOAD SELECTION ---------- */
    async function loadSelection(ids){
      // If IDs provided, fetch those. Else: fallback by class/subject/chapter.
      if (ids && ids.length){
        sessionParams.questionIds = ids;
        const chunks = [];
        const chunkSize = 10; // Firestore "in" limit
        for (let i=0;i<ids.length;i+=chunkSize){
          const slice = ids.slice(i, i+chunkSize);
          const qs = await db.collection('questions').where(firebase.firestore.FieldPath.documentId(), 'in', slice).get();
          qs.forEach(doc => chunks.push({id:doc.id, ...doc.data()}));
        }
       selectedQuestions = sortByNumber(chunks);

      } else {
        const snap = await db.collection('questions')
          .where('class','==',sessionParams.class)
          .where('subject','==',sessionParams.subject)
          .where('chapter','==',sessionParams.chapter)
          .orderBy('questionNumber','asc')
          .get();
        selectedQuestions = [];
        snap.forEach(doc => selectedQuestions.push({id:doc.id, ...doc.data()}));
        sessionParams.questionIds = selectedQuestions.map(x => x.id);
      }
    }

    function sortByNumber(arr){
      return arr
        .map(q => ({...q, __n: q.questionNumber || 0}))
        .sort((a,b) => a.__n - b.__n)
        .map(q => (delete q.__n, q));
    }

    /* ---------- BATCHING ---------- */
    function makeBatches(size){
      batches = [];
      for (let i=0;i<selectedQuestions.length;i+=size){
        batches.push(selectedQuestions.slice(i, i+size));
      }
      currentBatchIndex = 0;
    }

    function gotoBatch(idx){
      if (idx < 0 || idx >= batches.length) return;
      currentBatchIndex = idx;
      renderBatchProgress();
      renderQuestionPreviewForBatch();
      toast(`Batch ${idx+1} ready`);
    }

   /* ---------- SANITIZE (strip any saved MathJax/mjx/SVG) ---------- */
function __cleanMathJaxArtifacts(s=''){
  const str = String(s);

  // If it already looks like plain TeX (no HTML tags) keep it EXACTLY as is.
  const hasTags = /<[^>]+>/.test(str);
  const hasPlainTeX = /\\\(|\\\[|\\begin\{/.test(str);
  if (hasPlainTeX && !hasTags) return str;

  let t = str;

  // Remove whole MathJax containers and inline SVG blobs
  t = t
    .replace(/<mjx-container[\s\S]*?<\/mjx-container>/gi, '')
    .replace(/<svg[\s\S]*?<\/svg>/gi, '');

  // Strip remaining MathJax/SVG related tags
  t = t.replace(/<\/?(?:mjx-\w+|g|path|defs|use|rect|span|div|style)\b[^>]*>/gi, '');

  // Remove any path "d" attributes that may have leaked
  t = t.replace(/\bd="[^"]*"/gi, '');

  // Remove lines that are ONLY SVG path commands (avoid nuking normal text)
  t = t.replace(/^[ \t]*[MLCQTSHVZmlcqts hvz][0-9,\.\-\seE]+[ \t]*$/gm, '');

  // Normalize whitespace; DO NOT touch backslashes
  t = t
    .replace(/&nbsp;/gi, ' ')
    .replace(/\s+\n/g, '\n')
    .replace(/\n\s+/g, '\n')
    .replace(/[ \t]{2,}/g, ' ')
    .trim();

  return t;
}
/* ---------- RENDER ---------- */

    function renderHeaderInfo(){
      byId('hdr-class').textContent   = sessionParams.class || '—';
      byId('hdr-subject').textContent = sessionParams.subject || '—';
      byId('hdr-chapter').textContent = sessionParams.chapter || '—';
      byId('hdr-count').textContent   = sessionParams.questionIds.length || 0;
    }

    function renderBatches(){
      const el = byId('batches');
      el.innerHTML = '';
      batches.forEach((group, i) => {
        const total = group.length;
        const saved = batchSaved.has(i) ? '✅ Saved' : '⏳ Pending';
        const div = document.createElement('div');
        div.className = 'batch-card';
        div.innerHTML = `
          <div class="batch-head">
            <div>Batch ${i+1} of ${batches.length}</div>
            <div>${saved}</div>
          </div>
          <div class="batch-meta">${total} question(s)</div>
          <div class="batch-actions">
            <button class="batch-btn" data-goto="${i}">Open</button>
            <button class="batch-btn primary" data-chat="${i}">Open ChatGPT (Prefilled)</button>
          </div>
        `;
        el.appendChild(div);
      });

      el.querySelectorAll('button[data-goto]').forEach(btn => {
        btn.onclick = () => gotoBatch(parseInt(btn.dataset.goto,10));
      });
      el.querySelectorAll('button[data-chat]').forEach(btn => {
        btn.onclick = () => { currentBatchIndex = parseInt(btn.dataset.chat,10); openChatGptForCurrentBatch(); };
      });
    }

    function renderBatchProgress(){
      const n = batches.length ? currentBatchIndex + 1 : 0;
      byId('batch-progress').textContent = batches.length
        ? `Batch ${n} / ${batches.length}`
        : 'No batches';
    }

    function renderQuestionPreviewForBatch(){
      const area = byId('chat-messages-area');
      area.innerHTML = '';
      const cur = batches[currentBatchIndex] || [];
      cur.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'ai-question-item';
        const label = q.questionNumber ? `Q${q.questionNumber}` : `#${idx+1}`;
        const body = buildQuestionBody(q);
        item.innerHTML = `<span class="question-meta-ai">${label}</span>`;
        const txt = document.createElement('div');
        txt.className = 'question-text-ai';
        txt.textContent = __cleanMathJaxArtifacts(body);  // strip any saved SVG/mjx first
        item.appendChild(txt);
        area.appendChild(item);
      });
      if (window.MathJax) MathJax.typesetPromise([area]);
    }

    function buildQuestionBody(q){
  const stem = __cleanMathJaxArtifacts(q.question || q.body || q.text || '');
  if (q.options && q.options.length){
    const lines = [
      stem,
      `A) ${__cleanMathJaxArtifacts(q.options[0] || '')}`,
      `B) ${__cleanMathJaxArtifacts(q.options[1] || '')}`,
      `C) ${__cleanMathJaxArtifacts(q.options[2] || '')}`,
      `D) ${__cleanMathJaxArtifacts(q.options[3] || '')}`
    ];
    return lines.join('\n');
  }
  return stem;
}

    /* ---------- CHATGPT HANDOFF ---------- */
    function openChatGptForCurrentBatch(){
      const cur = batches[currentBatchIndex] || [];
      if (!cur.length){ toast('No questions in this batch'); return; }

      const header = [
        `Please provide the CORRECT ANSWER and a CLEAR, STEP-BY-STEP EXPLANATION for each question.`,
        `Respond as:`,
        `Q<n>: Ans: <A) or B) or C) or D) or text>`,
        `Explanation: <your explanation>`,
        ``,
        `Class: ${sessionParams.class}`,
        `Subject: ${sessionParams.subject}`,
        `Chapter: ${sessionParams.chapter}`,
        ``,
        `QUESTIONS:`
      ].join('\\n');

      const body = cur.map((q, i) => {
        const label = q.questionNumber ? `Q${q.questionNumber}` : `Q${i+1}`;
        const stem  = __cleanMathJaxArtifacts(q.question || q.body || q.text || '');
const opts  = (q.options && q.options.length)
  ? `\nA) ${__cleanMathJaxArtifacts(q.options[0] || '')}\nB) ${__cleanMathJaxArtifacts(q.options[1] || '')}\nC) ${__cleanMathJaxArtifacts(q.options[2] || '')}\nD) ${__cleanMathJaxArtifacts(q.options[3] || '')}`
  : '';
        return `${label}:\\n${stem}${opts}`;
      }).join('\\n\\n');

      const prompt = `${header}\\n\\n${body}\\n\\nSTRICT:\\n- Keep exactly the format lines per question.\\n- No extra commentary before/after.`;
      openInChatGptWithPrefill(prompt);
    }

    async function openInChatGptWithPrefill(text){
      let copied = false;
      try { await navigator.clipboard.writeText(text); copied = true; } catch {}
      toast(copied ? 'Copied prompt. Opening ChatGPT…' : 'Opening ChatGPT… (paste manually)');
      const url = new URL('https://chatgpt.com/');
      url.searchParams.set('q', text);
      window.open(url.toString(), '_blank', 'noopener');
    }

    /* ---------- PARSE & SAVE BATCH ---------- */
    async function parseAndSaveCurrentBatch(){
      const raw = byId('paste-answers-text').value.trim();
      if (!raw){ toast('Paste ChatGPT output first'); return; }

      const cur = batches[currentBatchIndex] || [];
      if (!cur.length){ toast('Nothing to save for this batch'); return; }

      // Build label -> doc map
      const indexByLabel = new Map();
      cur.forEach((q, i) => {
        const label = q.questionNumber ? `Q${q.questionNumber}` : `Q${i+1}`;
        indexByLabel.set(label.toUpperCase(), q);
      });

      // Robust blocks split (captures first block too)
      const blocks = raw
        .split(/(?:^|\n)(?=Q\s*\d+\s*[:\)])/ig)
        .map(s => s.trim())
        .filter(Boolean);

      let parsedCount = 0;
      const toWrite = [];

      blocks.forEach(block => {
        const headerMatch = block.match(/^Q\s*(\d+)\s*[:\)]/i);
        if (!headerMatch) return;

        const qNum = headerMatch[1];
        const key = `Q${qNum}`.toUpperCase();
        const qDoc = indexByLabel.get(key);
        if (!qDoc) return;

        // Extract answer + explanation
        let answer = null, explanation = '';
        const ansLine = block.match(/Ans\s*:\s*(.+)/i);
        if (ansLine){
          answer = ansLine[1].trim();
          const expMatch = block.match(/Explanation\s*:\s*([\s\S]+)/i);
          explanation = expMatch ? expMatch[1].trim() : block.replace(/^[^\n]*Ans[^\n]*\n?/i,'').trim();
        } else {
          const compact = block.replace(/^Q\s*\d+\s*[:\)]\s*/i, '');
          const m = compact.match(/^([A-D]\)|[A-D]\b|[A-D](?=\s)|[^\n]+?)\s*[-–:]\s*(.+)/i);
          if (m){
            answer = m[1].trim();
            explanation = m[2].trim();
          } else {
            const firstLine = compact.split('\n')[0] || '';
            const A = firstLine.match(/^\s*([A-D]\)|[A-D]\b)/i);
            if (A){
              answer = A[1].trim();
              explanation = compact.replace(A[0],'').trim();
            }
          }
        }

        // Normalize letters only (avoid picking letters from text)
        const letterOnly = (answer || '').match(/^\s*([A-D])\)?\s*(?:[,/&]?\s*([A-D])\)?)?\s*$/i);
        if (qDoc.options && qDoc.options.length){
          if (letterOnly){
            const picks = [...new Set([letterOnly[1], letterOnly[2]].filter(Boolean).map(s => s.toUpperCase()))];
            answer = picks.length > 1 ? `Ans: ${picks.map(L => `${L})`).join(', ')}` : `Ans: ${picks[0]})`;
          } else if (answer){
            answer = `Ans: ${answer}`;
          }
        } else if (answer){
          answer = `Ans: ${answer}`;
        }

        toWrite.push({ id:qDoc.id, answer:answer || null, explanation:explanation || '' });
        parsedCount++;
      });

      if (!parsedCount){ toast('Could not match any Q<n> in this batch'); return; }

      // Save to Firestore
      await Promise.all(toWrite.map(rec => {
        savedAnswers.set(rec.id, { answer:rec.answer, explanation:rec.explanation });
        return db.collection('questions').doc(rec.id).update({
          parsedAnswer: rec.answer || null,
          explanation: rec.explanation || '',
          updatedBy: currentUserProfile.uid,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }));

      batchSaved.add(currentBatchIndex);
      renderBatches();
      byId('paste-answers-text').value = '';
      toast(`Saved ${parsedCount} answer(s) for Batch ${currentBatchIndex+1}`);
    }

    /* ---------- SAVE ALL ---------- */
    async function saveAllToFirestore(){
      if (!savedAnswers.size){ toast('No parsed answers yet'); return; }
      toast('All parsed answers already saved to database');
    }

    /* ---------- DOWNLOAD KEY ---------- */
    async function downloadAnswerKey(){
      const rows = [];
      for (const q of selectedQuestions){
        const key   = savedAnswers.get(q.id) || { answer: q.parsedAnswer || q.answer || '', explanation: q.explanation || '' };
        const label = q.questionNumber ? `Q${q.questionNumber}` : q.id.slice(0,6);
        rows.push({
          label,
          question: __cleanMathJaxArtifacts(q.question || q.text || q.body || ''),
          answer: (key.answer || '').trim(),
          explanation: (key.explanation || '').trim()
        });
      }

      if (!rows.length){ toast('Nothing to download'); return; }

      const txt = rows.map(r =>
`${r.label}
Question: ${r.question}
${r.answer ? r.answer+'\n' : ''}Explanation: ${r.explanation || '(not provided)'}
`).join('\n');

      const csv = [
        ['Label','Question','Answer','Explanation'].map(quoteCSV).join(','),
        ...rows.map(r => [r.label, r.question, r.answer, r.explanation].map(quoteCSV).join(','))
      ].join('\n');

      saveBlob(txt, buildFileName('answer-key.txt'), 'text/plain;charset=utf-8');
      saveBlob(csv, buildFileName('answer-key.csv'), 'text/csv;charset=utf-8');
      toast('Downloading TXT and CSV…');
    }

    function buildFileName(ext){
      const cls = (sessionParams.class || 'Class').replace(/\s+/g,'');
      const subj = (sessionParams.subject || 'Subject').replace(/\s+/g,'');
      const chap = (sessionParams.chapter || 'Chapter').replace(/[^\w]+/g,'_');
      return `${cls}_${subj}_${chap}_${ext}`;
    }

    function saveBlob(content, filename, type){
      const blob = new Blob([content], {type});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    }

    function quoteCSV(s){
      const t = (s || '').replace(/"/g,'""');
      return `"${t}"`;
    }

    /* ---------- UTILS ---------- */
    function byId(id){ return document.getElementById(id); }
    function toast(msg){
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(()=>{ t.style.transition='opacity .35s'; t.style.opacity='0'; }, 1200);
      setTimeout(()=> t.remove(), 1600);
    }
    function escapeHtml(s=''){
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
