<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Get Answer Key | St. Patrick's School</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- MathJax (same config) -->
  <script>
    window.MathJax = {
      loader: { load: ['[tex]/noerrors'] },
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true,
        packages: {'[+]': ['noerrors']}
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    :root { --header-height: 90px; --chat-bar-height: 65px; }
    html { height: -webkit-fill-available; }
    body {
      margin:0; padding:0; font-family:'Inter','Segoe UI',Arial,sans-serif;
      background:#f4f8fc; min-height:100vh; height:auto; overflow-y:auto;
    }
    body::after{
      content:"St. Patrick's\\A IIT & NEET FOUNDATION";
      white-space:pre; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
      font-size:5vw; font-weight:bold; color:rgba(15,61,107,0.04); z-index:-1; pointer-events:none; line-height:1.2; text-align:center;
    }
    .page-wrapper{ display:flex; flex-direction:column; height:100%; }
    #main-header{
      background:linear-gradient(90deg,#1762a7,#0f3d6b); color:#fff;
      border-bottom-left-radius:28px; border-bottom-right-radius:28px;
      min-height:var(--header-height); display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:15px 10px 18px; box-sizing:border-box; flex-shrink:0; position:sticky; top:0; z-index:1200;
    }
    #main-header .school-title{ font-size:1.8em; font-weight:bold; margin:0; }
    #main-header .subtitle{ font-size:1.05em; color:#e0eaff; margin-top:5px; }
    main{ flex-grow:1; display:flex; flex-direction:column; }
    @media (hover:hover) and (pointer:fine){ main{ overflow:visible; } }

    .review-container{
      width:100%; max-width:900px; margin:auto; background:#fff; border-radius:16px;
      box-shadow:0 4px 18px rgba(0,27,68,0.1);
      display:flex; flex-direction:column; flex-grow:1; overflow:visible;
      margin-top:20px; margin-bottom:20px; min-height:calc(100vh - 40px);
    }

    .setup-form-container{ padding:25px 30px; }
    .setup-form-container h2{ text-align:center; color:#0f3d6b; margin:0 0 12px; }
    .info-line{ text-align:center; margin:6px 0 16px; color:#2f4866; font-weight:600; }
    .pill{ display:inline-block; background:#eaf2fb; color:#12416c; border:1px solid #bcd6ef; border-radius:999px; padding:6px 12px; margin:0 6px; font-size:0.9em; }

    .chat-ui-bar{ background:linear-gradient(90deg,#1762a7,#0f3d6b); color:#fff; padding:12px 15px; }
    .actions-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; margin-top:8px; }
    .btn{ display:inline-block; width:100%; padding:10px 0; border-radius:8px; border:1.5px solid transparent; font-weight:700; font-size:.95em; cursor:pointer; }
    .action-saffron{ background:#ff9933; color:#fff; }
    .action-green{ background:#28a745; color:#fff; }
    .action-outline{ background:#fff; color:#1762a7; border-color:#1762a7; }

    #ai-toggle-paste-btn{
      display:block; width:100vw; margin:12px 0 8px; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
      padding:12px 16px; background:linear-gradient(90deg,#1762a7,#0f3d6b); color:#fff; border:0; border-radius:0;
      font-weight:700; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.12);
    }

    .batch-card{
      border:1px solid #bcd6ef; border-radius:12px; padding:14px; margin:10px 15px; background:#fff;
    }
    .batch-header{ display:flex; align-items:center; justify-content:space-between; color:#0f3d6b; font-weight:700; }
    .batch-meta{ color:#2b5876; font-size:0.92em; margin-top:4px; }
    .batch-actions{ display:flex; gap:10px; margin-top:10px; }
    .batch-btn{ padding:8px 12px; border-radius:8px; border:1px solid #1762a7; color:#1762a7; background:#fff; font-weight:700; cursor:pointer; }
    .batch-btn.primary{ background:#1762a7; color:#fff; border-color:#1762a7; }
    .batch-btn.green{ background:#28a745; color:#fff; border-color:#28a745; }

    .paste-zone{ background:#ffffff; border:1px solid #bcd6ef; border-radius:10px; margin:10px 15px 0 15px; display:none; }
    .pz-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid #e6eff8; }
    .pz-body{ padding:0 12px 12px; }
    #paste-answers-text{ width:100%; box-sizing:border-box; border:0; outline:0; min-height:40vh; font-size:15px; line-height:1.4; }
    .pz-note{ font-size:12px; color:#5b6b7a; margin-top:6px; }

    .confirmation-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:3000; padding:15px; box-sizing:border-box; }
    .confirmation-modal{ background:#fff; padding:25px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,.3); width:min(560px,92vw); max-height:85vh; display:flex; flex-direction:column; }
    .confirmation-modal h3{ margin:0 0 10px; font-size:1.2em; color:#0f3d6b; }
    .confirmation-modal p{ flex:1 1 auto; overflow:auto; margin:0; white-space:pre-wrap; color:#333; }
    .confirmation-modal .modal-buttons{ margin-top:12px; display:flex; gap:10px; justify-content:flex-end; }
    .confirmation-modal .modal-buttons button{ padding:10px 20px; border:0; border-radius:6px; font-weight:700; cursor:pointer; }
    #confirm-cancel-btn{ background:#e9ecef; color:#495057; }
    #confirm-proceed-btn{ background:#0f3d6b; color:#fff; }

    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:24px; background:#0f3d6b; color:#fff; padding:10px 14px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.2); z-index:100000; font-weight:600; letter-spacing:.2px; font-size:14px; opacity:.98; }

    .ai-list{ padding:10px 15px 0; }
    .q-item{ background:#fff; border:1px solid #e6eff8; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
    .q-meta{ color:#c82333; font-weight:600; font-size:0.9em; margin-bottom:6px; }
    .q-text{ color:#004085; white-space:pre-wrap; }

    .footer-bar.chat-ui-bar{ display:flex; flex-direction:column; gap:8px; }
    .footer-actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header id="main-header">
      <h1 class="school-title">St. Patrick's School</h1>
      <div class="subtitle">IIT & NEET FOUNDATION</div>
    </header>

    <main>
      <div id="wrap" class="review-container">
        <div class="setup-form-container">
          <h2>Get Answer Key</h2>
          <div id="top-info" class="info-line">
            <span class="pill" id="pill-class">Class: —</span>
            <span class="pill" id="pill-subject">Subject: —</span>
            <span class="pill" id="pill-chapter">Chapter: —</span>
            <span class="pill" id="pill-count">0 selected</span>
          </div>

          <div class="actions-row">
            <button id="btn-change-selection" class="btn action-saffron">Change Selection</button>
            <button id="btn-download" class="btn action-outline">Download Key</button>
            <button id="btn-save-all" class="btn action-green">Save All</button>
          </div>
        </div>

        <!-- Batch list -->
        <div id="batches"></div>

        <!-- Paste Panel -->
        <button id="ai-toggle-paste-btn">Show Paste Panel</button>
        <div class="paste-zone" id="paste-zone">
          <div class="pz-head">
            <span style="font-weight:700;color:#0f3d6b;">Paste Answers + Explanations for Current Batch</span>
            <button id="btn-parse-save" class="batch-btn green">Parse & Save This Batch</button>
          </div>
          <div class="pz-body">
            <textarea id="paste-answers-text" placeholder="Paste ChatGPT output here. Accepts formats like:
Q1: Ans: C) 
Explanation: ...
— or —
Q1) C — <explanation>"></textarea>
            <div class="pz-note">Tip: We send 15 questions at a time. After reviewing answers, paste here and click “Parse & Save This Batch”.</div>
          </div>
        </div>

        <!-- Questions preview (optional) -->
        <div id="question-list" class="ai-list"></div>

        <div class="footer-bar chat-ui-bar">
          <div id="batch-progress" style="font-weight:600;"></div>
          <div class="footer-actions">
            <button class="btn action-outline" id="btn-prev-batch">Previous Batch</button>
            <button class="btn action-saffron" id="btn-open-chatgpt">Open ChatGPT (Prefilled)</button>
            <button class="btn action-outline" id="btn-next-batch">Next Batch</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    /* ---------- CONFIG ---------- */
    const API_BASE_URL = 'https://question-bank-lqsu.onrender.com';
    const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.appspot.com",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    /* ---------- STATE ---------- */
    let currentUserProfile = null;
    let sessionParams = { class:'', subject:'', chapter:'', questionType:'', questionIds:[] };
    let selectedQuestions = [];            // [{id, question, options[], metaLine, ...}]
    let batches = [];                      // [[q,q,...], ...] groups of 15
    let currentBatchIndex = 0;
    let savedAnswers = new Map();          // id -> {answer, explanation}
    let batchSaved = new Set();            // batchIndex that has been saved

    /* ---------- INIT ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      auth.onAuthStateChanged(async (user) => {
        if (!user) { location.href = 'login.html'; return; }
        currentUserProfile = { uid:user.uid, email:user.email, name:user.displayName };

        // get IDs from history.state or ?ids=
        const st = history.state || {};
        const urlParams = new URLSearchParams(location.search);
        const qpIds = (urlParams.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);

        sessionParams = st.sessionParams || {
          class: st.class || '',
          subject: st.subject || '',
          chapter: st.chapter || '',
          questionType: st.questionType || 'MCQ (Single)'
        };
        const passedIds = (st.questionIds && st.questionIds.length) ? st.questionIds : qpIds;

        await loadSelection(passedIds);
        renderHeaderInfo();
        makeBatches(15);
        renderBatches();
        renderBatchProgress();
        renderQuestionPreviewForBatch();

        // Wire actions
        byId('btn-open-chatgpt').onclick = openChatGptForCurrentBatch;
        byId('btn-next-batch').onclick   = () => gotoBatch(currentBatchIndex + 1);
        byId('btn-prev-batch').onclick   = () => gotoBatch(currentBatchIndex - 1);
        byId('btn-parse-save').onclick   = parseAndSaveCurrentBatch;
        byId('btn-save-all').onclick     = saveAllToFirestore;
        byId('btn-download').onclick     = downloadAnswerKey;
        byId('btn-change-selection').onclick = () => history.back();

        const togg = byId('ai-toggle-paste-btn');
        const pz   = byId('paste-zone');
        togg.onclick = () => {
          const open = pz.style.display !== 'none';
          pz.style.display = open ? 'none' : 'block';
          togg.textContent = open ? 'Show Paste Panel' : 'Hide Paste Panel';
        };
      });
    });

    /* ---------- LOAD SELECTION ---------- */
    async function loadSelection(ids){
      // If IDs provided, fetch those. Else: fallback by class/subject/chapter.
      if (ids && ids.length){
        sessionParams.questionIds = ids;
        const chunks = [];
        // batched fetch by ids (Firestore lacks "in" over 10? we can chunk)
        const chunkSize = 10;
        for (let i=0;i<ids.length;i+=chunkSize){
          const slice = ids.slice(i, i+chunkSize);
          const qs = await db.collection('questions').where(firebase.firestore.FieldPath.documentId(), 'in', slice).get();
          qs.forEach(doc => chunks.push({id:doc.id, ...doc.data()}));
        }
        selectedQuestions = sortByNumber(chunks);
      } else {
        // fallback: load all for this chapter
        const snap = await db.collection('questions')
          .where('class','==',sessionParams.class)
          .where('subject','==',sessionParams.subject)
          .where('chapter','==',sessionParams.chapter)
          .orderBy('questionNumber','asc')
          .get();
        selectedQuestions = [];
        snap.forEach(doc => selectedQuestions.push({id:doc.id, ...doc.data()}));
        sessionParams.questionIds = selectedQuestions.map(x => x.id);
      }
    }

    function sortByNumber(arr){
      return arr
        .map(q => ({...q, __n: q.questionNumber || 0}))
        .sort((a,b) => a.__n - b.__n)
        .map(q => (delete q.__n, q));
    }

    /* ---------- BATCHING ---------- */
    function makeBatches(size){
      batches = [];
      for (let i=0;i<selectedQuestions.length;i+=size){
        batches.push(selectedQuestions.slice(i, i+size));
      }
      currentBatchIndex = 0;
    }

    function gotoBatch(idx){
      if (idx < 0 || idx >= batches.length) return;
      currentBatchIndex = idx;
      renderBatchProgress();
      renderQuestionPreviewForBatch();
      toast(`Batch ${idx+1} ready`);
    }

    /* ---------- RENDER ---------- */
    function renderHeaderInfo(){
      byId('pill-class').textContent   = `Class: ${sessionParams.class || '—'}`;
      byId('pill-subject').textContent = `Subject: ${sessionParams.subject || '—'}`;
      byId('pill-chapter').textContent = `Chapter: ${sessionParams.chapter || '—'}`;
      byId('pill-count').textContent   = `${sessionParams.questionIds.length} selected`;
    }

    function renderBatches(){
      const el = byId('batches');
      el.innerHTML = '';
      batches.forEach((group, i) => {
        const total = group.length;
        const saved = batchSaved.has(i) ? '✅ Saved' : '⏳ Pending';
        const div = document.createElement('div');
        div.className = 'batch-card';
        div.innerHTML = `
          <div class="batch-header">
            <div>Batch ${i+1} of ${batches.length}</div>
            <div>${saved}</div>
          </div>
          <div class="batch-meta">${total} question(s)</div>
          <div class="batch-actions">
            <button class="batch-btn" data-goto="${i}">Open</button>
            <button class="batch-btn primary" data-chat="${i}">Open ChatGPT (Prefilled)</button>
          </div>
        `;
        el.appendChild(div);
      });

      el.querySelectorAll('button[data-goto]').forEach(btn => {
        btn.onclick = () => gotoBatch(parseInt(btn.dataset.goto,10));
      });
      el.querySelectorAll('button[data-chat]').forEach(btn => {
        btn.onclick = () => { currentBatchIndex = parseInt(btn.dataset.chat,10); openChatGptForCurrentBatch(); };
      });
    }

    function renderBatchProgress(){
      const n = batches.length ? currentBatchIndex + 1 : 0;
      byId('batch-progress').textContent = batches.length
        ? `Batch ${n} / ${batches.length}`
        : 'No batches';
    }

    function renderQuestionPreviewForBatch(){
      const list = byId('question-list');
      list.innerHTML = '';
      const cur = batches[currentBatchIndex] || [];
      cur.forEach((q, idx) => {
        const qi = document.createElement('div');
        qi.className = 'q-item';
        const label = q.questionNumber ? `Q${q.questionNumber}` : `#${idx+1}`;
        qi.innerHTML = `
          <div class="q-meta">${label}</div>
          <div class="q-text">${escapeHtml(buildQuestionBody(q))}</div>
        `;
        list.appendChild(qi);
      });
      if (window.MathJax) MathJax.typesetPromise([list]);
    }

    function buildQuestionBody(q){
      if (q.options && q.options.length){
        const lines = [
          q.question || q.body || '',
          `A) ${q.options[0] || ''}`,
          `B) ${q.options[1] || ''}`,
          `C) ${q.options[2] || ''}`,
          `D) ${q.options[3] || ''}`
        ];
        return lines.join('\n');
      }
      // descriptive
      return q.text || q.body || q.question || '';
    }

    /* ---------- CHATGPT HANDOFF ---------- */
    function openChatGptForCurrentBatch(){
      const cur = batches[currentBatchIndex] || [];
      if (!cur.length){ toast('No questions in this batch'); return; }

      const header = [
        `Please provide the CORRECT ANSWER and a CLEAR, STEP-BY-STEP EXPLANATION for each question.`,
        `Respond as:`,
        `Q<n>: Ans: <A) or B) or C) or D) or text>`,
        `Explanation: <your explanation>`,
        ``,
        `Class: ${sessionParams.class}`,
        `Subject: ${sessionParams.subject}`,
        `Chapter: ${sessionParams.chapter}`,
        ``,
        `QUESTIONS:`
      ].join('\n');

      const body = cur.map((q, i) => {
        const label = q.questionNumber ? `Q${q.questionNumber}` : `Q${i+1}`;
        const stem  = (q.question || q.body || q.text || '').trim();
        const opts  = (q.options && q.options.length)
          ? `\nA) ${q.options[0] || ''}\nB) ${q.options[1] || ''}\nC) ${q.options[2] || ''}\nD) ${q.options[3] || ''}`
          : '';
        return `${label}:\n${stem}${opts}`;
      }).join('\n\n');

      const prompt = `${header}\n\n${body}\n\nSTRICT:\n- Keep exactly the format lines per question.\n- No extra commentary before/after.`;
      openInChatGptWithPrefill(prompt);
    }

    async function openInChatGptWithPrefill(text){
      let copied = false;
      try { await navigator.clipboard.writeText(text); copied = true; } catch {}
      toast(copied ? 'Copied prompt. Opening ChatGPT…' : 'Opening ChatGPT… (paste manually)');
      const url = new URL('https://chatgpt.com/');
      url.searchParams.set('q', text);
      window.open(url.toString(), '_blank', 'noopener');
    }

    /* ---------- PARSE & SAVE BATCH ---------- */
    async function parseAndSaveCurrentBatch(){
      const raw = byId('paste-answers-text').value.trim();
      if (!raw){ toast('Paste ChatGPT output first'); return; }

      const cur = batches[currentBatchIndex] || [];
      if (!cur.length){ toast('Nothing to save for this batch'); return; }

      // Build a map from visible label -> question doc
      const indexByLabel = new Map();
      cur.forEach((q, i) => {
        const label = q.questionNumber ? `Q${q.questionNumber}` : `Q${i+1}`;
        indexByLabel.set(label.toUpperCase(), q);
      });

      // parser accepts:
      // Q12: Ans: C)
      // Explanation: ...
      // or
      // Q12) C — explanation...
      // or
      // Q12: A) … (explanation on next lines)
      const blocks = raw
        .split(/\n(?=Q\s*\d+\s*[:\)])/i)
        .map(s => s.trim())
        .filter(Boolean);

      let parsedCount = 0;
      const toWrite = [];

      blocks.forEach(block => {
        const headerMatch = block.match(/^Q\s*(\d+)\s*[:\)]/i);
        if (!headerMatch) return;

        const qNum = headerMatch[1];
        const key = `Q${qNum}`.toUpperCase();
        const qDoc = indexByLabel.get(key);
        if (!qDoc) return;

        // extract answer line
        let answer = null, explanation = '';
        // 1) explicit "Ans:"
        const ansLine = block.match(/Ans\s*:\s*(.+)/i);
        if (ansLine){
          answer = ansLine[1].trim();
          // explanation: after "Explanation:" or lines after Ans:
          const expMatch = block.match(/Explanation\s*:\s*([\s\S]+)/i);
          explanation = expMatch ? expMatch[1].trim() : block.replace(/^[^\n]*Ans[^\n]*\n?/i,'').trim();
        } else {
          // 2) compact "Q12) C - explanation"
          const compact = block.replace(/^Q\s*\d+\s*[:\)]\s*/i, '');
          const m = compact.match(/^([A-D]\)|[A-D]\b|[A-D](?=\s)|[^\n]+?)\s*[-–:]\s*(.+)/i);
          if (m){
            answer = m[1].trim();
            explanation = m[2].trim();
          } else {
            // 3) maybe first token is answer, rest explanation
            const firstLine = compact.split('\n')[0] || '';
            const A = firstLine.match(/^\s*([A-D]\)|[A-D]\b)/i);
            if (A){
              answer = A[1].trim();
              explanation = compact.replace(A[0],'').trim();
            }
          }
        }

        // normalize answer letters like "C" => "C)"
        if (qDoc.options && qDoc.options.length){
          // enforce letters A–D
          const letters = (answer || '').match(/[A-D]\)?/gi);
          if (letters && letters.length){
            const uniq = [...new Set(letters.map(t => t[0].toUpperCase()))];
            answer = (uniq.length === 1)
              ? `Ans: ${uniq[0]})`
              : `Ans: ${uniq.map(L => `${L})`).join(', ')}`;
          } else if (answer) {
            answer = `Ans: ${answer}`;
          }
        } else if (answer){
          answer = `Ans: ${answer}`;
        }

        toWrite.push({ id:qDoc.id, answer:answer || null, explanation:explanation || '' });
        parsedCount++;
      });

      if (!parsedCount){ toast('Could not match any Q<n> in this batch'); return; }

      // Save to Firestore
      await Promise.all(toWrite.map(rec => {
        savedAnswers.set(rec.id, { answer:rec.answer, explanation:rec.explanation });
        return db.collection('questions').doc(rec.id).update({
          parsedAnswer: rec.answer || null,
          explanation: rec.explanation || '',
          updatedBy: currentUserProfile.uid,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }));

      batchSaved.add(currentBatchIndex);
      renderBatches();
      byId('paste-answers-text').value = '';
      toast(`Saved ${parsedCount} answer(s) for Batch ${currentBatchIndex+1}`);
    }

    /* ---------- SAVE ALL ---------- */
    async function saveAllToFirestore(){
      if (!savedAnswers.size){ toast('No parsed answers yet'); return; }
      // already persisted per-batch; this button is just a UX confirm
      toast('All parsed answers already saved to database');
    }

    /* ---------- DOWNLOAD KEY ---------- */
    async function downloadAnswerKey(){
      // Build combined list in order
      const rows = [];
      for (const q of selectedQuestions){
        const key   = savedAnswers.get(q.id) || { answer: q.parsedAnswer || q.answer || '', explanation: q.explanation || '' };
        const label = q.questionNumber ? `Q${q.questionNumber}` : q.id.slice(0,6);
        rows.push({
          label,
          question: (q.question || q.text || q.body || '').replace(/\s+/g,' ').trim(),
          answer: (key.answer || '').trim(),
          explanation: (key.explanation || '').trim()
        });
      }

      if (!rows.length){ toast('Nothing to download'); return; }

      // Offer TXT and CSV
      const txt = rows.map(r =>
`${r.label}
Question: ${r.question}
${r.answer ? r.answer+'\n' : ''}Explanation: ${r.explanation || '(not provided)'}
`).join('\n');

      const csv = [
        ['Label','Question','Answer','Explanation'].map(quoteCSV).join(','),
        ...rows.map(r => [r.label, r.question, r.answer, r.explanation].map(quoteCSV).join(','))
      ].join('\n');

      // Save both
      saveBlob(txt, buildFileName('answer-key.txt'), 'text/plain;charset=utf-8');
      saveBlob(csv, buildFileName('answer-key.csv'), 'text/csv;charset=utf-8');
      toast('Downloading TXT and CSV…');
    }

    function buildFileName(ext){
      const cls = (sessionParams.class || 'Class').replace(/\s+/g,'');
      const subj = (sessionParams.subject || 'Subject').replace(/\s+/g,'');
      const chap = (sessionParams.chapter || 'Chapter').replace(/[^\w]+/g,'_');
      return `${cls}_${subj}_${chap}_${ext}`;
    }

    function saveBlob(content, filename, type){
      const blob = new Blob([content], {type});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    }

    function quoteCSV(s){
      const t = (s || '').replace(/"/g,'""');
      return `"${t}"`;
    }

    /* ---------- UTILS ---------- */
    function byId(id){ return document.getElementById(id); }
    function toast(msg){
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(()=>{ t.style.transition='opacity .35s'; t.style.opacity='0'; }, 1200);
      setTimeout(()=> t.remove(), 1600);
    }
    function escapeHtml(s=''){ return s.replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
