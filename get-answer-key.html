<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Answer Key Builder | St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root { --blue:#1762a7; --ink:#0f3d6b; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#f6f9ff; color:#123; }
    header{ background:linear-gradient(90deg,#1762a7,#0f3d6b); color:#fff; padding:18px 14px; text-align:center; border-bottom-left-radius:20px; border-bottom-right-radius:20px; }
    header h1{ margin:0; font-size:1.4rem; }
    main{ max-width:860px; margin:14px auto; padding:0 14px 40px; }
    .card{ background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(15,61,107,.12); padding:16px; margin-top:14px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .meta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin:8px 0 6px; }
    .meta div{ background:#f7fbff; border:1px solid #bdd6ef; border-radius:8px; padding:10px 12px; }
    textarea{ width:100%; min-height:300px; border:1.5px solid #bdd6ef; border-radius:10px; padding:12px; font-size:.95rem; }
    .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
    .btn-primary{ background:var(--blue); color:#fff; }
    .btn-plain{ background:#eef5ff; color:#0f3d6b; border:1px solid #bdd6ef; }
    .small{ color:#456; font-size:.9rem; }
    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:22px; background:#0f3d6b; color:#fff; padding:10px 14px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.2); z-index:10000; }
    pre{ background:#0f3d6b10; border:1px dashed #bdd6ef; padding:10px; border-radius:10px; overflow:auto; }
  </style>
</head>
<body>
  <header>
    <h1>Answer Key Builder</h1>
    <div class="small">Paste or open ChatGPT, then print to PDF</div>
  </header>

  <main>
    <div id="metaCard" class="card" style="display:none;">
      <h3 style="margin:4px 0 10px;">Selection</h3>
      <div class="meta" id="metaGrid"></div>
      <div class="small" id="countLine"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h3 style="margin:6px 0;">Prompt</h3>
        <div class="small" id="payloadHint"></div>
      </div>
      <textarea id="promptBox" spellcheck="false"></textarea>
      <div class="row" style="margin-top:12px;">
        <button id="copyBtn" class="btn btn-primary"><i class="fa-solid fa-copy"></i> Copy prompt</button>
        <button id="openBtn" class="btn btn-plain"><i class="fa-brands fa-rocketchat"></i> Open ChatGPT (blank)</button>
        <button id="downloadBtn" class="btn btn-plain"><i class="fa-solid fa-file-arrow-down"></i> Download prompt.txt</button>
      </div>
      <p class="small" style="margin-top:10px;">
        Tip: We don’t auto-fill ChatGPT with the prompt to avoid mobile URL length/pop-up issues.
        After opening ChatGPT, paste the prompt (Ctrl/Cmd+V).
      </p>
    </div>

    <div id="previewCard" class="card" style="display:none;">
      <h3 style="margin:6px 0;">First question (preview)</h3>
      <pre id="previewBlock"></pre>
    </div>
  </main>

  <script>
    function toast(msg){
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
      setTimeout(()=>{ t.style.transition='opacity .35s'; t.style.opacity='0'; }, 1200);
      setTimeout(()=> t.remove(), 1600);
    }

    // === Hydrate from sessionStorage (from Bank page) ===
    let payload=null;
    try{ payload = JSON.parse(sessionStorage.getItem('answerKeyPayload') || 'null'); }catch(_){}
    if (payload && payload.source === 'bank') {
      const meta = payload.meta || {};
      const qs   = payload.questions || [];
      const txt  = payload.paste || '';

      // Meta box
      const metaCard = document.getElementById('metaCard');
      const metaGrid = document.getElementById('metaGrid');
      const countLine= document.getElementById('countLine');
      const addItem = (k,v) => {
        if (!v) return;
        const d = document.createElement('div');
        d.innerHTML = `<strong>${k}:</strong> ${v}`;
        metaGrid.appendChild(d);
      };
      addItem('Class',   meta.class);
      addItem('Subject', meta.subject);
      addItem('Chapter', meta.chapter || 'All');
      addItem('Type',    meta.questionType || 'All');
      countLine.textContent = `${qs.length} question(s) selected`;
      if (metaGrid.children.length) metaCard.style.display = '';

      // Prompt area
      const box = document.getElementById('promptBox');
      box.value = txt || '';
      document.getElementById('payloadHint').textContent = 'Loaded from selection';

      // Tiny preview
      if (qs.length){
        const first = qs[0];
        const isMcq = first.A || first.B || first.C || first.D;
        let p = (first.question || '').trim();
        if (isMcq){
          p += `\nA) ${first.A||''}\nB) ${first.B||''}\nC) ${first.C||''}\nD) ${first.D||''}`;
        }
        document.getElementById('previewBlock').textContent = p;
        document.getElementById('previewCard').style.display = '';
      }

      // Clear to avoid stale re-use on refresh
      sessionStorage.removeItem('answerKeyPayload');
    } else {
      document.getElementById('payloadHint').textContent =
        'No payload found. You can paste a prompt manually.';
    }

    // Buttons
    document.getElementById('copyBtn').onclick = async () => {
      try{
        await navigator.clipboard.writeText(document.getElementById('promptBox').value);
        toast('Copied!');
      }catch(_){ toast('Copy failed'); }
    };

    document.getElementById('openBtn').onclick = () => {
      // Open a blank new chat (no massive ?q=… param)
      const url = 'https://chatgpt.com/'; // or https://chat.openai.com/
      const w = window.open(url, '_blank', 'noopener');
      if (!w) location.href = url;
    };

    document.getElementById('downloadBtn').onclick = () => {
      const blob = new Blob([document.getElementById('promptBox').value || ''], {type:'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'answer-key-prompt.txt';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 50);
    };
  </script>
</body>
</html>
