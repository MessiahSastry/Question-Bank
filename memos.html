// Returns the group name for a given class name
function getClassGroupName(className) {
  className = (className+"").replace(/[^a-z0-9]/gi,'').toLowerCase();
  for (let [k, v] of Object.entries(CLASS_GROUP_MAP)) {
    let key = k.replace(/[^a-z0-9]/gi,'').toLowerCase();
    if (className === key || className === key.replace("th","")) return v;
  }
  // Default group (for safety)
  return "6-9";
}

// Tune these to match your new PNG's grid
const SUBJECT_LAYOUT = {
  startY: 1540,   // keep
  endY:   2700,   // was 2240 → more vertical band for rows
  totalsGap: 40,
  font: 60
};
const SUBJECT_HEADER_Y = 1460; // fixed header position

function buildSubjectY(n) {
  const { startY, endY } = SUBJECT_LAYOUT;
  const maxRows = 12;

  const count = Math.max(0, Math.min(n, maxRows));
  if (count === 0) return { rowsY: [], totalY: Math.round(startY + 80) };

  // keep first-row gap unchanged
  const TOP_PAD_FROM_HEADER = 150;

  // reserve space for TOTAL/attendance so rows never touch it
  const SAFE_ABOVE_TOTAL = 110;      // cushion above TOTAL
  const firstRowY = Math.max(startY, SUBJECT_HEADER_Y + TOP_PAD_FROM_HEADER);
  const lastRowY  = endY - SAFE_ABOVE_TOTAL;

  // --- small but clear gap between rows ---
  const MIN_ROW_GAP = 45;            // ← tweak 32–42 to taste

  // even spacing in available band
  const rawGap = (count === 1) ? 0 : (lastRowY - firstRowY) / (count - 1);

  // use at least MIN_ROW_GAP but never overflow the band
  const gap = (count === 1)
    ? 0
    : Math.min(
        Math.max(rawGap, MIN_ROW_GAP),
        (lastRowY - firstRowY) / (count - 1)
      );

  const rowsY = Array.from({ length: count }, (_, i) =>
    Math.round(firstRowY + i * gap)
  );

  // place TOTAL a little below the last row, but keep it safely inside the area
  const totalY = Math.min(
    endY - 40,
    rowsY[rowsY.length - 1] + Math.max(MIN_ROW_GAP + 40, Math.round(gap * 2.2))
  );

  return { rowsY, totalY };
}

    .map((e, i) => `${String(i + 1).padStart(2, ' ')}. ${e.name}`)
    .join('\n');

  renderBackCols();

}
async function loadClasses() {

async function loadSections() {

  let snap = await db.collection('years').doc(year).collection('classes').doc(classId).collection('sections').orderBy('name').get();
  sections = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));

sectionChoices.setChoices(
  sections.map(s => ({ value: s.id, label: s.name, selected: false })),

);
sectionChoices.setChoiceByValue(sections[0]?.id || '');

}
async function loadExams() {
  let year = yearSel.value;
  let classId = classSel.value;
  // Get class group for this class (reuse your CLASS_GROUP_MAP from students.html if possible)
  let classObj = classes.find(c => c.id === classId);
let className = classObj ? classObj.name : '';
// Always use 'class-' + normalized classGroup for Firestore collection
let classGroup = getClassGroupName ? getClassGroupName(className) : '';
let classGroupFS;
if (classGroup === "nursery-lkg-ukg") {
  classGroupFS = "nursery-lkg-ukg";
} else {
  classGroupFS = "class-" + classGroup.toLowerCase();
}
let examsSnap = await db.collection('years').doc(year)
    .collection('exams').doc('classGroups')
    .collection(classGroupFS).get();

if (examsSnap.empty) {
  examChoices.clearStore();
  examChoices.setChoices([{ value: '', label: 'No choices to choose from', selected: true }], 'value', 'label', false);
  await loadStudents();
  return;
}
exams = examsSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));
examChoices.clearStore();
if (exams.length === 0) {
  examChoices.setChoices([{ value: '', label: 'No choices to choose from', selected: true }], 'value', 'label', false);
} else {
  examChoices.setChoices(
    exams.map(e => ({ value: e.id, label: e.name, selected: false })),
    'value', 'label', false
  );
  examChoices.setChoiceByValue(exams[0]?.id || '');
}


/* Prune examCols that no longer exist (e.g., class/exam set changed) */
{
  const validIds = new Set(exams.map(e => e.id));
  backPlan.examCols = (backPlan.examCols || []).filter(id => validIds.has(id));
  renderBackCols();
}

await loadStudents();
}
async function loadStudents() {
  let year = yearSel.value, classId = classSel.value, sectionId = sectionSel.value;
  if (!year || !classId || !sectionId) { studentListDiv.innerHTML = ''; students = []; return; }
  let snap = await db.collection('years').doc(year).collection('classes').doc(classId).collection('sections').doc(sectionId).collection('students').orderBy('roll').get();
  students = [];
  snap.forEach(doc => { let d=doc.data(); if (!d.isDeleted) students.push({id: doc.id, ...d}); });
  showStudentList();
}

 * infers subtopics/max from Firestore if not present in the exam object.
 *
 * Returns:
 * {
 *   subjects: [
 *     {
 *       name: "Mathematics",
 *       subtopics: [ { name: "Algebra", max: 10 }, { name: "Geometry", max: 15 }, ... ],
 *       subjectMax: 25
 *     },
 *     ...
 *   ],
 *   hasSubtopics: true/false
 * }
 */
async function buildExamStructure(examObj, { year, classId, sectionId } = {}) {
  __examHasSubtopics = false;

  if (!examObj) return { subjects: [], hasSubtopics: false };

    // 1) Start from explicit exam definition if available
  let subjects = [];

  // NEW: allow exam-wide subtopics at root of exam doc
  const examWideSubs = Array.isArray(examObj?.subtopics)
    ? examObj.subtopics.map(t => ({
        name: t?.name || '',
        max: (typeof t?.max === 'number' && !isNaN(t.max)) ? t.max : null
      }))
    : null;
  if (examWideSubs && examWideSubs.length) __examHasSubtopics = true;

  if (Array.isArray(examObj.subjects)) {
    subjects = examObj.subjects.map(s => {
      const name = s?.name || '';
      let subtopics = Array.isArray(s?.subtopics) ? s.subtopics.map(t => ({
        name: t?.name || '',
        max: (typeof t?.max === 'number' && !isNaN(t.max)) ? t.max : null
      })) : [];

      // subjectMax: prefer explicit; else sum known subtopic max
      let subjectMax = (typeof s?.max === 'number' && !isNaN(s.max)) ? s.max : null;
      if (subjectMax == null && subtopics.length) {
        const sum = subtopics.reduce((acc, t) => acc + (typeof t.max === 'number' ? t.max : 0), 0);
        subjectMax = (sum > 0 ? sum : null);
      }

           // If subject has no explicit subtopics but exam has an exam-wide schema, use it
      if ((!subtopics || subtopics.length === 0) && examWideSubs && examWideSubs.length) {
        subtopics = examWideSubs.map(t => ({ name: t.name, max: t.max }));
      }
      if (subtopics.length) __examHasSubtopics = true;
      return { name, subtopics, subjectMax };

    });
  }

  // 2) If no subjects (or missing subtopics) and Firestore is available, try a light inference
  //    (We only look at the first student’s marks to infer consistent subtopic keys.)
  const needsInference = subjects.length === 0 || subjects.some(s => s.subtopics.length === 0);
  if (needsInference && year && classId && sectionId) {
    try {
      const secRef = db.collection('years').doc(year)
        .collection('classes').doc(classId)
        .collection('sections').doc(sectionId)
        .collection('students');

      const firstStuSnap = await secRef.orderBy('roll').limit(1).get();
      if (!firstStuSnap.empty) {
        const firstStu = firstStuSnap.docs[0];
        const marksDoc = await firstStu.ref.collection('marks').doc(examSel.value).get();
        const marksData = marksDoc.exists ? (marksDoc.data() || {}) : {};

       // If examObj.subjects existed, map against them; else derive subjects from marks keys (excluding __subs).
if (subjects.length === 0) {
  const rootKeys = Object.keys(marksData).filter(k => k !== '__subs');
  subjects = rootKeys.map(sn => ({
    name: sn,
    subtopics: (examWideSubs && examWideSubs.length)
      ? examWideSubs.map(t => ({ name: t.name, max: t.max }))
      : [],
    subjectMax: null
  }));
  if (examWideSubs && examWideSubs.length) __examHasSubtopics = true;
}


// Prefer subtopics from marksData.__subs[subject]; fallback to object-at-root heuristic
const subsRoot = (marksData && typeof marksData.__subs === 'object') ? marksData.__subs : {};

subjects = subjects.map(s => {
  const subjName = s.name || '';
  // exact/normalized match at root for totals
  const subjKey = Object.keys(marksData).find(k => _normLabel(k) === _normLabel(subjName));
  const subjVal = subjKey ? marksData[subjKey] : null;

  // exact/normalized match inside __subs for breakdown
  const subsKey = Object.keys(subsRoot).find(k => _normLabel(k) === _normLabel(subjName));
  const subsObj = subsKey ? subsRoot[subsKey] : null;

  // Case 1: breakdown present under __subs.<Subject>
  if (subsObj && typeof subsObj === 'object' && !Array.isArray(subsObj)) {
    const inferred = Object.keys(subsObj).map(k => ({ name: k, max: null }));
    if (inferred.length) {
      __examHasSubtopics = true;
      if (s.subtopics.length === 0) s.subtopics = inferred;
      if (s.subjectMax == null) s.subjectMax = null; // unknown without explicit max
    }
  }
  // Case 2: fallback heuristic: object stored at root under subject key
  else if (subjVal && typeof subjVal === 'object' && !Array.isArray(subjVal)) {
    const entries = Object.entries(subjVal);
    const inferred = entries
      .filter(([k, v]) => (typeof v === 'number' || String(v).toUpperCase() === 'AB'))
      .map(([k]) => ({ name: k, max: null }));
    if (inferred.length) {
      __examHasSubtopics = true;
      if (s.subtopics.length === 0) s.subtopics = inferred;
      if (s.subjectMax == null) s.subjectMax = null;
    }
  }

  return s;
    // If still missing subtopics and exam-wide schema exists, apply it
  if ((!s.subtopics || s.subtopics.length === 0) && examWideSubs && examWideSubs.length) {
    s.subtopics = examWideSubs.map(t => ({ name: t.name, max: t.max }));
    __examHasSubtopics = true;
  }
});
      }
    } catch (e) {
      console.warn('Exam structure inference skipped:', e);
    }
  }

  // 3) Finalize: ensure stable arrays/fields
  subjects = subjects.map(s => ({
    name: s.name || '',
    subtopics: Array.isArray(s.subtopics) ? s.subtopics : [],
    subjectMax: (typeof s.subjectMax === 'number' && !isNaN(s.subjectMax)) ? s.subjectMax : null
  }));

  __examStructure = { subjects, hasSubtopics: __examHasSubtopics };
  return __examStructure;
}

/** Get or rebuild the structure for current selects */
async function getExamStructure() {
  const examId = examSel.value;
  const examObj = exams.find(e => e.id === examId);
  if (!examObj) {
    __examStructure = { subjects: [], hasSubtopics: false };
    return __examStructure;
  }
  // Rebuild every time exam/class/section changes (simple & safe)
  return await buildExamStructure(examObj, {
    year: yearSel.value,
    classId: classSel.value,
    sectionId: sectionSel.value
  });
}
// Get the exam structure for a specific examId (used by back page)
// Uses the same builder and class/year/section context as the front page.
async function getExamStructureForExamId(examId) {
  const examObj = exams.find(e => e.id === examId);
  if (!examObj) return { subjects: [], hasSubtopics: false };
  return await buildExamStructure(examObj, {
    year: yearSel.value,
    classId: classSel.value,
    sectionId: sectionSel.value
  });
}

// ======= PDF Helpers ========
/* ======= PAGE MARGINS + DYNAMIC COLUMN BUILDER (auto-spread) ======= */
// Only margins are fixed; all column x-positions are computed to fill the width
const PAGE_MARGINS = { left: 220, right: 2260 }; // tweak if you need more/less padding
const MAX_TO_NEXT_EXTRA_GAP = 28;
    const MAX_X_OFFSET = 100;
    
// ==== Exam-wide subtopic schema (names + header max) ====
let __examSubtopicSchema = null;
function getExamSubtopicSchema() {
  if (!__examStructure || !Array.isArray(__examStructure.subjects)) {
    __examSubtopicSchema = [];
    return __examSubtopicSchema;
  }
  const norm = s => String(s || '').replace(/[\s._-]+/g, '').toLowerCase();
  const order = [];
  const seen  = new Set();
  const maxBy = {};
  for (const subj of __examStructure.subjects) {
    const subs = Array.isArray(subj.subtopics) ? subj.subtopics : [];
    for (const st of subs) {
      const name = st?.name || '';
      const key  = norm(name);
      if (!key) continue;
      if (!seen.has(key)) { seen.add(key); order.push(name); }
      const m = (typeof st?.max === 'number' && !isNaN(st.max)) ? st.max : null;
      if (m != null && maxBy[key] == null) maxBy[key] = m;
    }
  }
  __examSubtopicSchema = order.map(n => {
    const key = norm(n);
    const m   = maxBy[key];
    return { name: n, max: (m != null ? m : null) };
  });
  return __examSubtopicSchema;
}

// Columns cache for header + rows
let __cols = []; // [{key,label,x}] including SUBJECT, MAX MARKS, each subtopic, TOTAL, GRADE

/**
 * Build the full column list and spread them evenly between margins.
 * SUBJECT and GRADE are NOT fixed — they’re just first/last in the array.
 */
// Auto-fit columns to content (no stretch to full width)
function computeColumns() {
  const schema = getExamSubtopicSchema(); // [{name,max}]
  const headers = [
    { key: '__subject', label: 'SUBJECT' },
    { key: '__max',     label: 'MAX MARKS' },
    ...schema.map(s => ({
      key: s.name,
      label: s.max != null ? `${s.name} (${s.max})` : `${s.name}`
    })),
    { key: '__total',   label: 'TOTAL' },
    { key: '__grade',   label: 'GRADE' }
  ];

  const headerSize = _subtopicHeaderFont(schema.length);
  const avgCharPx  = headerSize * 0.60;

    // Base sizes (smaller than before)
  const BASE_GAP  = 20;   // edge gaps
  const MIN_GAP   = 6;

  // Extra breathing room only between SUBJECT -> MAX
  const SUBJECT_TO_MAX_EXTRA_GAP = 36;

  // Inner gaps (between subtopic columns) will be 60% of the edge gap
  const innerGapFor = g => Math.max(6, Math.floor(g * 0.6));

  // Minimum widths (slightly tightened except subject/max kept larger)
  const MIN_SUBJECT = 300, MIN_MAX = 180, MIN_TOTAL = 150, MIN_GRADE = 140, MIN_SUBTOPIC = 100;
  const MAX_COL     = 420;

  function estWidth(label, minW, maxW = MAX_COL) {
    const L = String(label || '').toUpperCase();
    const w = Math.round((L.length + 2) * avgCharPx);
    return Math.max(minW, Math.min(maxW, w));
  }

  // widths + mins
  const widths = {}, mins = {};
  for (const h of headers) {
    if (h.key === '__subject') { mins[h.key] = MIN_SUBJECT; widths[h.key] = estWidth(h.label, MIN_SUBJECT); }
    else if (h.key === '__max') { mins[h.key] = MIN_MAX; widths[h.key] = estWidth(h.label, MIN_MAX); }
    else if (h.key === '__total') { mins[h.key] = MIN_TOTAL; widths[h.key] = estWidth(h.label, MIN_TOTAL); }
    else if (h.key === '__grade') { mins[h.key] = MIN_GRADE; widths[h.key] = estWidth(h.label, MIN_GRADE); }
    else { mins[h.key] = MIN_SUBTOPIC; widths[h.key] = estWidth(h.label, MIN_SUBTOPIC); }
  }

  const L = PAGE_MARGINS.left, R = PAGE_MARGINS.right;
  const avail = Math.max(0, R - L);

  const keys = headers.map(h => h.key);

  // compute total width using pair-wise gaps (inner subtopic gaps are smaller)
     function totalWidth(edgeGap, ws) {
    const sumW = keys.reduce((a,k) => a + ws[k], 0);
    let gaps = 0;
   for (let i = 0; i < headers.length - 1; i++) {
  const left  = headers[i].key, right = headers[i+1].key;

  const isInnerSubGap =
    left !== '__subject' && right !== '__grade' &&
    left !== '__max' && right !== '__total'; // between subtopic-like columns

  const isSubjectToMax = (left === '__subject' && right === '__max');
  const isMaxToNext    = (left === '__max' && right !== '__total'); // MAX → first subtopic

  const base  = isInnerSubGap ? innerGapFor(edgeGap) : edgeGap;
  const extra = isSubjectToMax
    ? SUBJECT_TO_MAX_EXTRA_GAP
    : (isMaxToNext ? MAX_TO_NEXT_EXTRA_GAP : 0);

  gaps += base + extra;
}
return sumW + gaps;
}

  // 1) try base gap
  let gap = BASE_GAP;
  let ws  = { ...widths };

  // 2) shrink to MIN_GAP if needed
  if (totalWidth(gap, ws) > avail) gap = MIN_GAP;

  // 3) scale widths toward mins if still overflow
  if (totalWidth(gap, ws) > avail) {
    let lo = 0, hi = 1, best = 1;
    for (let it = 0; it < 22; it++) {
      const mid = (lo + hi) / 2;
      const trial = {};
      for (const h of headers) {
        const k = h.key;
        // Give subtopic columns a slightly higher shrink rate (pull them more)
        const bias = (k !== '__subject' && k !== '__max' && k !== '__total' && k !== '__grade') ? 0.9 : 1.0;
        trial[k] = Math.max(mins[k], Math.floor(mins[k] + (widths[k] - mins[k]) * (mid * bias)));
      }
      if (totalWidth(gap, trial) <= avail) { best = mid; lo = mid; }
      else { hi = mid; }
    }
    for (const h of headers) {
      const k = h.key;
      const bias = (k !== '__subject' && k !== '__max' && k !== '__total' && k !== '__grade') ? 0.9 : 1.0;
      ws[k] = Math.max(mins[k], Math.floor(mins[k] + (widths[k] - mins[k]) * (best * bias)));
    }
  }

  // final centering
  const tableW = totalWidth(gap, ws);
  const startX = Math.round(L + Math.max(0, (avail - tableW) / 2));

  // lay out with pair-wise gaps
  let cursorX = startX;
  __cols = headers.map((h, i) => {
    const k = h.key;
    const w = ws[k];
    const cx = cursorX + Math.round(w / 2);
    const def = { ...h, x: cx, width: w };
    // choose next gap: smaller between subtopic-like columns
       if (i < headers.length - 1) {
  const nextK = headers[i+1].key;
  const isInnerSubGap =
    k !== '__subject' && nextK !== '__grade' &&
    k !== '__max' && nextK !== '__total';
  const isSubjectToMax = (k === '__subject' && nextK === '__max');
  const isMaxToNext    = (k === '__max' && nextK !== '__total'); // MAX → first subtopic

  const base  = isInnerSubGap ? innerGapFor(gap) : gap;
  const extra = isSubjectToMax
    ? SUBJECT_TO_MAX_EXTRA_GAP
    : (isMaxToNext ? MAX_TO_NEXT_EXTRA_GAP : 0);

  cursorX += w + base + extra;
}
    return def;
  });

  return __cols;
}

// table bounds shared by header + total row
function getTableBounds(pad = 30) {
  const cols = computeColumns();
  const left  = Math.round(cols[0].x - cols[0].width / 2) - pad;
  const right = Math.round(cols[cols.length - 1].x + cols[cols.length - 1].width / 2) + pad;
  return { left, right, width: right - left };
}

  function getColX(key) {
  // Recompute each time to follow current schema and ensure __cols is fresh
  const cols = computeColumns();
  const hit = cols.find(c => c.key === key);
  return hit ? hit.x : null;
}
function _subtopicHeaderFont(n) {
  if (n >= 12) return 30;
  if (n >= 10) return 34;
  if (n >= 8)  return 38;
  if (n >= 6)  return 44;
  return 48; // default
}

function _subtopicCellFont(n) {
  if (n >= 12) return 36;
  if (n >= 10) return 40;
  if (n >= 8)  return 44;
  if (n >= 6)  return 50;
  return 56; // default
}
 //===== Landscape back-page renderer ===== 
function _measureTextWidth(pdf, text, size=48) {
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(size);
  return pdf.getTextWidth(String(text || ''));
}

// Build columns as groups: each exam → two subcolumns (TOTAL, GRADE)
function _buildBackColumnsModel(backPlan, exams) {
  const cols = [{ key: '__subject', label: 'SUBJECT', kind: 'subject' }];
  const groups = []; // [{ examId, name, startIndex, endIndex }]

  for (const exId of (backPlan.examCols || [])) {
    const exName = (exams.find(e => e.id === exId)?.name || exId);
    const startIndex = cols.length;
    cols.push({ key: `${exId}__tot`, label: 'TOTAL', kind: 'tot', examId: exId });
cols.push({ key: `${exId}__gr`,  label: 'GRADE', kind: 'gr',  examId: exId });
    const endIndex = cols.length - 1;
    groups.push({ examId: exId, name: exName, startIndex, endIndex });
  }

  return { cols, groups };
}

// Two-tone school title (solid fill inside + colored outline)
// NOTE: preserves the original casing (no toUpperCase()).
function drawSchoolTitleTwoTone(
  pdf,
  text,
  { borderX, borderY, borderW },
  opts = {}
) {
  const {
    fill = '#0f3d6b',       // INSIDE color (navy)
    stroke = '#ff7a00',     // OUTLINE color (orange)
    strokeWidth = 12,
    shadow = 'rgba(0,0,0,0.18)',
    fontPx = 88,
    yOffset = 40,
    family = "Segoe UI, Arial, Helvetica, sans-serif"
  } = opts;

    const targetW = Math.min(1600, Math.floor(borderW * 0.70)); // smaller cap & scale
  const pad = 40;

  // measure
  const mCanvas = document.createElement('canvas');
  const mCtx = mCanvas.getContext('2d');
  mCanvas.width = 2200; mCanvas.height = 220;
  mCtx.font = `900 ${fontPx}px ${family}`;
  const textStr = String(text || '');               // ← keep original casing
  const textW = Math.ceil(mCtx.measureText(textStr).width);

  // paint
  const W = textW + pad * 2;
  const H = fontPx + pad * 2;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.font = `900 ${fontPx}px ${family}`;
  ctx.textBaseline = 'top';

  // soft shadow
  if (shadow) {
    ctx.shadowColor = shadow;
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 8;
  }

  // outline first
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = stroke;     // orange border
  ctx.lineWidth = strokeWidth;
  ctx.strokeText(textStr, pad, pad);

  // fill inside
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = fill;         // navy fill
  ctx.fillText(textStr, pad, pad);

  // place on PDF
  const ratio = targetW / canvas.width;
  const w = targetW;
  const h = Math.round(canvas.height * ratio);
  const x = borderX + Math.round((borderW - w) / 2);
  const y = borderY + yOffset;

  pdf.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, w, h, undefined, 'FAST');
return { x, y, w, h };
}

    // Create a linear gradient as a dataURL for jsPDF.addImage
function makeGradientDataURL(w, h, stops, direction = 'diag') {
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(2, Math.round(w));
  canvas.height = Math.max(2, Math.round(h));
  const ctx = canvas.getContext('2d');

  let grad;
  if (direction === 'vertical') grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  else if (direction === 'horizontal') grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  else grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height); // 'diag'

  (stops || []).forEach(s => grad.addColorStop(s.offset, s.color));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/png');
}
    // Build a public URL if only a Storage path is saved (e.g., "years/.../photo.jpg")
function buildStorageUrlFromPath(path) {
  const bucket = (firebase.app().options.storageBucket || '').replace('gs://','');
  if (!bucket || !path) return '';
  return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(path)}?alt=media`;
}

// Fetch any image URL and return a dataURL (base64) for jsPDF.addImage
async function urlToDataURL(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function drawStudentPhoto(pdf, stu) {
  try {
    // 1) Resolve a URL for the photo
    let url = stu.photoUrl || stu.photoURL || '';
    if (!url && stu.photoPath) url = buildStorageUrlFromPath(stu.photoPath);
    if (!url) return;

    // 2) Load image as dataURL (already have in your code)
    const dataURL = await urlToDataURL(url);
    const { x, y, w, h } = HEAD_PHOTO;

    // 3) Compose rounded photo + gradient ring ON A CANVAS (no PDF clipping)
    const border = 18;
    const rOuter = 22;
    const rInner = Math.max(6, rOuter - 6);

    // helper: rounded rect path
    function rr(ctx, x, y, w, h, r) {
      const r2 = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r2, y);
      ctx.lineTo(x + w - r2, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r2);
      ctx.lineTo(x + w, y + h - r2);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r2, y + h);
      ctx.lineTo(x + r2, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r2);
      ctx.lineTo(x, y + r2);
      ctx.quadraticCurveTo(x, y, x + r2, y);
      ctx.closePath();
    }

    // create canvas
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(2, Math.round(w));
    canvas.height = Math.max(2, Math.round(h));
    const ctx = canvas.getContext('2d');

    // 3a) draw gradient outer rounded rect
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0.00, '#FF6EC4');
    grad.addColorStop(0.50, '#7C4DFF');
    grad.addColorStop(1.00, '#4ADEDE');
    ctx.fillStyle = grad;
    rr(ctx, 0, 0, w, h, rOuter);
    ctx.fill();

    // 3b) “knock out” inner area to make the ring
    ctx.globalCompositeOperation = 'destination-out';
    rr(ctx, border, border, w - 2 * border, h - 2 * border, rInner);
    ctx.fill();

    // 3c) draw the photo inside the inner rounded rect
    ctx.globalCompositeOperation = 'destination-over'; // draw below the transparent knockout
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataURL; });
    ctx.save();
    rr(ctx, border, border, w - 2 * border, h - 2 * border, rInner);
    ctx.clip();
    ctx.drawImage(img, border, border, w - 2 * border, h - 2 * border);
    ctx.restore();

    // 4) Add the precomposed PNG to the PDF (no PDF clip at all)
    const composedURL = canvas.toDataURL('image/png');
    pdf.addImage(composedURL, 'PNG', x, y, w, h, undefined, 'FAST');
  } catch (e) {
    console.warn('Photo compose failed:', e);
    // hard fallback: draw plain photo without any mask
    try {
      const dataURL = await urlToDataURL(stu.photoUrl || stu.photoURL || buildStorageUrlFromPath(stu.photoPath));
      const { x, y, w, h } = HEAD_PHOTO;
      pdf.addImage(dataURL, 'JPEG', x, y, w, h, undefined, 'FAST');
    } catch {}
  }
}

/* ===== Back-side helpers: read any exam for a student and compute subject totals ===== */
async function _readMarksDocFor(stuId, examId) {
  const year = yearSel.value, classId = classSel.value, sectionId = sectionSel.value;
  const ref = db.collection('years').doc(year)
    .collection('classes').doc(classId)
    .collection('sections').doc(sectionId)
    .collection('students').doc(stuId)
    .collection('marks').doc(examId);
  const snap = await ref.get();
  return snap.exists ? (snap.data() || {}) : {};
}

/* Build normalized subject list across multiple exams (union, stable by name) */
function _unionSubjectsAcross(examIds, perExamSubjectsMap) {
  const seen = new Set();
  const out = [];
  for (const ex of examIds) {
    const arr = perExamSubjectsMap.get(ex) || [];
    for (const s of arr) {
      const key = _normLabel(s.name || s);
      if (!key || seen.has(key)) continue;
      seen.add(key);
      out.push(s.name || s);
    }
  }
  return out;
}

/* From an exam marks object, compute subject totals.
   RULE: if no numeric entries at all → total === 'AB'.
         If a number exists (including 0) → sum the numbers. */
function _extractSubjectTotalsFromMarks(marksObj, structure) {
  const norm = s => String(s || '').replace(/[\s._-]+/g, '').toLowerCase();
  const subjects = [];
  const subsRoot = (marksObj && typeof marksObj.__subs === 'object') ? marksObj.__subs : {};

  const baseSubjects = (structure?.subjects?.length
    ? structure.subjects.map(s => s.name)
    : Object.keys(marksObj).filter(k => k !== '__subs')
  );

  for (const subjName of baseSubjects) {
    // locate values for this subject
    const keyRoot = Object.keys(marksObj).find(k => norm(k) === norm(subjName));
    const subjVal = keyRoot ? marksObj[keyRoot] : marksObj[subjName];

    const keySubs = Object.keys(subsRoot || {}).find(k => norm(k) === norm(subjName));
    const subsObj = keySubs ? subsRoot[keySubs] : null;

    let total = 0;
    let max   = 0;
    let sawNumeric = false; // ← our decisive flag

    // Prefer __subs breakdown
    if (subsObj && typeof subsObj === 'object') {
      for (const [k, v] of Object.entries(subsObj)) {
        if (typeof v === 'number' && !isNaN(v)) {      // includes 0
          total += +v;
          sawNumeric = true;
        }
        // infer max from exam structure if known
        const subjDef = structure?.subjects?.find(s => norm(s.name) === norm(subjName));
        const stDef   = subjDef?.subtopics?.find(t => norm(t.name) === norm(k));
        if (typeof stDef?.max === 'number') max += stDef.max;
      }
      // fallback subjectMax when we couldn't sum subtopic maxes
      if (max === 0) {
        const subjDef = structure?.subjects?.find(s => norm(s.name) === norm(subjName));
        if (typeof subjDef?.subjectMax === 'number') max = subjDef.subjectMax;
      }
    }
    // Or: object stored directly at the subject key
    else if (subjVal && typeof subjVal === 'object' && !Array.isArray(subjVal)) {
      for (const [, v] of Object.entries(subjVal)) {
        if (typeof v === 'number' && !isNaN(v)) {
          total += +v;
          sawNumeric = true;
        }
      }
      // no reliable max here
    }
    // Or: a scalar at the subject key
    else if (subjVal !== undefined) {
      if (typeof subjVal === 'number' && !isNaN(subjVal)) {
        total = +subjVal;      // 0 is valid
        sawNumeric = true;
      } else {
        // explicit AB / blank → no numbers seen
        sawNumeric = false;
      }
      // try structure max
      const subjDef = structure?.subjects?.find(s => norm(s.name) === norm(subjName));
      if (typeof subjDef?.subjectMax === 'number') max = subjDef.subjectMax;
    }

    // Finalize per our rule
    const finalTotal = sawNumeric ? total : 'AB';

    // only include subjects that either have a number or are AB (skip truly missing subjects)
    if (sawNumeric || finalTotal === 'AB') {
      subjects.push({ name: subjName, total: finalTotal, max });
    }
  }

  return subjects;
}

// ======= PDF GENERATION =========
async function fetchStudentData(stu) {
  // 0) Resolve current selections + exam structure
  const year = yearSel.value, classId = classSel.value, sectionId = sectionSel.value, examId = examSel.value;
  const examObj = exams.find(e => e.id === examId);
  const structure = await getExamStructure(); // { subjects: [{name, subtopics[], subjectMax}], hasSubtopics }

  // 1) Read marks doc for this student
  const marksDoc = await db.collection('years').doc(year)
    .collection('classes').doc(classId)
    .collection('sections').doc(sectionId)
    .collection('students').doc(stu.id)
    .collection('marks').doc(examId).get();
  const marks = marksDoc.exists ? (marksDoc.data() || {}) : {};
  // Use the same subject-total extractor the back page uses
const reconciledTotals = _extractSubjectTotalsFromMarks(marks, structure); // [{name,total,max}]
const recByName = new Map(
  reconciledTotals.map(r => [String(r.name).replace(/[\s._-]+/g,'').toLowerCase(), r])
);

  // 2) Helpers
  const norm = s => String(s || '').replace(/[\s._-]+/g, '').toLowerCase();
  const isNum = v => (typeof v === 'number' && !isNaN(v));
const toNum  = v => (v === '' || v == null ? null : (Number.isFinite(+v) ? +v : null));


  // 3) Build subjects with subtopics, totals and grade
  let stuSubjects = [];
  let totalMarksAll = 0, totalMaxAll = 0;

  for (const subjDef of (structure.subjects || [])) {
    const subjName = subjDef.name || '';
    const keyNorm = subjName.replace(/[\s._-]+/g,'').toLowerCase();
    const recHit  = recByName.get(keyNorm); // {total,max} if extractor found it
    const subjKey = Object.keys(marks).find(k => norm(k) === norm(subjName));
    const subjVal = subjKey ? marks[subjKey] : marks[subjName];

    // Prepare subtopic list from structure
    const subtopics = Array.isArray(subjDef.subtopics) ? subjDef.subtopics.map(t => ({
      name: t?.name || '',
      max: (typeof t?.max === 'number' && !isNaN(t.max)) ? t.max : null,
      mark: '' // will fill below
    })) : [];

   // Choose subtopic source: prefer __subs.<Subject>, fallback to object-at-root
const subsRoot = (marks && typeof marks.__subs === 'object') ? marks.__subs : null;
const subsKey  = subsRoot ? Object.keys(subsRoot).find(k => norm(k) === norm(subjName)) : null;
const subsObj  = (subsKey && typeof subsRoot[subsKey] === 'object') ? subsRoot[subsKey] : null;

const subSrc = subsObj || (subjVal && typeof subjVal === 'object' && !Array.isArray(subjVal) ? subjVal : null);

// If no declared subtopics but we have a subtopic object, create cells from its keys
if ((!subtopics.length) && subSrc) {
  for (const k of Object.keys(subSrc)) {
    subtopics.push({ name: k, max: null, mark: '' });
  }
}

// Fill subtopic marks from the chosen source
if (subtopics.length && subSrc) {
  for (const st of subtopics) {
    const k = Object.keys(subSrc).find(x => norm(x) === norm(st.name));
    const v = (k ? subSrc[k] : subSrc[st.name]);
    st.mark = (v === 'AB' || v === 'ab' || v === 'Ab') ? 'AB' : (isNum(v) ? +v : '');
  }
}

    // If no subtopics (or subjVal is a direct mark), support direct subject mark
    let subjectTotalMarks = 0;
    let subjectTotalMax = (typeof subjDef.subjectMax === 'number' && !isNaN(subjDef.subjectMax)) ? subjDef.subjectMax : null;

    if (subtopics.length) {
      // Sum numeric subtopic marks
      for (const st of subtopics) {
        if (isNum(st.mark)) subjectTotalMarks += st.mark;
      }
      // If subjectMax not explicit, sum known subtopic max values
      if (subjectTotalMax == null) {
        const sumMax = subtopics.reduce((acc, st) => acc + (typeof st.max === 'number' ? st.max : 0), 0);
        subjectTotalMax = (sumMax > 0 ? sumMax : null);
      }
    } else {
      // No subtopics: treat subjVal as direct mark, and look for max on subjDef.max
      const directMark = (subjVal === 'AB' || subjVal === 'ab' || subjVal === 'Ab')
        ? 'AB'
        : (isNum(subjVal) ? +subjVal : '');
      subjectTotalMarks = isNum(directMark) ? directMark : 0;

      if (subjectTotalMax == null && typeof subjDef.max === 'number' && !isNaN(subjDef.max)) {
        subjectTotalMax = subjDef.max;
      }
      // Represent a single pseudo-subtopic cell (optional visual)
      if (!subtopics.length) {
        subtopics.push({ name: '-', max: subjectTotalMax, mark: (directMark === 'AB' ? 'AB' : (isNum(directMark) ? directMark : '')) });
      }
    }

    // Grade computation
    let grade = '';
    if (subtopics.length && subtopics.every(st => st.mark === 'AB' || st.mark === '' )) {
      grade = 'AB'; // all subtopic entries absent/blank
    } else if (subjectTotalMax && subjectTotalMax > 0) {
      const pct = (subjectTotalMarks / subjectTotalMax) * 100;
      grade = (pct >= 95) ? 'A+' :
              (pct >= 90) ? 'A'  :
              (pct >= 85) ? 'B+' :
              (pct >= 80) ? 'B'  :
              (pct >= 70) ? 'C+' :
              (pct >= 60) ? 'C'  :
              (pct >= 50) ? 'D'  :
              (pct >= 40) ? 'E'  : 'F';
    } else {
      grade = ''; // unknown max → no grade
    }

    // Aggregate to overall
    if (isNum(subjectTotalMarks)) totalMarksAll += subjectTotalMarks;
    if (isNum(subjectTotalMax))   totalMaxAll   += subjectTotalMax;

    // Keep backward-compatible fields (max/marks) for existing drawing,
    // but also attach detailed subtopics.
    stuSubjects.push({
      name: subjName,
      max: subjectTotalMax ?? '',             // subject max
      marks: (grade === 'AB') ? 'AB' : subjectTotalMarks, // subject total marks
      grade,
      subtopics                                // detailed cells for rendering
    });
  }

  // 4) Attendance (unchanged)
  let attSnap = { forEach: () => {} };
  if (year && classId && sectionId) {
    attSnap = await db.collection('years').doc(year)
      .collection('classes').doc(classId)
      .collection('sections').doc(sectionId)
      .collection('attendance').get();
  }
  const months = ['06','07','08','09','10','11','12','01','02','03'];
  const attArr = months.map(() => ({work:0, pres:0}));
  attSnap.forEach(doc => {
    const date = doc.id;
    const mm = date.split('-')[1];
    const idx = months.indexOf(mm);
    if (idx >= 0) {
      attArr[idx].work += 1;
      const st = doc.data()[stu.id];
      if (st && st.M !== 'absent') attArr[idx].pres += 0.5;
      if (st && st.A !== 'absent') attArr[idx].pres += 0.5;
    }
  });

  // 5) Assemble student record (keep overall grade rule same as before)
  const percentage = (totalMaxAll ? Math.round((totalMarksAll / totalMaxAll) * 100) : '');

  return {
    id: stu.id,
    name: stu.name,
    father: stu.father,
    roll: stu.roll,
    class: classes.find(c=>c.id===classId)?.name || '',
    section: (sections.find(s=>s.id===sectionId)?.name) || (sectionSel.options[sectionSel.selectedIndex]?.text || ''),
    percentage,
    rank: '',
    subjects: stuSubjects,
    totalMarks: totalMarksAll,
    totalMax: totalMaxAll,
    overallGrade: totalMaxAll
      ? ((totalMarksAll/totalMaxAll)*100 >= 95 ? 'A+'
        : (totalMarksAll/totalMaxAll)*100 >= 90 ? 'A'
        : (totalMarksAll/totalMaxAll)*100 >= 85 ? 'B+'
        : (totalMarksAll/totalMaxAll)*100 >= 80 ? 'B'
        : (totalMarksAll/totalMaxAll)*100 >= 70 ? 'C+'
        : (totalMarksAll/totalMaxAll)*100 >= 60 ? 'C'
        : (totalMarksAll/totalMaxAll)*100 >= 50 ? 'D'
        : (totalMarksAll/totalMaxAll)*100 >= 40 ? 'E'
        : 'F')
      : '',
    photoUrl: stu.photoUrl || stu.photoURL || '',
    photoPath: stu.photoPath || '',
    attendance: attArr
  };
}
// Build back page rows from the *exam schema* (not from student marks).
// AB / '-' rule:
//  - Subject in schema but student's values blank → 'AB'
//  - Subject not in that exam schema at all → '-'
async function buildBackDataForStudent(stu) {
  const needExamIds = Array.from(new Set(backPlan.examCols || []));
  const norm = s => String(s || '').replace(/[\s._-]+/g, '').toLowerCase();

  // 1) Read schema (via the same builder as the front page) + student's marks
  const schemaByExam = new Map(); // exId -> { subjects:[{name,subjectMax,subtopics[]}] , maxBySubject:Map, headerMax }
  const marksByExam  = new Map(); // exId -> raw marks doc

  for (const exId of needExamIds) {
    // use the robust, inferring structure (front-page builder)
    const struct = await getExamStructureForExamId(exId); // {subjects:[{name,subjectMax,subtopics[]}]}
    const maxBySubject = new Map();
    const subjNames = [];

    for (const s of (struct?.subjects || [])) {
      const key = norm(s?.name || '');
      if (!key) continue;
      subjNames.push(s.name);

      // prefer explicit subjectMax, else sum subtopic max
      let m = (typeof s?.subjectMax === 'number' && !isNaN(s.subjectMax)) ? s.subjectMax : null;
      if (m == null && Array.isArray(s?.subtopics) && s.subtopics.length) {
        const sum = s.subtopics.reduce((a,t)=> a + (typeof t?.max === 'number' ? t.max : 0), 0);
        m = (sum > 0 ? sum : null);
      }
      maxBySubject.set(key, m);
    }

    // header “(NN MARKS)”: use the first non-null subject max we know
    let headerMax = null;
    for (const v of maxBySubject.values()) { if (typeof v === 'number' && v > 0) { headerMax = v; break; } }

    schemaByExam.set(exId, { subjNames, maxBySubject, headerMax });

    const mobj = await _readMarksDocFor(stu.id, exId);
    marksByExam.set(exId, mobj || {});
  }

  // 2) Subject list = union of schema subjects across chosen exams
  const subjectSet = new Set();
  for (const exId of needExamIds) {
    (schemaByExam.get(exId)?.subjNames || []).forEach(n => n && subjectSet.add(n));
  }
  const subjectList = Array.from(subjectSet);
  if (subjectList.length === 0) return { subjectList: [], rows: [], headerMaxByExam: new Map() };

  // 3) Build rows with AB / '-' logic
  const rows = subjectList.map(name => {
    const keyName = norm(name);
    const row = { subject: name, exams: {} };

    for (const exId of needExamIds) {
      const mobj = marksByExam.get(exId) || {};
      const { maxBySubject } = schemaByExam.get(exId) || {};
      const fixedMax = maxBySubject ? (maxBySubject.get(keyName) ?? null) : null;

      // default when subject not in this exam schema
      let marksVal = '-';

      if (fixedMax != null) {
        // subject exists in schema → look for student's values
        const subsRoot = (mobj && typeof mobj.__subs === 'object') ? mobj.__subs : null;
        const subsKey  = subsRoot ? Object.keys(subsRoot).find(k => norm(k) === keyName) : null;
        const subjKey  = Object.keys(mobj).find(k => k !== '__subs' && norm(k) === keyName);

        if (subsKey && typeof subsRoot[subsKey] === 'object') {
          // sum numeric parts; if none, AB
          let sum = 0, sawNum = false;
          for (const v of Object.values(subsRoot[subsKey])) {
            if (typeof v === 'number' && !isNaN(v)) { sum += v; sawNum = true; }
          }
          marksVal = sawNum ? sum : 'AB';
        } else if (subjKey !== undefined) {
          const v = mobj[subjKey];
          if (typeof v === 'number' && !isNaN(v))      marksVal = v;     // allows 0
          else if (String(v).toUpperCase() === 'AB')   marksVal = 'AB';
          else if (v && typeof v === 'object') {
            let sum = 0, saw = false;
            for (const x of Object.values(v)) {
              if (typeof x === 'number' && !isNaN(x)) { sum += x; saw = true; }
            }
            marksVal = saw ? sum : 'AB';
          } else {
            marksVal = 'AB'; // subject present in schema but student's value blank
          }
        } else {
          marksVal = 'AB';   // in schema, but no entry at all for student → AB
        }
      }

      // grade only when both numbers are known
      let gradeTxt = '-';
      if (typeof marksVal === 'number' && typeof fixedMax === 'number' && fixedMax > 0) {
        const pct = (marksVal / fixedMax) * 100;
        gradeTxt =
          (pct >= 95) ? 'A+' :
          (pct >= 90) ? 'A'  :
          (pct >= 85) ? 'B+' :
          (pct >= 80) ? 'B'  :
          (pct >= 70) ? 'C+' :
          (pct >= 60) ? 'C'  :
          (pct >= 50) ? 'D'  :
          (pct >= 40) ? 'E'  : 'F';
      }

      row.exams[exId] = { marks: marksVal, max: fixedMax, grade: gradeTxt };
    }

    return row;
  });

  // 4) Header max (for “(NN MARKS)” line) per exam
  const headerMaxByExam = new Map();
  for (const exId of needExamIds) {
    headerMaxByExam.set(exId, schemaByExam.get(exId)?.headerMax ?? null);
  }

  return { subjectList, rows, headerMaxByExam };
}

async function getAllStudentFullData() {
  let dataArr = [];
  for (let stu of students) {
    let dat = await fetchStudentData(stu);
    dataArr.push(dat);
  }
  dataArr.sort((a,b)=>b.totalMarks-a.totalMarks);
  let rank = 1, lastMark = null, lastRank = 1;
  dataArr.forEach((d,i) => {
    if (d.totalMarks !== lastMark) { rank = i+1; lastMark = d.totalMarks; lastRank = rank; }
    d.rank = lastRank;
  });
  dataArr.sort((a,b)=> {
    let aIdx = students.findIndex(s=>s.name===a.name&&s.roll==a.roll);
    let bIdx = students.findIndex(s=>s.name===b.name&&s.roll==b.roll);
    return aIdx-bIdx;
  });
  return dataArr;
}

 /* --- Subject rows: dynamic with SUBTOPICS + TOTAL(M/Max) + GRADE --- */

// Totals row box spanning full table width (margins to margins)
const tBoxHeight = 80;
const tBoxY = totalYAdj - 55;
pdf.setDrawColor(15, 61, 107);
pdf.setLineWidth(4);
const { left: tLeft, width: tWidth } = getTableBounds(30);
pdf.roundedRect(tLeft, tBoxY, tWidth, tBoxHeight, 20, 20, 'S');

// "TOTAL" label centered in SUBJECT column
centerText(pdf, "TOTAL", xSubject, totalYAdj, 60, COLOR_GREEN);
centerText(pdf, String(totalMax ?? ''), xMax, totalYAdj, 60, COLOR_RED);
centerText(pdf, (totalMarks === '' || totalMarks == null ? 'AB' : String(totalMarks)), xTotal, totalYAdj, 60, COLOR_GREEN);
centerText(pdf, student.overallGrade, xGrade, totalYAdj, 60, COLOR_GRADE);


           // Attendance on preview
    for (let i = 0; i < 10; i++) {
      const a = (student.attendance && student.attendance[i]) || { work: "", pres: "" };
      centerText(pdf, String(a.work || ""), attWorkCoords[i][0], attWorkCoords[i][1], 60, COLOR_GREEN);
      centerText(pdf, String(a.pres || ""), attPresCoords[i][0], attPresCoords[i][1], 60, COLOR_BROWN);
    }

       // Back page (landscape) on preview, only if there is something to show
    try {
      if (backPlan.examCols && backPlan.examCols.length) {
  const backData = await buildBackDataForStudent(student);
  pdf.addPage([3509, 2481], "l");
  drawBackPageLandscape(pdf, backData, backPlan, exams, student);
}
    } catch (e) {
      console.warn("Back page build failed (preview):", e);
    }

    } // ← end for loop

  pdf.save(isSingle ? `progress_card_${fullDataArr[0].roll || 'student'}.pdf`
                    : `progress_cards_${classSel.options[classSel.selectedIndex].text}_${sectionSel.options[sectionSel.selectedIndex].text}.pdf`);
}

// ========== PREVIEW RENDER ===============
async function showPreviewPDF(stuArr) {
  let pdf;

  for (let idx = 0; idx < stuArr.length; idx++) {
    const student = stuArr[idx];
    const memoImgData = await getMemo();

    // create/add page
    if (idx === 0) {
      pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "px", format: [2481, 3509] });
    } else {
      pdf.addPage([2481, 3509], "p");
    }
    pdf.addImage(memoImgData, "PNG", 0, 0, 2481, 3509);

    // header
    const exam = examSel.options[examSel.selectedIndex].textContent;
centerText(pdf, exam.toUpperCase(), HEAD_EXAM[0], HEAD_EXAM[1], HEAD_EXAM[2]);

// --- Labels violet, values green (preview) ---
const nameLabel = 'NAME: ';
leftText(pdf, nameLabel, HEAD_NAME[0], HEAD_NAME[1], HEAD_NAME[2], COLOR_VIOLET);
leftText(
  pdf,
  (student.name?.toUpperCase() || ''),
  HEAD_NAME[0] + _measureTextWidth(pdf, nameLabel, HEAD_NAME[2]),
  HEAD_NAME[1],
  HEAD_NAME[2],
  COLOR_GREEN
);

// (Father stays as-is; remove if you don’t want it)
leftText(pdf, student.father?.toUpperCase() || "", HEAD_FATHER[0], HEAD_FATHER[1], HEAD_FATHER[2], COLOR_RED);

// CLASS / SECTION
const csLabel = 'CLASS / SECTION: ';
const csValue = `${formatClass(student.class)}${student.section ? ' / ' + formatSection(student.section) : ''}`;
leftText(pdf, csLabel, HEAD_CLASS[0], HEAD_CLASS[1], HEAD_CLASS[2], COLOR_VIOLET);
leftText(
  pdf,
  csValue,
  HEAD_CLASS[0] + _measureTextWidth(pdf, csLabel, HEAD_CLASS[2]),
  HEAD_CLASS[1],
  HEAD_CLASS[2],
  COLOR_GREEN
);

// ROLL
const rollLabel = 'ROLL: ';
leftText(pdf, rollLabel, HEAD_ROLL[0], HEAD_ROLL[1], HEAD_ROLL[2], COLOR_VIOLET);
leftText(
  pdf,
  (student.roll?.toString() || ''),
  HEAD_ROLL[0] + _measureTextWidth(pdf, rollLabel, HEAD_ROLL[2]),
  HEAD_ROLL[1],
  HEAD_ROLL[2],
  COLOR_GREEN
);

// Percentage stays green
leftText(pdf, student.percentage, HEAD_PERCENT[0], HEAD_PERCENT[1], HEAD_PERCENT[2], COLOR_GREEN);
    await drawStudentPhoto(pdf, student);

    // rank badge
    const [cx, cy, s] = HEAD_RANK;
    pdf.setFillColor(120, 80, 30); pdf.ellipse(cx+10, cy+15, 55, 40, "F");
    pdf.setFillColor(255, 255, 255); pdf.setDrawColor(...COLOR_BROWN); pdf.setLineWidth(8);
    pdf.ellipse(cx, cy, 52, 35, "FD"); pdf.setTextColor(0,0,0); pdf.setFontSize(s); pdf.setFont("helvetica", "bold");
    pdf.text((student.rank ?? "").toString(), cx, cy + 33, { align: "center" });
    pdf.setLineWidth(1);

    /* --- Subject rows: dynamic with SUBTOPICS + TOTAL(M/Max) + GRADE (preview) --- */
let rowSubs = Array.isArray(student.subjects) ? student.subjects : [];
if (!rowSubs.length) {
  const rec = await fetchStudentData(student);
  rowSubs = Array.isArray(rec.subjects) ? rec.subjects : [];
  if (typeof student.totalMarks !== "number" && typeof rec.totalMarks === "number") student.totalMarks = rec.totalMarks;
  if (typeof student.totalMax   !== "number" && typeof rec.totalMax   === "number") student.totalMax   = rec.totalMax;
  if (!student.attendance?.length && rec.attendance?.length) student.attendance = rec.attendance;
}

const { rowsY, totalY } = buildSubjectY(rowSubs.length);
drawSubjectsHeader(pdf, SUBJECT_HEADER_Y);

const totalYAdj = Math.min(totalY + TOTAL_SHIFT_PX, SUBJECT_LAYOUT.endY - 20);

// Draw each subject row
for (let i = 0; i < Math.min(rowSubs.length, rowsY.length); i++) {
  drawSubjectRow(pdf, rowsY[i], rowSubs[i] || {});
}
// Totals pulled from the computed student object
const totalMarks = (typeof student.totalMarks === "number") ? student.totalMarks : 0;
const totalMax   = (typeof student.totalMax   === "number") ? student.totalMax   : 0;

// Totals (ensure overallGrade fallback)  // (using totalMarks/totalMax declared above)
student.overallGrade = student.overallGrade || (totalMax > 0 ? (
  ((totalMarks/totalMax)*100 >= 95) ? 'A+' :
  ((totalMarks/totalMax)*100 >= 90) ? 'A'  :
  ((totalMarks/totalMax)*100 >= 85) ? 'B+' :
  ((totalMarks/totalMax)*100 >= 80) ? 'B'  :
  ((totalMarks/totalMax)*100 >= 70) ? 'C+' :
  ((totalMarks/totalMax)*100 >= 60) ? 'C'  :
  ((totalMarks/totalMax)*100 >= 50) ? 'D'  :
  ((totalMarks/totalMax)*100 >= 40) ? 'E'  : 'F'
) : '');

// Dynamic Xs from the auto-spread columns
const xSubject = getColX('__subject');
const xMax     = getColX('__max') + MAX_X_OFFSET;
const xTotal   = getColX('__total');
const xGrade   = getColX('__grade');

// Totals row box spanning full table width (margins to margins)
const tBoxHeight = 80;
const tBoxY = totalYAdj - 45;
pdf.setDrawColor(15, 61, 107);
pdf.setLineWidth(4);
const { left: pLeft, width: pWidth } = getTableBounds(30);
pdf.roundedRect(pLeft, tBoxY, pWidth, tBoxHeight, 20, 20, 'S');

// "TOTAL" label centered in SUBJECT column
centerText(pdf, "TOTAL", xSubject, totalYAdj, 60, COLOR_GREEN);
centerText(pdf, String(totalMax ?? ''), xMax, totalYAdj, 60, COLOR_RED);
centerText(pdf, (totalMarks === '' || totalMarks == null ? 'AB' : String(totalMarks)), xTotal, totalYAdj, 60, COLOR_GREEN);
centerText(pdf, student.overallGrade, xGrade, totalYAdj, 60, COLOR_GRADE);
    
    // Attendance on preview
    // Attendance on preview
for (let i = 0; i < 10; i++) {
  const a = (student.attendance && student.attendance[i]) || { work: "", pres: "" };
  centerText(pdf, String(a.work || ""), attWorkCoords[i][0], attWorkCoords[i][1], 60, COLOR_GREEN);
  centerText(pdf, String(a.pres || ""), attPresCoords[i][0], attPresCoords[i][1], 60, COLOR_BROWN);
}

// ⇣ Add back page (landscape) to PREVIEW when at least one exam column is chosen
try {
  if (backPlan.examCols && backPlan.examCols.length) {
    const backData = await buildBackDataForStudent(student);
    pdf.addPage([3509, 2481], "l");
    drawBackPageLandscape(pdf, backData, backPlan, exams, student);
  }
} catch (e) {
  console.warn("Back page build failed (preview):", e);
}
  } // ← end for loop

  // SAFETY: if no pages were created
  if (!pdf) { pdfPreview.innerHTML = ""; return; }

  // Render the built PDF to canvases
  const data = pdf.output("arraybuffer");
  const loadingTask = window["pdfjsLib"].getDocument({ data });
  pdfPreview.innerHTML = "";
  loadingTask.promise.then(function (pdfDoc) {
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      pdfDoc.getPage(i).then(function (page) {
        const viewport = page.getViewport({ scale: 0.19 });
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width  = viewport.width;
       pdfPreview.appendChild(canvas);
page.render({ canvasContext: ctx, viewport });
      });
    }
  });
}

(async function() {
  await loadYears();
  renderBackCols();
})();
