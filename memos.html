    // Maps each class name to a group string (used for fetching exams)
const CLASS_GROUP_MAP = {
  "Nursery": "nursery-lkg-ukg",
  "LKG": "nursery-lkg-ukg",
  "UKG": "nursery-lkg-ukg",
  "1": "1-2",
  "2": "1-2",
  "1st": "1-2",
  "2nd": "1-2",
  "1st Class": "1-2",
  "2nd Class": "1-2",
  "3": "3-5",
  "4": "3-5",
  "5": "3-5",
  "3rd": "3-5",
  "4th": "3-5",
  "5th": "3-5",
  "3rd Class": "3-5",
  "4th Class": "3-5",
  "5th Class": "3-5",
  "6": "6-9",
  "7": "6-9",
  "8": "6-9",
  "9": "6-9",
  "6th": "6-9",
  "7th": "6-9",
  "8th": "6-9",
  "9th": "6-9",
  "6th Class": "6-9",
  "7th Class": "6-9",
  "8th Class": "6-9",
  "9th Class": "6-9",
  "10": "10",
  "10th": "10",
  "10th Class": "10"
};
// Returns the group name for a given class name
function getClassGroupName(className) {
  className = (className+"").replace(/[^a-z0-9]/gi,'').toLowerCase();
  for (let [k, v] of Object.entries(CLASS_GROUP_MAP)) {
    let key = k.replace(/[^a-z0-9]/gi,'').toLowerCase();
    if (className === key || className === key.replace("th","")) return v;
  }
  // Default group (for safety)
  return "6-9";
}

// ===== EFFECTIVE EXAMS (group defaults + class overrides) =====
async function fetchEffectiveExams(year, classId, className) {
  const yearRef = db.collection('years').doc(year);

  // Resolve primary group id from the class name (your existing helper)
  const baseGroup = getClassGroupName(className) || '';

  // Try a few safe aliases so we survive minor naming drift like "10" vs "class-10"
  const groupCandidates = Array.from(new Set([
    baseGroup,
    baseGroup.toLowerCase(),
    baseGroup.replace(/^class[-\s]*/i, ''),          // "class-10" -> "10"
    baseGroup.startsWith('class-') ? baseGroup : `class-${baseGroup}`, // "10" -> "class-10"
  ])).filter(Boolean);

  // Accumulator for group-level exams
  const map = new Map();

  // --- 1) GROUP EXAMS (support BOTH folderings) ---
  // a) years/{year}/exams/classGroups/{group}/*
  // b) years/{year}/classGroups/{group}/exams/*
  for (const g of groupCandidates) {
    let snap = null;

    // (a)
    try {
      snap = await yearRef.collection('exams').doc('classGroups').collection(g).get();
      if (snap && !snap.empty) {
        snap.forEach(d => map.set(d.id, { id: d.id, ...d.data(), __origin: 'group' }));
        break; // we found a populated path; stop trying aliases
      }
    } catch (_) {}

    // (b)
    try {
      snap = await yearRef.collection('classGroups').doc(g).collection('exams').get();
      if (snap && !snap.empty) {
        snap.forEach(d => map.set(d.id, { id: d.id, ...d.data(), __origin: 'group' }));
        break; // populated alternative found
      }
    } catch (_) {}
  }

  // --- 2) CLASS OVERRIDES / CLASS-ONLY (support BOTH names) ---
  // Prefer: years/{year}/classes/{classId}/examOverrides/*
  let overSnap = null;
  try {
    overSnap = await yearRef.collection('classes').doc(classId).collection('examOverrides').get();
  } catch (_) {}

  // Also accept: years/{year}/classes/{classId}/exams/*
  if (!overSnap || overSnap.empty) {
    try {
      overSnap = await yearRef.collection('classes').doc(classId).collection('exams').get();
    } catch (_) {}
  }

  if (overSnap && !overSnap.empty) {
    overSnap.forEach(doc => {
      const o = doc.data() || {};

      // Explicit hide of an inherited exam
      if (o.hidden === true) {
        map.delete(doc.id);
        return;
      }

      // Class-only (own id) or unknown id → add as-is
      if (o.origin === 'class-only' || !map.has(doc.id)) {
        map.set(doc.id, { id: doc.id, ...o, __origin: 'class-only' });
        return;
      }

      // Field-level override on a group exam (same id)
      const base = map.get(doc.id);
      map.set(doc.id, {
        ...base,
        name:      (o.name ?? base.name),
        subjects:  (Array.isArray(o.subjects)  && o.subjects.length  ? o.subjects  : base.subjects),
        subtopics: (Array.isArray(o.subtopics) && o.subtopics.length ? o.subtopics : base.subtopics),
        grading:   (o.grading || base.grading),
        __origin:  'overridden'
      });
    });
  }

  // --- 3) Return stable, name-sorted list ---
  const list = Array.from(map.values());
  list.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
  return list;
}

// Tune these to match your new PNG's grid
const SUBJECT_LAYOUT = {
  startY: 1540,   // keep
  endY:   2700,   // was 2240 → more vertical band for rows
  totalsGap: 40,
  font: 60
};
const SUBJECT_HEADER_Y = 1460; // fixed header position

function buildSubjectY(n) {
  const { startY, endY } = SUBJECT_LAYOUT;
  const maxRows = 12;

  const count = Math.max(0, Math.min(n, maxRows));
  if (count === 0) return { rowsY: [], totalY: Math.round(startY + 80) };

  // keep first-row gap unchanged
  const TOP_PAD_FROM_HEADER = 150;

  // reserve space for TOTAL/attendance so rows never touch it
  const SAFE_ABOVE_TOTAL = 110;      // cushion above TOTAL
  const firstRowY = Math.max(startY, SUBJECT_HEADER_Y + TOP_PAD_FROM_HEADER);
  const lastRowY  = endY - SAFE_ABOVE_TOTAL;

  // --- small but clear gap between rows ---
  const MIN_ROW_GAP = 45;            // ← tweak 32–42 to taste

  // even spacing in available band
  const rawGap = (count === 1) ? 0 : (lastRowY - firstRowY) / (count - 1);

  // use at least MIN_ROW_GAP but never overflow the band
  const gap = (count === 1)
    ? 0
    : Math.min(
        Math.max(rawGap, MIN_ROW_GAP),
        (lastRowY - firstRowY) / (count - 1)
      );

  const rowsY = Array.from({ length: count }, (_, i) =>
    Math.round(firstRowY + i * gap)
  );

  // place TOTAL a little below the last row, but keep it safely inside the area
  const totalY = Math.min(
    endY - 40,
    rowsY[rowsY.length - 1] + Math.max(MIN_ROW_GAP + 40, Math.round(gap * 2.2))
  );

  return { rowsY, totalY };
}

// Attendance table origin (dynamic months)
// Table will be drawn from this starting point:
const ATT_TABLE_START = { x: 238, y: 2758 };

// Month labels in academic order (used to decide how many columns to render)
const ATT_MONTHS_AX = [
  { key: '06', label: 'June'   },
  { key: '07', label: 'July'   },
  { key: '08', label: 'August' },
  { key: '09', label: 'Sep'    },
  { key: '10', label: 'Oct'    },

  { key: '12', label: 'Dec'    },

];

// Draws a centered, auto-expanding attendance table.
// It shows months up to the last one that has any data (work or pres > 0).
function drawAttendanceTable(pdf, attArr) {
  // --- Target frame (the light attendance box area on your template) ---
  // Adjust these two numbers only if your template box changes.
  const FRAME_LEFT  = PAGE_MARGINS.left;
  const FRAME_RIGHT = PAGE_MARGINS.right;

  const startY = ATT_TABLE_START.y; // you already positioned this nicely

  // 1) Decide how many months to render (up to the last month with any data)
  const lastIdx = (() => {
    let idx = -1;
    (attArr || []).forEach((m, i) => {
      const has = (Number(m?.work) || 0) > 0 || (Number(m?.pres) || 0) > 0;
      if (has) idx = i;
    });
    return Math.max(idx, 0);
  })();

  const monthsToShow = ATT_MONTHS_AX.slice(0, lastIdx + 1);
  const cols = monthsToShow.length;

  // 2) Geometry (center the whole table inside the frame)
  const frameW = FRAME_RIGHT - FRAME_LEFT;

  // keep left label column constant so the month columns flex
  const labelColW = 300;
  const availForMonths = Math.max(180, frameW - labelColW);

  // Minimum column width; if we have many months it will shrink but not below this
  const MIN_COL_W = 120;
  const colW = Math.max(MIN_COL_W, Math.floor(availForMonths / Math.max(cols, 1)));

  // total table width that we will actually draw (could be < frameW)
  const tableW = labelColW + colW * cols;

  // center horizontally inside the frame
  const startX = FRAME_LEFT + Math.round((frameW - tableW) / 2);

  // 3) Row geometry
  const rows = 3;          // Header + Working Days + Days Present
  const rowH = 75;
  const tableH = rows * rowH;

  // 4) Box + grid
  pdf.setDrawColor(15, 61, 107);
  pdf.setFillColor(250, 253, 255);
  pdf.setLineWidth(2);
  pdf.roundedRect(startX, startY, tableW, tableH, 14, 14, 'FD');

  // vertical lines
  pdf.setLineWidth(1.4);
  for (let c = 1; c <= cols; c++) {
    const x = startX + labelColW + c * colW;
    pdf.line(x, startY, x, startY + tableH);
  }
  // horizontal lines
  for (let r = 1; r < rows; r++) {
    const y = startY + r * rowH;
    pdf.line(startX, y, startX + tableW, y);
  }

  // 5) Typography (auto scale down when many months so text never collides)
  const autoSize = (base, min) => Math.max(min, Math.min(base, Math.floor((colW / 180) * base)));
  const headerSize  = autoSize(64, 38);  // month names
  const labelSize   = autoSize(60, 36);  // left labels
  const numbersSize = autoSize(60, 36);  // numbers

  const ORANGE = [255, 122, 0];
  const GREEN  = [22, 163, 74];
  const BROWN  = [139, 69, 19];

  // 6) Month headers
  pdf.setFont('helvetica', 'bold');
  pdf.setTextColor(...ORANGE);
  pdf.setFontSize(headerSize);
  monthsToShow.forEach((m, c) => {
    const cx = startX + labelColW + c * colW + colW / 2;
    const cy = startY + rowH / 2 + 10;
    pdf.text(m.label, cx, cy, { align: 'center', baseline: 'middle' });
  });

  // 7) Left labels — left-aligned with a small inset so they don't touch the left line
pdf.setTextColor(...ORANGE);
pdf.setFontSize(labelSize);
const labelLeftInset = 18; // tweak 18–26 if you want more space
const labelX = startX + labelLeftInset;
const padY = 14;

pdf.text('Attendance',    labelX, startY + rowH / 2 + 10,            { align: 'left', baseline: 'middle' });
pdf.text('Working Days:', labelX, startY + rowH + rowH / 2 + padY,   { align: 'left', baseline: 'middle' });
pdf.text('Days Present:', labelX, startY + 2 * rowH + rowH / 2 + padY,{ align: 'left', baseline: 'middle' });

  // 8) Numbers
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(numbersSize);

  // Working Days (green)
  pdf.setTextColor(...GREEN);
  monthsToShow.forEach((m, c) => {
    const v = Number(attArr?.[c]?.work) || 0;
    if (!v) return;
    const cx = startX + labelColW + c * colW + colW / 2;
    const cy = startY + rowH + rowH / 2 + padY;
    pdf.text(String(v), cx, cy, { align: 'center', baseline: 'middle' });
  });

  // Days Present (brown)
  pdf.setTextColor(...BROWN);
  monthsToShow.forEach((m, c) => {
    const raw = attArr?.[c]?.pres;
    const v = (typeof raw === 'number') ? raw : (Number(raw) || 0);
    if (!v) return;
    const cx = startX + labelColW + c * colW + colW / 2;
    const cy = startY + 2 * rowH + rowH / 2 + padY;
    pdf.text(String(v), cx, cy, { align: 'center', baseline: 'middle' });
  });

  pdf.setTextColor(0,0,0);
}

async function loadGradingDefaultFromFirestore() {
  try {
    const year = yearSel?.value;
    if (!year) { __gradingDefaultScale = null; return; }
    const snap = await db.collection('years')
      .doc(year)
      .collection('settings')

   Priority:
   1) Selected exam's grading.scale (mode: 'custom')
   2) Legacy fallback (matches old fixed thresholds)
*/
const LEGACY_GRADING_SCALE = [
  { grade: 'A+', min: 95, max: 100 },
  { grade: 'A',  min: 90, max: 94.9999 },
  { grade: 'B+', min: 85, max: 89.9999 },
  { grade: 'B',  min: 80, max: 84.9999 },
  { grade: 'C+', min: 70, max: 79.9999 },
  { grade: 'C',  min: 60, max: 69.9999 },
  { grade: 'D',  min: 50, max: 59.9999 },
  { grade: 'E',  min: 40, max: 49.9999 },
  { grade: 'F',  min: 0,  max: 39.9999 }
];

// sanitize + sort scale (descending by min)
function _normalizeScale(scaleArr) {
  const arr = Array.isArray(scaleArr) ? scaleArr.slice() : [];
  return arr
    .map(r => ({
      grade: String(r?.grade ?? '').trim(),
      min: Number.isFinite(+r?.min) ? +r.min : NaN,
      max: Number.isFinite(+r?.max) ? +r.max : NaN
    }))
    .filter(r => r.grade && !Number.isNaN(r.min) && !Number.isNaN(r.max))
    .sort((a, b) => b.min - a.min);
}

// Resolve scale for a given examId from loaded `exams` list
function getScaleForExamId(examId) {
  try {
    const ex = (Array.isArray(exams) ? exams.find(e => e.id === examId) : null);
    const s  = ex?.grading?.scale;
    const mode = ex?.grading?.mode;
    if (mode === 'custom' && Array.isArray(s) && s.length) {
      const norm = _normalizeScale(s);
      if (norm.length) return norm;
    }
  } catch {}
  return _normalizeScale(LEGACY_GRADING_SCALE);
}

// Resolve scale for the currently selected exam
function getActiveScale() {
  // If a global default is loaded, prefer it for ALL displays (legend, etc.)
  if (Array.isArray(__gradingDefaultScale) && __gradingDefaultScale.length) {
    return __gradingDefaultScale;
  }
  // Otherwise fall back to the currently selected exam’s scale (or legacy)
  const exId = (examSel?.value || '').trim();
  return getScaleForExamId(exId);
}


// Compute grade from percentage using a scale
function gradeFromPctUsingScale(pct, scale = getActiveScale()) {
  if (pct == null || !Number.isFinite(+pct)) return '';
  const p = +pct;
  const table = _normalizeScale(scale);
  for (const row of table) {
    if (p >= row.min && p <= row.max) return row.grade;
  }
  return ''; // out of range → blank
}

// Determine "fail" for visuals (rings). By default, treat grade 'F' as fail.
// If no 'F' band exists, compute the lowest passing min and fail if below it.
function isFailPct(pct, scale = getActiveScale()) {
  if (pct == null || !Number.isFinite(+pct)) return false;
  const table = _normalizeScale(scale);
  const g = gradeFromPctUsingScale(+pct, table);
  if (g && /^f(?:ail)?$/i.test(g)) return true;

  // derive pass threshold if needed
  const passing = table.filter(r => !/^f(?:ail)?$/i.test(String(r.grade)));
  if (passing.length) {
    const minPass = Math.min(...passing.map(r => r.min));
    return +pct < minPass;
  }
  // fallback to legacy < 40 as fail
  return +pct < 40;
}

    ? withSubs.slice().sort((a,b) => b.subtopics.length - a.subtopics.length)[0]   // longest subtopic list wins

    : [];

  const maxBy = {};

    return Math.max(minW, Math.min(maxW, w));
  }

  // widths + mins
  const widths = {}, mins = {};
  for (const h of headers) {
    if (h.key === '__subject') { mins[h.key] = MIN_SUBJECT; widths[h.key] = estWidth(h.label, MIN_SUBJECT); }
    else if (h.key === '__max') { mins[h.key] = MIN_MAX; widths[h.key] = estWidth(h.label, MIN_MAX); }
    else if (h.key === '__total') { mins[h.key] = MIN_TOTAL; widths[h.key] = estWidth(h.label, MIN_TOTAL); }
    else if (h.key === '__grade') { mins[h.key] = MIN_GRADE; widths[h.key] = estWidth(h.label, MIN_GRADE); }

     function totalWidth(edgeGap, ws) {
    const sumW = keys.reduce((a,k) => a + ws[k], 0);
    let gaps = 0;
   for (let i = 0; i < headers.length - 1; i++) {

    left !== '__max' && right !== '__total'; // between subtopic-like columns

  const isSubjectToMax = (left === '__subject' && right === '__max');
  const isMaxToNext    = (left === '__max' && right !== '__total'); // MAX → first subtopic

function getTableBounds(pad = 30) {
  const cols = computeColumns();
  const left  = Math.round(cols[0].x - cols[0].width / 2) - pad;
  const right = Math.round(cols[cols.length - 1].x + cols[cols.length - 1].width / 2) + pad;
  return { left, right, width: right - left };

  function getColX(key) {

function _measureTextWidth(pdf, text, size=48) {

// Build columns as groups: each exam → two subcolumns (TOTAL, GRADE)
function _buildBackColumnsModel(backPlan, exams) {
  const cols = [{ key: '__subject', label: 'SUBJECT', kind: 'subject' }];
  const groups = []; // [{ examId, name, startIndex, endIndex }]

  for (const exId of (backPlan.examCols || [])) {

    const startIndex = cols.length;
    cols.push({ key: `${exId}__tot`, label: 'TOTAL', kind: 'tot', examId: exId });
cols.push({ key: `${exId}__gr`,  label: 'GRADE', kind: 'gr',  examId: exId });
    const endIndex = cols.length - 1;
    groups.push({ examId: exId, name: exName, startIndex, endIndex });
  }

  return { cols, groups };
}

// Two-tone school title (solid fill inside + colored outline)
// NOTE: preserves the original casing (no toUpperCase()).
function drawSchoolTitleTwoTone(
  pdf,
  text,
  { borderX, borderY, borderW },
  opts = {}
) {
  const {
    fill = '#0f3d6b',       // INSIDE color (navy)
    stroke = '#ff7a00',     // OUTLINE color (orange)
    strokeWidth = 12,
    shadow = 'rgba(0,0,0,0.18)',
    fontPx = 88,
    yOffset = 40,
    family = "Segoe UI, Arial, Helvetica, sans-serif"
  } = opts;

    const targetW = Math.min(1600, Math.floor(borderW * 0.70)); // smaller cap & scale
  const pad = 40;

  // measure
  const mCanvas = document.createElement('canvas');
  const mCtx = mCanvas.getContext('2d');
  mCanvas.width = 2200; mCanvas.height = 220;
  mCtx.font = `900 ${fontPx}px ${family}`;
  const textStr = String(text || '');               // ← keep original casing
  const textW = Math.ceil(mCtx.measureText(textStr).width);

  // paint
  const W = textW + pad * 2;
  const H = fontPx + pad * 2;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.font = `900 ${fontPx}px ${family}`;
  ctx.textBaseline = 'top';

  // soft shadow
  if (shadow) {
    ctx.shadowColor = shadow;
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 8;
  }

  // outline first
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = stroke;     // orange border
  ctx.lineWidth = strokeWidth;
  ctx.strokeText(textStr, pad, pad);

  // fill inside
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = fill;         // navy fill
  ctx.fillText(textStr, pad, pad);

  // place on PDF
  const ratio = targetW / canvas.width;
  const w = targetW;
  const h = Math.round(canvas.height * ratio);
  const x = borderX + Math.round((borderW - w) / 2);
  const y = borderY + yOffset;

  pdf.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, w, h, undefined, 'FAST');
return { x, y, w, h };
}

    // Create a linear gradient as a dataURL for jsPDF.addImage
function makeGradientDataURL(w, h, stops, direction = 'diag') {
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(2, Math.round(w));
  canvas.height = Math.max(2, Math.round(h));
  const ctx = canvas.getContext('2d');

  let grad;
  if (direction === 'vertical') grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  else if (direction === 'horizontal') grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  else grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height); // 'diag'

  (stops || []).forEach(s => grad.addColorStop(s.offset, s.color));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/png');
}
    // Build a public URL if only a Storage path is saved (e.g., "years/.../photo.jpg")
function buildStorageUrlFromPath(path) {
  const bucket = (firebase.app().options.storageBucket || '').replace('gs://','');
  if (!bucket || !path) return '';
  return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(path)}?alt=media`;
}

// Fetch any image URL and return a dataURL (base64) for jsPDF.addImage
// Fetch any image URL and return a dataURL (base64) for jsPDF.addImage (cached)
const __photoCache = new Map();
async function urlToDataURL(url) {
  if (!url) return '';
  if (__photoCache.has(url)) return __photoCache.get(url);
  const res = await fetch(url);
  const blob = await res.blob();
  const data = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
  __photoCache.set(url, data);
  return data;
}
async function drawStudentPhoto(pdf, stu) {
  try {
    // 1) Resolve a URL for the photo
    let url = stu.photoUrl || stu.photoURL || '';
    if (!url && stu.photoPath) url = buildStorageUrlFromPath(stu.photoPath);
    if (!url) return;

    // 2) Load image as dataURL (already have in your code)
    const dataURL = await urlToDataURL(url);
    const { x, y, w, h } = HEAD_PHOTO;

    // 3) Compose rounded photo + gradient ring ON A CANVAS (no PDF clipping)
    const border = 18;
    const rOuter = 22;
    const rInner = Math.max(6, rOuter - 6);

    // helper: rounded rect path
    function rr(ctx, x, y, w, h, r) {
      const r2 = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r2, y);
      ctx.lineTo(x + w - r2, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r2);
      ctx.lineTo(x + w, y + h - r2);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r2, y + h);
      ctx.lineTo(x + r2, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r2);
      ctx.lineTo(x, y + r2);
      ctx.quadraticCurveTo(x, y, x + r2, y);
      ctx.closePath();
    }

    // create canvas
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(2, Math.round(w));
    canvas.height = Math.max(2, Math.round(h));
    const ctx = canvas.getContext('2d');

    // 3a) draw gradient outer rounded rect
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0.00, '#FF6EC4');
    grad.addColorStop(0.50, '#7C4DFF');
    grad.addColorStop(1.00, '#4ADEDE');
    ctx.fillStyle = grad;
    rr(ctx, 0, 0, w, h, rOuter);
    ctx.fill();

    // 3b) “knock out” inner area to make the ring
    ctx.globalCompositeOperation = 'destination-out';
    rr(ctx, border, border, w - 2 * border, h - 2 * border, rInner);
    ctx.fill();

    // 3c) draw the photo inside the inner rounded rect
    ctx.globalCompositeOperation = 'destination-over'; // draw below the transparent knockout
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataURL; });
    ctx.save();
    rr(ctx, border, border, w - 2 * border, h - 2 * border, rInner);
    ctx.clip();
    ctx.drawImage(img, border, border, w - 2 * border, h - 2 * border);
    ctx.restore();

    // 4) Add the precomposed PNG to the PDF (no PDF clip at all)
    const composedURL = canvas.toDataURL('image/png');
    pdf.addImage(composedURL, 'PNG', x, y, w, h, undefined, 'FAST');
  } catch (e) {
    console.warn('Photo compose failed:', e);
    // hard fallback: draw plain photo without any mask
    try {
      const dataURL = await urlToDataURL(stu.photoUrl || stu.photoURL || buildStorageUrlFromPath(stu.photoPath));
      const { x, y, w, h } = HEAD_PHOTO;
      pdf.addImage(dataURL, 'JPEG', x, y, w, h, undefined, 'FAST');
    } catch {}
  }
}

/* ===== Back-side helpers: read any exam for a student and compute subject totals ===== */
  // simple in-memory cache so we don't refetch the same marks repeatedly
const __marksCache = new Map();

/**
 * Read a student's marks document for a given exam.
 * Falls back to {} if missing. Results are cached per year/class/section/student/exam.
 */
async function _readMarksDocFor(stuId, examId) {
  const year = yearSel.value;
  const classId = classSel.value;
  const sectionId = sectionSel.value;

  if (!year || !classId || !sectionId || !stuId || !examId) return {};

  const cacheKey = `${year}/${classId}/${sectionId}/${stuId}/${examId}`;
  if (__marksCache.has(cacheKey)) return __marksCache.get(cacheKey);

  const ref = db.collection('years').doc(year)
    .collection('classes').doc(classId)
    .collection('sections').doc(sectionId)
    .collection('students').doc(stuId)
    .collection('marks').doc(examId);

  const snap = await ref.get();
  const data = snap.exists ? (snap.data() || {}) : {};
  __marksCache.set(cacheKey, data);
  return data;
}

async function computeRanksByExam(examIds) {
  if (!Array.isArray(examIds) || examIds.length === 0) return new Map();
  const out = new Map(); // examId -> Map(studentId -> rank)
  for (const exId of (examIds || [])) {
    const struct = await getExamStructureForExamId(exId);
    const totals = [];
    for (const stu of students) {
      const marksObj = await _readMarksDocFor(stu.id, exId);
      const subs = _extractSubjectTotalsFromMarks(marksObj, struct); // [{total,max}]
      const sum = subs.reduce((a,s)=> a + (typeof s.total === 'number' ? s.total : 0), 0);
      totals.push({ id: stu.id, total: sum });
    }
    totals.sort((a,b)=> b.total - a.total);
    let last = null, rank = 1, lastRank = 1;
    totals.forEach((t,i) => {
      if (t.total !== last) { rank = i+1; last = t.total; lastRank = rank; }
      t.rank = lastRank;
    });
    out.set(exId, new Map(totals.map(t => [t.id, t.rank])));
  }
  return out;
}

/* Build normalized subject list across multiple exams (union, stable by name) */
function _unionSubjectsAcross(examIds, perExamSubjectsMap) {
  const seen = new Set();
  const out = [];
  for (const ex of examIds) {
    const arr = perExamSubjectsMap.get(ex) || [];
    for (const s of arr) {
      const key = nkey(s.name || s);
      if (!key || seen.has(key)) continue;
      seen.add(key);
      out.push(s.name || s);
    }
  }
  return out;
}

/* From an exam marks object, compute subject totals.
   RULE: if no numeric entries at all → total === 'AB'.
         If a number exists (including 0) → sum the numbers. */
function _extractSubjectTotalsFromMarks(marksObj, structure) {
    const subjects = [];
  const subsRoot = (marksObj && typeof marksObj.__subs === 'object') ? marksObj.__subs : {};

  const baseSubjects = (structure?.subjects?.length
    ? structure.subjects.map(s => s.name)
    : Object.keys(marksObj).filter(k => k !== '__subs')
  );

  for (const subjName of baseSubjects) {
    // locate values for this subject
    const keyRoot = Object.keys(marksObj).find(k => nkey(k) === nkey(subjName));
    const subjVal = keyRoot ? marksObj[keyRoot] : marksObj[subjName];

    const keySubs = Object.keys(subsRoot || {}).find(k => nkey(k) === nkey(subjName));
    const subsObj = keySubs ? subsRoot[keySubs] : null;

    let total = 0;
    let max   = 0;
    let sawNumeric = false; // ← our decisive flag

    // Prefer __subs breakdown
    if (subsObj && typeof subsObj === 'object') {
      for (const [k, v] of Object.entries(subsObj)) {
        if (typeof v === 'number' && !isNaN(v)) {      // includes 0
          total += +v;
          sawNumeric = true;
        }
        // infer max from exam structure if known
        const subjDef = structure?.subjects?.find(s => nkey(s.name) === nkey(subjName));
        const stDef   = subjDef?.subtopics?.find(t => nkey(t.name) === nkey(k));
        if (typeof stDef?.max === 'number') max += stDef.max;
      }
      // fallback subjectMax when we couldn't sum subtopic maxes
      if (max === 0) {
        const subjDef = structure?.subjects?.find(s => nkey(s.name) === nkey(subjName));
        if (typeof subjDef?.subjectMax === 'number') max = subjDef.subjectMax;
      }
    }
    // Or: object stored directly at the subject key
    else if (subjVal && typeof subjVal === 'object' && !Array.isArray(subjVal)) {
      for (const [, v] of Object.entries(subjVal)) {
        if (typeof v === 'number' && !isNaN(v)) {
          total += +v;
          sawNumeric = true;
        }
      }
      // no reliable max here
    }
    // Or: a scalar at the subject key
    else if (subjVal !== undefined) {
      if (typeof subjVal === 'number' && !isNaN(subjVal)) {
        total = +subjVal;      // 0 is valid
        sawNumeric = true;
      } else {
        // explicit AB / blank → no numbers seen
        sawNumeric = false;
      }
           // try structure max
      const subjDef = structure?.subjects?.find(s => nkey(s.name) === nkey(subjName));
    if (typeof subjDef?.subjectMax === 'number') max = subjDef.subjectMax;
    }

    // Finalize per our rule
    const finalTotal = sawNumeric ? total : 'AB';

    // only include subjects that either have a number or are AB (skip truly missing subjects)
    if (sawNumeric || finalTotal === 'AB') {
      subjects.push({ name: subjName, total: finalTotal, max });
    }
  }

  return subjects;
}

const __EXCLUDE_REMARK_SUBJECTS = new Set(['spoken english','discipline']);

    const M = (typeof s?.max === 'number' ? s.max : null);
    const p = (m != null && M != null && M > 0) ? (m / M) * 100 : null;
    return {

  });

  const good85   = perSub.filter(x => x.pct != null && x.pct >= 85 && x.pct < 90).map(x => x.name);
  const weakLT50 = perSub.filter(x => (x.pct != null && x.pct < 50) && !x.isFail).map(x => x.name);
  const weakLE60 = perSub.filter(x => (x.pct != null && x.pct <= 60) && !x.isFail).map(x => x.name);
  const failSubs = perSub.filter(x => x.isFail).map(x => x.name);
  const abSubs   = perSub.filter(x => x.isAB).map(x => x.name);

  let work = 0, pres = 0;
  (student.attendance || []).forEach(m => { work += Number(m.work) || 0; pres += Number(m.pres) || 0; });
  const att = work > 0 ? Math.round((pres / work) * 100) : null;

  const parts = [];
  if (overallPct != null) {

    else                       pool = REMARK_POOLS.overall.lt40;
    parts.push(pick(pool));

  if (best95.length) {

  } else if (very90.length) {
    parts.push(pick(REMARK_POOLS.praise90).replace('{SUBJECTS}', formatSubjectsList(very90)));
  } else if (good85.length) {
    parts.push(pick(REMARK_POOLS.praise85).replace('{SUBJECTS}', formatSubjectsList(good85)));
  }
  if (failSubs.length) {
    parts.push(pick(REMARK_POOLS.focusFail).replace('{SUBJECTS}', formatSubjectsList(failSubs)));
  } else if (weakLT50.length) {
    parts.push(pick(REMARK_POOLS.focusLT50).replace('{SUBJECTS}', formatSubjectsList(weakLT50)));
  } else if (weakLE60.length) {
    parts.push(pick(REMARK_POOLS.focusLE60).replace('{SUBJECTS}', formatSubjectsList(weakLE60)));
  }
  if (abSubs.length && !failSubs.length) {
    parts.push(pick(REMARK_POOLS.focusAB).replace('{SUBJECTS}', formatSubjectsList(abSubs)));
  }
  if (att != null) {
    let apool;
    if      (att >= 95) apool = REMARK_POOLS.attendance.ge95;
    else if (att >= 90) apool = REMARK_POOLS.attendance.ge90;
    else if (att >= 75) apool = REMARK_POOLS.attendance.ge75;

// --- Concurrency limiter (promise pool) ---
function pLimit(concurrency){
  const q=[]; let active=0;
  const next=()=>{ if(active>=concurrency||q.length===0) return;
    active++; const {fn,resolve,reject}=q.shift();
    Promise.resolve().then(fn).then(
      v=>{active--; resolve(v); next();},
      e=>{active--; reject(e); next();}
    );
  };
  return fn=>new Promise((resolve,reject)=>{ q.push({fn,resolve,reject}); next(); });
}

//  - Subject in schema but student's values blank → 'AB'
//  - Subject not in that exam schema at all → '-'
async function buildBackDataForStudent(stu) {
  const needExamIds = Array.from(new Set(backPlan.examCols || []));
  // use global nkey()

  // 1) Read schema (via the same builder as the front page) + student's marks
  const schemaByExam = new Map(); // exId -> { subjects:[{name,subjectMax,subtopics[]}] , maxBySubject:Map, headerMax }
  const marksByExam  = new Map(); // exId -> raw marks doc

  for (const exId of needExamIds) {
    // use the robust, inferring structure (front-page builder)
    const struct = await getExamStructureForExamId(exId); // {subjects:[{name,subjectMax,subtopics[]}]}
    const maxBySubject = new Map();
    const subjNames = [];

    for (const s of (struct?.subjects || [])) {
      const key = nkey(s?.name || '');
      if (!key) continue;
      subjNames.push(s.name);

      // prefer explicit subjectMax, else sum subtopic max
      let m = (typeof s?.subjectMax === 'number' && !isNaN(s.subjectMax)) ? s.subjectMax : null;
      if (m == null && Array.isArray(s?.subtopics) && s.subtopics.length) {
        const sum = s.subtopics.reduce((a,t)=> a + (typeof t?.max === 'number' ? t.max : 0), 0);
        m = (sum > 0 ? sum : null);
      }
      maxBySubject.set(key, m);
    }

    // header “(NN MARKS)”: use the first non-null subject max we know
    let headerMax = null;
    for (const v of maxBySubject.values()) { if (typeof v === 'number' && v > 0) { headerMax = v; break; } }

    schemaByExam.set(exId, { subjNames, maxBySubject, headerMax });

    const mobj = await _readMarksDocFor(stu.id, exId);
    marksByExam.set(exId, mobj || {});
  }

  // 2) Subject list = union of schema subjects across chosen exams
  const subjectSet = new Set();
  for (const exId of needExamIds) {
    (schemaByExam.get(exId)?.subjNames || []).forEach(n => n && subjectSet.add(n));
  }
  const subjectList = Array.from(subjectSet);
  if (subjectList.length === 0) return { subjectList: [], rows: [], headerMaxByExam: new Map() };

  // 3) Build rows with AB / '-' logic
  const rows = subjectList.map(name => {
    const keyName = nkey(name);
    const row = { subject: name, exams: {} };

    for (const exId of needExamIds) {
      const mobj = marksByExam.get(exId) || {};
      const { maxBySubject } = schemaByExam.get(exId) || {};
      const fixedMax = maxBySubject ? (maxBySubject.get(keyName) ?? null) : null;

      // default when subject not in this exam schema
      let marksVal = '-';

      if (fixedMax != null) {
        // subject exists in schema → look for student's values
        const subsRoot = (mobj && typeof mobj.__subs === 'object') ? mobj.__subs : null;
        const subsKey  = subsRoot ? Object.keys(subsRoot).find(k => nkey(k) === keyName) : null;
        const subjKey  = Object.keys(mobj).find(k => k !== '__subs' && nkey(k) === keyName);

        if (subsKey && typeof subsRoot[subsKey] === 'object') {
          // sum numeric parts; if none, AB
          let sum = 0, sawNum = false;
          for (const v of Object.values(subsRoot[subsKey])) {
            if (typeof v === 'number' && !isNaN(v)) { sum += v; sawNum = true; }
          }
          marksVal = sawNum ? sum : 'AB';
        } else if (subjKey !== undefined) {
          const v = mobj[subjKey];
          if (typeof v === 'number' && !isNaN(v))      marksVal = v;     // allows 0
          else if (String(v).toUpperCase() === 'AB')   marksVal = 'AB';
          else if (v && typeof v === 'object') {
            let sum = 0, saw = false;
            for (const x of Object.values(v)) {
              if (typeof x === 'number' && !isNaN(x)) { sum += x; saw = true; }
            }
            marksVal = saw ? sum : 'AB';
          } else {
            marksVal = 'AB'; // subject present in schema but student's value blank
          }
        } else {
          marksVal = 'AB';   // in schema, but no entry at all for student → AB
        }
      }

      // grade only when both numbers are known
      let gradeTxt = '-';
if (typeof marksVal === 'number' && typeof fixedMax === 'number' && fixedMax > 0) {
  const pct = (marksVal / fixedMax) * 100;
  gradeTxt = gradeFromPctUsingScale(pct, getScaleForExamId(exId));
}

      row.exams[exId] = { marks: marksVal, max: fixedMax, grade: gradeTxt };
    }

    return row;
  });

  // 4) Header max (for “(NN MARKS)” line) per exam
  const headerMaxByExam = new Map();
  for (const exId of needExamIds) {
    headerMaxByExam.set(exId, schemaByExam.get(exId)?.headerMax ?? null);
  }

  return { subjectList, rows, headerMaxByExam };
}

async function getAllStudentFullData() {
  let dataArr = [];
  for (let stu of students) {
    let dat = await fetchStudentData(stu);
    dataArr.push(dat);
  }
  dataArr.sort((a,b)=>b.totalMarks-a.totalMarks);
  let rank = 1, lastMark = null, lastRank = 1;
  dataArr.forEach((d,i) => {
    if (d.totalMarks !== lastMark) { rank = i+1; lastMark = d.totalMarks; lastRank = rank; }
    d.rank = lastRank;
  });
  dataArr.sort((a,b)=> {
    let aIdx = students.findIndex(s=>s.name===a.name&&s.roll==a.roll);
    let bIdx = students.findIndex(s=>s.name===b.name&&s.roll==b.roll);
    return aIdx-bIdx;
  });
  return dataArr;
}

/* === Custom dropdown creator (same behavior as bank.html) === */
(function(){
  function buildCustomFromSelect(sel){
    // hide native select but keep it for change listeners & form submit
    sel.classList.add('native-select-hidden');

    // container
    const wrap = document.createElement('div');
    wrap.className = 'custom-dropdown';
    // visible label
    const selected = document.createElement('div');
    selected.className = 'selected-option';
    // options popup
    const popup = document.createElement('div');
    popup.className = 'dropdown-options';

    // fill from native options
    const opts = Array.from(sel.options);
    const curr = sel.selectedIndex >= 0 ? opts[sel.selectedIndex] : opts[0];
    selected.textContent = curr ? (curr.textContent || curr.value) : 'Select';

    opts.forEach(o=>{
      const item = document.createElement('div');
      item.setAttribute('data-value', o.value);
      item.textContent = o.textContent || o.value;
      if (o.disabled) item.style.opacity = '0.5';
      popup.appendChild(item);
    });

    // interactions (same pattern as bank.html)
    selected.addEventListener('click', function(e){
      e.stopPropagation();
      closeAll();
      wrap.classList.toggle('open');
    });
    popup.addEventListener('click', function(e){
      const t = e.target.closest('div[data-value]');
      if(!t) return;
      const val = t.getAttribute('data-value');
      // sync back to native select
      sel.value = val;
      sel.dispatchEvent(new Event('change', { bubbles:true }));
      // update visible label
      selected.textContent = t.textContent;
      wrap.classList.remove('open');
    });

    wrap.appendChild(selected);
    wrap.appendChild(popup);
    // place *after* the native select
    sel.insertAdjacentElement('afterend', wrap);
  }

  function closeAll(){
    document.querySelectorAll('.custom-dropdown.open').forEach(d=>d.classList.remove('open'));
  }

  document.addEventListener('click', closeAll);

  // Convert all selects that opt in
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('select[data-custom="dropdown"]').forEach(buildCustomFromSelect);
  });
})();
</script>
