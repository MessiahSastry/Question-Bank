  <script>
    // Maps each class name to a group string (used for fetching exams)
const CLASS_GROUP_MAP = {
  "Nursery": "nursery-lkg-ukg",
  "LKG": "nursery-lkg-ukg",
  "UKG": "nursery-lkg-ukg",
  "1": "1-2",
  "2": "1-2",
  "1st": "1-2",
  "2nd": "1-2",
  "1st Class": "1-2",
  "2nd Class": "1-2",
  "3": "3-5",
  "4": "3-5",
  "5": "3-5",
  "3rd": "3-5",
  "4th": "3-5",
  "5th": "3-5",
  "3rd Class": "3-5",
  "4th Class": "3-5",
  "5th Class": "3-5",
  "6": "6-9",
  "7": "6-9",
  "8": "6-9",
  "9": "6-9",
  "6th": "6-9",
  "7th": "6-9",
  "8th": "6-9",
  "9th": "6-9",
  "6th Class": "6-9",
  "7th Class": "6-9",
  "8th Class": "6-9",
  "9th Class": "6-9",
  "10": "10",
  "10th": "10",
  "10th Class": "10"
};
// Returns the group name for a given class name
function getClassGroupName(className) {
  className = (className+"").replace(/[^a-z0-9]/gi,'').toLowerCase();
  for (let [k, v] of Object.entries(CLASS_GROUP_MAP)) {
    let key = k.replace(/[^a-z0-9]/gi,'').toLowerCase();
    if (className === key || className === key.replace("th","")) return v;
  }
  // Default group (for safety)
  return "6-9";
}

// ===== EFFECTIVE EXAMS (group defaults → class overrides → section overrides) =====
async function fetchEffectiveExams(year, classId, className, sectionId) {
  const yearRef = db.collection('years').doc(year);

  // Resolve primary group id from the class name
  const baseGroup = getClassGroupName(className) || '';

  // Survive minor naming drift like "10" vs "class-10"
  const groupCandidates = Array.from(new Set([
    baseGroup,
    baseGroup.toLowerCase(),
    baseGroup.replace(/^class[-\s]*/i, ''),                                // "class-10" -> "10"
    baseGroup.startsWith('class-') ? baseGroup : class-${baseGroup},      // "10" -> "class-10"
  ])).filter(Boolean);

  // Accumulator for effective exams
  const map = new Map();

  // --- 1) GROUP EXAMS (support BOTH folderings) ---
  // a) years/{year}/exams/classGroups/{group}/*
  // b) years/{year}/classGroups/{group}/exams/*
  for (const g of groupCandidates) {
    let snap = null;

    // (a)
    try {
      snap = await yearRef.collection('exams').doc('classGroups').collection(g).get();
      if (snap && !snap.empty) {
        snap.forEach(d => map.set(d.id, { id: d.id, ...d.data(), __origin: 'group' }));
        break; // found a populated path
      }
    } catch (_) {}

    // (b)
    try {
      snap = await yearRef.collection('classGroups').doc(g).collection('exams').get();
      if (snap && !snap.empty) {
        snap.forEach(d => map.set(d.id, { id: d.id, ...d.data(), __origin: 'group' }));
        break; // alternative path found
      }
    } catch (_) {}
  }

  // --- 2) CLASS OVERRIDES / CLASS-ONLY (support BOTH names) ---
  // Prefer: years/{year}/classes/{classId}/examOverrides/*
  let clsSnap = null;
  try {
    clsSnap = await yearRef.collection('classes').doc(classId).collection('examOverrides').get();
  } catch (_) {}

  // Also accept: years/{year}/classes/{classId}/exams/*
  if (!clsSnap || clsSnap.empty) {
    try {
      clsSnap = await yearRef.collection('classes').doc(classId).collection('exams').get();
    } catch (_) {}
  }

  if (clsSnap && !clsSnap.empty) {
    clsSnap.forEach(doc => {
      const o = doc.data() || {};

      // hide inherited exam
      if (o.hidden === true) {
        map.delete(doc.id);
        return;
      }

      // class-only (new id) OR add/override existing
      if (!map.has(doc.id) || o.origin === 'class-only') {
        map.set(doc.id, { id: doc.id, ...o, __origin: 'class-only' });
      } else {
        const base = map.get(doc.id);
        map.set(doc.id, {
          ...base,
          name:      (o.name ?? base.name),
          subjects:  (Array.isArray(o.subjects)  && o.subjects.length  ? o.subjects  : base.subjects),
          subtopics: (Array.isArray(o.subtopics) && o.subtopics.length ? o.subtopics : base.subtopics),
          grading:   (o.grading || base.grading),
          includeInTotal: (o.includeInTotal ?? base.includeInTotal),
          __origin:  'overridden-class'
        });
      }
    });
  }

  // --- 3) SECTION OVERRIDES / SECTION-ONLY (highest priority; support BOTH names) ---
  // Prefer: years/{year}/classes/{classId}/sections/{sectionId}/examOverrides/*
  // Also:   years/{year}/classes/{classId}/sections/{sectionId}/exams/*
  if (sectionId) {
    let secSnap = null;
    try {
      secSnap = await yearRef.collection('classes').doc(classId)
        .collection('sections').doc(sectionId)
        .collection('examOverrides').get();
    } catch (_) {}

    if (!secSnap || secSnap.empty) {
      try {
        secSnap = await yearRef.collection('classes').doc(classId)
          .collection('sections').doc(sectionId)
          .collection('exams').get();
      } catch (_) {}
    }

    if (secSnap && !secSnap.empty) {
      secSnap.forEach(doc => {
        const o = doc.data() || {};

        // hide inherited exam at section scope
        if (o.hidden === true) {
          map.delete(doc.id);
          return;
        }

        // section-only (new id) OR override whatever exists
        if (!map.has(doc.id) || o.origin === 'section-only') {
          map.set(doc.id, { id: doc.id, ...o, __origin: 'section-only' });
        } else {
          const base = map.get(doc.id);
          map.set(doc.id, {
            ...base,
            name:      (o.name ?? base.name),
            subjects:  (Array.isArray(o.subjects)  && o.subjects.length  ? o.subjects  : base.subjects),
            subtopics: (Array.isArray(o.subtopics) && o.subtopics.length ? o.subtopics : base.subtopics),
            grading:   (o.grading || base.grading),
            includeInTotal: (o.includeInTotal ?? base.includeInTotal),
            __origin:  'overridden-section'
          });
        }
      });
    }
  }

  // --- 4) Return stable, name-sorted list ---
  const list = Array.from(map.values());
  list.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
  return list;
}
// Custom Y coordinates (exact order as your template for each memo)
// === Canonical subject-key normalizer (use everywhere) ===
function nkey(s) {
  return String(s || '')
    .normalize('NFKC')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

/* ---- Subtopic mode helpers ---- */
function _modeOf(subject) {
  return String(subject?.subtopicMode || subject?.subtopicsMode || subject?.mode || '')
    .trim().toLowerCase();
}
function _isModeCommon(subject) { return _modeOf(subject) === 'common' || _modeOf(subject) === ''; }
function _isModeCustom(subject) { return _modeOf(subject) === 'custom'; }
function _isModeNone(subject)   { return _modeOf(subject) === 'none'; }

/* Expand subject list into a row plan: common=1 row, custom=2 rows (header+data), none=1 row */
function _makeRowPlan(subjects) {
  const rows = [];
  (subjects || []).forEach(s => {
    // If old pre-expanded items slipped in, honor them
    if (s && s.__rowKind === 'custom-header') {
      rows.push({ kind: 'custom-header', subject: s });
      return;
    }
    if (s && s.__rowKind === 'custom-data') {
      rows.push({ kind: 'custom-data', subject: s });
      return;
    }

    // Fresh, not-expanded subjects
    if (_isModeCustom(s)) {
      rows.push({ kind: 'custom-header', subject: s });
      rows.push({ kind: 'custom-data',   subject: s });
    } else {
      rows.push({ kind: 'normal', subject: s });
    }
  });
  return rows;
}
 
// X coordinates for (max/marks/grade)
const X_SUBJECT = 520;    // Subject name column (left-aligned; adjust if needed)
const X_MAX   = 1236;
const X_MARKS = 1502;
const X_GRADE = 1802;

// Header/attendance coordinates
const HEAD_EXAM     = [1226, 831, 60]; // center, size 60
const HEAD_NAME     = [973, 992, 60];  // left, size 60, green
const HEAD_FATHER   = [973, 1107, 60]; // left, size 60, red
const HEAD_CLASS    = [500, 1216, 60]; // left, size 60, green
const HEAD_SECTION  = [900, 1216, 60];  // left, size 60, green
const HEAD_ROLL     = [1300, 1216, 60]; // left, size 60, green
const HEAD_PERCENT  = [1836, 1216, 60]; // left, size 60, green
const HEAD_RANK     = [2137, 755, 100]; // center, size 100, white with brown border
  const HEAD_CLASS_VALUE_OFFSET = 10;
const HEAD_NAME_VALUE_OFFSET  = 10;  // tweak if needed
const HEAD_ROLL_VALUE_OFFSET  = 10;  // tweak if needed

// Photo box (square) — to the right of Percentage, below the Rank badge
const HEAD_PHOTO = {
  w: 300,                 // width
  h: 360,                 // height (taller than width)
  x: HEAD_PERCENT[0] + 160,
  y: HEAD_PERCENT[1] - 230
};
// ==== SINGLE MEMO BACKGROUND + DYNAMIC SUBJECT ROWS ====
// Use one common PNG for all classes
const MEMO_PNG_FILE = "memo-for-all.png";

// Tune these to match your new PNG's grid
const SUBJECT_LAYOUT = {
  startY: 1540,   // keep
  endY:   2700,   // was 2240 → more vertical band for rows
  totalsGap: 40,
  font: 60
};
const SUBJECT_HEADER_Y = 1460; // fixed header position

function buildSubjectY(n) {
  const { startY, endY } = SUBJECT_LAYOUT;
  const maxRows = 12;

  // Accept either a number or the subjects array
  const countRaw = Array.isArray(n) ? _makeRowPlan(n).length : n;
  const count = Math.max(0, Math.min(countRaw, maxRows));
  if (count === 0) return { rowsY: [], totalY: Math.round(startY + 80) };

  // keep first-row gap unchanged
  const TOP_PAD_FROM_HEADER = 150;

  // reserve space for TOTAL/attendance so rows never touch it
  const SAFE_ABOVE_TOTAL = 110;      // cushion above TOTAL
  const firstRowY = Math.max(startY, SUBJECT_HEADER_Y + TOP_PAD_FROM_HEADER);
  const lastRowY  = endY - SAFE_ABOVE_TOTAL;

  // --- small but clear gap between rows ---
  const MIN_ROW_GAP = 45;            // ← tweak 32–42 to taste

  // even spacing in available band
  const rawGap = (count === 1) ? 0 : (lastRowY - firstRowY) / (count - 1);

  // use at least MIN_ROW_GAP but never overflow the band
  const gap = (count === 1)
    ? 0
    : Math.min(
        Math.max(rawGap, MIN_ROW_GAP),
        (lastRowY - firstRowY) / (count - 1)
      );

  const rowsY = Array.from({ length: count }, (_, i) =>
    Math.round(firstRowY + i * gap)
  );

  // place TOTAL a little below the last row, but keep it safely inside the area
  const totalY = Math.min(
    endY - 40,
    rowsY[rowsY.length - 1] + Math.max(MIN_ROW_GAP + 40, Math.round(gap * 2.2))
  );

  return { rowsY, totalY };
}

// Load the common memo PNG (dataURL) once per page
let __memoCache = null;
async function getMemo() {
  if (!__memoCache) __memoCache = await loadMemoImg(MEMO_PNG_FILE);
  return __memoCache;
}
// Read section attendance once per class/section/year per session
let __attendanceCache = null;
async function getSectionAttendance() {
  if (__attendanceCache) return __attendanceCache;
  const year = yearSel.value, classId = classSel.value, sectionId = sectionSel.value;
  if (!year || !classId || !sectionId) { __attendanceCache = { forEach: () => {} }; return __attendanceCache; }
  const snap = await db.collection('years').doc(year)
    .collection('classes').doc(classId)
    .collection('sections').doc(sectionId)
    .collection('attendance').get();
  __attendanceCache = snap;
  return __attendanceCache;
}

// Attendance table origin (dynamic months)
// Table will be drawn from this starting point:
const ATT_TABLE_START = { x: 238, y: 2758 };

// Month labels in academic order (used to decide how many columns to render)
const ATT_MONTHS_AX = [
  { key: '06', label: 'June'   },
  { key: '07', label: 'July'   },
  { key: '08', label: 'August' },
  { key: '09', label: 'Sep'    },
  { key: '10', label: 'Oct'    },
  { key: '11', label: 'Nov'    },
  { key: '12', label: 'Dec'    },
  { key: '01', label: 'Jan'    },
  { key: '02', label: 'Feb'    },
  { key: '03', label: 'March'  }
];

// Draws a centered, auto-expanding attendance table.
// It shows months up to the last one that has any data (work or pres > 0).
function drawAttendanceTable(pdf, attArr) {
  // --- Target frame (the light attendance box area on your template) ---
  // Adjust these two numbers only if your template box changes.
  const FRAME_LEFT  = PAGE_MARGINS.left;
  const FRAME_RIGHT = PAGE_MARGINS.right;

  const startY = ATT_TABLE_START.y; // you already positioned this nicely

  // 1) Decide how many months to render (up to the last month with any data)
  const lastIdx = (() => {
    let idx = -1;
    (attArr || []).forEach((m, i) => {
      const has = (Number(m?.work) || 0) > 0 || (Number(m?.pres) || 0) > 0;
      if (has) idx = i;
    });
    return Math.max(idx, 0);
  })();

  const monthsToShow = ATT_MONTHS_AX.slice(0, lastIdx + 1);
  const cols = monthsToShow.length;

  // 2) Geometry (center the whole table inside the frame)
  const frameW = FRAME_RIGHT - FRAME_LEFT;

  // keep left label column constant so the month columns flex
  const labelColW = 300;
  const availForMonths = Math.max(180, frameW - labelColW);

  // Minimum column width; if we have many months it will shrink but not below this
  const MIN_COL_W = 120;
  const colW = Math.max(MIN_COL_W, Math.floor(availForMonths / Math.max(cols, 1)));

  // total table width that we will actually draw (could be < frameW)
  const tableW = labelColW + colW * cols;

  // center horizontally inside the frame
  const startX = FRAME_LEFT + Math.round((frameW - tableW) / 2);

  // 3) Row geometry
  const rows = 3;          // Header + Working Days + Days Present
  const rowH = 75;
  const tableH = rows * rowH;

  // 4) Box + grid
  pdf.setDrawColor(15, 61, 107);
  pdf.setFillColor(250, 253, 255);
  pdf.setLineWidth(2);
  pdf.roundedRect(startX, startY, tableW, tableH, 14, 14, 'FD');

  // vertical lines
  pdf.setLineWidth(1.4);
  for (let c = 1; c <= cols; c++) {
    const x = startX + labelColW + c * colW;
    pdf.line(x, startY, x, startY + tableH);
  }
  // horizontal lines
  for (let r = 1; r < rows; r++) {
    const y = startY + r * rowH;
    pdf.line(startX, y, startX + tableW, y);
  }

  // 5) Typography (auto scale down when many months so text never collides)
  const autoSize = (base, min) => Math.max(min, Math.min(base, Math.floor((colW / 180) * base)));
  const headerSize  = autoSize(64, 38);  // month names
  const labelSize   = autoSize(60, 36);  // left labels
  const numbersSize = autoSize(60, 36);  // numbers

  const ORANGE = [255, 122, 0];
  const GREEN  = [22, 163, 74];
  const BROWN  = [139, 69, 19];

  // 6) Month headers
  pdf.setFont('helvetica', 'bold');
  pdf.setTextColor(...ORANGE);
  pdf.setFontSize(headerSize);
  monthsToShow.forEach((m, c) => {
    const cx = startX + labelColW + c * colW + colW / 2;
    const cy = startY + rowH / 2 + 10;

let __examStructure = null;           // last-resolved structure
const __examStructCache = new Map();  // key: year|class|section|exam -> structure
let __examHasSubtopics = false;       // quick flag for layout decisions

/* ===== Grading scale resolver (per-exam) =====
   Priority:
   1) Selected exam's grading.scale (mode: 'custom')
   2) Legacy fallback (matches old fixed thresholds)
*/
const LEGACY_GRADING_SCALE = [
  { grade: 'A+', min: 95, max: 100 },
  { grade: 'A',  min: 90, max: 94.9999 },
  { grade: 'B+', min: 85, max: 89.9999 },
  { grade: 'B',  min: 80, max: 84.9999 },
  { grade: 'C+', min: 70, max: 79.9999 },
  { grade: 'C',  min: 60, max: 69.9999 },
  { grade: 'D',  min: 50, max: 59.9999 },
  { grade: 'E',  min: 40, max: 49.9999 },
  { grade: 'F',  min: 0,  max: 39.9999 }
];

// sanitize + sort scale (descending by min)
function _normalizeScale(scaleArr) {
  const arr = Array.isArray(scaleArr) ? scaleArr.slice() : [];
  return arr
    .map(r => ({
      grade: String(r?.grade ?? '').trim(),
      min: Number.isFinite(+r?.min) ? +r.min : NaN,
      max: Number.isFinite(+r?.max) ? +r.max : NaN
    }))
    .filter(r => r.grade && !Number.isNaN(r.min) && !Number.isNaN(r.max))
    .sort((a, b) => b.min - a.min);
}

// Resolve scale for a given examId from loaded exams list
function getScaleForExamId(examId) {
  try {
    const ex = (Array.isArray(exams) ? exams.find(e => e.id === examId) : null);
    const s  = ex?.grading?.scale;
    const mode = ex?.grading?.mode;
    if (mode === 'custom' && Array.isArray(s) && s.length) {
      const norm = _normalizeScale(s);
      if (norm.length) return norm;
    }
  } catch {}
  return _normalizeScale(LEGACY_GRADING_SCALE);
}

// Resolve scale for the currently selected exam
function getActiveScale() {
  // If a global default is loaded, prefer it for ALL displays (legend, etc.)
  if (Array.isArray(__gradingDefaultScale) && __gradingDefaultScale.length) {
    return __gradingDefaultScale;
  }
  // Otherwise fall back to the currently selected exam’s scale (or legacy)
  const exId = (examSel?.value || '').trim();
  return getScaleForExamId(exId);
}

// Compute grade from percentage using a scale
function gradeFromPctUsingScale(pct, scale = getActiveScale()) {
  if (pct == null || !Number.isFinite(+pct)) return '';
  const p = +pct;
  const table = _normalizeScale(scale);
  for (const row of table) {
    if (p >= row.min && p <= row.max) return row.grade;
  }
  return ''; // out of range → blank
}

// Determine "fail" for visuals (rings). By default, treat grade 'F' as fail.
// If no 'F' band exists, compute the lowest passing min and fail if below it.
function isFailPct(pct, scale = getActiveScale()) {
  if (pct == null || !Number.isFinite(+pct)) return false;
  const table = _normalizeScale(scale);
  const g = gradeFromPctUsingScale(+pct, table);
  if (g && /^f(?:ail)?$/i.test(g)) return true;

  // derive pass threshold if needed
  const passing = table.filter(r => !/^f(?:ail)?$/i.test(String(r.grade)));
  if (passing.length) {
    const minPass = Math.min(...passing.map(r => r.min));
    return +pct < minPass;
  }
  // fallback to legacy < 40 as fail
  return +pct < 40;
}

/**
 * Builds the exam structure from the selected exam definition and (optionally)
 * infers subtopics/max from Firestore if not present in the exam object.
 *
 * Returns:
 * {
 *   subjects: [
 *     {
 *       name: "Mathematics",
 *       subtopics: [ { name: "Algebra", max: 10 }, { name: "Geometry", max: 15 }, ... ],
 *       subjectMax: 25
 *     },
 *     ...
 *   ],
 *   hasSubtopics: true/false
 * }
 */
async function buildExamStructure(examObj, { year, classId, sectionId } = {}) {
  // PURE VERSION: does NOT mutate __examStructure or __examHasSubtopics.
  // Returns: { subjects: [...], hasSubtopics: boolean }

  let hasSubtopics = false;
  if (!examObj) return { subjects: [], hasSubtopics: false };

  // 1) Start from explicit exam definition if available
  let subjects = [];

  // Exam-wide subtopics at root (schema shared by subjects that don't define their own)
  const examWideSubs = Array.isArray(examObj?.subtopics)
    ? examObj.subtopics.map(t => ({
        name: t?.name || '',
        max: (typeof t?.max === 'number' && !isNaN(t.max)) ? t.max : null
      }))
    : null;
  if (examWideSubs && examWideSubs.length) hasSubtopics = true;

  if (Array.isArray(examObj.subjects)) {
    subjects = examObj.subjects.map(s => {
      const name = s?.name || '';
      let subtopics = Array.isArray(s?.subtopics)
        ? s.subtopics.map(t => ({
            name: t?.name || '',
            max: (typeof t?.max === 'number' && !isNaN(t.max)) ? t.max : null
          }))
        : [];

      // subjectMax: prefer explicit; else sum known subtopic max
      let subjectMax = (typeof s?.max === 'number' && !isNaN(s.max)) ? s.max : null;
      if (subjectMax == null && subtopics.length) {
        const sum = subtopics.reduce((acc, t) => acc + (typeof t.max === 'number' ? t.max : 0), 0);
        subjectMax = (sum > 0 ? sum : null);
      }

      // If subject has no explicit subtopics but exam has an exam-wide schema, use it
      if ((!subtopics || subtopics.length === 0) && examWideSubs && examWideSubs.length) {
        subtopics = examWideSubs.map(t => ({ name: t.name, max: t.max }));
      }
      if (Array.isArray(subtopics) && subtopics.length) hasSubtopics = true;

      const subtopicMode = String(s?.subtopicMode || s?.subtopicsMode || s?.mode || '')
        .trim().toLowerCase();

      return { name, subtopics, subjectMax, subtopicMode, max: s?.max };
    });
  }

  // 2) If subjects missing / missing subtopics, try a light inference from first student's marks
  const needsInference = subjects.length === 0 || subjects.some(s => s.subtopics.length === 0);
  if (needsInference && year && classId && sectionId) {
    try {
      const secRef = db.collection('years').doc(year)
        .collection('classes').doc(classId)
        .collection('sections').doc(sectionId)
        .collection('students');

      const firstStuSnap = await secRef.orderBy('roll').limit(1).get();
      if (!firstStuSnap.empty) {
        const firstStu = firstStuSnap.docs[0];
        const marksDoc = await firstStu.ref.collection('marks').doc(examSel.value).get();
        const marksData = marksDoc.exists ? (marksDoc.data() || {}) : {};

        // build/merge subject names from marks when needed (ignore __subs / __*)
        const rootKeys = Object.keys(marksData).filter(k => !/^__subs(\b|[.\[])/i.test(k) && !/^__/.test(k));
        if (subjects.length === 0) {
          subjects = rootKeys.map(sn => ({
            name: sn,
            subtopics: (examWideSubs && examWideSubs.length)
              ? examWideSubs.map(t => ({ name: t.name, max: t.max }))
              : [],
            subjectMax: null
          }));
          if (examWideSubs && examWideSubs.length) hasSubtopics = true;
        } else {
          const existing = new Set(subjects.map(s => nkey(s.name)));
          rootKeys.forEach(sn => {
            if (!existing.has(nkey(sn))) {
              subjects.push({
                name: sn,
                subtopics: (examWideSubs && examWideSubs.length)
                  ? examWideSubs.map(t => ({ name: t.name, max: t.max }))
                  : [],
                subjectMax: null
              });
              if (examWideSubs && examWideSubs.length) hasSubtopics = true;
            }
          });
        }

        // Prefer breakdown from __subs.<Subject>, else object-at-root heuristic
        const subsRoot = (marksData && typeof marksData.__subs === 'object') ? marksData.__subs : {};
        subjects = subjects.map(s => {
          const subjName = s.name || '';
          const subjKey  = Object.keys(marksData).find(k => nkey(k) === nkey(subjName));
          const subjVal  = subjKey ? marksData[subjKey] : null;

          const subsKey  = Object.keys(subsRoot).find(k => nkey(k) === nkey(subjName));
          const subsObj  = subsKey ? subsRoot[subsKey] : null;

          if (subsObj && typeof subsObj === 'object' && !Array.isArray(subsObj)) {
            const inferred = Object.keys(subsObj).map(k => ({ name: k, max: null }));
            if (inferred.length) {
              hasSubtopics = true;
              if (s.subtopics.length === 0) s.subtopics = inferred;
              if (s.subjectMax == null) s.subjectMax = null;
            }
          } else if (subjVal && typeof subjVal === 'object' && !Array.isArray(subjVal)) {
            const entries = Object.entries(subjVal);
            const inferred = entries
              .filter(([, v]) => (typeof v === 'number' || String(v).toUpperCase() === 'AB'))
              .map(([k]) => ({ name: k, max: null }));
            if (inferred.length) {
              hasSubtopics = true;
              if (s.subtopics.length === 0) s.subtopics = inferred;
              if (s.subjectMax == null) s.subjectMax = null;
            }
          }

          // still missing? attach exam-wide schema if present
          if ((!s.subtopics || s.subtopics.length === 0) && examWideSubs && examWideSubs.length) {
            s.subtopics = examWideSubs.map(t => ({ name: t.name, max: t.max }));
            hasSubtopics = true;
          }
          return s;
        });
      }
    } catch (e) {
      console.warn('Exam structure inference skipped (pure):', e);
    }
  }

  // 3) Finalize: ensure stable arrays/fields
  const normSubjects = (subjects || []).map(s => ({
    ...s,
    name: s?.name || '',
    subtopics: Array.isArray(s?.subtopics) ? s.subtopics : [],
    max: (Number.isFinite(+s?.max) ? +s.max
        : (Number.isFinite(+s?.subjectMax) ? +s.subjectMax : null)),
    subtopicMode: String(s?.subtopicMode || s?.subtopicsMode || s?.mode || '')
      .trim().toLowerCase()
  }));

  return { subjects: normSubjects, hasSubtopics: !!hasSubtopics };
}

function buildAutoRemark(student) {
  const overallPct = Number.isFinite(+student.percentage) ? +student.percentage : null;
  const subs = Array.isArray(student.subjects) ? student.subjects : [];

  // Exclude these subjects from remarks
  const __EXCLUDE_REMARK_SUBJECTS = new Set(['spoken english','discipline']);

  const perSub = subs
    .filter(s => !__EXCLUDE_REMARK_SUBJECTS.has(nkey(s?.name)))
    .map(s => {
      const m = (s && s.marks === 'AB') ? null : (typeof s?.marks === 'number' ? s.marks : null);
      const M = (typeof s?.max === 'number' ? s.max : null);
      const p = (m != null && M != null && M > 0) ? (m / M) * 100 : null;
      return { name: String(s?.name || '').trim(), pct: p, isAB: s?.marks === 'AB', isFail: (p != null) ? isFailPct(p) : false };
    });

  // --- Early exit: absent in all subjects ---
  if (perSub.length && perSub.every(x => x.isAB)) {
    return "Absent for the entire examination; please ensure full attendance in the next assessment.";
  }

  const best95 = perSub.filter(x => x.pct != null && x.pct >= 95).map(x => x.name);
  const very90 = perSub.filter(x => x.pct != null && x.pct >= 90 && x.pct < 95).map(x => x.name);
  const good85 = perSub.filter(x => x.pct != null && x.pct >= 85 && x.pct < 90).map(x => x.name);
  const weakLT50 = perSub.filter(x => (x.pct != null && x.pct < 50) && !x.isFail).map(x => x.name);
  const weakLE60 = perSub.filter(x => (x.pct != null && x.pct <= 60) && !x.isFail).map(x => x.name);
  const failSubs = perSub.filter(x => x.isFail).map(x => x.name);
  const abSubs = perSub.filter(x => x.isAB).map(x => x.name);

  let work = 0, pres = 0;
  (student.attendance || []).forEach(m => {
    work += Number(m.work) || 0;
    pres += Number(m.pres) || 0;
  });
  const att = work > 0 ? Math.round((pres / work) * 100) : null;

  const parts = [];

  if (overallPct != null) {
    let pool;
    if (overallPct >= 95) pool = REMARK_POOLS.overall.ge95;
    else if (overallPct >= 90) pool = REMARK_POOLS.overall.ge90;
    else if (overallPct >= 85) pool = REMARK_POOLS.overall.ge85;
    else if (overallPct >= 70) pool = REMARK_POOLS.overall.ge70;
    else if (overallPct >= 60) pool = REMARK_POOLS.overall.ge60;
    else if (overallPct >= 40) pool = REMARK_POOLS.overall.ge40;
    else pool = REMARK_POOLS.overall.lt40;
    parts.push(pick(pool));
  }

  if (best95.length) {
    parts.push(pick(REMARK_POOLS.praise95).replace('{SUBJECTS}', fmtSubjects(best95, 'P')));
  } else if (very90.length) {
    parts.push(pick(REMARK_POOLS.praise90).replace('{SUBJECTS}', fmtSubjects(very90, 'P')));
  } else if (good85.length) {
    parts.push(pick(REMARK_POOLS.praise85).replace('{SUBJECTS}', fmtSubjects(good85, 'P')));
  }

  // --- Weakness/Fail line selection with “bottom-2” fallback (no AB; avoid praising & scolding same subject) ---
  const praisedSet = new Set([...best95, ...very90, ...good85].map(n => nkey(n)));
  const chooseUpToTwo = (arr) => (arr || [])
    .filter(Boolean)
    .filter(n => !praisedSet.has(nkey(n))) // don’t contradict praise
    .slice(0, 2);

  if (failSubs.length) {
    // If any fails → ONLY a fail line (max 2)
    const list = chooseUpToTwo(failSubs);
    if (list.length) {
      parts.push(pick(REMARK_POOLS.focusFail).replace('{SUBJECTS}', fmtSubjects(list, 'F')));
    }
  } else {
    // Absolute weakness first
    const w50 = chooseUpToTwo(weakLT50);
    const w60 = chooseUpToTwo(weakLE60);

    if (w50.length) {
      parts.push(pick(REMARK_POOLS.focusLT50).replace('{SUBJECTS}', fmtSubjects(w50, 'I')));
    } else if (w60.length) {
      parts.push(pick(REMARK_POOLS.focusLE60).replace('{SUBJECTS}', fmtSubjects(w60, 'I')));
    } else {
      // Relative fallback: pick bottom-2 by percentage (exclude AB & praised)
      const relativeTwo = perSub
        .filter(x => x.pct != null && !x.isAB && !praisedSet.has(nkey(x.name)))
        .sort((a, b) => a.pct - b.pct)
        .slice(0, 2)
        .map(x => x.name);
      if (relativeTwo.length) {
        // Use a gentle improvement tone
        parts.push(pick(REMARK_POOLS.focusLE60).replace('{SUBJECTS}', fmtSubjects(relativeTwo, 'I')));
      }
    }
  }

  // AB subjects (list up to two; only when there are no failing subjects)
  if (abSubs.length && !failSubs.length) {
    const abList = abSubs.slice(0, 2);
    parts.push(
      pick(REMARK_POOLS.focusAB)
        .replace('{SUBJECTS}', formatSubjectsList(abSubs.map(n => `[[AB:${n}]]`)))
    );
  }

  if (att != null) {
    let apool;
    if (att >= 95) apool = REMARK_POOLS.attendance.ge95;
    else if (att >= 90) apool = REMARK_POOLS.attendance.ge90;
    else if (att >= 75) apool = REMARK_POOLS.attendance.ge75;
    else apool = REMARK_POOLS.attendance.lt75;
    parts.push(pick(apool).replace('{ATT}', String(att)));
  }

  parts.push(pick(REMARK_POOLS.closing));

  const remark = parts.filter(Boolean).join(' ');
  return remark.length > 380 ? (remark.slice(0, 377) + '…') : remark;
}

    /* TOTAL / GRADE (custom sums only its listed subtopics) */

    {

          if (v != null) { total += v; sawNumber = true; }

        } else if (typeof subjVal === 'number') {

        } else if (Array.isArray(subtopics) && subtopics.length) {
          for (const st of subtopics) {
            const v = (st?.mark === 'AB' ? null : (Number.isFinite(+st?.mark) ? +st.mark : null));
            if (v != null) { total += v; sawNumber = true; }
          }
        }

      const pct = (typeof subjectComputedMax === 'number' && subjectComputedMax > 0 && subjectComputedMarks !== 'AB') ? (subjectComputedMarks / subjectComputedMax) * 100 : null;

        let mark;
        if (raw === 'AB' || String(raw).toUpperCase() === 'AB') {

        } else if (raw === '' || raw === null || raw === undefined) {
          mark = ''; // will render as AB later
        } else if (Number.isFinite(+raw)) {

        } else {
          mark = ''; // unknown → blank
        }

      }
    }

    // If no subtopics (or subjVal is a direct mark), support direct subject mark

    let subjectTotalMax = (typeof subjDef.subjectMax === 'number' && !isNaN(subjDef.subjectMax)) ? subjDef.subjectMax : null;

    if (subtopics.length) {
      // Sum numeric subtopic marks
      for (const st of subtopics) {
        if (isNum(st.mark)) subjectTotalMarks += st.mark;
      }
      // If subjectMax not explicit, sum known subtopic max values
      if (subjectTotalMax == null) {
        const sumMax = subtopics.reduce((acc, st) => acc + (typeof st.max === 'number' ? st.max : 0), 0);
        subjectTotalMax = (sumMax > 0 ? sumMax : null);
      }
    } else {
      // No subtopics: direct scalar mark at root.
      // Accept numeric strings (e.g., "42") as valid marks.
      const isAB = String(subjVal).toUpperCase() === 'AB';
      const asNum = Number.isFinite(+subjVal) ? +subjVal : null;
      const directMark = isAB ? 'AB' : (asNum !== null ? asNum : '');
      subjectTotalMarks = (typeof directMark === 'number') ? directMark : 0;

      if (subjectTotalMax == null && typeof subjDef.max === 'number' && !isNaN(subjDef.max)) {
        subjectTotalMax = subjDef.max;
      }

      // Only add a placeholder cell for non-'none' modes; 'none' must render '-' cells
      if (!subtopics.length && subjMode !== 'none') {
        subtopics.push({ name: '-', max: subjectTotalMax, mark: (directMark === 'AB' ? 'AB' : (typeof directMark === 'number' ? directMark : '')) });

    // Grade computation + SUBJECT TOTAL handling for subtopicMode === 'none'
    let grade = '';

        subjectTotalMarks = 0; // keep numeric for overall %
      } else if (Number.isFinite(+recHit.total)) {

      }
      if (subjectTotalMax == null && Number.isFinite(+recHit.max)) {

    // Aggregate to overall
    if (isNum(subjectTotalMarks)) totalMarksAll += subjectTotalMarks;
    if (isNum(subjectTotalMax)) totalMaxAll += subjectTotalMax;

    // Keep backward-compatible fields (max/marks)
    stuSubjects.push({
      name: subjName,
      max: subjectTotalMax ?? '',
      marks: displayMarks,
      grade,
      subtopics,
      subtopicMode: subjMode // <- keep this

  // --- build ordered subjects for front page ---

  (stuSubjects || []).forEach(s => {

  const subjectsOrdered = [...commonList, ...customList, ...noneList];

  // 4) Attendance (cached)

    photoPath: stu.photoPath || '',
    attendance: attArr
  };
}

      if (fixedMax != null) {
        // subject exists in schema → look for student's values
        const subsRoot = (mobj && typeof mobj.__subs === 'object') ? mobj.__subs : null;
        const subsKey = subsRoot ? Object.keys(subsRoot).find(k => nkey(k) === keyName) : null;
        const subjKey = Object.keys(mobj).find(k => !/^__/.test(k) && nkey(k) === keyName);

        if (subsKey && typeof subsRoot[subsKey] === 'object') {
          // sum numeric parts; if none, AB
          let sum = 0, sawNum = false;
          for (const v of Object.values(subsRoot[subsKey])) {
            if (typeof v === 'number' && !isNaN(v)) { sum += v; sawNum = true; }
          }
          marksVal = sawNum ? sum : 'AB';
        } else if (subjKey !== undefined) {
          const v = mobj[subjKey];
          if (typeof v === 'number' && !isNaN(v)) marksVal = v; // allows 0
          else if (String(v).toUpperCase() === 'AB') marksVal = 'AB';
          else if (v && typeof v === 'object') {
            let sum = 0, saw = false;
            for (const x of Object.values(v)) {
              if (typeof x === 'number' && !isNaN(x)) { sum += x; saw = true; }
            }
            marksVal = saw ? sum : 'AB';
          } else {
            marksVal = 'AB'; // subject present in schema but student's value blank
          }
        } else {
          marksVal = 'AB'; // in schema, but no entry at all for student → AB
        }
      }

      // grade only when both numbers are known
      let gradeTxt = '-';
      if (typeof marksVal === 'number' && typeof fixedMax === 'number' && fixedMax > 0) {
        const pct = (marksVal / fixedMax) * 100;
        gradeTxt = gradeFromPctUsingScale(pct, getScaleForExamId(exId));
      }

      row.exams[exId] = { marks: marksVal, max: fixedMax, grade: gradeTxt };
    }
    return row;
  });

  // 4) Header max (for “(NN MARKS)” line) per exam
  const headerMaxByExam = new Map();
  for (const exId of needExamIds) {
    headerMaxByExam.set(exId, schemaByExam.get(exId)?.headerMax ?? null);
  }

  return { subjectList, rows, headerMaxByExam };
}

// PDF generation (multi or single)

    student.overallGrade = student.overallGrade || (totalMax > 0 ? gradeFromPctUsingScale((totalMarks / totalMax) * 100, getActiveScale()) : '' );

}

<script>
/* === Custom dropdown creator (same behavior as bank.html) === */
(function(){
  function buildCustomFromSelect(sel){
    // hide native select but keep it for change listeners & form submit
    sel.classList.add('native-select-hidden');

    // container
    const wrap = document.createElement('div');
    wrap.className = 'custom-dropdown';

    // visible label
    const selected = document.createElement('div');
    selected.className = 'selected-option';

    // options popup
    const popup = document.createElement('div');
    popup.className = 'dropdown-options';

    // fill from native options
    const opts = Array.from(sel.options);
    const curr = sel.selectedIndex >= 0 ? opts[sel.selectedIndex] : opts[0];
    selected.textContent = curr ? (curr.textContent || curr.value) : 'Select';

    opts.forEach(o=>{
      const item = document.createElement('div');
      item.setAttribute('data-value', o.value);
      item.textContent = o.textContent || o.value;
      if (o.disabled) item.style.opacity = '0.5';
      popup.appendChild(item);
    });

    // interactions (same pattern as bank.html)
    selected.addEventListener('click', function(e){
      e.stopPropagation();
      closeAll();
      wrap.classList.toggle('open');
    });

    popup.addEventListener('click', function(e){
      const t = e.target.closest('div[data-value]');
      if(!t) return;
      const val = t.getAttribute('data-value');

      // sync back to native select
      sel.value = val;
      sel.dispatchEvent(new Event('change', { bubbles:true }));

      // update visible label
      selected.textContent = t.textContent;
      wrap.classList.remove('open');
    });

    wrap.appendChild(selected);
    wrap.appendChild(popup);

    // place *after* the native select
    sel.insertAdjacentElement('afterend', wrap);
  }

  function closeAll(){
    document.querySelectorAll('.custom-dropdown.open').forEach(d=>d.classList.remove('open'));
  }

  document.addEventListener('click', closeAll);

  // Convert all selects that opt in
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('select[data-custom="dropdown"]').forEach(buildCustomFromSelect);
  });
})();
</script>
