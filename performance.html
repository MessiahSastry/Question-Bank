*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Segoe UI',Arial,sans-serif}button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}button,select{min-height:42px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #90bce8;outline-offset:2px}
.shell{max-width:1280px;margin:24px auto;padding:0 16px}.header{background:var(--navy);color:white;border-radius:14px;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}.subtitle{margin-top:5px;opacity:.9}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;background:white;color:var(--navy);padding:9px 13px;font-weight:600}.primary{background:var(--navy);color:white;border-color:var(--navy)}.header .btn{background:white;color:var(--navy)}

#status{margin:12px 2px;white-space:pre-line}#status.error{color:var(--red)}#status.warning{color:#8a5511}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:18px}.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:11px 13px;white-space:nowrap;font-weight:600}.tabs button[aria-selected=true]{border-bottom-color:var(--blue);color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:15px;text-align:left;color:var(--text)}.stat strong{display:block;font-size:27px;margin:3px 0}.stat span{font-size:12px;color:var(--muted)}.stat.bad strong{color:var(--red)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart{width:100%;min-width:0}.chart svg{display:block;width:100%;height:auto}.scroll{overflow-x:auto;max-width:100%}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-weight:600;background:var(--bg);color:var(--muted)}tbody tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.low{color:var(--red)}.up{color:var(--green)}.score{display:block;border-radius:5px;background:#fff6e8;padding:6px 8px;white-space:nowrap;text-align:center}.score.low{background:#fcebec}.score.high{background:#e9f5ee}.score.missing{background:#edf1f5;color:var(--muted)}.score small{display:block;font-size:11px}.name-button{background:transparent;border:0;padding:0;color:var(--blue);text-decoration:underline;min-height:30px;text-align:left}.notice{background:#edf4fc;border-radius:7px;padding:11px;margin-top:12px}.report-header{border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:16px}.report-header h2{color:var(--navy)}.empty{padding:25px;color:var(--muted);text-align:center}#view{min-height:100px}.badge{display:inline-block;border-radius:5px;background:#edf4fc;padding:3px 8px;font-size:12px}.offscreen{position:absolute;left:-99999px;top:0}
@media(max-width:800px){.filters,.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{margin:12px auto;padding:0 10px}.header,.panel{padding:15px}.tabs button{padding:10px}.header h1{font-size:21px}}

<body>
<main class="shell">
 <header class="header"><div><h1>St. Patrick's School</h1><div>Academic Performance Analysis</div><div id="classSec" class="subtitle"></div></div><div class="actions"><button id="refreshBtn" class="btn" type="button">Refresh data</button><button id="pdfBtn" class="btn" type="button" disabled>Download PDF</button></div></header>
 <section class="panel no-print" aria-label="Report selections">
  <div class="filters"><fieldset><legend>Select examinations</legend><div id="examChoices" class="choices">Loading examinations...</div><div id="examOrder" class="order"></div><p class="small">Order matters: first = earlier exam, last = latest exam. Use the arrows to change it.</p></fieldset><fieldset><legend>Select subjects</legend><div class="row" style="margin-bottom:9px"><button id="allSubjectsBtn" class="btn" type="button">Select all subjects</button></div><div id="subjectChoices" class="choices"></div></fieldset></div>
  <div class="row settings"><label>Graph averages <select id="basis"><option value="matched">Same students across selected exams</option><option value="all">All recorded marks in each exam</option></select></label><label>Report for <select id="audience"><option>Academic Incharge</option><option>Subject Teacher</option></select></label><span id="selectionSummary" class="small"></span></div>
 </section>

<script>
(() => {
'use strict';
const CONFIG={apiKey:'AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE',authDomain:'stpatricks-questionbank.firebaseapp.com',projectId:'stpatricks-questionbank',storageBucket:'stpatricks-questionbank.appspot.com',messagingSenderId:'917615322861',appId:'1:917615322861:web:c6c890aa2184dd395b8ee4'};
const CLASS_GROUP_MAP={'Nursery':'nursery-lkg-ukg','LKG':'nursery-lkg-ukg','UKG':'nursery-lkg-ukg','1st Class':'class-1-2','2nd Class':'class-1-2','3rd Class':'class-3-5','4th Class':'class-3-5','5th Class':'class-3-5','6th Class':'class-6-9','7th Class':'class-6-9','8th Class':'class-6-9','9th Class':'class-6-9','10th Class':'class-10'};
const PASS=40,ABSENT_CODES=new Set(['AB','ABS','ABSENT']);
const PALETTE=['#1762a7','#168271','#7959a4','#bb7420','#b44670','#348297','#727342','#7d5b47'];
const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=value=>value===null||!Number.isFinite(value)?'—':Number(value.toFixed(1)).toString();
const mean=values=>values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null;
const nameOf=student=>String(student.name||student.studentName||student.fullName||('Student '+(student.roll??student.id)));
const context={year:localStorage.getItem('sp_selectedYear')||'',classId:localStorage.getItem('sp_selectedClassId')||'',className:localStorage.getItem('sp_selectedClassName')||'',sectionId:localStorage.getItem('sp_selectedSectionId')||'',sectionName:localStorage.getItem('sp_selectedSectionName')||''};
const state={students:[],exams:[],examIds:[],subjects:[],selectedSubjects:[],allSubjects:true,own:'',tab:'own',filter:'all',studentId:null,basis:'matched',cache:new Map(),pending:new Map(),generation:0,ready:false,exporting:false,initialising:false};
let db,studentRef;
function status(message,kind=''){$('status').textContent=message;$('status').className=kind;}
function setBusy(busy){state.ready=!busy;$('pdfBtn').disabled=busy||state.exporting||!state.selectedSubjects.length;}
function limiter(limit){let active=0;const queue=[];function next(){if(active>=limit||!queue.length)return;active++;const item=queue.shift();Promise.resolve().then(item.work).then(item.resolve,item.reject).finally(()=>{active--;next();});next();}return work=>new Promise((resolve,reject)=>{queue.push({work,resolve,reject});next();});}
const limitRead=limiter(8);
function examSubjects(exam){return Array.isArray(exam.subjects)?exam.subjects.filter(s=>s&&typeof s.name==='string'&&s.name.trim()):[];}
function subjectConfig(exam,subject){const items=examSubjects(exam).filter(s=>s.name===subject);return items.length===1?items[0]:null;}
function normalise(raw,max){
 if(raw===undefined||raw===null||(typeof raw==='string'&&(!raw.trim()||/^(pending|not entered|unentered)$/i.test(raw.trim()))))return{kind:'pending',label:'Pending'};
 if(typeof raw==='string'&&ABSENT_CODES.has(raw.trim().toUpperCase()))return{kind:'absent',label:'AB'};
 if(!Number.isFinite(max)||max<=0)return{kind:'config',label:'Max not set'};
 const mark=typeof raw==='number'?raw:typeof raw==='string'&&/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(raw.trim())?Number(raw):NaN;
 if(!Number.isFinite(mark)||mark<0||mark>max)return{kind:'invalid',label:'Invalid mark'};
 return{kind:'score',mark,max,percent:mark/max*100,label:fmt(mark)+'/'+fmt(max)};
}
function record(snapshot,exam,student,subject){
 const offered=examSubjects(exam).some(s=>s.name===subject);if(!offered)return{kind:'na',label:'Not offered'};
 const source=snapshot.records.get(exam.id)?.get(student.id);if(source?.error)return{kind:'unavailable',label:'Unavailable'};
 const config=subjectConfig(exam,subject);return normalise(source?.data?.[subject],config&&config.max!==''&&config.max!==null?Number(config.max):NaN);
}
function stats(snapshot,exam,subject){const records=snapshot.students.map(student=>record(snapshot,exam,student,subject)),valid=records.filter(r=>r.kind==='score');return{records,valid,n:valid.length,average:mean(valid.map(r=>r.percent)),passed:valid.filter(r=>r.percent>=PASS).length,below:valid.filter(r=>r.percent<PASS).length,absent:records.filter(r=>r.kind==='absent').length,pending:records.filter(r=>r.kind==='pending').length,invalid:records.filter(r=>r.kind==='invalid'||r.kind==='config').length,unavailable:records.filter(r=>r.kind==='unavailable').length};}
function series(snapshot,subject,student=null){
 const offered=snapshot.exams.filter(exam=>examSubjects(exam).some(s=>s.name===subject));
 const people=student?[student]:snapshot.students;
 const matched=people.filter(person=>offered.every(exam=>record(snapshot,exam,person,subject).kind==='score'));
 const values=snapshot.exams.map(exam=>{if(!offered.includes(exam))return{value:null,n:0};const group=student?people:snapshot.basis==='matched'?matched:people;const valid=group.map(person=>record(snapshot,exam,person,subject)).filter(r=>r.kind==='score');return{value:mean(valid.map(r=>r.percent)),n:valid.length};});
 return{subject,values,partial:offered.length!==snapshot.exams.length};
}
function movement(snapshot,subject){
 const first=snapshot.exams[0],last=snapshot.exams.at(-1);let n=0,up=0,down=0,same=0,newPass=0,newBelow=0;
 if(snapshot.exams.length<2)return{n,up,down,same,newPass,newBelow};
 snapshot.students.forEach(student=>{const a=record(snapshot,first,student,subject),b=record(snapshot,last,student,subject);if(a.kind!=='score'||b.kind!=='score')return;n++;const delta=b.percent-a.percent;if(delta>1e-8)up++;else if(delta<-1e-8)down++;else same++;if(a.percent<PASS&&b.percent>=PASS)newPass++;if(a.percent>=PASS&&b.percent<PASS)newBelow++;});return{n,up,down,same,newPass,newBelow};
}
function snapshot(){return{students:state.students.slice(),exams:state.examIds.map(id=>state.exams.find(exam=>exam.id===id)).filter(Boolean),subjects:state.selectedSubjects.slice(),records:new Map(state.examIds.map(id=>[id,state.cache.get(id)||new Map()])),basis:state.basis,audience:$('audience').value,generated:new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'}),context:{...context}};}
function colour(exam){const index=state.exams.findIndex(item=>item.id===exam.id);return PALETTE[(index<0?0:index)%PALETTE.length];}
function table(headers,rows,cls=''){return`<div class="scroll"><table class="${cls}"><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}" class="empty">No results in this selection.</td></tr>`}</tbody></table></div>`;}
function plainTable(headers,rows){return table(headers,rows.map(row=>row.map(esc)));}
function basisNote(s){return s.basis==='matched'?'Each subject uses the same students across selected exams that offer it. Subjects not offered show N/A.':'Each exam uses its own recorded marks. Assessed-student counts can differ between exams.';}
function metadata(s){return`${s.context.className} - ${s.context.sectionName} | ${s.context.year} | Exams, in order: ${s.exams.map(e=>e.name).join(' → ')} | Subjects: ${s.subjects.join(', ')} | Pass mark: ${PASS}% | ${s.generated}`;}
function reportHeader(s){return`<div class="report-header"><h2>St. Patrick's School</h2><strong>${esc(s.audience)} - Academic Analysis</strong><p class="small">${esc(metadata(s))}</p><p class="small">${esc(basisNote(s))}</p></div>`;}
function latestRows(s,subjects=s.subjects){const latest=s.exams.at(-1);return subjects.map(subject=>{if(!examSubjects(latest).some(item=>item.name===subject))return[subject,'Not offered','N/A','N/A','N/A','N/A','N/A','N/A','N/A'];const a=stats(s,latest,subject);return[subject,a.average===null?'—':fmt(a.average)+'%',a.n?`${a.passed} of ${a.n} (${fmt(a.passed/a.n*100)}%)`:'—',a.below,a.absent,a.pending,a.invalid,a.unavailable];});}
function averageRows(s,subjects=s.subjects){return subjects.map(subject=>{const values=series(s,subject).values,first=values[0].value,last=values.at(-1).value;return[subject,...values.map(v=>v.value===null?'N/A':`${fmt(v.value)}% (${v.n} assessed)`),s.exams.length<2||first===null||last===null?'—':signed(last-first)+' points'];});}
function signed(value){return(value>1e-8?'+':'')+fmt(Math.abs(value)<1e-8?0:value);}
function movementRows(s){return s.subjects.map(subject=>{const m=movement(s,subject);return[subject,m.n,m.up,m.down,m.same,m.newPass,m.newBelow];});}
function scoreCell(s,student,subject,withRaw=true){const last=s.exams.at(-1),r=record(s,last,student,subject);if(r.kind!=='score')return`<span class="score missing">${esc(r.label)}</span>`;const first=record(s,s.exams[0],student,subject),delta=s.exams.length>1&&first.kind==='score'?`<small>${esc(signed(r.percent-first.percent))} points</small>`:'';return`<span class="score ${r.percent<PASS?'low':r.percent>=80?'high':''}">${withRaw?esc(r.label)+' · ':''}${fmt(r.percent)}%${r.percent<PASS?' ↓':''}${delta}</span>`;}
function studentTable(s,subjects=s.subjects,clickable=true){return table(['Roll','Student',...subjects,'Subjects below pass'],s.students.map(student=>[esc(student.roll??''),clickable?`<button class="name-button" type="button" data-student-id="${esc(student.id)}">${esc(nameOf(student))}</button>`:esc(nameOf(student)),...subjects.map(subject=>scoreCell(s,student,subject)),String(s.subjects.filter(subject=>{const r=record(s,s.exams.at(-1),student,subject);return r.kind==='score'&&r.percent<PASS;}).length)]));}
function attentionRows(s){const first=s.exams[0],last=s.exams.at(-1);return s.students.map(student=>{const low=[],declined=[],incomplete=[];s.subjects.forEach(subject=>{const b=record(s,last,student,subject),a=record(s,first,student,subject);if(b.kind==='score'&&b.percent<PASS)low.push(subject);if(s.exams.length>1&&a.kind==='score'&&b.kind==='score'&&b.percent<a.percent-1e-8)declined.push(subject);if(b.kind!=='score'&&b.kind!=='na')incomplete.push(subject+' ('+b.label+')');});return{name:nameOf(student),roll:student.roll??'',low,declined,incomplete};}).filter(row=>row.low.length||row.declined.length||row.incomplete.length).map(row=>[row.roll,row.name,row.low.join(', ')||'None',row.declined.join(', ')||'None',row.incomplete.join(', ')||'None']);}
function short(value,max){value=String(value);return value.length>max?value.slice(0,Math.max(1,max-1))+'…':value;}
function svg(width,height,content,title){return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><rect width="${width}" height="${height}" fill="white"/>${content}</svg>`;}
function text(x,y,value,attrs=''){return`<text x="${x}" y="${y}" font-family="Arial,sans-serif" font-size="12" fill="#20364e" ${attrs}>${esc(value)}</text>`;}
function barSVG(s,subjects=s.subjects,width=900,exams=s.exams){
 const left=Math.min(170,Math.max(85,width*.18)),right=55,top=18,group=29+exams.length*21,height=top+subjects.length*group+43,plot=width-left-right;let out='';
 for(const tick of[0,25,50,75,100]){const x=left+plot*tick/100;out+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${height-35}" stroke="#d9e4ef"/>`+text(x,height-18,tick,'text-anchor="middle"');}
 subjects.forEach((subject,index)=>{const y=top+index*group,values=series(s,subject).values;out+=text(8,y+12,short(subject,Math.floor((width-20)/7)),'font-weight="bold"');exams.forEach((exam,j)=>{const value=values[s.exams.findIndex(e=>e.id===exam.id)],by=y+22+j*21;out+=text(8,by+10,short(exam.name,Math.floor((left-15)/7)));if(value.value===null)out+=text(left+5,by+10,'N/A');else out+=`<rect x="${left}" y="${by}" width="${plot*value.value/100}" height="13" rx="2" fill="${colour(exam)}"><title>${esc(subject+' | '+exam.name+': '+fmt(value.value)+'%; '+value.n+' assessed')}</title></rect>`+text(left+plot*value.value/100+5,by+11,fmt(value.value)+'%');});});
 out+=text(left+plot/2,height-1,'Average marks (%)','text-anchor="middle"');return svg(width,height,out,'Average percentage by subject and examination');
}
function lineSVG(s,subjects=s.subjects,width=900,student=null){
 const height=320,left=47,right=28,top=40,bottom=270,plot=width-left-right;let out='';
 if(s.exams.length<2)return svg(width,90,text(12,40,'Select at least two examinations to show progress.'),'Select two examinations');
 const x=i=>left+plot*i/(s.exams.length-1),y=value=>bottom-(bottom-top)*value/100;
 for(const tick of[0,25,50,75,100])out+=`<line x1="${left}" y1="${y(tick)}" x2="${width-right}" y2="${y(tick)}" stroke="#d9e4ef"/>`+text(left-8,y(tick)+4,tick,'text-anchor="end"');
 const tickStep=Math.max(1,Math.ceil(s.exams.length/5));s.exams.forEach((exam,i)=>{if(i%tickStep===0||i===s.exams.length-1)out+=text(x(i),bottom+20,short(exam.name,Math.max(5,Math.floor(plot/Math.min(s.exams.length,5)/7))),`text-anchor="${i===0?'start':i===s.exams.length-1?'end':'middle'}"`);});
 subjects.forEach((subject,index)=>{const values=series(s,subject,student).values,color=PALETTE[index%PALETTE.length];let path='';values.forEach((value,i)=>{if(value.value===null){path='';return;}if(i&&values[i-1].value!==null)out+=`<line x1="${x(i-1)}" y1="${y(values[i-1].value)}" x2="${x(i)}" y2="${y(value.value)}" stroke="${color}" stroke-width="2.5"/>`;out+=`<circle cx="${x(i)}" cy="${y(value.value)}" r="3.5" fill="${color}"><title>${esc(subject+' | '+s.exams[i].name+': '+fmt(value.value)+'% ('+value.n+' assessed)')}</title></circle>`;});});
 out+=text(left+plot/2,height-4,'Examination','text-anchor="middle"');out+=text(12,25,'Average (%)');return svg(width,height,out,'Progress across selected examinations');

  const pages=doc.getNumberOfPages();for(let page=1;page<=pages;page++){doc.setPage(page);doc.setDrawColor(217,228,239);doc.line(margin,pageH-10,pageW-margin,pageH-10);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(90);doc.text(pdfText(s.context.className+' - '+s.context.sectionName+' | '+s.context.year),margin,pageH-6);doc.text(page+' / '+pages,pageW-margin,pageH-6,{align:'right'});}doc.save(filename(s,'pdf'));status('PDF report downloaded.');
 }catch(error){status('PDF export failed: '+error.message+' You can use Print / Save PDF from Report preview.','error');}finally{state.exporting=false;$('pdfBtn').disabled=!state.ready;}
}
function printReport(s=snapshot()){
 const win=window.open('','_blank');if(!win){status('Allow the report window to open, then select Print / Save PDF.','error');return;}
 let body=`<div class="panel">${reportHeader(s)}<h2>1. Subject comparison</h2></div>`;
 for(const subjects of chunks(s.subjects,4))for(const exams of chunks(s.exams,4))body+=`<div class="panel"><div class="chart">${barSVG(s,subjects,1200,exams)}</div></div>`;
 body+=`<div class="panel">${plainTable(['Subject','Average','Students passed','Below pass','Absent','Pending','Invalid / max issue','Unavailable'],latestRows(s))}</div><div class="panel print-break">${reportHeader(s)}<h2>2. Exam comparison</h2></div>`;
 for(const subjects of chunks(s.subjects,3))body+=`<div class="panel">${lineLegend(subjects)}<div class="chart">${lineSVG(s,subjects,1200)}</div></div>`;
 for(const exams of chunks(s.exams,4)){const indices=exams.map(exam=>s.exams.findIndex(e=>e.id===exam.id));body+=`<div class="panel">${plainTable(['Subject',...exams.map(e=>e.name)],s.subjects.map(subject=>{const values=series(s,subject).values;return[subject,...indices.map(i=>values[i].value===null?'N/A':fmt(values[i].value)+'% ('+values[i].n+' assessed)')];}))}</div>`;}
 if(s.exams.length>1)body+=`<div class="panel"><p class="small">Student movement compares ${esc(s.exams[0].name)} with ${esc(s.exams.at(-1).name)} using valid marks in both.</p>${plainTable(['Subject','Compared','Improved','Declined','Unchanged','Newly passed','Newly below pass'],movementRows(s))}</div>`;
 for(const subjects of chunks(s.subjects,4))body+=`<div class="panel print-break">${reportHeader(s)}<h2>3. Student comparison - ${esc(s.exams.at(-1).name)}</h2><p class="small">Changes from ${esc(s.exams[0].name)}; below-pass count covers all selected subjects.</p>${studentTable(s,subjects,false)}</div>`;
 body+=`<div class="panel print-break">${reportHeader(s)}<h2>Students requiring attention</h2>${plainTable(['Roll','Student','Below pass in','Declined in','Incomplete / issues'],attentionRows(s))}</div>`;
 win.document.open();win.document.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Academic Analysis Report</title><style>'+document.querySelector('style').textContent+'</style></head><body><div class="shell"><div class="panel no-print"><button class="btn primary" onclick="window.print()">Print / Save PDF</button><span class="small"> Select Save as PDF as the destination; use A4 landscape.</span></div>'+body+'</div></body></html>');win.document.close();
}
document.addEventListener('change',event=>{if(state.initialising)return;const target=event.target;if(target.dataset.examIndex!==undefined){if(state.exporting){renderChoices();return;}const exam=state.exams[Number(target.dataset.examIndex)];if(!target.checked&&state.examIds.length===1){target.checked=true;status('Keep at least one examination selected.','warning');return;}state.examIds=target.checked?[...state.examIds,exam.id]:state.examIds.filter(id=>id!==exam.id);updateSubjects();analyse();}else if(target.dataset.subjectIndex!==undefined){const subject=state.subjects[Number(target.dataset.subjectIndex)];if(!target.checked&&state.selectedSubjects.length===1){target.checked=true;status('Keep at least one subject selected.','warning');return;}state.allSubjects=false;state.selectedSubjects=target.checked?[...state.selectedSubjects,subject]:state.selectedSubjects.filter(name=>name!==subject);if(!state.selectedSubjects.includes(state.own))state.own=state.selectedSubjects[0];renderChoices();renderView();}else if(target.id==='basis'){state.basis=target.value;renderView();}else if(target.id==='audience')renderView();else if(target.id==='ownSubject'){state.own=target.value;state.filter='all';renderView();}else if(target.id==='ownFilter'){state.filter=target.value;renderView();}});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.tab){state.tab=button.dataset.tab;renderView();}else if(button.dataset.move!==undefined&&!state.exporting){const index=Number(button.dataset.move),next=index+Number(button.dataset.direction);if(next>=0&&next<state.examIds.length){[state.examIds[index],state.examIds[next]]=[state.examIds[next],state.examIds[index]];renderChoices();renderView();}}else if(button.dataset.ownFilter){state.filter=button.dataset.ownFilter;renderView();}else if(button.dataset.studentId){state.studentId=button.dataset.studentId;state.tab='students';renderView();$('studentDetail')?.scrollIntoView({behavior:'smooth',block:'nearest'});}else if(button.dataset.action==='pdf')exportPDF();else if(button.dataset.action==='print')printReport();else if(button.dataset.action==='png')exportPNG();});
$('allSubjectsBtn').addEventListener('click',()=>{state.allSubjects=true;state.selectedSubjects=state.subjects.slice();if(!state.own)state.own=state.selectedSubjects[0];renderChoices();renderView();});$('pdfBtn').addEventListener('click',exportPDF);$('refreshBtn').addEventListener('click',()=>{if(!state.exporting)initialise();});
let previousWidth=0;if(window.ResizeObserver)new ResizeObserver(entries=>{const current=Math.round(entries[0].contentRect.width);if(current!==previousWidth){previousWidth=current;drawCharts();}}).observe($('view'));
window.addEventListener('load',initialise,{once:true});
})();
</script>
