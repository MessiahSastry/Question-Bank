function verticalSVG(s,subjects=s.subjects,width=1000,exams=s.exams){

 const longest=Math.max(1,...subjects.map(subject=>wrapChars(subject,Math.max(7,Math.floor(group/7))).length)),height=bottom+80+longest*17;let out='';
 out+=svgText(7,22,'Average marks (%)','',14);
 for(const tick of[0,25,50,75,100]){const y=bottom-(bottom-top)*tick/100;out+='<line x1="'+left+'" y1="'+y+'" x2="'+(width-right)+'" y2="'+y+'" stroke="#d9e4ef"/>'+svgText(left-10,y+5,tick,'text-anchor="end"');}
 subjects.forEach((subject,i)=>{
  const values=series(s,subject).values,cx=left+group*(i+.5),pitch=barWidth+8;
  exams.forEach((exam,j)=>{
   const sourceIndex=s.exams.findIndex(item=>item.id===exam.id),value=values[sourceIndex],x=cx+(j-(exams.length-1)/2)*pitch-barWidth/2,a=stats(s,exam,subject);
   const code=examCode(exam,sourceIndex);
   if(value.value===null)out+=svgText(x+barWidth/2,bottom-14,'N/A','text-anchor="middle"',12);
   else{
    const barHeight=(bottom-top)*value.value/100,y=bottom-barHeight;
    out+='<rect data-subject="'+esc(subject)+'" data-exam="'+esc(exam.id)+'" x="'+x+'" y="'+y+'" width="'+barWidth+'" height="'+barHeight+'" rx="4" fill="'+shade(subject,sourceIndex,s.exams.length)+'"><title>'+esc(subject+' | '+exam.name+' | '+metricName(s)+': '+fmt(value.value)+'%; '+value.n+' in average. Present '+a.n+', absent '+a.absent+', failed '+a.below)+'</title></rect>';
    out+=svgText(x+barWidth/2,y-25,fmt(value.value)+'%','text-anchor="middle" font-weight="600"',14);
    out+=svgText(x+barWidth/2,y-9,'P'+a.n+' A'+a.absent+' F'+a.below,'text-anchor="middle"',10);
    if(exams.length===1&&barWidth>=32&&barHeight>subject.length*7+20)out+='<text transform="translate('+(x+barWidth/2)+' '+(y+barHeight/2)+') rotate(-90)" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="'+barLabelColour(subject)+'">'+esc(subject)+'</text>';

  });

 });

async function getEffectiveExamSnapshot() {
  const yearRef = db.collection('years').doc(context.year);
  const classRef = yearRef.collection('classes').doc(context.classId);

  const [groupSnap, classSnap, sectionSnap] = await Promise.all([
    yearRef.collection('exams').doc('classGroups')
      .collection(CLASS_GROUP_MAP[context.className] || 'default').get(),

    classRef.collection('examOverrides').get(),

    classRef.collection('sections').doc(context.sectionId)
      .collection('examOverrides').get()
  ]);

  const exams = new Map();

  groupSnap.forEach(doc => {
    exams.set(doc.id, doc.data() || {});
  });

  function applyOverrides(snap, onlyOrigin) {
    snap.forEach(doc => {
      const override = doc.data() || {};
      const base = exams.get(doc.id);

      if (override.origin === onlyOrigin) {
        exams.set(doc.id, override);
      } else if (override.hidden === true) {
        exams.delete(doc.id);
      } else if (!base) {
        exams.set(doc.id, override);
      } else {
        exams.set(doc.id, {
          ...base,
          name: override.name ?? base.name,

          subjects:
            Array.isArray(override.subjects) && override.subjects.length
              ? override.subjects
              : base.subjects,

          subtopics:
            Array.isArray(override.subtopics) && override.subtopics.length
              ? override.subtopics
              : base.subtopics,

          grading: override.grading || base.grading
        });
      }
    });
  }

  applyOverrides(classSnap, 'class-only');
  applyOverrides(sectionSnap, 'section-only');

  return {
    forEach(callback) {
      exams.forEach((data, id) => {
        callback({ id, data: () => data });
      });
    }
  };
}

  if(typeof doc.autoTable!=='function')throw new Error('The PDF table library did not load.');
  const pageW=297,pageH=210,margin=12,usable=273,contentTop=43;let y=contentTop;
  function header(){
   doc.setFillColor(15,61,107);doc.rect(0,0,pageW,22,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text("St. Patrick's School",margin,10);
   doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(pdfText(original.audience)+' - Academic Analysis',margin,17);
   doc.setTextColor(60);doc.setFontSize(9);doc.text(pdfText(original.context.className+' - '+original.context.sectionName+' | '+original.context.year),margin,29);
   doc.setFontSize(8);doc.text(pdfText('Generated: '+original.generated+' | Students: '+original.students.length+' | Pass mark: '+PASS+'%'),margin,35);y=contentTop;
  }
  function newPage(){doc.addPage();header();}
  function heading(value){if(y>150)newPage();doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(15,61,107);doc.text(pdfText(value),margin,y+5);y+=11;}
  function note(value){
   doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(75);
   const lines=doc.splitTextToSize(pdfText(value),usable);if(y+lines.length*3.5+5>193)newPage();
   doc.text(lines,margin,y+3);y+=lines.length*3.5+5;
  }
  function pdfTable(headers,rows){
   if(y>172)newPage();
   doc.autoTable({head:[headers.map(pdfText)],body:(rows.length?rows:[headers.map((_,index)=>index===0?'No results in this selection.':'')]).map(row=>row.map(pdfText)),startY:y,margin:{top:contentTop,bottom:15,left:margin,right:margin},
    styles:{font:'helvetica',fontSize:8,cellPadding:2.1,overflow:'linebreak',textColor:[32,54,78],lineColor:[217,228,239],lineWidth:.1},
    headStyles:{fillColor:[15,61,107],textColor:255},alternateRowStyles:{fillColor:[246,249,252]},rowPageBreak:'avoid',
    willDrawPage(data){if(data.pageNumber>1)header();}
   });y=doc.lastAutoTable.finalY+7;
  }
  async function chart(source){
   const image=await svgPNG(source,1.6);let height=usable*image.height/image.width;
   if(y+height>193)newPage();
   const available=193-y,heightUsed=Math.min(height,available),widthUsed=heightUsed*image.width/image.height;
   doc.addImage(image.data,'PNG',margin+(usable-widthUsed)/2,y,widthUsed,heightUsed,undefined,'FAST');y+=heightUsed+6;
  }
  header();
  for(const[section,metric]of['total','written'].entries()){
   const s=asMetric(original,metric);if(section>0)newPage();heading((section+1)+'. '+metricName(s)+' - subject comparison');note(basisNote(s));
   let first=true;
   for(const subjects of balancedChunks(s.subjects,6))for(const exams of chunks(s.exams,3)){
    if(!first){newPage();heading(metricName(s)+' - subject comparison, continued');}first=false;
    note(exams.map(exam=>examCode(exam,s.exams.indexOf(exam))+' = '+exam.name).join(' | '));await chart(verticalSVG(s,subjects,1200,exams));
   }
   heading('Present, absent and failed counts');pdfTable(DETAIL_HEADERS,detailRows(s));
   heading('Failed-student list - '+metricName(s));pdfTable(['Roll','Student','Subject','Exam','Marks','Percentage'],failureRows(s));
  }
  newPage();heading('3. Comparison of examinations');
  for(const metric of['total','written']){
   const s=asMetric(original,metric);heading(metricName(s));note(basisNote(s));
   for(const exams of chunks(s.exams,4)){
    const indices=exams.map(exam=>s.exams.indexOf(exam));
    pdfTable(['Subject',...exams.map(exam=>exam.name)],s.subjects.map(subject=>{const values=series(s,subject).values;return[subject,...indices.map(i=>values[i].value===null?'N/A':fmt(values[i].value)+'% ('+values[i].n+' students)')];}));
   }
   if(s.exams.length>1){
    note('Change: '+s.exams[0].name+' to '+s.exams.at(-1).name+'. Differences are percentage points.');
    pdfTable(['Subject','Change in average'],averageRows(s).map(row=>[row[0],row.at(-1)]));
    heading('Individual student movement - '+metricName(s));pdfTable(MOVEMENT_HEADERS,movementRows(s));
   }
  }
  for(const metric of['total','written']){
   const s=asMetric(original,metric);
   for(const subjects of chunks(s.subjects,4)){
    newPage();heading('4. '+metricName(s)+' - student results');note('Latest exam: '+s.exams.at(-1).name+'. Change from '+s.exams[0].name+'. AB includes not-entered marks.');
    const rows=s.students.map(student=>[student.roll??'',nameOf(student),...subjects.map(subject=>{
     const a=record(s,s.exams[0],student,subject),b=record(s,s.exams.at(-1),student,subject);
     return b.kind==='score'?b.label+' ('+fmt(b.percent)+'%)'+(s.exams.length>1&&a.kind==='score'?'\n'+signed(b.percent-a.percent)+' points':''):b.label;
    })]);pdfTable(['Roll','Student',...subjects],rows);
   }
  }
  newPage();heading('5. Students requiring attention - overall total');pdfTable(['Roll','Student','Below pass in','Declined in','Absent in','Other issues'],attentionRows(original));
  const pages=doc.getNumberOfPages();
  for(let page=1;page<=pages;page++){
   doc.setPage(page);doc.setDrawColor(217,228,239);doc.line(margin,pageH-10,pageW-margin,pageH-10);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(85);
   doc.text(pdfText(original.context.className+' - '+original.context.sectionName+' | '+original.context.year),margin,pageH-6);doc.text(page+' / '+pages,pageW-margin,pageH-6,{align:'right'});
  }
  doc.save(filename(original,'pdf'));status('PDF downloaded with overall and written-exam graphs, attendance counts and failed-student lists.');
 }catch(error){status('PDF export failed: '+error.message+' Use Print / Save PDF from Report preview.','error');}
 finally{state.exporting=false;syncControls();}
}
function printReport(s=snapshot()){
 const win=window.open('','_blank');if(!win){status('Allow the report window to open, then select Print / Save PDF.','error');return;}
 const body=reportHTML(s,true);
 win.document.open();win.document.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Analysis Report</title><style>'+document.querySelector('style').textContent+'</style></head><body><main class="shell"><div class="panel no-print"><button class="btn primary" type="button" onclick="window.print()">Print / Save PDF</button><p class="small">Select Save as PDF and A4 landscape.</p></div>'+body+'</main></body></html>');win.document.close();
}
document.addEventListener('change',event=>{
 const target=event.target;if(state.initialising||state.exporting)return;
 if(target.dataset.examIndex!==undefined){
  const exam=state.exams[Number(target.dataset.examIndex)];if(!exam)return;
  if(!target.checked&&state.examIds.length===1){target.checked=true;status('Keep at least one examination selected.','warning');return;}
  state.examIds=target.checked?[...state.examIds,exam.id]:state.examIds.filter(id=>id!==exam.id);
  if(!state.manualOrder)state.examIds.sort((a,b)=>state.exams.findIndex(exam=>exam.id===a)-state.exams.findIndex(exam=>exam.id===b));
  updateSubjects();analyse();
 }else if(target.dataset.subjectIndex!==undefined){
  const subject=state.subjects[Number(target.dataset.subjectIndex)];if(!subject)return;
  if(!target.checked&&state.selectedSubjects.length===1){target.checked=true;status('Keep at least one subject selected.','warning');return;}
  state.allSubjects=false;state.selectedSubjects=target.checked?[...state.selectedSubjects,subject]:state.selectedSubjects.filter(name=>name!==subject);
  if(!state.selectedSubjects.includes(state.own))state.own=state.selectedSubjects[0];renderChoices();renderView();
 }else if(target.id==='basis'){state.basis=target.value;renderView();}
 else if(target.id==='audience')renderView();
 else if(target.id==='ownSubject'){state.own=target.value;state.filter='all';renderView();}
 else if(target.id==='ownFilter'){state.filter=target.value;renderView();}
 else if(target.id==='studentMetric'){state.studentMetric=target.value;renderView();}
});
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.tab){state.tab=button.dataset.tab;renderView();}
 else if(button.dataset.move!==undefined&&!state.exporting&&!state.initialising){
  const index=Number(button.dataset.move),next=index+Number(button.dataset.direction);
  if(next>=0&&next<state.examIds.length){state.manualOrder=true;[state.examIds[index],state.examIds[next]]=[state.examIds[next],state.examIds[index]];renderChoices();renderView();}
 }else if(button.dataset.ownFilter){state.filter=button.dataset.ownFilter;renderView();}
 else if(button.dataset.studentId){state.studentId=button.dataset.studentId;state.tab='students';renderView();$('studentDetail')?.scrollIntoView({behavior:'smooth',block:'nearest'});}
 else if(button.dataset.action==='pdf')exportPDF();
 else if(button.dataset.action==='print')printReport();
 else if(button.dataset.action==='png')exportPNG(button.dataset.metric||'total');
});
$('allSubjectsBtn').addEventListener('click',()=>{if(state.initialising||state.exporting)return;state.allSubjects=true;state.selectedSubjects=state.subjects.slice();if(!state.own)state.own=state.selectedSubjects[0];renderChoices();renderView();});
$('pdfBtn').addEventListener('click',exportPDF);
$('refreshBtn').addEventListener('click',initialise);
let resizeFrame=0,previousWidth=0;
if(window.ResizeObserver)new ResizeObserver(entries=>{
 const width=Math.round(entries[0].contentRect.width);
 if(width!==previousWidth){previousWidth=width;cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(drawCharts);}
}).observe($('view'));
enhanceSelects();syncControls();window.addEventListener('load',initialise,{once:true});
})();

</script>
