<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Marks (WhatsApp) - St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Segoe+UI:400,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <style>
    html, body { background:#f4f8fc; margin:0; padding:0; font-family:'Segoe UI', Arial, sans-serif; }
    .container { max-width: 980px; margin: 26px auto; background:#fff; border-radius:18px; box-shadow:0 4px 18px #0f3d6b22; padding: 22px 18px 24px 18px; }
    .school-title { color:#0f3d6b; font-size:1.7em; font-weight:700; text-align:center; }
    .subtitle { color:#1762a7; font-size:1.02em; font-weight:600; text-align:center; margin: 4px 0 16px 0; }
    label { font-weight:600; color:#195084; display:block; margin-bottom:6px; }
    .row { display:flex; gap:13px; }
    .row > div { flex:1; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin: 12px 0 8px 0; }
    .btn {
      background: linear-gradient(90deg, #1762a7 0%, #0f3d6b 100%);
      color:#fff; font-weight:700; border:none; padding: 12px 18px;
      border-radius:9px; font-size:1.02em; cursor:pointer; box-shadow:0 2px 8px #d2e7fa;
      transition: filter .12s;
    }
    .btn:hover { filter: brightness(0.95); }
    .btn.secondary { background:#e5f1fb; color:#0f3d6b; font-weight:700; border:1px solid #b4c8e9; }
    .note { color:#808b9a; font-size:.96em; margin-top:8px; }

    /* flat white dropdowns like your sample */
    .styled-dropdown {
      background:#fff; border:1.5px solid #b4c8e9; color:#14305a; font-size:1.08em; border-radius:6px;
      appearance:none; -webkit-appearance:none; outline:none; box-shadow:none; padding: 13px 14px; width:100%;
    }
    .styled-dropdown:focus { border:1.5px solid #1762a7; }

    /* table */
    .table-wrap { margin-top: 14px; overflow-x:auto; border:1px solid #e8eef7; border-radius:12px; }
    table { border-collapse: collapse; width: 100%; min-width: 860px; }
    thead th { position: sticky; top: 0; background:#f7fbff; color:#0f3d6b; font-weight:800; border-bottom:2px solid #e1ecf7; padding:10px 8px; text-align:left; }
    tbody td { border-bottom:1px solid #f0f4fb; padding:9px 8px; font-size:0.98em; }
    tbody tr:hover { background:#fbfdff; }
    .cell-center { text-align:center; }
    .phone-bad { color:#c0392b; font-weight:700; }
    .mark-ab { color:#c0392b; font-weight:700; }
    .tot { font-weight:800; color:#0f3d6b; }
    .pct { font-weight:700; color:#1762a7; }
    .rk  { font-weight:800; color:#2b8e32; }

    .pill { display:inline-block; border:1px solid #b4c8e9; background:#eef6ff; color:#0f3d6b; padding:4px 8px; border-radius:999px; font-weight:700; font-size:.92em; }
    .wa-btn { background:#25D366; color:#fff; font-weight:800; border:none; padding:8px 12px; border-radius:7px; cursor:pointer; }
    .wa-btn:active { filter: brightness(0.95); }

    .toast { display:none; position: fixed; left: 50%; bottom: 38px; transform: translateX(-50%); background:#1762a7; color:#fff; padding: 12px 24px; border-radius: 9px; font-size: 1.02em; box-shadow: 0 2px 16px #19508488; z-index: 9999; opacity: 0.97; font-weight: 700; }

    /* spinner overlay */
    #spinnerOverlay {
      display:none; position:fixed; top:0; left:0; width:100vw; height:100vh;
      background:rgba(255,255,255,0.65); z-index:99999; align-items:center; justify-content:center;
    }
    .lds-dual-ring { display:inline-block; width:60px; height:60px; }
    .lds-dual-ring:after {
      content:" "; display:block; width:44px; height:44px; margin:8px; border-radius:50%;
      border:6px solid #1762a7; border-color:#1762a7 transparent #1762a7 transparent;
      animation: lds-dual-ring 1.1s linear infinite;
    }
    @keyframes lds-dual-ring { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
  </style>
</head>

    <div class="subtitle">IIT & NEET FOUNDATION<br>Post Marks (WhatsApp)</div>

    <div class="section">
      <label for="yearSel">Academic Year</label>
      <select id="yearSel" class="styled-dropdown"></select>
    </div>

<script>
  // ================= FIREBASE INIT =================
  const firebaseConfig = {
    apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
    authDomain: "stpatricks-questionbank.firebaseapp.com",
    projectId: "stpatricks-questionbank",
    storageBucket: "stpatricks-questionbank.appspot.com",
    messagingSenderId: "917615322861",

  const db = firebase.firestore();

// CampusConnect custom alert (replaces window.alert)
(function setupCampusConnectAlert(){
  const dlgId = 'dlgAppAlert';
  if (document.getElementById(dlgId)) return;

  const wrapper = document.createElement('div');
  wrapper.innerHTML = `
    <dialog id="dlgAppAlert" style="border:none;border-radius:16px;padding:0;max-width:420px;width:92vw;">
      <div style="background:#0f3d6b;color:#fff;padding:10px 14px;border-radius:16px 16px 0 0;font-weight:600;font-size:15px;text-align:left;">
        CampusConnect
      </div>
      <div style="padding:14px 16px 10px 16px;font-size:14px;line-height:1.5;">
        <p id="appAlertText" style="margin:0 0 12px 0;"></p>
        <div style="text-align:right;margin-top:4px;">
          <button id="btnAppAlertOk"
                  style="background:#0f3d6b;color:#fff;border:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;">
            OK
          </button>
        </div>
      </div>

  `;
  const dialog = wrapper.firstElementChild;
  document.body.appendChild(dialog);

  const textEl = dialog.querySelector('#appAlertText');

  function show(msg){

    dialog.showModal();

  if (okBtn) okBtn.onclick = () => dialog.close();

  // Override native alert
  window.alert = show;
})();
  
  auth.onAuthStateChanged(function(user){
    if (!user) { window.location.replace("index.html"); }
  });

  // =============== UI REFS ========================
  const yearSel    = document.getElementById('yearSel');
  const classSel   = document.getElementById('classSel');
  const sectionSel = document.getElementById('sectionSel');
  const examSel    = document.getElementById('examSel');
  const theadEl    = document.getElementById('thead');
  const tbodyEl    = document.getElementById('tbody');
  const sendAllBtn = document.getElementById('sendAllBtn');
  const copySummaryBtn = document.getElementById('copySummaryBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  const toastDiv = document.getElementById('toast');
  const spinnerOverlay = document.getElementById('spinnerOverlay');

  function showSpinner(){ spinnerOverlay.style.display = 'flex'; }
  function hideSpinner(){ spinnerOverlay.style.display = 'none'; }
  function showToast(msg){
    toastDiv.textContent = msg;
    toastDiv.style.display = 'block';
    setTimeout(()=> toastDiv.style.display='none', 1800);
  }

  // ============== CHOICES (Keep flat white look) ==========
  // (We still use native-select styling; Choices improves UX without changing your flat style.)
  const yearChoices    = new Choices(yearSel,    { searchEnabled:false, itemSelectText:'', shouldSort:false });
  const classChoices   = new Choices(classSel,   { searchEnabled:false, itemSelectText:'', shouldSort:false });
  const sectionChoices = new Choices(sectionSel, { searchEnabled:false, itemSelectText:'', shouldSort:false });
  const examChoices    = new Choices(examSel,    { searchEnabled:false, itemSelectText:'', shouldSort:false });

  async function setChoices(inst, arr, valueKey='value', labelKey='label', selectValue='') {
    inst.clearStore();
    inst.setChoices(arr.map(o => ({
      value: o[valueKey], label: o[labelKey], selected: false
    })), 'value', 'label', true);
    if (selectValue) inst.setChoiceByValue(selectValue);
  }

  // ============== CLASS GROUP MAP =================
  const CLASS_GROUP_MAP = {
    'Nursery': 'nursery-lkg-ukg',
    'LKG': 'nursery-lkg-ukg',
    'UKG': 'nursery-lkg-ukg',
    '1': 'class-1-2', '1st': 'class-1-2', '1st Class': 'class-1-2',
    '2': 'class-1-2', '2nd': 'class-1-2', '2nd Class': 'class-1-2',
    '3': 'class-3-5', '3rd': 'class-3-5', '3rd Class': 'class-3-5',
    '4': 'class-3-5', '4th': 'class-3-5', '4th Class': 'class-3-5',
    '5': 'class-3-5', '5th': 'class-3-5', '5th Class': 'class-3-5',
    '6': 'class-6-9', '6th': 'class-6-9', '6th Class': 'class-6-9',
    '7': 'class-6-9', '7th': 'class-6-9', '7th Class': 'class-6-9',
    '8': 'class-6-9', '8th': 'class-6-9', '8th Class': 'class-6-9',
    '9': 'class-6-9', '9th': 'class-6-9', '9th Class': 'class-6-9',
    '10': 'class-10', '10th': 'class-10', '10th Class': 'class-10'
  };
  function getClassGroupName(className){
    const key = (className||'').toString().replace(/[^a-z0-9 ]/gi,'').trim();
    if (CLASS_GROUP_MAP[key]) return CLASS_GROUP_MAP[key];
    // try relaxed match
    for (const k of Object.keys(CLASS_GROUP_MAP)) {
      if (key.toLowerCase() === k.toLowerCase()) return CLASS_GROUP_MAP[k];
    }
    return 'class-6-9';
  }

  // ============== GLOBAL STATE ====================
  let YEARS = [];
  let CLASSES = [];
  let SECTIONS = [];
  let EXAMS = [];
  let SUBJECTS = []; // [{name, max}, ...]
  let ROWS = [];     // computed student rows (filled in Part 3)

  // ============== LOADERS =========================
  async function loadYears() {
    // Prefer ordering by 'name' desc (your DB pattern). Fallback to unsorted if field missing.
    let snap;
    try {
      snap = await db.collection('years').orderBy('name', 'desc').get();
    } catch(e) {
      snap = await db.collection('years').get();
    }
    YEARS = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));
    const opts = YEARS.map(y => ({ value: y.id, label: y.id }));
    await setChoices(yearChoices, opts, 'value', 'label', YEARS[0]?.id || '');
  }

  async function loadClasses() {
    const year = yearSel.value;
    if (!year) { await setChoices(classChoices, []); return; }
    const snap = await db.collection('years').doc(year).collection('classes').orderBy('name').get();
    CLASSES = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));
    const opts = CLASSES.map(c => ({ value: c.id, label: c.name }));
    await setChoices(classChoices, opts, 'value', 'label', CLASSES[0]?.id || '');
  }

  async function loadSections() {
    const year = yearSel.value;
    const classId = classSel.value;
    if (!year || !classId) { await setChoices(sectionChoices, []); return; }
    const snap = await db.collection('years').doc(year).collection('classes').doc(classId).collection('sections').orderBy('name').get();
    SECTIONS = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));
    const opts = SECTIONS.map(s => ({ value: s.id, label: s.name }));
    await setChoices(sectionChoices, opts, 'value', 'label', SECTIONS[0]?.id || '');
  }

  async function loadExams() {
    const year = yearSel.value;
    const classId = classSel.value;
    if (!year || !classId) { await setChoices(examChoices, []); return; }

    const classObj = CLASSES.find(c => c.id === classId);
    const className = classObj?.name || '';
    const group = getClassGroupName(className); // e.g., "class-6-9" or "nursery-lkg-ukg"

    const snap = await db.collection('years').doc(year)
      .collection('exams').doc('classGroups')
      .collection(group).orderBy('name').get();

    EXAMS = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) })) || [];
    const opts = EXAMS.length ? EXAMS.map(e => ({ value: e.id, label: e.name })) : [{ value: '', label: 'No exams' }];
    await setChoices(examChoices, opts, 'value', 'label', EXAMS[0]?.id || '');
  if (EXAMS.length) {
    await loadStudentsAndMarks();   // Part 3 wrapper will auto-rank + render
  } else {
    ROWS = []; SUBJECTS = [];
    theadEl.innerHTML = '';
    tbodyEl.innerHTML = '';
  }
}
  // ============== DATA FETCH (students + marks) ===========
  function normalizePhoneIndia(raw) {
    if (!raw) return '';
    let d = (''+raw).replace(/\D/g,'').replace(/^0+/, '');
    if (d.length === 10) return '91' + d;
    if (d.length === 12 && d.startsWith('91')) return d;
    // fallback: if 11 digits or others, mark invalid
    return '';
  }

  function safeNumber(n){ return (n===0 || (typeof n === 'number' && !isNaN(n))) ? n : null; }
  // ===== Attendance helpers (robust, supports nested/alias keys) =====
function _toInt(x){ const n = Number(x); return Number.isFinite(n) ? Math.trunc(n) : null; }

function _flatten(obj, out = {}) {
  for (const [k, v] of Object.entries(obj || {})) {
    const key = String(k || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    if (v && typeof v === 'object' && !Array.isArray(v)) _flatten(v, out);
    else out[key] = v;
  }
  return out;
}

function makeAttendanceText(markDoc = {}, stuDoc = {}, examId = '', examName = '') {
  // Pull a per-exam node from the student doc if it exists (e.g., attendance[examId])
  const byExam =
    (stuDoc.attendance && (stuDoc.attendance[examId] || stuDoc.attendance[examName])) ||
    (stuDoc.att && (stuDoc.att[examId] || stuDoc.att[examName])) ||
    (stuDoc.attd && (stuDoc.attd[examId] || stuDoc.attd[examName])) ||
    null;

  // Flatten: student -> byExam -> markDoc (later overrides earlier)
  const flat = { ..._flatten(stuDoc), ..._flatten(byExam || {}), ..._flatten(markDoc) };

  // If there’s already a preformatted string, or a single "attendance" field, use it
  const pre = flat.attendancetext ?? flat.atttext ?? flat.att;
  if (typeof pre === 'string' && pre.trim()) return pre.trim();

  // Accept a numeric "attendance" too (often from keys like "Attendance %")
  const pctFromAttendance = Number(flat.attendance);
  if (Number.isFinite(pctFromAttendance)) return `${pctFromAttendance.toFixed(1)}%`;

  // Broader alias sets
  const presentAliases = [
    'present','presentdays','attpresent','p','pdays','attp','dayspresent','presentday','presentcount'
  ];
  const workingAliases = [
    'working','workingdays','totaldays','attworking','total','w','wdays','attw',
    'totalworkingdays','workdays','workingday'
  ];
  const absentAliases = [
    'absent','absentdays','attabsent','a','adays','atta','daysabsent','absentday'
  ];
  const pctAliases = [
    'attendancepct','attpct','percent','percentage','pct','attendance'
  ];

  const pick = (keys) => {
    for (const k of keys) {
      if (k in flat) {
        const n = _toInt(flat[k]);
        if (n !== null) return n;
      }
    }
    return null;
  };

  const p = pick(presentAliases);
  let w = pick(workingAliases);

  // If only present+absent are available, derive working = present + absent
  if (p !== null && (w === null || w === 0)) {
    const a = pick(absentAliases);
    if (a !== null) w = p + a;
  }

  // Percentage candidates
  let pctNum = null;
  for (const k of pctAliases) {
    if (k in flat) {
      const n = Number(flat[k]);
      if (Number.isFinite(n)) { pctNum = n; break; }
    }
  }

  if (p !== null && w !== null && w > 0) {
    const pct = (pctNum !== null) ? pctNum : Math.round((p / w) * 1000) / 10;
    return `${p}/${w} (${pct.toFixed(1)}%)`;
  }
  if (pctNum !== null) return `${pctNum.toFixed(1)}%`;
  return "";
}
  // ===== Section attendance (daily docs) aggregator =====
function _valIsPresent(v){
  const s = (v == null ? '' : String(v)).trim().toLowerCase();
  return s === 'present' || s === 'p' || s === 'true' || s === '1' || s === 'yes' || s === 'y';
}
function _entryIsPresent(entry){
  if (entry && typeof entry === 'object') {
    // Count the whole day present if ANY half/session is present
    return _valIsPresent(entry.A) || _valIsPresent(entry.M) ||
           _valIsPresent(entry.F) || _valIsPresent(entry.H) ||
           _valIsPresent(entry.present) || _valIsPresent(entry.status);
  }
  return _valIsPresent(entry);
}

async function loadAttendanceSummary(year, classId, sectionId){
  const attCol = db.collection('years').doc(year)
    .collection('classes').doc(classId)
    .collection('sections').doc(sectionId)
    .collection('attendance');

  const snap = await attCol.get();
  const presentByStudent = {};
  let working = 0;

  snap.forEach(doc => {
    const data = doc.data() || {};
    // treat this doc as a working day if it has any entries
    const hasAny = Object.values(data).some(v => (v && typeof v === 'object') || typeof v === 'string');
    if (!hasAny) return;
    working++;
    for (const [stuId, entry] of Object.entries(data)) {
      if (_entryIsPresent(entry)) {
        presentByStudent[stuId] = (presentByStudent[stuId] || 0) + 1;
      }
    }
  });

  return { working, presentByStudent };
}

function makeAttendanceFromSummary(summary, studentId){
  if (!summary || !summary.working) return "";
  const p = summary.presentByStudent[studentId] || 0;
  const w = summary.working;
  const pct = Math.round((p / w) * 1000) / 10;
  return `${p}/${w} (${pct.toFixed(1)}%)`;
}
  async function loadStudentsAndMarks() {
    const year = yearSel.value;
    const classId = classSel.value;
    const sectionId = sectionSel.value;
    const examId = examSel.value;

    if (!year || !classId || !sectionId || !examId) { SUBJECTS = []; ROWS = []; return { subjects:[], rows:[] }; }

    const examObj = EXAMS.find(e => e.id === examId) || {};
    SUBJECTS = Array.isArray(examObj.subjects) ? examObj.subjects.slice() : [];

    // Load students
    const stuSnap = await db.collection('years').doc(year)
      .collection('classes').doc(classId)
      .collection('sections').doc(sectionId)
      .collection('students').orderBy('roll').get();

    const students = [];
    stuSnap.forEach(doc => {
      const d = doc.data() || {};
      if (!d.isDeleted) students.push({ id: doc.id, ...d });
    });

    // Load each student's marks for this exam
    const markDocs = await Promise.all(students.map(stu =>
      db.collection('years').doc(year)
        .collection('classes').doc(classId)
        .collection('sections').doc(sectionId)
        .collection('students').doc(stu.id)
        .collection('marks').doc(examId).get()
    ));
    const attSummary = await loadAttendanceSummary(year, classId, sectionId);
    const examNameForAtt = (EXAMS.find(e => e.id === examId)?.name) || '';
    const rows = students.map((stu, idx) => {
      const md = markDocs[idx];
      const data = md.exists ? (md.data() || {}) : {};
      const attTextDocs = makeAttendanceText(data, stu, examId, examNameForAtt) || '';
      const attText = attTextDocs || makeAttendanceFromSummary(attSummary, stu.id);
      const subjMarks = SUBJECTS.map(s => {
        // robust key match
        const want = (s.name||'').replace(/[\s.]/g,'').toLowerCase();
        let val = data[s.name];
        if (val === undefined) {
          for (const k of Object.keys(data)) {
            if (k.replace(/[\s.]/g,'').toLowerCase() === want) { val = data[k]; break; }
          }
        }
        // Convert missing to "AB"
        if (val === undefined || val === null || val === '') return 'AB';
        // If numeric-like, coerce number
        const num = Number(val);
        return isNaN(num) ? 'AB' : num;
      });

      // Totals: AB counts as 0
      let obtained = 0, totalMax = 0;
      subjMarks.forEach((m, i) => {
        const max = Number(SUBJECTS[i]?.max ?? 0) || 0;
        totalMax += max;
        if (m !== 'AB' && safeNumber(m) !== null) obtained += Number(m);
      });
      const percent = totalMax ? Math.round((obtained/totalMax)*1000)/10 : 0;

     return {
      studentId: stu.id,
      roll: stu.roll || '',
      name: stu.name || '',
      father: stu.father || '',
      className: (CLASSES.find(c=>c.id===classId)?.name)||'',
      sectionName: (SECTIONS.find(s=>s.id===sectionId)?.name)||'',
      phoneRaw: stu.parentPhone || '',
      phoneIntl: normalizePhoneIndia(stu.parentPhone || ''),
      subjMarks, obtained, totalMax, percent,
      rank: null, // will be filled later
      attendanceText: attText
    };
    });

    ROWS = rows;
    return { subjects: SUBJECTS, rows: ROWS };
  }

  // ============== CHANGE HANDLERS (wiring only; render comes in Part 3) =====
  yearSel.addEventListener('change', async () => {
  showSpinner();
  try {
    await loadClasses();
    await loadSections();
    await loadExams();
    await loadStudentsAndMarks();   // <-- add this
  } finally { hideSpinner(); }
});

classSel.addEventListener('change', async () => {
  showSpinner();
  try {
    await loadSections();
    await loadExams();
    await loadStudentsAndMarks();   // <-- add this
  } finally { hideSpinner(); }
});

sectionSel.addEventListener('change', async () => {
  showSpinner();
  try {
    await loadExams();
    await loadStudentsAndMarks();   // <-- add this
  } finally { hideSpinner(); }
});

  examSel.addEventListener('change', async () => {
    showSpinner();
    try {
      await loadStudentsAndMarks();
      // rendering + ranking is in Part 3
    } finally { hideSpinner(); }
  });

  refreshBtn.addEventListener('click', async () => {
    showSpinner();
    try {
      await loadYears();
      await loadClasses();
      await loadSections();
      await loadExams();
      await loadStudentsAndMarks();
      // Part 3 will render
    } finally { hideSpinner(); }
  });

  // Expose init so Part 3 can run it after defining render functions
  window._pmInit = async function() {
    showSpinner();
    try {
      await loadYears();
      await loadClasses();
      await loadSections();
      await loadExams();
      await loadStudentsAndMarks();
    } finally { hideSpinner(); }
  };
</script>
<script>
  // ================= PART 3: RENDER + RANK + ACTIONS =================

  // Hook: wrap loadStudentsAndMarks so any existing listeners will auto-render after loading
  const _origLoadStudentsAndMarks = loadStudentsAndMarks;
  window.loadStudentsAndMarks = async function() {
    const out = await _origLoadStudentsAndMarks();
    computeRanks();
    renderTable();
    return out;
  };

    function computeRanks() {
    if (!ROWS || !ROWS.length) return;

    // small normalizer (same idea as other modules)
    const nkey = (s) => String(s || '').trim().toLowerCase();

    // Build tie-break info for each row
    const enriched = (ROWS || []).map(row => {
      const per = new Map();

      // Map subject name → numeric mark (AB and invalid treated as 0)
      (SUBJECTS || []).forEach((s, idx) => {
        if (!s) return;
        const key = nkey(s.name);
        const raw = (row.subjMarks || [])[idx];
        let val = 0;
        if (raw === 'AB') {
          val = 0;
        } else {
          const num = Number(raw);
          val = Number.isFinite(num) ? num : 0;
        }
        per.set(key, val);
      });

      const get = (aliases) => {
        for (const name of aliases) {
          const v = per.get(nkey(name));
          if (typeof v === 'number' && !isNaN(v)) return v;
        }
        return 0;
      };

      const total = Number.isFinite(+row.obtained) ? +row.obtained : 0;

      // Maths 1 + Maths 2 combined
      const m1 = get(['math 1','math-1','maths 1','maths-1','mathematics 1','mathematics-1']);
      const m2 = get(['math 2','math-2','maths 2','maths-2','mathematics 2','mathematics-2']);
      const mathCombo = m1 + m2;

      // Physics / Biology / Chemistry (common labels)
      const physics   = get(['physics','physical science','phy']);
      const biology   = get(['biology','bio','life science']);
      const chemistry = get(['chemistry','chem']);

      const rollNum = Number.isFinite(+row.roll) ? +row.roll : 999999;

      return {
        row,
        total,
        mathCombo,
        physics,
        biology,
        chemistry,
        roll: rollNum
      };
    });

    // Sort with tie-break:
    // 1) Total
    // 2) Math1+Math2
    // 3) Physics
    // 4) Biology
    // 5) Chemistry
    // 6) Lower roll number
    enriched.sort((A, B) => {
      if (B.total     !== A.total)     return B.total     - A.total;
      if (B.mathCombo !== A.mathCombo) return B.mathCombo - A.mathCombo;
      if (B.physics   !== A.physics)   return B.physics   - A.physics;
      if (B.biology   !== A.biology)   return B.biology   - A.biology;
      if (B.chemistry !== A.chemistry) return B.chemistry - A.chemistry;
      return A.roll - B.roll;
    });

    // Dense ranking based on TOTAL marks (same style as memos/certificates)
    let lastScore = null;
    let lastRank  = 0;
    let i = 0;

    for (const e of enriched) {
      i++;
      if (e.total !== lastScore) {
        lastRank  = i;
        lastScore = e.total;
      }
      e.row.rank = lastRank;
    }
    // ranks are now on the same ROW objects
  }
  function renderTable() {
    // Build header
    const subjHeads = (SUBJECTS||[]).map(s => `<th class="cell-center">${escapeHtml(s.name)}<br><span class="pill">/${s.max||0}</span></th>`).join('');
    theadEl.innerHTML = `
      <tr>
        <th>Roll</th>
        <th>Name</th>
        <th>Phone</th>
        ${subjHeads}
        <th class="cell-center">Total</th>
        <th class="cell-center">%</th>
        <th class="cell-center">Rank</th>
        <th class="cell-center">Action</th>
      </tr>
    `;

    // Body (keep UI order by roll)
    const rowsHtml = (ROWS||[])
      .sort((a,b) => {
        const ar = Number(a.roll), br = Number(b.roll);
        if (!isNaN(ar) && !isNaN(br)) return ar - br;
        return String(a.roll).localeCompare(String(b.roll));
      })
      .map((r, idx) => {
        const phoneCell = r.phoneIntl ? r.phoneIntl.replace(/^91/,'+91 ') : `<span class="phone-bad">—</span>`;
        const subjTds = r.subjMarks.map((m,i) => {
          const cls = (m==='AB') ? 'mark-ab' : '';
          return `<td class="cell-center ${cls}">${m==='AB' ? 'AB' : m}</td>`;
        }).join('');
        return `
          <tr data-index="${idx}">
            <td>${escapeHtml(r.roll)}</td>
            <td>${escapeHtml(r.name)}</td>
            <td>${phoneCell}</td>
            ${subjTds}
            <td class="cell-center tot">${r.obtained}</td>
            <td class="cell-center pct">${r.totalMax? (Math.round((r.obtained/r.totalMax)*1000)/10).toFixed(1) : '0.0'}</td>
            <td class="cell-center rk">${r.rank ?? ''}</td>
            <td class="cell-center">
              <button class="wa-btn" data-wa="${idx}">WhatsApp</button>
            </td>
          </tr>
        `;
      }).join('');

    tbodyEl.innerHTML = rowsHtml;

    // Attach per-row WA handlers
    tbodyEl.querySelectorAll('button.wa-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.wa);
        const row = ROWS[idx];
        sendOneWhatsApp(row);
      });
    });

    // Bulk + summary buttons
    sendAllBtn.onclick = sendAllWhatsApp;
    copySummaryBtn.onclick = copySummary;
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function composeMessage(row){
    const year = yearSel.value;
    const className = row.className || '';
    const sectionName = row.sectionName || '';
    const examName = (EXAMS.find(e => e.id === examSel.value)?.name) || '';

    const lines = [];
    lines.push(`*St. Patrick's School – Marks*`);
    lines.push(`Student: ${row.name} (Roll ${row.roll})`);
    lines.push(`Class & Section: ${className} - ${sectionName}`);
    lines.push(`Exam: ${examName}`);
    lines.push('');
    // subjects
    for (let i=0;i<(SUBJECTS||[]).length;i++){
      const s = SUBJECTS[i];
      const m = row.subjMarks[i];
      const val = (m==='AB') ? 'AB' : m;
      lines.push(`${s.name}: ${val}/${s.max||0}`);
    }
    lines.push('');
    const pct = row.totalMax ? (Math.round((row.obtained/row.totalMax)*1000)/10).toFixed(1) : '0.0';
    lines.push(`Total: ${row.obtained}/${row.totalMax}  ( ${pct}% )`);
    lines.push(`Rank: ${row.rank ?? ''}`);
    if (row.attendanceText) lines.push(`Attendance: ${row.attendanceText}`);
    lines.push('');
    lines.push(`Thank you`);
    lines.push(`St. Patrick's School`);
    return lines.join('\n');
  }

  function openWhatsApp(phoneIntl, message) {
  const url = `https://wa.me/${phoneIntl}?text=${encodeURIComponent(message)}`;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isMobile) {
    // use same tab on phones (less likely to be blocked)
    window.location.href = url;
  } else {
    window.open(url, '_blank', 'noopener');
  }
}

  function sendOneWhatsApp(row){
    if (!row.phoneIntl){
      showToast('Missing or invalid phone number.');
      return;
    }
    const msg = composeMessage(row);
    openWhatsApp(row.phoneIntl, msg);
  }

 let BULK = { list: [], i: 0 };

function updateBulkUI(){
  const st = document.getElementById('bulkStatus');
  if (!st) return;
  st.textContent = (BULK.i >= BULK.list.length)
    ? 'All done.'
    : `Ready: ${BULK.i}/${BULK.list.length}`;
}

async function sendAllWhatsApp(){
  if (!ROWS || !ROWS.length) { showToast('No students to send.'); return; }
  const valid = ROWS.filter(r => !!r.phoneIntl);
  const invalid = ROWS.filter(r => !r.phoneIntl);
  if (!valid.length) { showToast('No valid phone numbers.'); return; }

  BULK = { list: valid, i: 0 };
  const inline = document.getElementById('bulkInline');
inline.style.display = 'flex';
wireBulkOverlay();
  updateBulkUI();
  showToast(`Tap "Open Next" to send ${valid.length} chats. Skipped ${invalid.length}.`);
}


function openNextInQueue(){
  if (!BULK.list.length) return;
  if (BULK.i >= BULK.list.length){
    document.getElementById('bulkInline').style.display = 'none';
    showToast('All chats opened.');
    return;
  }
  const r = BULK.list[BULK.i];
  openWhatsApp(r.phoneIntl, composeMessage(r)); // opened by user click -> not blocked
  BULK.i++;
  updateBulkUI();
}

function cancelBulk(){
  BULK = { list: [], i: 0 };
  document.getElementById('bulkOverlay').style.display = 'none';
}

// wire overlay buttons once
function wireBulkOverlay(){
  const next = document.getElementById('bulkNext');
  const cancel = document.getElementById('bulkCancel');
  if (next && !next.dataset.wired){
    next.addEventListener('click', openNextInQueue);
    next.dataset.wired = '1';
  }
  if (cancel && !cancel.dataset.wired){
    cancel.addEventListener('click', cancelBulk);
    cancel.dataset.wired = '1';
  }
}
// wire once DOM is ready
document.addEventListener('DOMContentLoaded', wireBulkOverlay);

  function copySummary(){
    if (!ROWS || !ROWS.length) { showToast('Nothing to copy.'); return; }
    const examName = (EXAMS.find(e => e.id === examSel.value)?.name) || '';
    const className = (CLASSES.find(c=>c.id===classSel.value)?.name)||'';
    const sectionName = (SECTIONS.find(s=>s.id===sectionSel.value)?.name)||'';

    const head = `St. Patrick's School – ${className}-${sectionName} – ${examName}`;
    const lines = [head, ''];
    // ordered by roll
    const rows = [...ROWS].sort((a,b) => {
      const ar = Number(a.roll), br = Number(b.roll);
      if (!isNaN(ar) && !isNaN(br)) return ar - br;
      return String(a.roll).localeCompare(String(b.roll));
    });
    for (const r of rows){
      const pct = r.totalMax ? (Math.round((r.obtained/r.totalMax)*1000)/10).toFixed(1) : '0.0';
      lines.push(`${r.roll}. ${r.name} — ${r.obtained}/${r.totalMax} (${pct}%)  Rank: ${r.rank ?? ''}`);
    }
    const text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(()=> showToast('Summary copied.'));
    } else {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Summary copied.');
    }
  }

  function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

  // Kick off initial load + first render
  (async function(){
    await window._pmInit();
    computeRanks();
    renderTable();
  })();
  function wireBulkOverlay(){
  const next = document.getElementById('bulkNext');
  const cancel = document.getElementById('bulkCancel');
  if (next && !next.dataset.wired){
    next.addEventListener('click', openNextInQueue);
    next.dataset.wired = '1';
  }
  if (cancel && !cancel.dataset.wired){
    cancel.addEventListener('click', cancelBulk);
    cancel.dataset.wired = '1';
  }
}
document.addEventListener('DOMContentLoaded', wireBulkOverlay);
</script>
 </body>
