// --- Helpers for MCQ logic (keep as-is) ---
function extractMCQOptions(q) {
    if (Array.isArray(q.options) && q.options.length === 4) return q.options;
    let stem = q.question || q.text || '';
    let match = stem.match(/^(.*?)(?:A\))\s*([^B]+)B\)\s*([^C]+)C\)\s*([^D]+)D\)\s*([^A]*)(?:Ans:|$)/);
    if (match) return [match[2].trim(), match[3].trim(), match[4].trim(), match[5].trim()];
    return null;
}
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}
function shuffleMCQQuestion(questionObj) {
    if (!questionObj.options || !questionObj.options.length) return questionObj;
    let { options, answer } = questionObj;
    let correctIndices = [];
    if (typeof answer === 'string') {
        const ansMatches = answer.match(/[A-D]/g);
        if (ansMatches) correctIndices = ansMatches.map(l => "ABCD".indexOf(l));
    } else if (Array.isArray(answer)) correctIndices = answer;
    const optPairs = options.map((opt, idx) => ({ opt, idx }));
    shuffleArray(optPairs);
    const newOptions = optPairs.map(p => p.opt);
    const newCorrectIndices = optPairs.map((p, newIdx) => (correctIndices.includes(p.idx) ? newIdx : null)).filter(x => x !== null);
    const ansStr = "Ans: " + newCorrectIndices.map(i => "ABCD"[i] + ")").join(", ");
    return { ...questionObj, options: newOptions, answer: ansStr };
}
function splitCounts(total, percents) {
    let result = percents.map(p => Math.floor(total * p / 100));
    let sum = result.reduce((a, b) => a + b, 0);
    let diff = total - sum;
    for (let i = 0; diff > 0; i++, diff--) result[i % result.length]++;
    return result;
}

// --- DEDUPE HELPERS (new) ---
function normalizeText(s) {
  if (!s) return '';
  let t = String(s);

  // strip HTML tags
  t = t.replace(/<[^>]+>/g, ' ');

  // HTML entities & non-breaking spaces
  t = t.replace(/&nbsp;/gi, ' ').replace(/\u00A0/g, ' ');

  // Unicode canonicalization
  try { t = t.normalize('NFKC'); } catch (e) {}

  // remove zero-width/invisible characters
  t = t.replace(/[\u200B-\u200D\uFEFF]/g, '');

  // unify dashes & minus (en/em/hyphen/minus → '-')
  t = t.replace(/[\u2010-\u2015\u2212]/g, '-');

  // unify quotes
  t = t.replace(/[\u2018\u2019\u201A\u2032]/g, "'")
       .replace(/[\u201C\u201D\u2033]/g, '"');

  // unify multiplication sign × to 'x'
  t = t.replace(/\u00D7/g, 'x');

  // collapse whitespace
  t = t.replace(/\s+/g, ' ').trim().toLowerCase();

  // ignore trivial trailing punctuation differences
  t = t.replace(/[.,;:!?]+$/g, '');

  return t;
}
// Build a stable de-dupe key from a question object
function makeDeDupeKey(q) {
  if (!q) return '';
  // Prefer 'question', fall back to 'text'
  let raw = String(q.question || q.text || '');

  // Drop HTML
  raw = raw.replace(/<[^>]+>/g, ' ');

  // Remove trailing "Ans: ..." (any case)
  raw = raw.replace(/\bAns?\s*:\s*.*$/i, '');

  // If MCQ options are inline, strip from the first option marker onward.
// Matches A) / A. / (A) with optional spaces, case-insensitive.
raw = raw.replace(/\s*(?:\(?\s*[A]\s*[\)\.])[\s\S]*$/i, '');

  // Final canonical form
  return normalizeText(raw);
}

function uniqueByIdOrText(arr) {
  const seenIds = new Set();
  const seenKeys = new Set();
  const out = [];
  for (const q of arr) {
    const id  = q.id || '';
    const key = makeDeDupeKey(q);
    if ((id && seenIds.has(id)) || (key && seenKeys.has(key))) continue;
    if (id)  seenIds.add(id);
    if (key) seenKeys.add(key);
    out.push(q);
  }
  return out;
}

// --- Firebase/Firestore fetch helpers ---
const db = {
    getChapters: async (selectedClass, selectedSubject) => {
        try {
            const firestore = firebase.firestore();
            const snapshot = await firestore.collection("questions")
                .where("class", "==", selectedClass)
                .where("subject", "==", selectedSubject)
                .get();
            if (snapshot.empty) return [];
            const chapterSet = new Set();
            snapshot.forEach(doc => { const data = doc.data(); if (data.chapter) chapterSet.add(data.chapter); });
            return Array.from(chapterSet);
        } catch (error) { console.error("Error fetching chapters from Firestore:", error); return []; }
    }
};

async function fetchQuestions({ selectedClass, selectedSubject, chapters, marksPerQuestion, mcqType, count, forceDifficulty }) {
    const firestore = firebase.firestore();
    let query = firestore.collection("questions")
        .where("class", "==", selectedClass)
        .where("subject", "==", selectedSubject);

    if (forceDifficulty) {
        query = query.where("difficulty", "==", forceDifficulty);
    } else if (window.difficultyFilter && window.difficultyFilter !== "Mixed") {
        query = query.where("difficulty", "==", window.difficultyFilter);
    }

    if (chapters && chapters.length) query = query.where("chapter", "in", chapters.slice(0, 10));
    if (marksPerQuestion)        query = query.where("marks", "==", parseInt(marksPerQuestion));
    if (mcqType === "MCQ (Single)")   query = query.where("mcqType", "==", "MCQ (Single)");
    else if (mcqType === "MCQ (Multiple)") query = query.where("mcqType", "==", "MCQ (Multiple)");

    const snapshot = await query.get();
    let allQuestions = [];
    snapshot.forEach(doc => { allQuestions.push({ id: doc.id, ...doc.data() }); });

    // De-dupe by ID or by normalized text
    allQuestions = uniqueByIdOrText(allQuestions);

    // For descriptive sections, allow docs with mcqType "Descriptive" or missing/empty
    if (mcqType === "Descriptive") {
        allQuestions = allQuestions.filter(q => !q.mcqType || q.mcqType === "Descriptive");
    }

    shuffleArray(allQuestions);
    return allQuestions.slice(0, count);
}
async function fetchQuestionsWithMarksFallback({
    selectedClass,
    selectedSubject,
    chapters,
    marksPerQuestion,
    mcqType,          // "MCQ (Single)" | "MCQ (Multiple)" | "Descriptive"
    count,
    forceDifficulty
}) {
    const firestore = firebase.firestore();
    const wantedMarks = parseInt(marksPerQuestion);
    let picked = [];

    // track duplicates by id AND by normalized text
    const usedIds = new Set();
    const usedKeys = new Set();

    const base = firestore.collection("questions")
        .where("class", "==", selectedClass)
        .where("subject", "==", selectedSubject);

    // allow only the requested type
    const isAllowedType = (d) => {
        if (mcqType === "MCQ (Single)")   return d.mcqType === "MCQ (Single)";
        if (mcqType === "MCQ (Multiple)") return d.mcqType === "MCQ (Multiple)";
        // Descriptive: accept docs with mcqType "Descriptive" OR missing/empty
        if (mcqType === "Descriptive")    return !d.mcqType || d.mcqType === "Descriptive";
        return true;
    };

    // apply firestore filters
    const applyFilters = (q, { marks, difficulty, withChapters = true } = {}) => {
        let qq = q;
        if (withChapters && chapters && chapters.length) qq = qq.where("chapter", "in", chapters.slice(0, 10));
        if (typeof marks === "number") qq = qq.where("marks", "==", marks);
        if (mcqType === "MCQ (Single)")   qq = qq.where("mcqType", "==", "MCQ (Single)");
        if (mcqType === "MCQ (Multiple)") qq = qq.where("mcqType", "==", "MCQ (Multiple)");
        if (difficulty) qq = qq.where("difficulty", "==", difficulty);
        return qq;
    };

    // run query and filter by type; no marks override (we keep exact marks only)
    const runAndFilter = async (qq) => {
        const out = [];
        const snap = await qq.get();
        snap.forEach(doc => {
            const d = { id: doc.id, ...doc.data() };
            if (!isAllowedType(d)) return;
            out.push(d);
        });
        return out;

        arr.push(d);

    {

        const docs = await runAndFilter(q1);
        dedupAppend(picked, docs);
        if (picked.length >= count) return picked.slice(0, count);
    }

    {

        const docs = await runAndFilter(q2);
        dedupAppend(picked, docs);

    }

        if (sectionErrors.length === 0) {
            subjectBlock.sections.push({ 
            ...sec, 
            questions, 
            instructions: buildSectionInstructions(sec) 
        });
        } else {
            allSectionErrors = allSectionErrors.concat(sectionErrors);
        }
    }
    finalPaper.subjects.push(subjectBlock);
}

// Show errors if any
if (allSectionErrors.length > 0) {
    showModalPrompt(
        `<b>Some sections could not be added:</b><br><ul style="text-align:left">${allSectionErrors.map(e => `<li>${e}</li>`).join('')}</ul>`
    );
    btn.disabled = false; btn.textContent = "Build Exam Draft";
    return; // stop!
}

// Save and continue as before
// Save and continue as before — but FIRST run a duplicate diagnostic
(function () {
  const dupNotes = [];
  for (const subj of finalPaper.subjects || []) {
    for (const sec of subj.sections || []) {
      const counts = {};
      for (const q of sec.questions || []) {
        const k = makeDeDupeKey({ text: q.text || q.question || '' });
        counts[k] = (counts[k] || 0) + 1;
      }
      const dupes = Object.entries(counts).filter(([_, c]) => c > 1);
      if (dupes.length) dupNotes.push(`${subj.subject} / ${sec.label}: ${dupes.length} duplicate key(s)`);
    }
  }
  if (dupNotes.length) {
    console.warn('BUILDER: duplicates EXIST before saving:', dupNotes);
  } else {
    console.warn('BUILDER: NO duplicates in finalPaper before saving');
  }
})();

sessionStorage.setItem('examPaper', JSON.stringify(finalPaper));
window.location.href = 'exam-review.html';
            } catch (err) {
                showToast("Error building exam: " + (err.message || err), "error");
            }
            btn.disabled = false;
            btn.textContent = "Build Exam Draft";
        });
    });
});
</script>
