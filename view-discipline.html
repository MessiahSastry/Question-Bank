<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Discipline - St. Patrick's School</title>

  <style>
    :root {
      --primary: #0f3d6b;
      --primary-light: #1762a7;
      --page-bg: #f4f8fc;
      --card-bg: #ffffff;
      --border: #d8e4ef;
      --muted: #687786;
      --late: #d97706;
      --uniform: #b42318;
      --sign: #7a3db8;
      --success: #18794e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--page-bg);
      color: #1f2933;
    }

    body {
      padding-bottom: 86px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      width: 100%;
      padding: 16px 12px 10px;
      text-align: center;
      color: #fff;
      background: var(--primary);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 4px 14px rgba(15, 61, 107, 0.20);
    }

    .school-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .school-subtitle {
      margin-top: 2px;
      color: #c9e4ff;
      font-size: 0.92rem;
    }

    .academic-year {
      min-height: 22px;
      margin-top: 4px;
      color: #fdc600;
      font-size: 1.03rem;
      font-weight: 700;
    }

    .main-content {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 116px 12px 28px;
    }

    .title-row {
      margin: 10px 2px 14px;
    }

    .page-title {
      margin: 0;
      color: var(--primary);
      font-size: 1.42rem;
      font-weight: 750;
    }

    .class-section {
      margin-top: 4px;
      color: #506171;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .filter-card,
    .summary-card,
    .student-card,
    .message-card {
      background: var(--card-bg);
      border: 1px solid rgba(216, 228, 239, 0.95);
      border-radius: 13px;
      box-shadow: 0 2px 9px rgba(15, 61, 107, 0.09);
    }

    .filter-card {
      padding: 13px;
      margin-bottom: 12px;
    }

    .filter-title {
      margin-bottom: 9px;
      color: var(--primary);
      font-weight: 750;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      color: #506171;
      font-size: 0.82rem;
      font-weight: 700;
    }

       .modern-dropdown {
      position: relative;
      width: 100%;
    }

    .modern-dropdown-button {
      width: 100%;
      min-height: 49px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1.4px solid #c7d7ea;
      border-radius: 10px;
      background: #f8fbfe;
      color: #1f2933;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition:
        border-color 0.16s ease,
        box-shadow 0.16s ease,
        background 0.16s ease;
    }

    .modern-dropdown-button:focus,
    .modern-dropdown.open .modern-dropdown-button {
      border-color: var(--primary-light);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(23, 98, 167, 0.13);
    }

    .dropdown-chevron {
      flex: 0 0 auto;
      color: var(--primary);
      font-size: 1.05rem;
      transition: transform 0.18s ease;
    }

    .modern-dropdown.open .dropdown-chevron {
      transform: rotate(180deg);
    }

    .modern-dropdown-menu {
      position: absolute;
      top: calc(100% + 7px);
      left: 0;
      right: 0;
      z-index: 300;
      display: none;
      max-height: 260px;
      overflow-y: auto;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #d4e0eb;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 61, 107, 0.20);
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .modern-dropdown.open .modern-dropdown-menu {
      display: block;
    }

    .modern-dropdown-option {
      position: relative;
      width: 100%;
      min-height: 45px;
      padding: 10px 40px 10px 12px;
      display: flex;
      align-items: center;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      color: #334454;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
    }

    .modern-dropdown-option:hover,
    .modern-dropdown-option:active {
      background: #eef6fd;
      color: var(--primary);
    }

    .modern-dropdown-option.selected {
      background: #e7f1fb;
      color: var(--primary);
      font-weight: 750;
    }

    .modern-dropdown-option.selected::after {
      content: "✓";
      position: absolute;
      right: 13px;
      color: var(--primary-light);
      font-size: 1rem;
      font-weight: 800;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      padding: 10px 11px;
      border: 1.4px solid #c7d7ea;
      border-radius: 8px;
      background: #f8fbfe;
      color: #1f2933;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(23, 98, 167, 0.12);
    }
    .search-wrap {
      margin-top: 9px;
    }

    .summary-card {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px;
      margin-bottom: 13px;
    }

    .summary-item {
      min-width: 0;
      padding: 8px 4px;
      text-align: center;
      border-radius: 9px;
      background: #f7fafc;
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.15;
    }

    .summary-count {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 1.15rem;
      font-weight: 800;
    }

    .summary-item.late .summary-count {
      color: var(--late);
    }

    .summary-item.uniform .summary-count {
      color: var(--uniform);
    }

    .summary-item.sign .summary-count {
      color: var(--sign);
    }

    .column-headings {
      display: grid;
      grid-template-columns: minmax(0, 1fr) repeat(3, 72px);
      gap: 7px;
      padding: 0 11px 6px;
      color: #687786;
      font-size: 0.75rem;
      font-weight: 750;
      text-align: center;
    }

    .column-headings span:first-child {
      text-align: left;
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .student-card {
      width: 100%;
      padding: 10px 11px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) repeat(3, 72px);
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(216, 228, 239, 0.95);
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    }

    .student-card:active {
      transform: scale(0.992);
    }

    .student-card:hover {
      border-color: #9ebbd6;
      box-shadow: 0 3px 12px rgba(15, 61, 107, 0.13);
    }

       .student-main {
      display: flex;
      align-items: center;
      min-width: 0;
      overflow: hidden;
    }

    .avatar {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      margin-right: 9px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e7f1fb;
      color: var(--primary);
      box-shadow: 0 0 0 2px #e9f2fb;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .student-text {
      flex: 1;
      min-width: 0;
    }

       .student-name {
      width: 100%;
      overflow: hidden;
      display: -webkit-box;
      color: #1467b7;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.18;
      white-space: normal;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .student-roll {
      display: block;
      width: 100%;
      margin-top: 3px;
      color: #748291;
      font-size: 0.79rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .count-badge {
      min-height: 35px;
      padding: 6px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-size: 0.98rem;
      font-weight: 800;
    }

    .count-badge.zero {
      background: #f3f6f8;
      color: #9aa6b2;
    }

    .count-badge.late {
      background: #fff4df;
      color: #9a4f00;
      border: 1px solid #f2cf91;
    }

    .count-badge.uniform {
      background: #fff0ee;
      color: #a4261d;
      border: 1px solid #efbbb5;
    }

    .count-badge.sign {
      background: #f5edff;
      color: #6832a1;
      border: 1px solid #d5bce9;
    }

        .date-records-section {
      margin-top: 18px;
    }

    .date-records-title {
      margin: 0 2px 10px;
      color: var(--primary);
      font-size: 1.08rem;
      font-weight: 750;
    }

    .date-record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .date-record-card {
      width: 100%;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(216, 228, 239, 0.95);
      border-radius: 11px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(15, 61, 107, 0.08);
      cursor: pointer;
    }

    .date-record-card:hover {
      border-color: #9ebbd6;
      box-shadow: 0 3px 12px rgba(15, 61, 107, 0.13);
    }

    .date-record-date {
      color: var(--primary);
      font-weight: 750;
    }

    .date-record-badges {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 5px;
    }

    .mini-badge {
      padding: 4px 7px;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .mini-badge.late {
      background: #fff4df;
      color: #9a4f00;
    }

    .mini-badge.uniform {
      background: #fff0ee;
      color: #a4261d;
    }

    .mini-badge.sign {
      background: #f5edff;
      color: #6832a1;
    }

    .mini-badge.clear {
      background: #eaf7f0;
      color: var(--success);
    }

    .excel-btn {
      background: #18794e;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(24, 121, 78, 0.25);
    }

    .excel-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .message-card {
      padding: 22px 14px;
      text-align: center;
      color: #71808e;
    }
    .message-card.error {
      color: #b42318;
    }

    .bottom-actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.98);
      border-top: 1px solid #d7e3ee;
      box-shadow: 0 -5px 20px rgba(15, 61, 107, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .bottom-actions button {
      appearance: none;
      -webkit-appearance: none;
      flex: 1 1 0;
      width: auto;
      max-width: 300px;
      min-height: 48px;
      margin: 0;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-btn {
      background: #e8f0f7;
      color: var(--primary);
      border: 1px solid #bfd1e1 !important;
    }

    .refresh-btn {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(15, 61, 107, 0.28);
    }

    .refresh-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.56);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .detail-modal {
      width: min(520px, 100%);
      max-height: 86vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
    }

    .detail-header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: #fff;
      border-radius: 15px 15px 0 0;
    }

    .detail-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .detail-title {
      overflow: hidden;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-subtitle {
      margin-top: 2px;
      color: #c9e4ff;
      font-size: 0.82rem;
    }

    .close-btn {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 1.35rem;
      cursor: pointer;
    }

    .detail-body {
      padding: 13px;
    }

    .detail-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }

    .detail-summary-item {
      padding: 9px 5px;
      text-align: center;
      border-radius: 9px;
      background: #f7fafc;
      color: #506171;
      font-size: 0.77rem;
      font-weight: 700;
    }

    .detail-summary-item strong {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .issue-section {
      margin-top: 11px;
      border: 1px solid #e2eaf1;
      border-radius: 10px;
      overflow: hidden;
    }

    .issue-heading {
      padding: 9px 11px;
      font-weight: 750;
    }

    .issue-heading.late {
      background: #fff4df;
      color: #9a4f00;
    }

    .issue-heading.uniform {
      background: #fff0ee;
      color: #a4261d;
    }

    .issue-heading.sign {
      background: #f5edff;
      color: #6832a1;
    }

    .detail-entry {
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid #eef2f5;
      font-size: 0.9rem;
    }

    .detail-entry:first-child {
      border-top: none;
    }

    .detail-date {
      font-weight: 650;
    }

    .detail-note {
      color: #71808e;
      text-align: right;
    }

    .empty-detail {
      padding: 11px;
      color: #8a97a4;
      font-size: 0.88rem;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      z-index: 4000;
      width: min(430px, calc(100% - 30px));
      padding: 11px 14px;
      border-radius: 10px;
      background: #17324d;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.24);
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: #a4261d;
    }

    @media (max-width: 560px) {
      .main-content {
        padding-left: 9px;
        padding-right: 9px;
      }

      .summary-card {
        grid-template-columns: repeat(2, 1fr);
      }

      .column-headings {
        grid-template-columns: minmax(0, 1fr) repeat(3, 56px);
        gap: 5px;
        padding-left: 9px;
        padding-right: 9px;
        font-size: 0.67rem;
      }

      .student-card {
        grid-template-columns: minmax(0, 1fr) repeat(3, 56px);
        gap: 5px;
        padding-left: 9px;
        padding-right: 9px;
      }

      .avatar {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
        margin-right: 7px;
      }

      .student-name {
        font-size: 0.93rem;
      }

      .count-badge {
        min-height: 33px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 390px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .column-headings {
        grid-template-columns: minmax(0, 1fr) repeat(3, 48px);
      }

      .student-card {
        grid-template-columns: minmax(0, 1fr) repeat(3, 48px);
      }

      .student-roll {
        font-size: 0.73rem;
      }
    }
  </style>
</head>

<body>
  <header class="fixed-header">
    <div class="school-title">St. Patrick's School</div>
    <div class="school-subtitle">IIT &amp; NEET FOUNDATION</div>
    <div class="academic-year" id="academicYearText"></div>
  </header>

  <main class="main-content">
    <div class="title-row">
      <h1 class="page-title">Discipline History</h1>
      <div class="class-section" id="classSectionText"></div>
    </div>

    <section class="filter-card">
      <div class="filter-title">View Records</div>

      <div class="filter-grid">
               <div>
          <label class="field-label">Month</label>

          <div class="modern-dropdown" id="monthDropdown">
            <button
              type="button"
              class="modern-dropdown-button"
              id="monthDropdownButton"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span id="monthDropdownText">All Months</span>
              <span class="dropdown-chevron">▼</span>
            </button>

            <div
              class="modern-dropdown-menu"
              id="monthDropdownMenu"
              role="listbox"
            >
              <button type="button" class="modern-dropdown-option" data-value="all">
                All Months
              </button>

              <button type="button" class="modern-dropdown-option" data-value="01">
                January
              </button>

              <button type="button" class="modern-dropdown-option" data-value="02">
                February
              </button>

              <button type="button" class="modern-dropdown-option" data-value="03">
                March
              </button>

              <button type="button" class="modern-dropdown-option" data-value="04">
                April
              </button>

              <button type="button" class="modern-dropdown-option" data-value="05">
                May
              </button>

              <button type="button" class="modern-dropdown-option" data-value="06">
                June
              </button>

              <button type="button" class="modern-dropdown-option" data-value="07">
                July
              </button>

              <button type="button" class="modern-dropdown-option" data-value="08">
                August
              </button>

              <button type="button" class="modern-dropdown-option" data-value="09">
                September
              </button>

              <button type="button" class="modern-dropdown-option" data-value="10">
                October
              </button>

              <button type="button" class="modern-dropdown-option" data-value="11">
                November
              </button>

              <button type="button" class="modern-dropdown-option" data-value="12">
                December
              </button>
            </div>
          </div>
        </div>

        <div>
          <label class="field-label">Year</label>

          <div class="modern-dropdown" id="yearDropdown">
            <button
              type="button"
              class="modern-dropdown-button"
              id="yearDropdownButton"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span id="yearDropdownText">All Years</span>
              <span class="dropdown-chevron">▼</span>
            </button>

            <div
              class="modern-dropdown-menu"
              id="yearDropdownMenu"
              role="listbox"
            ></div>
          </div>
        </div>
      </div>

      <div class="search-wrap">
        <label class="field-label" for="studentSearch">Search Student</label>
        <input
          class="search-input"
          type="search"
          id="studentSearch"
          placeholder="Enter student name or roll number"
          autocomplete="off"
        >
      </div>
    </section>

    <section class="summary-card" aria-label="Discipline summary">
      <div class="summary-item">
        <span class="summary-label">Record Days</span>
        <span class="summary-count" id="recordDaysCount">0</span>
      </div>

      <div class="summary-item late">
        <span class="summary-label">Late</span>
        <span class="summary-count" id="lateCount">0</span>
      </div>

      <div class="summary-item uniform">
        <span class="summary-label">No Uniform</span>
        <span class="summary-count" id="uniformCount">0</span>
      </div>

      <div class="summary-item sign">
        <span class="summary-label">No Sign</span>
        <span class="summary-count" id="signCount">0</span>
      </div>
    </section>

    <div class="column-headings" aria-hidden="true">
      <span>Student</span>
      <span>Late</span>
      <span>Uniform</span>
      <span>Sign</span>
    </div>

       <section class="student-list" id="studentList">
      <div class="message-card">Loading discipline history...</div>
    </section>

    <section class="date-records-section">
      <h2 class="date-records-title">Date-wise Discipline Records</h2>

      <div class="date-record-list" id="dateRecordList">
        <div class="message-card">Loading date-wise records...</div>
      </div>
    </section>
  </main>

    <div class="bottom-actions">
    <button type="button" id="backBtn" class="back-btn">← Back</button>

    <button type="button" id="downloadExcelBtn" class="excel-btn">
      Download Excel
    </button>

    <button type="button" id="refreshBtn" class="refresh-btn">Refresh</button>
  </div>

  <div class="modal-backdrop" id="detailBackdrop">
    <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-header">
        <div class="detail-title-wrap">
          <div class="detail-title" id="detailTitle">Student Discipline Details</div>
          <div class="detail-subtitle" id="detailSubtitle"></div>
        </div>

        <button type="button" class="close-btn" id="detailCloseBtn" aria-label="Close">×</button>
      </div>

      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.firebasestorage.app",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const auth = firebase.auth();

    const academicYear = localStorage.getItem("sp_selectedYear") || "";
    const currentClassId = localStorage.getItem("sp_selectedClassId") || "";
    const currentClassName = localStorage.getItem("sp_selectedClassName") || "";
    const currentSectionId = localStorage.getItem("sp_selectedSectionId") || "";
    const currentSectionName = localStorage.getItem("sp_selectedSectionName") || "";

    const academicYearText = document.getElementById("academicYearText");
    const classSectionText = document.getElementById("classSectionText");
        const monthDropdown = document.getElementById("monthDropdown");
    const monthDropdownButton = document.getElementById("monthDropdownButton");
    const monthDropdownText = document.getElementById("monthDropdownText");
    const monthDropdownMenu = document.getElementById("monthDropdownMenu");

    const yearDropdown = document.getElementById("yearDropdown");
    const yearDropdownButton = document.getElementById("yearDropdownButton");
    const yearDropdownText = document.getElementById("yearDropdownText");
    const yearDropdownMenu = document.getElementById("yearDropdownMenu");

    const studentSearch = document.getElementById("studentSearch");
        const studentList = document.getElementById("studentList");
    const dateRecordList = document.getElementById("dateRecordList");
    const downloadExcelBtn = document.getElementById("downloadExcelBtn");
    const recordDaysCount = document.getElementById("recordDaysCount");
    const lateCount = document.getElementById("lateCount");
    const uniformCount = document.getElementById("uniformCount");
    const signCount = document.getElementById("signCount");
    const backBtn = document.getElementById("backBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const detailBackdrop = document.getElementById("detailBackdrop");
    const detailCloseBtn = document.getElementById("detailCloseBtn");
    const detailTitle = document.getElementById("detailTitle");
    const detailSubtitle = document.getElementById("detailSubtitle");
    const detailBody = document.getElementById("detailBody");
    const toast = document.getElementById("toast");

        let students = [];
    let disciplineDocuments = [];
    let filteredDocuments = [];
    let studentSummaries = new Map();
    let toastTimer = null;

    const currentDate = new Date();

    let selectedMonth = String(
      currentDate.getMonth() + 1
    ).padStart(2, "0");

    let selectedYear = String(
      currentDate.getFullYear()
    );

    const monthNames = {
      all: "All Months",
      "01": "January",
      "02": "February",
      "03": "March",
      "04": "April",
      "05": "May",
      "06": "June",
      "07": "July",
      "08": "August",
      "09": "September",
      "10": "October",
      "11": "November",
      "12": "December"
    };
       academicYearText.textContent = academicYear;

    classSectionText.textContent = [
      currentClassName,
      currentSectionName
    ]
      .filter(Boolean)
      .join(" – ");

    setupModernDropdown(
      monthDropdown,
      monthDropdownButton,
      monthDropdownMenu,
      monthDropdownText,
      function (value) {
        selectedMonth = value;
        applyFilters();
      }
    );

    setupModernDropdown(
      yearDropdown,
      yearDropdownButton,
      yearDropdownMenu,
      yearDropdownText,
      function (value) {
        selectedYear = value;
        applyFilters();
      }
    );

    setDropdownSelection(
      monthDropdown,
      monthDropdownButton,
      monthDropdownMenu,
      monthDropdownText,
      selectedMonth,
      monthNames[selectedMonth] || "All Months"
    );

    function studentsCollection() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("students");
    }

    function disciplineCollection() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("disciplineRegister");
    }

    function escapeHtml(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getInitials(name = "") {
      const parts = String(name).trim().split(/\s+/).filter(Boolean);
      const first = parts[0] ? parts[0][0] : "";
      const second = parts[1] ? parts[1][0] : "";
      return (first + second).toUpperCase() || "S";
    }

    function showToast(message, type = "success") {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", type === "error");
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

        function closeAllDropdowns(exceptDropdown = null) {
      document.querySelectorAll(".modern-dropdown").forEach(function (dropdown) {
        if (dropdown === exceptDropdown) {
          return;
        }

        dropdown.classList.remove("open");

        const button = dropdown.querySelector(
          ".modern-dropdown-button"
        );

        if (button) {
          button.setAttribute("aria-expanded", "false");
        }
      });
    }

    function setDropdownSelection(
      dropdown,
      button,
      menu,
      textElement,
      value,
      label
    ) {
      dropdown.dataset.value = value;
      textElement.textContent = label;

      menu.querySelectorAll(".modern-dropdown-option").forEach(function (option) {
        option.classList.toggle(
          "selected",
          option.dataset.value === value
        );
      });

      dropdown.classList.remove("open");
      button.setAttribute("aria-expanded", "false");
    }

    function setupModernDropdown(
      dropdown,
      button,
      menu,
      textElement,
      onChange
    ) {
      button.addEventListener("click", function (event) {
        event.stopPropagation();

        const shouldOpen =
          !dropdown.classList.contains("open");

        closeAllDropdowns(dropdown);

        dropdown.classList.toggle(
          "open",
          shouldOpen
        );

        button.setAttribute(
          "aria-expanded",
          shouldOpen ? "true" : "false"
        );
      });

      menu.addEventListener("click", function (event) {
        const option = event.target.closest(
          ".modern-dropdown-option"
        );

        if (!option) {
          return;
        }

        event.stopPropagation();

        const value = option.dataset.value || "all";
        const label = option.textContent.trim();

        setDropdownSelection(
          dropdown,
          button,
          menu,
          textElement,
          value,
          label
        );

        if (typeof onChange === "function") {
          onChange(value, label);
        }
      });
    }

    function getAcademicYearValues() {
      const match = String(academicYear).match(
        /(\d{4})\D+(\d{2,4})/
      );

      if (!match) {
        return [];
      }

      const startYear = Number(match[1]);
      let endYear = Number(match[2]);

      if (match[2].length === 2) {
        const century =
          Math.floor(startYear / 100) * 100;

        endYear = century + endYear;

        if (endYear < startYear) {
          endYear += 100;
        }
      }

      return [
        String(startYear),
        String(endYear)
      ];
    }

    function isValidDateDocumentId(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
    }

    function formatDate(dateString) {
      if (!isValidDateDocumentId(dateString)) {
        return dateString || "";
      }

      const [year, month, day] = dateString.split("-");
      return `${day}-${month}-${year}`;
    }

    function compareRolls(a, b) {
      const aRoll = Number(a.roll);
      const bRoll = Number(b.roll);

      if (Number.isFinite(aRoll) && Number.isFinite(bRoll)) {
        return aRoll - bRoll;
      }

      if (Number.isFinite(aRoll)) return -1;
      if (Number.isFinite(bRoll)) return 1;

      return String(a.roll || "").localeCompare(
        String(b.roll || ""),
        undefined,
        { numeric: true, sensitivity: "base" }
      );
    }

    function emptySummary(studentId) {
      return {
        studentId,
        late: 0,
        noUniform: 0,
        noSign: 0,
        lateEntries: [],
        uniformEntries: [],
        signEntries: []
      };
    }

       function setLoading(isLoading) {
      refreshBtn.disabled = isLoading;
      downloadExcelBtn.disabled = isLoading;

      refreshBtn.textContent = isLoading
        ? "Loading..."
        : "Refresh";

      if (isLoading) {
        studentList.innerHTML =
          '<div class="message-card">Loading discipline history...</div>';

        dateRecordList.innerHTML =
          '<div class="message-card">Loading date-wise records...</div>';
      }
    }

    auth.onAuthStateChanged(async function (user) {
      if (!user) {
        window.location.replace("index.html");
        return;
      }

      if (!academicYear || !currentClassId || !currentSectionId) {
        studentList.innerHTML = `
          <div class="message-card error">
            Class or Section is not selected. Please go back and select it again.
          </div>
        `;
        refreshBtn.disabled = true;
        return;
      }

      await loadDisciplineHistory();
    });

    async function loadDisciplineHistory() {
      setLoading(true);

      try {
        const [studentSnapshot, disciplineSnapshot] = await Promise.all([
          studentsCollection().orderBy("roll").get(),
          disciplineCollection()
            .orderBy(firebase.firestore.FieldPath.documentId())
            .get()
        ]);

        students = [];
        studentSnapshot.forEach(function (doc) {
          const data = doc.data() || {};

          if (!data.isDeleted) {
            students.push({
              id: doc.id,
              ...data
            });
          }
        });

        students.sort(compareRolls);

        disciplineDocuments = [];
        disciplineSnapshot.forEach(function (doc) {
          if (!isValidDateDocumentId(doc.id)) {
            return;
          }

          disciplineDocuments.push({
            id: doc.id,
            data: doc.data() || {}
          });
        });

        populateYearFilter();
        applyFilters();
      } catch (error) {
        console.error("Discipline history load failed:", error);

        studentList.innerHTML = `
          <div class="message-card error">
            Unable to load discipline history. Please try again.
          </div>
        `;

        showToast("Unable to load discipline history.", "error");
      } finally {
        setLoading(false);
      }
    }

        function populateYearFilter() {
      const yearsSet = new Set(
        getAcademicYearValues()
      );

      yearsSet.add(
        String(currentDate.getFullYear())
      );

      disciplineDocuments.forEach(function (item) {
        yearsSet.add(
          item.id.substring(0, 4)
        );
      });

      const years = Array.from(yearsSet)
        .filter(function (year) {
          return /^\d{4}$/.test(year);
        })
        .sort(function (a, b) {
          return Number(a) - Number(b);
        });

      yearDropdownMenu.innerHTML = `
        <button
          type="button"
          class="modern-dropdown-option"
          data-value="all"
        >
          All Years
        </button>

        ${years.map(function (year) {
          return `
            <button
              type="button"
              class="modern-dropdown-option"
              data-value="${escapeHtml(year)}"
            >
              ${escapeHtml(year)}
            </button>
          `;
        }).join("")}
      `;

      const presentYear = String(
        currentDate.getFullYear()
      );

      selectedYear = years.includes(presentYear)
        ? presentYear
        : (years[0] || "all");

      setDropdownSelection(
        yearDropdown,
        yearDropdownButton,
        yearDropdownMenu,
        yearDropdownText,
        selectedYear,
        selectedYear === "all"
          ? "All Years"
          : selectedYear
      );
    }

        function applyFilters() {
      const searchValue =
        studentSearch.value.trim().toLowerCase();

      filteredDocuments = disciplineDocuments.filter(function (item) {
        const yearMatches =
          selectedYear === "all" ||
          item.id.startsWith(`${selectedYear}-`);

        const monthMatches =
          selectedMonth === "all" ||
          item.id.substring(5, 7) === selectedMonth;

        return yearMatches && monthMatches;
      });

            buildStudentSummaries();
      updateSummaryCounts();
      renderStudents(searchValue);
      renderDateRecords();
    }

    function buildStudentSummaries() {
      studentSummaries = new Map();

      for (const student of students) {
        studentSummaries.set(student.id, emptySummary(student.id));
      }

      for (const registerDocument of filteredDocuments) {
        const documentData = registerDocument.data || {};

        for (const student of students) {
          const entry = documentData[student.id];

          if (!entry || typeof entry !== "object") {
            continue;
          }

          const summary = studentSummaries.get(student.id);

          if (entry.late === true) {
            summary.late += 1;
            summary.lateEntries.push({
              date: registerDocument.id,
              lateMinutes: Number(entry.lateMinutes) > 0
                ? Number(entry.lateMinutes)
                : null
            });
          }

          if (entry.noUniform === true) {
            summary.noUniform += 1;
            summary.uniformEntries.push({
              date: registerDocument.id
            });
          }

          if (entry.noSign === true) {
            summary.noSign += 1;
            summary.signEntries.push({
              date: registerDocument.id
            });
          }
        }
      }

      for (const summary of studentSummaries.values()) {
        summary.lateEntries.sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });

        summary.uniformEntries.sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });

        summary.signEntries.sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });
      }
    }

    function updateSummaryCounts() {
      let totalLate = 0;
      let totalUniform = 0;
      let totalSign = 0;

      for (const summary of studentSummaries.values()) {
        totalLate += summary.late;
        totalUniform += summary.noUniform;
        totalSign += summary.noSign;
      }

      recordDaysCount.textContent = filteredDocuments.length;
      lateCount.textContent = totalLate;
      uniformCount.textContent = totalUniform;
      signCount.textContent = totalSign;
    }

    function badgeHtml(count, issueClass) {
      if (!count) {
        return '<span class="count-badge zero">0</span>';
      }

      return `
        <span class="count-badge ${issueClass}">
          ${count}
        </span>
      `;
    }

    function renderStudents(searchValue = "") {
      if (!students.length) {
        studentList.innerHTML =
          '<div class="message-card">No students found.</div>';
        return;
      }

      const matchingStudents = students.filter(function (student) {
        if (!searchValue) return true;

        const name = String(student.name || "").toLowerCase();
        const roll = String(student.roll || "").toLowerCase();

        return name.includes(searchValue) || roll.includes(searchValue);
      });

      if (!matchingStudents.length) {
        studentList.innerHTML =
          '<div class="message-card">No matching students found.</div>';
        return;
      }

      studentList.innerHTML = matchingStudents.map(function (student) {
        const summary =
          studentSummaries.get(student.id) ||
          emptySummary(student.id);

        const safeName = escapeHtml(student.name || "Student");
        const safePhoto = escapeHtml(student.photoUrl || "");
        const safeRoll = escapeHtml(student.roll || "");

        const avatar = safePhoto
          ? `<div class="avatar"><img src="${safePhoto}" alt="${safeName}"></div>`
          : `<div class="avatar">${escapeHtml(getInitials(student.name || ""))}</div>`;

        return `
          <button
            type="button"
            class="student-card"
            data-student-id="${escapeHtml(student.id)}"
            aria-label="View discipline details for ${safeName}"
          >
            <span class="student-main">
              ${avatar}

              <span class="student-text">
                <span class="student-name">${safeName}</span>
                <span class="student-roll">
                  Roll Number: ${safeRoll || "—"}
                </span>
              </span>
            </span>

            ${badgeHtml(summary.late, "late")}
            ${badgeHtml(summary.noUniform, "uniform")}
            ${badgeHtml(summary.noSign, "sign")}
          </button>
        `;
      }).join("");

      studentList.querySelectorAll(".student-card").forEach(function (card) {
        card.addEventListener("click", function () {
          openStudentDetails(this.dataset.studentId);
        });
      });
    }

           function getDocumentTotals(documentData = {}) {
      let late = 0;
      let noUniform = 0;
      let noSign = 0;

      students.forEach(function (student) {
        const entry = documentData[student.id];

        if (!entry || typeof entry !== "object") {
          return;
        }

        if (entry.late === true) late += 1;
        if (entry.noUniform === true) noUniform += 1;
        if (entry.noSign === true) noSign += 1;
      });

      return {
        late,
        noUniform,
        noSign
      };
    }

    function renderDateRecords() {
      if (!filteredDocuments.length) {
        dateRecordList.innerHTML = `
          <div class="message-card">
            No discipline records found for the selected period.
          </div>
        `;
        return;
      }

      const sortedDocuments = [...filteredDocuments].sort(function (a, b) {
        return b.id.localeCompare(a.id);
      });

      dateRecordList.innerHTML = sortedDocuments.map(function (item) {
        const totals = getDocumentTotals(item.data);

        const badges =
          totals.late || totals.noUniform || totals.noSign
            ? `
              <span class="mini-badge late">Late: ${totals.late}</span>
              <span class="mini-badge uniform">Uniform: ${totals.noUniform}</span>
              <span class="mini-badge sign">Sign: ${totals.noSign}</span>
            `
            : '<span class="mini-badge clear">No Issues</span>';

        return `
          <button
            type="button"
            class="date-record-card"
            data-date="${escapeHtml(item.id)}"
          >
            <span class="date-record-date">
              ${escapeHtml(formatDate(item.id))}
            </span>

            <span class="date-record-badges">
              ${badges}
            </span>
          </button>
        `;
      }).join("");

      dateRecordList
        .querySelectorAll(".date-record-card")
        .forEach(function (button) {
          button.addEventListener("click", function () {
            openDateDetails(this.dataset.date);
          });
        });
    }

    function openDateDetails(date) {
      const registerDocument = filteredDocuments.find(function (item) {
        return item.id === date;
      });

      if (!registerDocument) {
        showToast("Discipline record was not found.", "error");
        return;
      }

      const documentData = registerDocument.data || {};
      const totals = getDocumentTotals(documentData);

      const affectedStudents = students.filter(function (student) {
        const entry = documentData[student.id];

        return entry && (
          entry.late === true ||
          entry.noUniform === true ||
          entry.noSign === true
        );
      });

      detailTitle.textContent =
        `Discipline: ${formatDate(date)}`;

      detailSubtitle.textContent = [
        currentClassName,
        currentSectionName
      ].filter(Boolean).join(" – ");

      const studentRows = affectedStudents.length
        ? affectedStudents.map(function (student) {
            const entry = documentData[student.id] || {};
            const issues = [];

            if (entry.late === true) {
              const minutes = Number(entry.lateMinutes);

              issues.push(
                minutes > 0
                  ? `Late (${minutes} minutes)`
                  : "Late"
              );
            }

            if (entry.noUniform === true) {
              issues.push("No Uniform");
            }

            if (entry.noSign === true) {
              issues.push("No Sign");
            }

            return `
              <div class="detail-entry">
                <span class="detail-date">
                  ${escapeHtml(student.roll || "—")}.
                  ${escapeHtml(student.name || "Student")}
                </span>

                <span class="detail-note">
                  ${escapeHtml(issues.join(", "))}
                </span>
              </div>
            `;
          }).join("")
        : `
          <div class="empty-detail">
            No discipline issues were recorded on this date.
          </div>
        `;

      detailBody.innerHTML = `
        <div class="detail-summary">
          <div class="detail-summary-item">
            Late
            <strong>${totals.late}</strong>
          </div>

          <div class="detail-summary-item">
            No Uniform
            <strong>${totals.noUniform}</strong>
          </div>

          <div class="detail-summary-item">
            No Sign
            <strong>${totals.noSign}</strong>
          </div>
        </div>

        <section class="issue-section">
          <div class="issue-heading late">
            Student Discipline Details
          </div>

          ${studentRows}
        </section>
      `;

      detailBackdrop.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function safeFileNamePart(value) {
      return String(value || "")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, "_") || "Report";
    }

    function downloadDisciplineExcel() {
      if (selectedMonth === "all" || selectedYear === "all") {
        showToast(
          "Please select one month and one year before downloading.",
          "error"
        );
        return;
      }

      if (!filteredDocuments.length) {
        showToast(
          "No discipline records are available for the selected month.",
          "error"
        );
        return;
      }

      if (typeof XLSX === "undefined") {
        showToast("Excel library could not be loaded.", "error");
        return;
      }

      downloadExcelBtn.disabled = true;
      downloadExcelBtn.textContent = "Preparing...";

      try {
        const reportRows = [];

        const sortedDocuments = [...filteredDocuments].sort(function (a, b) {
          return a.id.localeCompare(b.id);
        });

        sortedDocuments.forEach(function (registerDocument) {
          const documentData = registerDocument.data || {};

          students.forEach(function (student) {
            const entry = documentData[student.id];

            if (!entry || typeof entry !== "object") {
              return;
            }

            const hasIssue =
              entry.late === true ||
              entry.noUniform === true ||
              entry.noSign === true;

            if (!hasIssue) {
              return;
            }

            reportRows.push([
              formatDate(registerDocument.id),
              student.roll || "",
              student.name || "",
              entry.late === true ? "Yes" : "",
              entry.late === true && Number(entry.lateMinutes) > 0
                ? Number(entry.lateMinutes)
                : "",
              entry.noUniform === true ? "Yes" : "",
              entry.noSign === true ? "Yes" : ""
            ]);
          });
        });

        if (!reportRows.length) {
          showToast(
            "No discipline issues were recorded for the selected month.",
            "error"
          );
          return;
        }

        const reportTitle = [
          currentClassName,
          currentSectionName,
          monthNames[selectedMonth],
          selectedYear,
          "Discipline Report"
        ].filter(Boolean).join(" – ");

        const excelData = [
          [reportTitle],
          [
            "Date",
            "Roll Number",
            "Student Name",
            "Late",
            "Late Minutes",
            "No Uniform",
            "No Sign"
          ],
          ...reportRows
        ];

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);

        worksheet["!merges"] = [
          {
            s: { r: 0, c: 0 },
            e: { r: 0, c: 6 }
          }
        ];

        worksheet["!cols"] = [
          { wch: 14 },
          { wch: 13 },
          { wch: 28 },
          { wch: 10 },
          { wch: 14 },
          { wch: 14 },
          { wch: 12 }
        ];

        worksheet["!autofilter"] = {
          ref: `A2:G${excelData.length}`
        };

        const workbook = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(
          workbook,
          worksheet,
          "Discipline Report"
        );

        const fileName = [
          "Discipline",
          monthNames[selectedMonth],
          selectedYear,
          currentClassName,
          currentSectionName
        ]
          .filter(Boolean)
          .map(safeFileNamePart)
          .join("_");

        XLSX.writeFile(
          workbook,
          `${fileName}.xlsx`
        );

        showToast("Discipline Excel downloaded.");
      } catch (error) {
        console.error("Discipline Excel download failed:", error);

        showToast(
          "Unable to download the discipline Excel file.",
          "error"
        );
      } finally {
        downloadExcelBtn.disabled = false;
        downloadExcelBtn.textContent = "Download Excel";
      }
    }

       function selectedPeriodText() {
      const monthText =
        monthNames[selectedMonth] || "All Months";

      const yearText =
        selectedYear === "all"
          ? "All Years"
          : selectedYear;

      if (
        selectedMonth === "all" &&
        selectedYear === "all"
      ) {
        return "All available records";
      }

      if (selectedMonth === "all") {
        return `All months – ${yearText}`;
      }

      if (selectedYear === "all") {
        return `${monthText} – All years`;
      }

      return `${monthText} ${yearText}`;
    }
    function issueEntriesHtml(entries, type) {
      if (!entries.length) {
        return '<div class="empty-detail">No records found.</div>';
      }

      return entries.map(function (entry) {
        let note = "";

        if (type === "late") {
          note = entry.lateMinutes
            ? `${entry.lateMinutes} minutes late`
            : "Late";
        } else if (type === "uniform") {
          note = "No Uniform";
        } else {
          note = "No Sign";
        }

        return `
          <div class="detail-entry">
            <span class="detail-date">${escapeHtml(formatDate(entry.date))}</span>
            <span class="detail-note">${escapeHtml(note)}</span>
          </div>
        `;
      }).join("");
    }

    function openStudentDetails(studentId) {
      const student = students.find(function (item) {
        return item.id === studentId;
      });

      if (!student) {
        showToast("Student details were not found.", "error");
        return;
      }

      const summary =
        studentSummaries.get(studentId) ||
        emptySummary(studentId);

      detailTitle.textContent = student.name || "Student";
      detailSubtitle.textContent =
        `Roll ${student.roll || "—"} • ${selectedPeriodText()}`;

      detailBody.innerHTML = `
        <div class="detail-summary">
          <div class="detail-summary-item">
            Late
            <strong>${summary.late}</strong>
          </div>

          <div class="detail-summary-item">
            No Uniform
            <strong>${summary.noUniform}</strong>
          </div>

          <div class="detail-summary-item">
            No Sign
            <strong>${summary.noSign}</strong>
          </div>
        </div>

        <section class="issue-section">
          <div class="issue-heading late">Late Dates</div>
          ${issueEntriesHtml(summary.lateEntries, "late")}
        </section>

        <section class="issue-section">
          <div class="issue-heading uniform">No Uniform Dates</div>
          ${issueEntriesHtml(summary.uniformEntries, "uniform")}
        </section>

        <section class="issue-section">
          <div class="issue-heading sign">No Sign Dates</div>
          ${issueEntriesHtml(summary.signEntries, "sign")}
        </section>
      `;

      detailBackdrop.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeStudentDetails() {
      detailBackdrop.classList.remove("show");
      document.body.style.overflow = "";
    }

       studentSearch.addEventListener(
      "input",
      applyFilters
    );

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".modern-dropdown")) {
        closeAllDropdowns();
      }
    });

        downloadExcelBtn.addEventListener(
      "click",
      downloadDisciplineExcel
    );

    refreshBtn.addEventListener(
      "click",
      loadDisciplineHistory
    );

    backBtn.addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "students.html";
      }
    });

    detailCloseBtn.addEventListener("click", closeStudentDetails);

    detailBackdrop.addEventListener("click", function (event) {
      if (event.target === detailBackdrop) {
        closeStudentDetails();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && detailBackdrop.classList.contains("show")) {
        closeStudentDetails();
      }
    });
  </script>
</body>
</html>
