<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Discipline - St. Patrick's School</title>

  <style>
    :root {
      --primary: #0f3d6b;
      --primary-light: #1762a7;
      --page-bg: #f4f8fc;
      --card-bg: #ffffff;
      --border: #d8e4ef;
      --muted: #687786;
      --late: #d97706;
      --uniform: #b42318;
      --sign: #7a3db8;
      --success: #18794e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--page-bg);
      color: #1f2933;
    }

    body {
      padding-bottom: 86px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      width: 100%;
      padding: 16px 12px 10px;
      text-align: center;
      color: #fff;
      background: var(--primary);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 4px 14px rgba(15, 61, 107, 0.20);
    }

    .school-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .school-subtitle {
      margin-top: 2px;
      color: #c9e4ff;
      font-size: 0.92rem;
    }

    .academic-year {
      min-height: 22px;
      margin-top: 4px;
      color: #fdc600;
      font-size: 1.03rem;
      font-weight: 700;
    }

    .main-content {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 116px 12px 28px;
    }

    .title-row {
      margin: 10px 2px 14px;
    }

    .page-title {
      margin: 0;
      color: var(--primary);
      font-size: 1.42rem;
      font-weight: 750;
    }

    .class-section {
      margin-top: 4px;
      color: #506171;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .filter-card,
    .summary-card,
    .student-card,
    .message-card {
      background: var(--card-bg);
      border: 1px solid rgba(216, 228, 239, 0.95);
      border-radius: 13px;
      box-shadow: 0 2px 9px rgba(15, 61, 107, 0.09);
    }

    .filter-card {
      padding: 13px;
      margin-bottom: 12px;
    }

    .filter-title {
      margin-bottom: 9px;
      color: var(--primary);
      font-weight: 750;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      color: #506171;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .filter-select,
    .search-input {
      width: 100%;
      min-width: 0;
      padding: 10px 11px;
      border: 1.4px solid #c7d7ea;
      border-radius: 8px;
      background: #f8fbfe;
      color: #1f2933;
      outline: none;
    }

    .filter-select:focus,
    .search-input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(23, 98, 167, 0.12);
    }

    .search-wrap {
      margin-top: 9px;
    }

    .summary-card {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px;
      margin-bottom: 13px;
    }

    .summary-item {
      min-width: 0;
      padding: 8px 4px;
      text-align: center;
      border-radius: 9px;
      background: #f7fafc;
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.15;
    }

    .summary-count {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 1.15rem;
      font-weight: 800;
    }

    .summary-item.late .summary-count {
      color: var(--late);
    }

    .summary-item.uniform .summary-count {
      color: var(--uniform);
    }

    .summary-item.sign .summary-count {
      color: var(--sign);
    }

    .column-headings {
      display: grid;
      grid-template-columns: minmax(0, 1fr) repeat(3, 72px);
      gap: 7px;
      padding: 0 11px 6px;
      color: #687786;
      font-size: 0.75rem;
      font-weight: 750;
      text-align: center;
    }

    .column-headings span:first-child {
      text-align: left;
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .student-card {
      width: 100%;
      padding: 10px 11px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) repeat(3, 72px);
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(216, 228, 239, 0.95);
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    }

    .student-card:active {
      transform: scale(0.992);
    }

    .student-card:hover {
      border-color: #9ebbd6;
      box-shadow: 0 3px 12px rgba(15, 61, 107, 0.13);
    }

    .student-main {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .avatar {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      margin-right: 9px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e7f1fb;
      color: var(--primary);
      box-shadow: 0 0 0 2px #e9f2fb;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .student-text {
      flex: 1;
      min-width: 0;
    }

    .student-name {
      overflow: hidden;
      color: #1467b7;
      font-size: 1rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-roll {
      margin-top: 2px;
      color: #748291;
      font-size: 0.79rem;
    }

    .count-badge {
      min-height: 35px;
      padding: 6px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-size: 0.98rem;
      font-weight: 800;
    }

    .count-badge.zero {
      background: #f3f6f8;
      color: #9aa6b2;
    }

    .count-badge.late {
      background: #fff4df;
      color: #9a4f00;
      border: 1px solid #f2cf91;
    }

    .count-badge.uniform {
      background: #fff0ee;
      color: #a4261d;
      border: 1px solid #efbbb5;
    }

    .count-badge.sign {
      background: #f5edff;
      color: #6832a1;
      border: 1px solid #d5bce9;
    }

    .message-card {
      padding: 22px 14px;
      text-align: center;
      color: #71808e;
    }

    .message-card.error {
      color: #b42318;
    }

    .bottom-actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.98);
      border-top: 1px solid #d7e3ee;
      box-shadow: 0 -5px 20px rgba(15, 61, 107, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .bottom-actions button {
      appearance: none;
      -webkit-appearance: none;
      flex: 1 1 0;
      width: auto;
      max-width: 300px;
      min-height: 48px;
      margin: 0;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-btn {
      background: #e8f0f7;
      color: var(--primary);
      border: 1px solid #bfd1e1 !important;
    }

    .refresh-btn {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(15, 61, 107, 0.28);
    }

    .refresh-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.56);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .detail-modal {
      width: min(520px, 100%);
      max-height: 86vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
    }

    .detail-header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: #fff;
      border-radius: 15px 15px 0 0;
    }

    .detail-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .detail-title {
      overflow: hidden;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-subtitle {
      margin-top: 2px;
      color: #c9e4ff;
      font-size: 0.82rem;
    }

    .close-btn {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 1.35rem;
      cursor: pointer;
    }

    .detail-body {
      padding: 13px;
    }

    .detail-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }

    .detail-summary-item {
      padding: 9px 5px;
      text-align: center;
      border-radius: 9px;
      background: #f7fafc;
      color: #506171;
      font-size: 0.77rem;
      font-weight: 700;
    }

    .detail-summary-item strong {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .issue-section {
      margin-top: 11px;
      border: 1px solid #e2eaf1;
      border-radius: 10px;
      overflow: hidden;
    }

    .issue-heading {
      padding: 9px 11px;
      font-weight: 750;
    }

    .issue-heading.late {
      background: #fff4df;
      color: #9a4f00;
    }

    .issue-heading.uniform {
      background: #fff0ee;
      color: #a4261d;
    }

    .issue-heading.sign {
      background: #f5edff;
      color: #6832a1;
    }

    .detail-entry {
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid #eef2f5;
      font-size: 0.9rem;
    }

    .detail-entry:first-child {
      border-top: none;
    }

    .detail-date {
      font-weight: 650;
    }

    .detail-note {
      color: #71808e;
      text-align: right;
    }

    .empty-detail {
      padding: 11px;
      color: #8a97a4;
      font-size: 0.88rem;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      z-index: 4000;
      width: min(430px, calc(100% - 30px));
      padding: 11px 14px;
      border-radius: 10px;
      background: #17324d;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.24);
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: #a4261d;
    }

    @media (max-width: 560px) {
      .main-content {
        padding-left: 9px;
        padding-right: 9px;
      }

      .summary-card {
        grid-template-columns: repeat(2, 1fr);
      }

      .column-headings {
        grid-template-columns: minmax(0, 1fr) repeat(3, 56px);
        gap: 5px;
        padding-left: 9px;
        padding-right: 9px;
        font-size: 0.67rem;
      }

      .student-card {
        grid-template-columns: minmax(0, 1fr) repeat(3, 56px);
        gap: 5px;
        padding-left: 9px;
        padding-right: 9px;
      }

      .avatar {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
        margin-right: 7px;
      }

      .student-name {
        font-size: 0.93rem;
      }

      .count-badge {
        min-height: 33px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 390px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .column-headings {
        grid-template-columns: minmax(0, 1fr) repeat(3, 48px);
      }

      .student-card {
        grid-template-columns: minmax(0, 1fr) repeat(3, 48px);
      }

      .student-roll {
        font-size: 0.73rem;
      }
    }
  </style>
</head>

<body>
  <header class="fixed-header">
    <div class="school-title">St. Patrick's School</div>
    <div class="school-subtitle">IIT &amp; NEET FOUNDATION</div>
    <div class="academic-year" id="academicYearText"></div>
  </header>

  <main class="main-content">
    <div class="title-row">
      <h1 class="page-title">Discipline History</h1>
      <div class="class-section" id="classSectionText"></div>
    </div>

    <section class="filter-card">
      <div class="filter-title">View Records</div>

      <div class="filter-grid">
        <div>
          <label class="field-label" for="monthFilter">Month</label>
          <select class="filter-select" id="monthFilter">
            <option value="all">All Months</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="yearFilter">Year</label>
          <select class="filter-select" id="yearFilter">
            <option value="all">All Years</option>
          </select>
        </div>
      </div>

      <div class="search-wrap">
        <label class="field-label" for="studentSearch">Search Student</label>
        <input
          class="search-input"
          type="search"
          id="studentSearch"
          placeholder="Enter student name or roll number"
          autocomplete="off"
        >
      </div>
    </section>

    <section class="summary-card" aria-label="Discipline summary">
      <div class="summary-item">
        <span class="summary-label">Record Days</span>
        <span class="summary-count" id="recordDaysCount">0</span>
      </div>

      <div class="summary-item late">
        <span class="summary-label">Late</span>
        <span class="summary-count" id="lateCount">0</span>
      </div>

      <div class="summary-item uniform">
        <span class="summary-label">No Uniform</span>
        <span class="summary-count" id="uniformCount">0</span>
      </div>

      <div class="summary-item sign">
        <span class="summary-label">No Sign</span>
        <span class="summary-count" id="signCount">0</span>
      </div>
    </section>

    <div class="column-headings" aria-hidden="true">
      <span>Student</span>
      <span>Late</span>
      <span>Uniform</span>
      <span>Sign</span>
    </div>

    <section class="student-list" id="studentList">
      <div class="message-card">Loading discipline history...</div>
    </section>
  </main>

  <div class="bottom-actions">
    <button type="button" id="backBtn" class="back-btn">← Back</button>
    <button type="button" id="refreshBtn" class="refresh-btn">Refresh</button>
  </div>

  <div class="modal-backdrop" id="detailBackdrop">
    <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-header">
        <div class="detail-title-wrap">
          <div class="detail-title" id="detailTitle">Student Discipline Details</div>
          <div class="detail-subtitle" id="detailSubtitle"></div>
        </div>

        <button type="button" class="close-btn" id="detailCloseBtn" aria-label="Close">×</button>
      </div>

      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.firebasestorage.app",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const auth = firebase.auth();

    const academicYear = localStorage.getItem("sp_selectedYear") || "";
    const currentClassId = localStorage.getItem("sp_selectedClassId") || "";
    const currentClassName = localStorage.getItem("sp_selectedClassName") || "";
    const currentSectionId = localStorage.getItem("sp_selectedSectionId") || "";
    const currentSectionName = localStorage.getItem("sp_selectedSectionName") || "";

    const academicYearText = document.getElementById("academicYearText");
    const classSectionText = document.getElementById("classSectionText");
    const monthFilter = document.getElementById("monthFilter");
    const yearFilter = document.getElementById("yearFilter");
    const studentSearch = document.getElementById("studentSearch");
    const studentList = document.getElementById("studentList");
    const recordDaysCount = document.getElementById("recordDaysCount");
    const lateCount = document.getElementById("lateCount");
    const uniformCount = document.getElementById("uniformCount");
    const signCount = document.getElementById("signCount");
    const backBtn = document.getElementById("backBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const detailBackdrop = document.getElementById("detailBackdrop");
    const detailCloseBtn = document.getElementById("detailCloseBtn");
    const detailTitle = document.getElementById("detailTitle");
    const detailSubtitle = document.getElementById("detailSubtitle");
    const detailBody = document.getElementById("detailBody");
    const toast = document.getElementById("toast");

    let students = [];
    let disciplineDocuments = [];
    let filteredDocuments = [];
    let studentSummaries = new Map();
    let toastTimer = null;

    academicYearText.textContent = academicYear;
    classSectionText.textContent = [currentClassName, currentSectionName]
      .filter(Boolean)
      .join(" – ");

    function studentsCollection() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("students");
    }

    function disciplineCollection() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("disciplineRegister");
    }

    function escapeHtml(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getInitials(name = "") {
      const parts = String(name).trim().split(/\s+/).filter(Boolean);
      const first = parts[0] ? parts[0][0] : "";
      const second = parts[1] ? parts[1][0] : "";
      return (first + second).toUpperCase() || "S";
    }

    function showToast(message, type = "success") {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", type === "error");
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function isValidDateDocumentId(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
    }

    function formatDate(dateString) {
      if (!isValidDateDocumentId(dateString)) {
        return dateString || "";
      }

      const [year, month, day] = dateString.split("-");
      return `${day}-${month}-${year}`;
    }

    function compareRolls(a, b) {
      const aRoll = Number(a.roll);
      const bRoll = Number(b.roll);

      if (Number.isFinite(aRoll) && Number.isFinite(bRoll)) {
        return aRoll - bRoll;
      }

      if (Number.isFinite(aRoll)) return -1;
      if (Number.isFinite(bRoll)) return 1;

      return String(a.roll || "").localeCompare(
        String(b.roll || ""),
        undefined,
        { numeric: true, sensitivity: "base" }
      );
    }

    function emptySummary(studentId) {
      return {
        studentId,
        late: 0,
        noUniform: 0,
        noSign: 0,
        lateEntries: [],
        uniformEntries: [],
        signEntries: []
      };
    }

    function setLoading(isLoading) {
      refreshBtn.disabled = isLoading;
      refreshBtn.textContent = isLoading ? "Loading..." : "Refresh";

      if (isLoading) {
        studentList.innerHTML =
          '<div class="message-card">Loading discipline history...</div>';
      }
    }

    auth.onAuthStateChanged(async function (user) {
      if (!user) {
        window.location.replace("index.html");
        return;
      }

      if (!academicYear || !currentClassId || !currentSectionId) {
        studentList.innerHTML = `
          <div class="message-card error">
            Class or Section is not selected. Please go back and select it again.
          </div>
        `;
        refreshBtn.disabled = true;
        return;
      }

      await loadDisciplineHistory();
    });

    async function loadDisciplineHistory() {
      setLoading(true);

      try {
        const [studentSnapshot, disciplineSnapshot] = await Promise.all([
          studentsCollection().orderBy("roll").get(),
          disciplineCollection()
            .orderBy(firebase.firestore.FieldPath.documentId())
            .get()
        ]);

        students = [];
        studentSnapshot.forEach(function (doc) {
          const data = doc.data() || {};

          if (!data.isDeleted) {
            students.push({
              id: doc.id,
              ...data
            });
          }
        });

        students.sort(compareRolls);

        disciplineDocuments = [];
        disciplineSnapshot.forEach(function (doc) {
          if (!isValidDateDocumentId(doc.id)) {
            return;
          }

          disciplineDocuments.push({
            id: doc.id,
            data: doc.data() || {}
          });
        });

        populateYearFilter();
        applyFilters();
      } catch (error) {
        console.error("Discipline history load failed:", error);

        studentList.innerHTML = `
          <div class="message-card error">
            Unable to load discipline history. Please try again.
          </div>
        `;

        showToast("Unable to load discipline history.", "error");
      } finally {
        setLoading(false);
      }
    }

    function populateYearFilter() {
      const previousValue = yearFilter.value || "all";

      const years = Array.from(
        new Set(
          disciplineDocuments.map(function (item) {
            return item.id.substring(0, 4);
          })
        )
      ).sort();

      yearFilter.innerHTML =
        '<option value="all">All Years</option>' +
        years.map(function (year) {
          return `<option value="${escapeHtml(year)}">${escapeHtml(year)}</option>`;
        }).join("");

      yearFilter.value = years.includes(previousValue)
        ? previousValue
        : "all";
    }

    function applyFilters() {
      const selectedMonth = monthFilter.value;
      const selectedYear = yearFilter.value;
      const searchValue = studentSearch.value.trim().toLowerCase();

      filteredDocuments = disciplineDocuments.filter(function (item) {
        const yearMatches =
          selectedYear === "all" ||
          item.id.startsWith(`${selectedYear}-`);

        const monthMatches =
          selectedMonth === "all" ||
          item.id.substring(5, 7) === selectedMonth;

        return yearMatches && monthMatches;
      });

      buildStudentSummaries();
      updateSummaryCounts();
      renderStudents(searchValue);
    }

    function buildStudentSummaries() {
      studentSummaries = new Map();

      for (const student of students) {
        studentSummaries.set(student.id, emptySummary(student.id));
      }

      for (const registerDocument of filteredDocuments) {
        const documentData = registerDocument.data || {};

        for (const student of students) {
          const entry = documentData[student.id];

          if (!entry || typeof entry !== "object") {
            continue;
          }

          const summary = studentSummaries.get(student.id);

          if (entry.late === true) {
            summary.late += 1;
            summary.lateEntries.push({
              date: registerDocument.id,
              lateMinutes: Number(entry.lateMinutes) > 0
                ? Number(entry.lateMinutes)
                : null
            });
          }

          if (entry.noUniform === true) {
            summary.noUniform += 1;
            summary.uniformEntries.push({
              date: registerDocument.id
            });
          }

          if (entry.noSign === true) {
            summary.noSign += 1;
            summary.signEntries.push({
              date: registerDocument.id
            });
          }
        }
      }

      for (const summary of studentSummaries.values()) {
        summary.lateEntries.sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });

        summary.uniformEntries.sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });

        summary.signEntries.sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });
      }
    }

    function updateSummaryCounts() {
      let totalLate = 0;
      let totalUniform = 0;
      let totalSign = 0;

      for (const summary of studentSummaries.values()) {
        totalLate += summary.late;
        totalUniform += summary.noUniform;
        totalSign += summary.noSign;
      }

      recordDaysCount.textContent = filteredDocuments.length;
      lateCount.textContent = totalLate;
      uniformCount.textContent = totalUniform;
      signCount.textContent = totalSign;
    }

    function badgeHtml(count, issueClass) {
      if (!count) {
        return '<span class="count-badge zero">0</span>';
      }

      return `
        <span class="count-badge ${issueClass}">
          ${count}
        </span>
      `;
    }

    function renderStudents(searchValue = "") {
      if (!students.length) {
        studentList.innerHTML =
          '<div class="message-card">No students found.</div>';
        return;
      }

      const matchingStudents = students.filter(function (student) {
        if (!searchValue) return true;

        const name = String(student.name || "").toLowerCase();
        const roll = String(student.roll || "").toLowerCase();

        return name.includes(searchValue) || roll.includes(searchValue);
      });

      if (!matchingStudents.length) {
        studentList.innerHTML =
          '<div class="message-card">No matching students found.</div>';
        return;
      }

      studentList.innerHTML = matchingStudents.map(function (student) {
        const summary =
          studentSummaries.get(student.id) ||
          emptySummary(student.id);

        const safeName = escapeHtml(student.name || "Student");
        const safePhoto = escapeHtml(student.photoUrl || "");
        const safeRoll = escapeHtml(student.roll || "");

        const avatar = safePhoto
          ? `<div class="avatar"><img src="${safePhoto}" alt="${safeName}"></div>`
          : `<div class="avatar">${escapeHtml(getInitials(student.name || ""))}</div>`;

        return `
          <button
            type="button"
            class="student-card"
            data-student-id="${escapeHtml(student.id)}"
            aria-label="View discipline details for ${safeName}"
          >
            <span class="student-main">
              ${avatar}

              <span class="student-text">
                <span class="student-name">${safeName}</span>
                <span class="student-roll">
                  Roll Number: ${safeRoll || "—"}
                </span>
              </span>
            </span>

            ${badgeHtml(summary.late, "late")}
            ${badgeHtml(summary.noUniform, "uniform")}
            ${badgeHtml(summary.noSign, "sign")}
          </button>
        `;
      }).join("");

      studentList.querySelectorAll(".student-card").forEach(function (card) {
        card.addEventListener("click", function () {
          openStudentDetails(this.dataset.studentId);
        });
      });
    }

    function selectedPeriodText() {
      const monthText =
        monthFilter.options[monthFilter.selectedIndex]?.text ||
        "All Months";

      const yearText =
        yearFilter.options[yearFilter.selectedIndex]?.text ||
        "All Years";

      if (monthFilter.value === "all" && yearFilter.value === "all") {
        return "All available records";
      }

      if (monthFilter.value === "all") {
        return `All months – ${yearText}`;
      }

      if (yearFilter.value === "all") {
        return `${monthText} – All years`;
      }

      return `${monthText} ${yearText}`;
    }

    function issueEntriesHtml(entries, type) {
      if (!entries.length) {
        return '<div class="empty-detail">No records found.</div>';
      }

      return entries.map(function (entry) {
        let note = "";

        if (type === "late") {
          note = entry.lateMinutes
            ? `${entry.lateMinutes} minutes late`
            : "Late";
        } else if (type === "uniform") {
          note = "No Uniform";
        } else {
          note = "No Sign";
        }

        return `
          <div class="detail-entry">
            <span class="detail-date">${escapeHtml(formatDate(entry.date))}</span>
            <span class="detail-note">${escapeHtml(note)}</span>
          </div>
        `;
      }).join("");
    }

    function openStudentDetails(studentId) {
      const student = students.find(function (item) {
        return item.id === studentId;
      });

      if (!student) {
        showToast("Student details were not found.", "error");
        return;
      }

      const summary =
        studentSummaries.get(studentId) ||
        emptySummary(studentId);

      detailTitle.textContent = student.name || "Student";
      detailSubtitle.textContent =
        `Roll ${student.roll || "—"} • ${selectedPeriodText()}`;

      detailBody.innerHTML = `
        <div class="detail-summary">
          <div class="detail-summary-item">
            Late
            <strong>${summary.late}</strong>
          </div>

          <div class="detail-summary-item">
            No Uniform
            <strong>${summary.noUniform}</strong>
          </div>

          <div class="detail-summary-item">
            No Sign
            <strong>${summary.noSign}</strong>
          </div>
        </div>

        <section class="issue-section">
          <div class="issue-heading late">Late Dates</div>
          ${issueEntriesHtml(summary.lateEntries, "late")}
        </section>

        <section class="issue-section">
          <div class="issue-heading uniform">No Uniform Dates</div>
          ${issueEntriesHtml(summary.uniformEntries, "uniform")}
        </section>

        <section class="issue-section">
          <div class="issue-heading sign">No Sign Dates</div>
          ${issueEntriesHtml(summary.signEntries, "sign")}
        </section>
      `;

      detailBackdrop.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeStudentDetails() {
      detailBackdrop.classList.remove("show");
      document.body.style.overflow = "";
    }

    monthFilter.addEventListener("change", applyFilters);
    yearFilter.addEventListener("change", applyFilters);
    studentSearch.addEventListener("input", applyFilters);

    refreshBtn.addEventListener("click", loadDisciplineHistory);

    backBtn.addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "students.html";
      }
    });

    detailCloseBtn.addEventListener("click", closeStudentDetails);

    detailBackdrop.addEventListener("click", function (event) {
      if (event.target === detailBackdrop) {
        closeStudentDetails();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && detailBackdrop.classList.contains("show")) {
        closeStudentDetails();
      }
    });
  </script>
</body>
</html>
