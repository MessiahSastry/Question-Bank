<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OMR Scanner | St. Patrick's School</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root{
      --brand:#0f3d6b;
      --text:#111;
      --muted:#6b7a90;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f4f8fc;color:var(--text)}
    body{display:flex;flex-direction:column}

    /* Top blue school header */
    .header{
      background:var(--brand);
      color:#fff;
      padding:10px 12px 12px;
      box-shadow:0 2px 6px rgba(0,0,0,.15);
    }
    .bar{
      display:flex;align-items:center;gap:8px;
    }
    .school{
      display:flex;flex-direction:column;line-height:1.15;
    }
   .school .name{
  font-weight:800;letter-spacing:.5px;font-size:16px;
  text-align:center;width:100%;
}
    .school .sub{
      font-weight:600;font-size:12px;opacity:.9;text-align:center;width:100%;
    }

    /* Right utility buttons (open/refresh) */
    .actions{margin-left:auto;display:flex;gap:8px}
    .btn{
      border:0;background:rgba(255,255,255,.16);color:#fff;
      padding:8px 10px;border-radius:10px;font-size:13px;
      display:inline-flex;gap:6px;align-items:center
    }
    .btn:active{transform:scale(.98)}
    .btn-link{color:#fff;text-decoration:none}

       /* Content area with iframe filling remaining height */
    .content{
      position:relative;flex:1;min-height:0; /* allow child to size */
      display:flex;flex-direction:column;
    }
    .frame-wrap{
      position:relative;flex:1;min-height:0;border-top:1px solid #e8eef7;
      background:#fff;
    }
    iframe{
      position:absolute;inset:0;border:0;width:100%;height:100%;
      display:block;background:#fff;
    }

    /* Safe area padding for notches */
    .pad{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
    .pad-top{padding-top:env(safe-area-inset-top)}
    .pad-bottom{padding-bottom:env(safe-area-inset-bottom)}

    /* Small screens tweaks */
    @media (max-width:480px){
      .btn .text{display:none}
      .title{font-size:14px}
      .school .name{font-size:14px}
      .school .sub{font-size:11px}
    }
  </style>
</head>
<body>
  <!-- School Header -->
  <header class="header pad pad-top">
    <div class="bar">
      <!-- Back -->
      <button class="btn" onclick="history.back()" aria-label="Back">
        <i class="fa fa-arrow-left"></i><span class="text">Back</span>
      </button>

      <!-- Centered school title block -->
      <div class="school" style="flex:1">
        <div class="name" id="schoolName">St. Patrick's School</div>
                <div class="sub">IIT &amp; NEET FOUNDATION • <span id="acadYear"></span></div>
      </div>

      <!-- Right actions -->
      <div class="actions">
        <button class="btn" onclick="document.getElementById('evalbee').contentWindow.location.reload()" aria-label="Refresh">
          <i class="fa fa-rotate-right"></i><span class="text">Refresh</span>
        </button>
        <a class="btn btn-link" href="https://evalbee.com/" target="_blank" rel="noopener">
          <i class="fa fa-up-right-from-square"></i><span class="text">Open App</span>
        </a>
      </div>
    </div>

    
  </header>

  <!-- Iframe area -->
  <main class="content pad-bottom">
    <div class="frame-wrap">
      <!-- Change src to a specific Evalbee route if needed -->
      <iframe
        id="evalbee"
        src="https://evalbee.com/"
        allow="camera; microphone; clipboard-write; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts">
      </iframe>
    </div>
  </main>

   <script>
    // Ensure full-height on mobile with dynamic viewport units fallback
    function fixHeight(){
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.querySelector('.content').style.height = `calc(${vh}px - ${document.querySelector('.header').offsetHeight}px)`;
    }
    addEventListener('resize', fixHeight);
    addEventListener('orientationchange', fixHeight);
    window.addEventListener('load', fixHeight);

    // Academic Year: rolls over in June (month 5)
    (function(){
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth(); // 0-11
      const start = (m >= 5) ? y : (y - 1);
      const ay = start + '–' + String(start + 1).slice(-2);
      const slot = document.getElementById('acadYear');
      if (slot) slot.textContent = ay;
    })();
  </script>
</body>
</html>
