   // --- Firestore refs like memos.html ---
// (db is created AFTER firebase.initializeApp below)
let currentYearId = window.currentYearId || null;

// Expose selections for your existing buttons (no logic changed)
window.selClassId = null;   window.selClassName = null;
window.selSectionId = null; window.selSectionName = null;
window.selExamId = null;    window.selExamName = null;

// Prefer an app-provided currentYearId; otherwise pick the latest from /years
async function ensureCurrentYearId() {
  if (currentYearId) return currentYearId;
  const saved = localStorage.getItem('sp_selectedYear');
  if (saved) { currentYearId = saved; return currentYearId; }
  const yrs = await db.collection('years').orderBy('name','desc').limit(1).get();
  if (!yrs.empty) {
    currentYearId = yrs.docs[0].id;
    localStorage.setItem('sp_selectedYear', currentYearId);
  } else {
    throw new Error('No "years" found in Firestore.');
  }
  return currentYearId;
}


// Load Classes -> Sections like memos.html
async function loadClassesIntoSelect() {
  const yearId = await ensureCurrentYearId();
  classSelected.textContent = 'Loading…';
  classSelected.dataset.value = '';
  classList.innerHTML = '';

  const snap = await db.collection('years').doc(yearId).collection('classes')
    .orderBy('order','asc').get().catch(() =>
      db.collection('years').doc(yearId).collection('classes').get()
    );

  const items = [];
  snap.forEach(doc => {
    const d = doc.data();
    items.push({ id: doc.id, name: d?.name || d?.title || doc.id });
  });

  classList.innerHTML = items.map(it =>
    `<div class="dropdown-option" data-id="${it.id}" data-name="${it.name}">${it.name}</div>`
  ).join('');

  classSelected.textContent = '--Select--';
}

async function loadSectionsIntoSelect(classId) {
  const yearId = await ensureCurrentYearId();
  sectionSelected.classList.add('disabled');
  sectionSelected.textContent = 'Loading…';
  sectionSelected.dataset.value = '';
  sectionList.innerHTML = '';

  const snap = await db.collection('years').doc(yearId)
    .collection('classes').doc(classId).collection('sections')
    .orderBy('name','asc').get().catch(() =>
      db.collection('years').doc(yearId).collection('classes').doc(classId)
        .collection('sections').get()
    );

  const items = [];
  snap.forEach(doc => {
    const d = doc.data();
    items.push({ id: doc.id, name: d?.name || doc.id });
  });

  sectionList.innerHTML = items.map(it =>
    `<div class="dropdown-option" data-id="${it.id}" data-name="${it.name}">${it.name}</div>`
  ).join('');

  sectionSelected.textContent = '--Select--';
  sectionSelected.classList.remove('disabled');
}

// Load Exams like memos.html (years/{year}/exams)
async function loadExamsIntoSelect() {
  const yearId = await ensureCurrentYearId();
  const sel = document.getElementById('examSel');
  sel.innerHTML = `<option value="" disabled selected>Loading…</option>`;

  const snap = await db.collection('years').doc(yearId).collection('exams')
    .orderBy('order','asc').get().catch(() =>
      db.collection('years').doc(yearId).collection('exams').get()
    );

  sel.innerHTML = `<option value="" disabled selected>Select exam</option>`;
  snap.forEach(doc => {
    const d = doc.data();
    const opt = document.createElement('option');
    opt.value = doc.id;
    opt.textContent = d?.name || d?.title || doc.id;
    sel.appendChild(opt);
  });
}

// Wire events (no changes to your download/copy logic)
async function initFilters() {
  await ensureCurrentYearId();
  await loadClassesIntoSelect();

 const classDropdown   = document.getElementById('classDropdown');
const classSelected   = document.getElementById('classSelected');
const classList       = document.getElementById('classList');
const sectionDropdown = document.getElementById('sectionDropdown');
const sectionSelected = document.getElementById('sectionSelected');
const sectionList     = document.getElementById('sectionList');

 // --- Class dropdown interactions ---
classSelected.onclick = (e) => {
  classList.style.display = (classList.style.display === 'block') ? 'none' : 'block';
  e.stopPropagation();
};
document.addEventListener('click', () => { classList.style.display = 'none'; });

classList.onclick = async (e) => {
  const opt = e.target.closest('.dropdown-option'); if (!opt) return;
  classSelected.textContent = opt.dataset.name;
  classSelected.dataset.value = opt.dataset.id;
  classList.style.display = 'none';

  window.selClassId = opt.dataset.id;
  window.selClassName = opt.dataset.name || '';
  classId = window.selClassId;
  className = window.selClassName || '';

  localStorage.setItem('sp_selectedClassId', classId || '');
  localStorage.setItem('sp_selectedClassName', className || '');

  // reset section
  window.selSectionId = null; window.selSectionName = null;
  localStorage.removeItem('sp_selectedSectionId');
  localStorage.removeItem('sp_selectedSectionName');
  sectionSelected.textContent = 'Loading…';
  sectionSelected.classList.add('disabled');
  sectionList.innerHTML = '';

  document.dispatchEvent(new CustomEvent('filters-changed', {detail:{kind:'class'}}));

  if (window.selClassId) await loadSectionsIntoSelect(window.selClassId);
};

// --- Section dropdown interactions ---
sectionSelected.onclick = (e) => {
  if (sectionSelected.classList.contains('disabled')) return;
  sectionList.style.display = (sectionList.style.display === 'block') ? 'none' : 'block';
  e.stopPropagation();
};
document.addEventListener('click', () => { sectionList.style.display = 'none'; });

sectionList.onclick = (e) => {
  const opt = e.target.closest('.dropdown-option'); if (!opt) return;
  sectionSelected.textContent = opt.dataset.name;
  sectionSelected.dataset.value = opt.dataset.id;
  sectionList.style.display = 'none';

  window.selSectionId = opt.dataset.id;
  window.selSectionName = opt.dataset.name || '';
  sectionId = window.selSectionId;
  sectionName = window.selSectionName || '';

  localStorage.setItem('sp_selectedSectionId', sectionId || '');
  localStorage.setItem('sp_selectedSectionName', sectionName || '');

  document.dispatchEvent(new CustomEvent('filters-changed', {detail:{kind:'section'}}));
  loadExams(); // refresh exams + data after section chosen
};
  /* removed obsolete sectionSel listener */

  // Let the page know filters exist (for any existing hooks)
  document.dispatchEvent(new CustomEvent('filters-ready'));
}

    // --- Grade logic ---
    function getGrade(percent){
      if (percent >= 95) return 'A+';
      if (percent >= 90) return 'A';
      if (percent >= 85) return 'B+';
      if (percent >= 80) return 'B';
      if (percent >= 70) return 'C+';
      if (percent >= 60) return 'C';
      if (percent >= 50) return 'D';
      if (percent >= 40) return 'E';
      return 'F';
    }

    // Shorten name
    function getShortName(name){
      if (!name) return '';
      const words = name.split(/\s+/).filter(Boolean);
      const out = [];
      const isSK = (w) => /^sk\.?$/i.test(w) || /^shaik$/i.test(w);
      const isMD = (w) => /^md\.?$/i.test(w) || /^moham+m[aeod]*$/i.test(w);
      for (let i=0;i<words.length;i++){
        const w = words[i].replace(/\./g,'').toUpperCase();
        if (i===0){
          if (isSK(w)) out.push('SK');
          else if (isMD(w)) out.push('MD');
          else out.push(words[i]);
        } else {
          if (isSK(w)) out.push('SK');
          else if (isMD(w)) out.push('MD');
          else out.push(words[i][0].toUpperCase()+'.');
        }
      }
      return Array.from(new Set(out)).join(' ');
    }

      return map[subj] || subj.charAt(0).toUpperCase();
    }

    // Helper: toggle loading spinner and button states
function setLoading(on){
  if (on){
    statusDiv.classList.add('loading');
    statusDiv.innerHTML = `<span>Loading data…</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
    excelBtn.disabled = pdfBtn.disabled = leapBtn.disabled = leapPdfBtn.disabled = copyCSEBtn.disabled = compactViewBtn.disabled = true;

}

// ------------- LOAD DATA -----------
    auth.onAuthStateChanged(function(user){
      if (!user){
        statusDiv.textContent = "Please login.";
pdfBtn.disabled = excelBtn.disabled = leapBtn.disabled = leapPdfBtn.disabled = copyCSEBtn.disabled = compactViewBtn.disabled = true;
return;

    async function loadExams(){
      // Show loading in dropdown
examSelected.textContent = 'Loading...';
examSelected.dataset.value = '';
examList.innerHTML = '';
setLoading(true);

      if (!academicYear || !classId || !sectionId){
        statusDiv.textContent = "Class or section not selected.";
examSelected.textContent = "--Select--";
examSelected.classList.add('disabled');
excelBtn.disabled = pdfBtn.disabled = leapBtn.disabled = leapPdfBtn.disabled = copyCSEBtn.disabled = compactViewBtn.disabled = true;
return;
      }

      try{
        // 1. Exams for class group
        const classGroup = getClassGroupName(className);
        const examsSnap = await db.collection('years').doc(academicYear)
          .collection('exams').doc('classGroups')
          .collection(classGroup).orderBy('name').get();

        exams = []; examMap = {};
        examsSnap.forEach(doc => {
          const ex = doc.data(); ex.id = doc.id;
          exams.push(ex); examMap[ex.id] = ex;
        });

        if (!exams.length){
          statusDiv.textContent = "No exams found for this class group.";
          examList.innerHTML = '<div class="dropdown-option" style="color:#aaa;cursor:default;">No exams</div>';
          examSelected.textContent = "--Select--";
          examSelected.classList.add('disabled');
          return;
        }

        // 2. List exams in dropdown
        examList.innerHTML = exams.map(ex =>
          `<div class="dropdown-option" data-id="${ex.id}">${ex.name}</div>`
        ).join('');

        examSelected.textContent = "--Select--";
        examSelected.dataset.value = '';
        examSelected.classList.remove('disabled');

        // 3. Students for section
        const studentsSnap = await db.collection('years').doc(academicYear)
          .collection('classes').doc(classId)
          .collection('sections').doc(sectionId)
          .collection('students').orderBy('roll').get();

        students = [];
        studentsSnap.forEach(doc => {
          const s = doc.data();
          if (!s.isDeleted) students.push({ id: doc.id, ...s });
        });

        // 4. Preload marks
        marksMap = {};
        for (const stu of students){
          marksMap[stu.id] = {};
          for (const ex of exams){
            const markDoc = await db.collection('years').doc(academicYear)
              .collection('classes').doc(classId)
              .collection('sections').doc(sectionId)
              .collection('students').doc(stu.id)
              .collection('marks').doc(ex.id).get();
            marksMap[stu.id][ex.id] = markDoc.exists ? markDoc.data() : {};
          }
        }

function classBand6to7(name){
  // Normalize class name to number when possible
  const m = String(name || '').match(/\d+/);
  const n = m ? parseInt(m[0],10) : null;
  return n && n >= 6 && n <= 7;
}
function classBand8to10(name){
  const m = String(name || '').match(/\d+/);
  const n = m ? parseInt(m[0],10) : null;
  return n && n >= 8 && n <= 10;
}

function subjMaxByName(selExamObj, subjName){
  const s = (selExamObj.subjects || []).find(x => x.name === subjName);
  return s ? (s.max || 50) : 50;
}

// Normalize a raw subject score to a /50 scale using its configured max
function normTo50(selExamObj, subjName, raw){
  const mx = subjMaxByName(selExamObj, subjName);
  if (typeof raw !== 'number' || isNaN(raw)) return null;
  if (!mx || isNaN(mx)) return null;
  return (raw / mx) * 50;
}

// Average of available (non-null) values
function avgAvailable(arr){
  const vals = arr.filter(v => typeof v === 'number' && !isNaN(v));
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}
function subjExists(selExamObj, name){
  return (selExamObj.subjects || []).some(s => s.name === name);
}
function englishNorm(selExamObj, getNormFn, marks){
  if (subjExists(selExamObj,'English 1') || subjExists(selExamObj,'English 2')){
    return avgAvailable([ getNormFn('English 1'), getNormFn('English 2') ]);
  }
  return getNormFn('English');
}
function mathNormPref(selExamObj, getNormFn){
  if (subjExists(selExamObj,'Math 1') || subjExists(selExamObj,'Math 2')){
    return avgAvailable([ getNormFn('Math 1'), getNormFn('Math 2') ]);
  }
  return avgAvailable([ getNormFn('Mathematics'), getNormFn('Math') ]);
}
// Map app subjects to LEAP subject list and compute total /50 per LEAP subject
// returns [{name:'Telugu', total50:number|null}, ...] in LEAP order for this class band
function mapToLeapTotals(selExamObj, className, marksPerSubject){
  const is67 = classBand6to7(className);
  const is810 = classBand8to10(className);

  // App subjects present (names)
  const appSubs = (selExamObj.subjects || []).map(s => s.name);

  function getNorm(subj){
    const raw = marksPerSubject[subj];
    return normTo50(selExamObj, subj, raw);
  }

  if (is67){
    // LEAP order: Telugu, Hindi, English, Math, Science, Social
   const english = englishNorm(selExamObj, getNorm, marksPerSubject);
    const math    = mathNormPref(selExamObj, getNorm);
    const science = avgAvailable([getNorm('Physical Science'), getNorm('Physics'), getNorm('Chemistry'), getNorm('Biology')].filter((_,i)=>true)); // support either PS+Chem+Bio or Phy+Chem+Bio
    return [
      { name:'Telugu',  total50:getNorm('Telugu') },
      { name:'Hindi',   total50:getNorm('Hindi') },
      { name:'English', total50:english },
      { name:'Math',    total50:math },
      { name:'Science', total50:science },
      { name:'Social',  total50:getNorm('Social') },
    ];
  }

  // default to 8–10 mapping (Telugu, Hindi, English, Math, Physics, Biology, Social)
  const english = englishNorm(selExamObj, getNorm, marksPerSubject);
  const math    = mathNormPref(selExamObj, getNorm);
  const physics = avgAvailable([getNorm('Physical Science'), getNorm('Physics'), getNorm('Chemistry')]);
  const biology = getNorm('Biology');

  return [
    { name:'Telugu',  total50:getNorm('Telugu') },
    { name:'Hindi',   total50:getNorm('Hindi') },
    { name:'English', total50:english },
    { name:'Math',    total50:math },
    { name:'Physics', total50:physics },
    { name:'Biology', total50:biology },
    { name:'Social',  total50:getNorm('Social') },
  ];
}

// ------- CSE subject order helper (Student paste: single column per subject) -------
function getSubjectsInCSEOrder(selExamObj){
  // Desired portal order:
  const desired = [
    'Mathematics',
    'Physical Science',
    'Biological Science',
    'Social Studies',
    'Composite Telugu',
    'Composite Telugu (Sanskrit)',
    'Hindi',
    'English'
  ];

  // Available subjects in the exam (as entered in app)
  const avail = (selExamObj.subjects || []).map(s => s.name);

  // Aliases for matching
  const aliases = {
    'Mathematics': ['Mathematics','Math','Math 1','Math 2'],
    'Physical Science': ['Physical Science','Physics'],
    'Biological Science': ['Biological Science','Biology'],
    'Social Studies': ['Social Studies','Social'],
    'Composite Telugu': ['Composite Telugu'],
    'Composite Telugu (Sanskrit)': ['Composite Telugu (Sanskrit)','Composite Telugu(Sanskrit)'],
    'Hindi': ['Hindi'],
    'English': ['English','English 1','English 2']
  };

  const list = [];
  for (const want of desired){
    const opts = aliases[want] || [want];
    const found = opts.find(x => avail.includes(x));
    if (found){
      // If generic "English" missing but E1/E2 exist, include both
      if (want === 'English' && !avail.includes('English')){
        if (avail.includes('English 1')) list.push('English 1');
        if (avail.includes('English 2')) list.push('English 2');
      } else {
        list.push(found);
      }
    }
  }
  return list;
}

// Apply pass floor and cap to [0,50]
function passFloor50(v){
  if (v === null) return 18; // treat missing as pass-floor per instruction
  const x = Math.max(18, Math.min(50, v));
  return x;
}

// Split a /50 total into Tools [5,5,5,35] using percent and rotating remainders
// roll: student roll number (used for rotation start)
function splitToTools(total50, roll){
  const T = Math.round(total50); // keep integer total after mapping/flooring logic
  const p = T / 50;

  const caps = [5,5,5,35];
  const raws = [5*p, 5*p, 5*p, 35*p];         // proportional
  const floors = raws.map(v => Math.floor(v));
  const sumFloors = floors.reduce((a,b)=>a+b,0);
  let R = T - sumFloors;

  // rotation start (0..3)
  let start = 0;
  if (typeof roll === 'number' && !isNaN(roll) && roll > 0){
    start = (roll - 1) % 4;
  }

  // Add +1 in rotating order until remainder is distributed
  let idx = start, safety = 10;
  while (R > 0 && safety-- > 0){
    if (floors[idx] < caps[idx]){
      floors[idx] += 1;
      R -= 1;
    }
    idx = (idx + 1) % 4;
  }

  // Ensure caps
  for (let i=0;i<4;i++){
    if (floors[i] > caps[i]) floors[i] = caps[i];
    if (floors[i] < 0) floors[i] = 0;
  }
  // Final fix if rounding drifted (rare): adjust tool-4 within cap
  const diff = T - floors.reduce((a,b)=>a+b,0);
  if (diff !== 0){
    const t4Room = caps[3] - floors[3];
    const adj = Math.max(-floors[3], Math.min(diff, t4Room));
    floors[3] += adj;
  }

  return [...floors, floors.reduce((a,b)=>a+b,0)]; // [T1,T2,T3,T4,Total]
}

   // ---------- Copy for CSE (Student): one student -> CSE row (LEAP-style normalize) ----------
copyCSEBtn.onclick = function(){
  if (!selectedExamObj){
    selectedExam = examSelected.dataset.value;
    selectedExamObj = examMap[selectedExam];
  }
  if (!selectedExamObj){ statusDiv.textContent = "Select an exam."; return; }

  // Helpers for normalization and slot building
  function nVal(marks, subj){ return normTo50(selectedExamObj, subj, marks[subj]); } // number|null
  function preferEnglish(marks){
    const e = nVal(marks, 'English');
    if (typeof e === 'number' && !isNaN(e)) return e;
    return avgAvailable([ nVal(marks,'English 1'), nVal(marks,'English 2') ]);
  }
  function biologyNorm(marks){
    return avgAvailable([ nVal(marks,'Biology'), nVal(marks,'Biological Science') ]);
  }
  function socialNorm(marks){
    return avgAvailable([ nVal(marks,'Social'), nVal(marks,'Social Studies') ]);
  }
  function physSciNorm(marks){
    return avgAvailable([ nVal(marks,'Physical Science'), nVal(marks,'Physics'), nVal(marks,'Chemistry') ]);
  }
  function mathNorm(marks){
    // If both M1 and M2 exist, average; else Math or whichever exists
    const m = nVal(marks,'Math');
    const m1 = nVal(marks,'Math 1');
    const m2 = nVal(marks,'Math 2');
    // If generic Math is present alone, use it; otherwise average of available parts
    if (typeof m === 'number' && (m1 == null && m2 == null)) return m;
    return avgAvailable([m, m1, m2]);
  }

  const is67 = classBand6to7(className);
  const is810 = classBand8to10(className);

    // Build output row: 4 tool parts (R,W,P,ST) per subject, no totals.
  function buildCSERowForStudent(stu){
    const marks = marksMap[stu.id][selectedExamObj.id] || {};

    // Normalize → floor 18 → cap 50, then split into [R,W,P,ST,Total]; use first 4 only
    function partsFromNorm(norm50){
      const t50 = Math.round(passFloor50(norm50));     // integer 18..50
      const arr = splitToTools(t50, stu.roll).slice(0,4); // [R,W,P,ST]
      return arr;
    }

    if (is67){
      // CSE (6–7): Telugu, Hindi, English, Math, Science, Social — each as 4 parts
      const telugu  = partsFromNorm( nVal(marks,'Telugu') );
      const hindi   = partsFromNorm( nVal(marks,'Hindi') );
      const english = partsFromNorm( preferEnglish(marks) );
      const math    = partsFromNorm( mathNorm(marks) );
      const science = partsFromNorm( physSciNorm(marks) || nVal(marks,'Biology') );
      const social  = partsFromNorm( socialNorm(marks) );

      return [
        ...telugu, ...hindi, ...english,
        ...math, ...science, ...social
      ];
    } else {
      // CSE (8–10) strict order with Telugu/Sanskrit rule
      const math      = partsFromNorm( mathNorm(marks) );
      const phys      = partsFromNorm( physSciNorm(marks) );
      const bio       = partsFromNorm( biologyNorm(marks) );
      const social    = partsFromNorm( socialNorm(marks) );
      const compTel   = partsFromNorm( nVal(marks,'Telugu') );   // Slot 5 → Telugu-derived parts
      const compTelSk = ['', '', '', ''];                        // Slot 6 → all four empty
      const hindi     = partsFromNorm( nVal(marks,'Hindi') );
      const english   = partsFromNorm( preferEnglish(marks) );

      return [
        ...math, ...phys, ...bio, ...social,
        ...compTel, ...compTelSk,
        ...hindi, ...english
      ];
    }
  }

  // Modal UI
    const TOOL4 = ['R','W','P','ST'];

  // Build label sets: Subject × [R,W,P,ST]
  const labels67 = ['Telugu','Hindi','English','Mathematics','Science','Social Studies']
    .flatMap(s => TOOL4.map(t => `${s} ${t}`));

  const labels810 = ['Mathematics','Physical Science','Biological Science','Social Studies','Composite Telugu','Composite Telugu (Sanskrit)','Hindi','English']
    .flatMap(s => TOOL4.map(t => `${s} ${t}`));

  const labels = is67 ? labels67 : labels810;

  // Build student options (roll order)
  const studentOptions = students
    .slice()
    .sort((a,b)=> (a.roll||0)-(b.roll||0))
    .map((s,i)=>`<option value="${i}">${String(s.roll).padStart(2,'0')} - ${s.name}</option>`)
    .join('');

    const body = `
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;">
      <label class="form-label" style="margin:0;">Student:</label>
      <select id="cseStudentSel" class="select-inline" style="min-width:260px;">${studentOptions}</select>
      <button id="csePrev" class="copy-btn" type="button">Prev</button>
      <button id="cseNext" class="copy-btn" type="button">Next</button>
      <button id="cseRefresh" class="copy-btn" type="button">Show</button>
    </div>
    <div style="margin:8px 0 10px;color:#185496;font-size:.95em;">
      Output is a <b>single tab-separated row</b> — <b>4 tool parts (R, W, P, ST) for each subject</b> in strict CSE order.
      For 8–10, <b>Composite Telugu</b> uses Telugu marks; <b>Composite Telugu (Sanskrit)</b> four slots are left blank.
    </div>
    <div id="csePreview" style="border:1px solid #cfe1f8;border-radius:10px;padding:10px;margin-bottom:10px;background:#f8fbff;">
      <div style="font-weight:700;color:#0f3d6b;margin-bottom:6px;">Preview</div>
      <div id="cseLabels"></div>
      <div id="cseVals" style="margin-top:6px;"></div>
    </div>
    <textarea id="cseRow" class="textarea-block" readonly placeholder="Press Show to generate"></textarea>
  `;
  const footer = `
  <button id="cseCopyRow" class="copy-btn" disabled>Copy Row (TSV)</button>
  <button id="cseCopyVert" class="copy-btn" disabled>Copy Vertical</button>
  <button class="copy-btn" onclick="closeModal()">Close</button>
`;
  openModal('Copy for CSE (Student)', body, footer);

  // Wire up modal elements
  const sel = document.getElementById('cseStudentSel');
  const btnPrev = document.getElementById('csePrev');
  const btnNext = document.getElementById('cseNext');
  const btnShow = document.getElementById('cseRefresh');
  const previewLabels = document.getElementById('cseLabels');
  const previewVals = document.getElementById('cseVals');
  const ta = document.getElementById('cseRow');
  const copyRowBtn = document.getElementById('cseCopyRow');
  const copyVertBtn = document.getElementById('cseCopyVert');

  // Remember last index in-session
  let lastIdx = Number(sessionStorage.getItem('sp_last_cse_idx') || '0');
  if (lastIdx < 0 || lastIdx >= students.length) lastIdx = 0;
  sel.value = String(lastIdx);

  function render(idx){
    const s = students.slice().sort((a,b)=>(a.roll||0)-(b.roll||0))[idx];
    if (!s){ ta.value = ''; copyRowBtn.disabled = copyVertBtn.disabled = true; return; }

    const values = buildCSERowForStudent(s);
    // TSV row
    const tsv = values.map(v => (v === '' ? '' : String(v))).join('\t');
    ta.value = tsv;
    copyRowBtn.disabled = copyVertBtn.disabled = false;

    // Preview labels + values
    previewLabels.innerHTML = labels.map(l=>`<span class="badge"><span class="lbl">${l}</span></span>`).join('');
    previewVals.innerHTML = values.map(v=>`<span class="badge"><span class="val">${v === '' ? '&nbsp;' : v}</span></span>`).join('');

    sessionStorage.setItem('sp_last_cse_idx', String(idx));
  }

  btnShow.onclick = ()=> render(parseInt(sel.value,10) || 0);
  btnPrev.onclick = ()=>{
    let i = (parseInt(sel.value,10) || 0) - 1; if (i < 0) i = 0; sel.value = String(i); render(i);
  };
  btnNext.onclick = ()=>{
    let i = (parseInt(sel.value,10) || 0) + 1; if (i >= students.length) i = students.length - 1; sel.value = String(i); render(i);
  };

  copyRowBtn.onclick = ()=>{
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    document.execCommand('copy');
    copyRowBtn.textContent = 'Copied!'; setTimeout(()=>copyRowBtn.textContent='Copy Row (TSV)', 1200);
  };
  copyVertBtn.onclick = ()=>{
    const lines = ta.value.split('\t').join('\n');
    ta.value = lines;
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    document.execCommand('copy');
    ta.value = lines.replace(/\n/g,'\t'); // restore TSV back to textarea after copy? keep TSV; so revert:
    ta.value = lines.split('\n').join('\t');
    copyVertBtn.textContent = 'Copied!'; setTimeout(()=>copyVertBtn.textContent='Copy Vertical', 1200);
  };

  // Initial render
  render(parseInt(sel.value,10) || 0);
};

    excelBtn.onclick = function(){
      if (!selectedExamObj){
        selectedExam = examSelected.dataset.value;
        selectedExamObj = examMap[selectedExam];
      }
      if (!selectedExamObj){ statusDiv.textContent = "Select an exam."; return; }

      statusDiv.textContent = "Preparing Excel...";

      // Build headers
      const headers = ['Roll','Name'];
      const subjectObjs = (selectedExamObj.subjects || []);
      const subjects = subjectObjs.map(s => s.name);
      const subjectShorts = subjectObjs.map(s => getShortSubjectName(s.name)); // (kept if needed later)
      headers.push(...subjects,'Total','Grade','Rank');

      // Build data rows
      let rows = [];
      const totalArr = [];

      students.forEach(stu => {
        const marks = marksMap[stu.id][selectedExamObj.id] || {};
        const row = [stu.roll, stu.name];
        const rowStyles = [null,null];

        let total = 0, tmax = 0, allAbsent = true;

        for (let i=0;i<subjects.length;i++){
          const subj = subjects[i];
          const v = marks[subj];
          const subjMax = (selectedExamObj.subjects.find(s => s.name === subj)?.max) || 100;
          const percentMark = (typeof v === 'number' && subjMax) ? (v / subjMax) * 100 : null;

          if (typeof v === 'number' && !isNaN(v)){
            row.push(v);
            rowStyles.push(percentMark < 40 ? { fill:{ fgColor:{ rgb:"FF0000" } }, font:{ color:{ rgb:"FFFFFF" } } } : null);
            total += v;
            tmax += subjMax;
            allAbsent = false;
          } else {
            row.push('Ab');
            rowStyles.push(null);
            tmax += subjMax;
          }
        }

        const percent = tmax ? (total / tmax) * 100 : 0;
        const grade = allAbsent ? '-' : getGrade(percent);
        const totalDisplay = allAbsent ? '-' : total;

        row.push(totalDisplay, grade, ''); // rank placeholder
        rowStyles.push(null,null,null);

        totalArr.push({ id:stu.id, total:totalDisplay });
        rows.push({ values:row, styles:rowStyles });
      });

      // Ranks
      const ranks = {};
      const valid = totalArr.filter(x => x.total !== '-').sort((a,b)=>Number(b.total)-Number(a.total));
      let currRank = 0, prevTotal = null, countSeen = 0;
      for (const item of valid){
        countSeen += 1;
        if (item.total !== prevTotal){ currRank = countSeen; prevTotal = item.total; }
        ranks[item.id] = currRank;
      }
      totalArr.filter(x => x.total === '-').forEach(x => { ranks[x.id] = '-'; });

      for (let i=0;i<rows.length;i++){
        rows[i].values[headers.length-1] = ranks[students[i].id];
      }

      // Sort by rank (absent at end)
      rows = rows.sort((a,b) => {
        const rA = a.values[headers.length-1], rB = b.values[headers.length-1];
        if (rA === '-' && rB !== '-') return 1;
        if (rA !== '-' && rB === '-') return -1;
        if (rA === '-' && rB === '-') return 0;
        return rA - rB;
      });

      // SheetJS
      const data = [headers, ...rows.map(r=>r.values)];
      const ws = XLSX.utils.aoa_to_sheet(data);

      // Apply styles for <40%
      for (let i=1;i<rows.length+1;i++){
        const rowObj = rows[i-1];
        if (!rowObj.styles) continue;
        for (let j=0;j<rowObj.styles.length;j++){
          const style = rowObj.styles[j];
          if (style){
            const cellAddr = XLSX.utils.encode_cell({ r:i, c:j });
            if (!ws[cellAddr]) continue;
            ws[cellAddr].s = style;
          }
        }
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, (selectedExamObj.name || "Exam"));
      const fname = `Marks_${className}_${sectionName}_${selectedExamObj.name}_${academicYear}.xlsx`;
      XLSX.writeFile(wb, fname);

      statusDiv.textContent = "Excel downloaded!";
    };

        selectedExamObj = examMap[selectedExam];
      }
      if (!selectedExamObj){ statusDiv.textContent = "Select an exam."; return; }

      statusDiv.textContent = "Preparing PDF...";

      const subjectObjs = (selectedExamObj.subjects || []);
      const subjects = subjectObjs.map(s => s.name);
      const subjectShorts = subjectObjs.map(s => getShortSubjectName(s.name));
      const subjMaxs = (selectedExamObj.subjects || []).map(s => s.max || 100);

      const totalArr = [];

      students.forEach(stu => {
        const marks = marksMap[stu.id][selectedExamObj.id] || {};
        const row = [stu.roll, stu.name];

        let total=0, tmax=0, allAbsent=true;
        for (let i=0;i<subjects.length;i++){
          const subj = subjects[i];
          const v = marks[subj];
          if (v !== undefined && v !== null && v !== '' && typeof v === 'number' && !isNaN(v)) allAbsent = false;
          row.push((v !== undefined && v !== null && v !== '') ? v : 'Ab');
          const mmax = subjMaxs[i];
          if (typeof v === 'number' && !isNaN(v)){ total += mmax ? v : 0; tmax += mmax; }
          else { tmax += mmax; }
        }

        const percent = tmax ? (total / tmax) * 100 : 0;
        const grade = allAbsent ? '-' : getGrade(percent);
        const totalDisplay = allAbsent ? '-' : total;
        row.push(totalDisplay, grade, ''); // rank later
        totalArr.push({ id:stu.id, total:totalDisplay, percent, allAbsent, row });
      });

      // Ranks
      const ranks = {};
      const valid = totalArr.filter(x=>x.total!=='-').sort((a,b)=>Number(b.total)-Number(a.total));
      let currRank=0, prevTotal=null, countSeen=0;

        countSeen += 1;
        if (item.total !== prevTotal){ currRank = countSeen; prevTotal = item.total; }
        ranks[item.id] = currRank;
      }
      totalArr.filter(x=>x.total==='-').forEach(x=>{ ranks[x.id] = '-'; });
      for (const x of totalArr) x.row[x.row.length-1] = ranks[x.id];

      const rankedRows = totalArr.sort((a,b)=>{
        const rA = ranks[a.id], rB = ranks[b.id];
        if (rA==='-' && rB!=='-') return 1;
        if (rA!=='-' && rB==='-') return -1;
        if (rA==='-' && rB==='-') return 0;
        return rA - rB;
      }).map(x=>x.row);

      const tableHeaders =
        `<th>ROLL</th><th style="text-align:left;padding-left:10px;min-width:110px;">NAME</th>` +

          : `<th>${s.toUpperCase()}</th>`
        ).join('') +
        `<th>TOTAL</th><th>GRADE</th><th>RANK</th>`;

      // Row builder
      function buildRowHtml(row, idx, rowPx){
        const nameShrink = (name) => {
          let f="1.14em";
          if (name.length>22) f="1.05em";
          if (name.length>32) f="0.93em";
          if (name.length>40) f="0.83em";
          if (name.length>48) f="0.73em";
          if (name.length>55) f="0.62em";
          if (name.length>65) f="0.54em";
          if (name.length>75) f="0.47em";
          return f;
        };
        let tds = '';
        for (let j=0;j<row.length;j++){
          if (j===0){
            tds += `<td style="font-size:1.25em;font-weight:600;min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;

            const name = row[j] || '';
            const fsize = nameShrink(name);

                        </div>
                      </td>`;
            } else {
              tds += `<td style="font-size:1.19em;min-height:${rowPx}px;height:${rowPx}px;">${(v!==undefined && v!==null && v!=="") ? v : 'Ab'}</td>`;
            }
          } else if (j===row.length-3 || j===row.length-2 || j===row.length-1){
            tds += `<td style="font-size:1.19em;font-weight:600;min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;
          } else {
            tds += `<td style="min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;
          }
        }
        const bgcolor = idx % 2 ? "#eaf1fa" : "#f8fbff";
        return `<tr style="background:${bgcolor};min-height:${rowPx}px;height:${rowPx}px;">${tds}</tr>`;
      }

      // Pagination constants
      const CM_TO_PX = 37.795;
      const pageContentHeightPx = (29.7 - 1.27 - 1.27) * CM_TO_PX;
      const tableHeaderPx = 28;
      const headingBlockPx = 140;

      // Row height based on count
      const studentCount = students.length;
      let rowHeight = 26;
      if (studentCount<=35) rowHeight=26;
      else if (studentCount<=40) rowHeight=17;
      else if (studentCount<=45) rowHeight=13;
      else if (studentCount<=50) rowHeight=9.5;
      else if (studentCount<=60) rowHeight=7.6;
      else rowHeight=5.8;

      const rowPx = Math.max(24, rowHeight);
      const rowsOnFirstPage = Math.max(1, Math.floor((pageContentHeightPx - headingBlockPx - tableHeaderPx) / rowPx));
      const rowsOnNextPages = Math.max(1, Math.floor((pageContentHeightPx - tableHeaderPx) / rowPx));

      const pagesHtml = [];
      let start = 0, pageIndex = 0;

      while (start < rankedRows.length){
        const perPage = pageIndex===0 ? rowsOnFirstPage : rowsOnNextPages;
        const slice = rankedRows.slice(start, start+perPage);
        const rowsHtml = slice.map((row, idx) => buildRowHtml(row, start+idx, rowPx)).join('');

        const tableHtml =
          `<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%;max-width:100%;font-size:0.70em;margin-top:8px;text-align:center;line-height:1.12;table-layout:auto;word-break:break-word;margin-bottom:10px;">
             <thead>
               <tr style="background:#1762a7;color:#fff;font-weight:bold;">${tableHeaders}</tr>
             </thead>
             <tbody>${rowsHtml}</tbody>
           </table>`;

        const headingBlockHtml = (pageIndex===0)
          ? `<div style="width:100%;text-align:center;margin-bottom:2px;">
               <div style="display:inline-flex;align-items:center;justify-content:center;">
                 <img src="schoollogo1.png" style="height:110px;width:auto;max-width:140px;border-radius:8px;margin-right:10px;" onerror="this.style.display='none';">
                 <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:110px;line-height:1.09;">
                   <span style="font-size:2.19em;font-weight:bold;letter-spacing:0.01em;font-family:'Times New Roman', Times, serif;color:#c81929;line-height:1.08;">St. Patrick's School</span>
                   <span style="font-size:1.19em;font-weight:700;color:#224a74;letter-spacing:0.01em;line-height:1.06;">IIT & NEET FOUNDATION</span>
                   <span style="font-size:1.17em;font-weight:bold;letter-spacing:0.01em;color:#187141;line-height:1.05;">${className}${sectionName ? ' - ' + sectionName : ''}</span>
                   <span style="font-size:1.12em;font-weight:bold;color:#b80000;letter-spacing:0.01em;line-height:1.05;">${selectedExamObj.name} Results</span>
                 </div>
                 <img src="schoollogo2.png" style="height:110px;width:auto;max-width:140px;border-radius:8px;margin-left:10px;" onerror="this.style.display='none';">
               </div>
             </div>`
          : '';

        pagesHtml.push(
          `<div class="pdf-page" style="${start + perPage < rankedRows.length ? 'page-break-after:always;' : ''}">
             ${headingBlockHtml}
             ${tableHtml}
           </div>`
        );

        start += perPage; pageIndex += 1;
      }

      const pdfHTML =
        `<div style="font-family:'Times New Roman', Times, serif; color:#1a1a1a; margin:0; padding:0;">
           <style>
             tr { page-break-inside: avoid !important; }
             thead { display: table-header-group; }
             tfoot { display: table-footer-group; }
             td, th { border: 1px solid #444 !important; padding: 0 1px; white-space: nowrap; font-size:0.98em; }
           </style>
           ${pagesHtml.join('')}
         </div>`;

      const printable = document.createElement('div');
      printable.innerHTML = pdfHTML;
      document.body.appendChild(printable);

      html2pdf().set({
        margin: [1.27, 1, 1.27, 1],
        filename: `Marks_${className}_${sectionName}_${selectedExamObj.name}_${academicYear}.pdf`,
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'cm', format: 'a3', orientation: 'landscape' }
      })
      .from(printable)
      .save()
      .then(() => {
        document.body.removeChild(printable);
        statusDiv.textContent = "PDF downloaded!";
      })
      .catch(err => {
        document.body.removeChild(printable);
        statusDiv.textContent = "Error generating PDF: " + err;
      });
    };
  </script>
</body>
</html>
