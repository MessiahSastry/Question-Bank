// Shorten name as per rules
function getShortName(name) {
  if (!name) return '';
  let words = name.split(/\s+/).filter(Boolean);
  let out = [];
  const isSK = (w) => /^sk\.?$/i.test(w) || /^shaik$/i.test(w);
  const isMD = (w) => /^md\.?$/i.test(w) || /^moham+m[aeod]*$/i.test(w);
  for (let i = 0; i < words.length; i++) {
    let w = words[i].replace(/\./g, '').toUpperCase();
    if (i === 0) {
      if (isSK(w)) out.push("SK");
      else if (isMD(w)) out.push("MD");
      else out.push(words[i]);
    } else {
      if (isSK(w)) out.push("SK");
      else if (isMD(w)) out.push("MD");
      else out.push(words[i][0].toUpperCase() + ".");
    }
  }
  // Remove duplicates (e.g., SK SK)
  return Array.from(new Set(out)).join(' ');
}
function getShortSubjectName(subj) {

    'Telugu': 'T',

    'Biology': 'B',
    'Social': 'S',
    'Spoken English': 'SE'
    // Add more if needed
  };
  // If already short or not mapped, return as is or just first char
  return map[subj] || subj.charAt(0).toUpperCase();
}
  // -- App globals --

  // Load classes for the selected academicYear
async function loadClasses() {
  try {
    classSelected.textContent = 'Loading...';
    classSelected.dataset.id = '';
    classList.innerHTML = '';
    sectionRow.style.display = 'none';
    sectionSelected.textContent = '--Select--';
    sectionSelected.dataset.id = '';
    sectionList.innerHTML = '';

    if (!academicYear) {
      statusDiv.textContent = "Academic year not set.";
      classSelected.textContent = "--Select--";
      return;
    }

    const snap = await db.collection('years').doc(academicYear)
      .collection('classes').orderBy('name').get();

    const classDocs = [];
    snap.forEach(doc => classDocs.push({ id: doc.id, ...(doc.data() || {}) }));

    if (!classDocs.length) {
      classSelected.textContent = "--Select--";
      classList.innerHTML = `<div class="dropdown-option" style="color:#aaa;cursor:default;">No classes</div>`;
      return;
    }

    classList.innerHTML = classDocs.map(c =>
      `<div class="dropdown-option" data-id="${c.id}" data-name="${c.name || c.id}">${c.name || c.id}</div>`
    ).join('');

    // Preselect from storage if possible
    const stored = classDocs.find(c => c.id === classId);
    if (stored) {
      setSelectedClass(stored, { fromPreselect: true });
    } else {
      classSelected.textContent = "--Select--";
    }
  } catch (err) {
    statusDiv.textContent = "Error: " + err.message;
    classSelected.textContent = "--Select--";
  }
}

// Load sections for a given class
async function loadSectionsForClass(classIdToLoad) {
  try {
    sectionRow.style.display = 'block';
    sectionSelected.textContent = 'Loading...';
    sectionSelected.dataset.id = '';
    sectionList.innerHTML = '';

    const snap = await db.collection('years').doc(academicYear)
      .collection('classes').doc(classIdToLoad)
      .collection('sections').orderBy('name').get();

    const secDocs = [];
    snap.forEach(doc => secDocs.push({ id: doc.id, ...(doc.data() || {}) }));

    if (!secDocs.length) {
      sectionSelected.textContent = "--Select--";
      sectionList.innerHTML = `<div class="dropdown-option" style="color:#aaa;cursor:default;">No sections</div>`;
      return;
    }

    sectionList.innerHTML = secDocs.map(s =>
      `<div class="dropdown-option" data-id="${s.id}" data-name="${s.name || s.id}">${s.name || s.id}</div>`
    ).join('');

    // Preselect from storage if possible
    const storedSec = secDocs.find(s => s.id === sectionId);
    if (storedSec) {
      setSelectedSection(storedSec, { fromPreselect: true });
    } else {
      sectionSelected.textContent = "--Select--";
    }
  } catch (err) {
    statusDiv.textContent = "Error: " + err.message;
    sectionSelected.textContent = "--Select--";
  }
}

  localStorage.setItem('sp_selectedClassName', className);

  examSelected.classList.add('disabled');

  loadSectionsForClass(classId);
}

// Set selected section (updates UI, storage, and then loads exams & students)

}

const classDropdown   = document.getElementById('classDropdown');
const classSelected   = document.getElementById('classSelected');

// Helper to refresh page heading

// Remember last-picked exam per (year, class, section)
function lastExamKey() {

}
function saveLastExam(examId) {

}

function updateExportState() {
  const haveExam = !!(selectedExamObj || examSelected.dataset.value);

  // ------------- LOAD DATA -----------

  async function loadExams() {
  try {
    // Reset & disable exam UI while loading
    examSelected.textContent = 'Loading...';
    examSelected.dataset.value = '';
    examList.innerHTML = '';
    excelBtn.disabled = true;
    pdfBtn.disabled   = true;
    statusDiv.textContent = "";

    if (!academicYear || !classId || !sectionId) {
      statusDiv.textContent = "Select class & section first.";
      examSelected.textContent = "--Select--";
      examSelected.classList.add('disabled');
      return;
    }

    // 1) Load exams for CURRENT class group
    const classGroup = getClassGroupName(className);
    const examsSnap = await db.collection('years').doc(academicYear)
      .collection('exams').doc('classGroups')
      .collection(classGroup).orderBy('name').get();

    exams = [];
    examMap = {};
    examsSnap.forEach(doc => {
      const ex = { id: doc.id, ...(doc.data() || {}) };
      exams.push(ex);
      examMap[ex.id] = ex;
    });

    if (!exams.length) {
      statusDiv.textContent = "No exams found for this class group.";
      examSelected.textContent = "--Select--";
      examSelected.classList.add('disabled');
      return;
    }

    // Fill exam dropdown (don’t auto-select unless we have a remembered one)
    examList.innerHTML = exams.map(ex =>
      `<div class="dropdown-option" data-id="${ex.id}">${ex.name}</div>`
    ).join('');
    examSelected.textContent = "--Select--";
    examSelected.classList.remove('disabled');

    // Try to preselect the last-used exam for this (year, class, section)
    const last = loadLastExam();
    if (last && examMap[last]) {
      selectedExam = last;
      selectedExamObj = examMap[last];
      examSelected.textContent = selectedExamObj.name;
      examSelected.dataset.value = last;
    } else {
      selectedExam = null;
      selectedExamObj = null;
    }
  if (selectedExam) {
  await loadMarksForExam(selectedExam);
}
    // 2) Load students for CURRENT section
    const studentsSnap = await db.collection('years').doc(academicYear)
      .collection('classes').doc(classId)
      .collection('sections').doc(sectionId)
      .collection('students').orderBy('roll').get();

    students = [];
    studentsSnap.forEach(doc => {
      const s = doc.data() || {};
      if (!s.isDeleted) students.push({ id: doc.id, ...s });
    });

    // 3) Preload marks for ALL exams
    // 3) Load marks ONLY for the currently selected exam (much fewer reads)
marksMap = {};           // reset (we'll fill per exam)
marksReady = false;
updateExportState();

// If an exam was remembered, load it now; otherwise wait for user pick
if (selectedExam) {
  await loadMarksForExam(selectedExam);
} else {
  // nothing selected yet; keep buttons disabled
}

  } catch (err) {
    statusDiv.textContent = "Error: " + err.message;
    examSelected.textContent = "--Select--";
    examSelected.classList.add('disabled');
    excelBtn.disabled = true;
    pdfBtn.disabled   = true;
  }
}

  // ---- Modern Dropdown Logic (Class, Section, Exam) ----
  async function loadMarksForExam(examId) {
  try {
    marksReady = false;
    statusDiv.textContent = 'Loading marks… please wait.';
    updateExportState();

    // Build all doc refs for this exam across students, then read in parallel
    const reads = students.map(stu =>
      db.collection('years').doc(academicYear)
        .collection('classes').doc(classId)
        .collection('sections').doc(sectionId)
        .collection('students').doc(stu.id)
        .collection('marks').doc(examId).get()
        .then(snap => ({ sid: stu.id, data: snap.exists ? (snap.data() || {}) : {} }))
    );

    const results = await Promise.all(reads);

    // Merge into marksMap shape: marksMap[studentId][examId] = {...}
    for (const r of results) {
      if (!marksMap[r.sid]) marksMap[r.sid] = {};
      marksMap[r.sid][examId] = r.data;
    }

    marksReady = true;
    if (statusDiv.textContent.startsWith('Loading marks')) statusDiv.textContent = '';
  } catch (e) {
    marksReady = false;
    statusDiv.textContent = 'Error loading marks: ' + e.message;
  } finally {
    updateExportState();
  }
}
function hideAllLists() {
  if (classList)   classList.style.display = 'none';
  if (sectionList) sectionList.style.display = 'none';
  if (examList)    examList.style.display = 'none';
}

// Toggle open
classSelected.onclick = function(e) {
  classList.style.display = (classList.style.display === 'block') ? 'none' : 'block';
  e.stopPropagation();
};
sectionSelected.onclick = function(e) {
  if (sectionRow.style.display === 'none') return;
  sectionList.style.display = (sectionList.style.display === 'block') ? 'none' : 'block';
  e.stopPropagation();
};
examSelected.onclick = function(e) {
  if (examSelected.classList.contains('disabled')) return;
  examList.style.display = (examList.style.display === 'block') ? 'none' : 'block';
  e.stopPropagation();
};

// Close ONLY when clicking outside any dropdown
document.addEventListener('click', function(e) {
  const clickedInside =
    (classDropdown && classDropdown.contains(e.target)) ||
    (sectionDropdown && sectionDropdown.contains(e.target)) ||
    (examDropdown && examDropdown.contains(e.target));
  if (!clickedInside) hideAllLists();
});

// Hide on page scroll, but ignore scrolls inside dropdown lists
window.addEventListener('scroll', function(e) {
  const t = e.target;
  const scrollingInsideDropdown =
    (classList && (t === classList || classList.contains(t))) ||
    (sectionList && (t === sectionList || sectionList.contains(t))) ||
    (examList && (t === examList || examList.contains(t)));
  if (!scrollingInsideDropdown) hideAllLists();
}, { capture: true, passive: true });

window.addEventListener('resize', hideAllLists);

// Select handlers
classList.onclick = function(e) {
  const opt = e.target.closest('.dropdown-option');
  if (!opt) return;
  hideAllLists();
  setSelectedClass({ id: opt.dataset.id, name: opt.dataset.name });
};

sectionList.onclick = function(e) {
  const opt = e.target.closest('.dropdown-option');
  if (!opt) return;
  hideAllLists();
  setSelectedSection({ id: opt.dataset.id, name: opt.dataset.name });
};

examList.onclick = function(e) {
  const opt = e.target.closest('.dropdown-option');

// Load just this exam's marks quickly, then enable exports

  // ------------- EXCEL EXPORT -------------
  excelBtn.onclick = function() {
  if (isExporting) return;
  if (!selectedExamObj) {
    selectedExam = examSelected.dataset.value;
    selectedExamObj = examMap[selectedExam];
  }
  if (!selectedExamObj) { statusDiv.textContent = "Select an exam."; return; }
if (!marksReady) { statusDiv.textContent = "Marks are still loading. Please wait a moment."; return; }

  isExporting = true;
  excelBtn.disabled = true;
  pdfBtn.disabled  = true;
  statusDiv.textContent = "Preparing Excel...";

  try {
    // Build headers
    let headers = ['Roll', 'Name'];
    let subjectObjs = (selectedExamObj.subjects || []);
    let subjects = subjectObjs.map(s => s.name);
    let subjectShorts = subjectObjs.map(s => getShortSubjectName(s.name));
    headers.push(...subjects, 'Total', 'Grade', 'Rank');

    // Build data rows
    let rows = [];
    let totalArr = [];
    students.forEach(stu => {
      let allMarks = (marksMap && marksMap[stu.id]) || {};
      let marks = allMarks[selectedExamObj.id] || {};
      let row = [stu.roll, stu.name];
      let rowStyles = [null, null];
      let total = 0, tmax = 0, allAbsent = true;
      for (let i = 0; i < subjects.length; ++i) {
        let subj = subjects[i];
        let v = marks[subj];
        let subjMax = (selectedExamObj.subjects.find(s => s.name === subj)?.max) || 100;
        let percentMark = (typeof v === 'number' && subjMax) ? (v / subjMax) * 100 : null;

        if (typeof v === 'number' && !isNaN(v)) {
          row.push(v);
          rowStyles.push(percentMark < 40 ? {
            fill: { fgColor: { rgb: "FF0000" } },
            font: { color: { rgb: "FFFFFF" } }
          } : null);
          total += v;
          tmax += subjMax;
          allAbsent = false;
        } else {
          row.push('Ab');
          rowStyles.push(null);
          tmax += subjMax;
        }
      }
      let percent = tmax ? (total / tmax) * 100 : 0;
      let grade = allAbsent ? '-' : getGrade(percent);
      let totalDisplay = allAbsent ? '-' : total;
      row.push(totalDisplay, grade, '');
      rowStyles.push(null, null, null);

      totalArr.push({ id: stu.id, total: totalDisplay });
      rows.push({ values: row, styles: rowStyles });
    });

    // Ranks (competition style)
    let ranks = {};
    let valid = totalArr.filter(x => x.total !== '-').sort((a, b) => Number(b.total) - Number(a.total));
    let currRank = 0, prevTotal = null, countSeen = 0;
    for (let item of valid) {
      countSeen += 1;
      if (item.total !== prevTotal) { currRank = countSeen; prevTotal = item.total; }
      ranks[item.id] = currRank;
    }
    totalArr.filter(x => x.total === '-').forEach(x => { ranks[x.id] = '-'; });
    for (let i = 0; i < rows.length; ++i) {
      rows[i].values[headers.length - 1] = ranks[students[i].id];
    }

    // Sort: put rank '-' (all absent) at end
    rows = rows.sort((a, b) => {
      let rA = a.values[headers.length-1], rB = b.values[headers.length-1];
      if (rA === '-' && rB !== '-') return 1;
      if (rA !== '-' && rB === '-') return -1;
      if (rA === '-' && rB === '-') return 0;
      return rA - rB;
    });

    // SheetJS export
    let data = [headers, ...rows.map(r => r.values)];
    let ws = XLSX.utils.aoa_to_sheet(data);

    // Apply cell styles (red fill + white font for <40%)
    for (let i = 1; i < rows.length + 1; ++i) {
      let rowObj = rows[i-1];
      if (!rowObj.styles) continue;
      for (let j = 0; j < rowObj.styles.length; ++j) {
        let style = rowObj.styles[j];
        if (style) {
          let cellAddr = XLSX.utils.encode_cell({ r: i, c: j });
          if (!ws[cellAddr]) continue;
          ws[cellAddr].s = style;
        }
      }
    }
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (selectedExamObj.name || "Exam"));
    let fname = `Marks_${className}_${sectionName}_${selectedExamObj.name}_${academicYear}.xlsx`;
    XLSX.writeFile(wb, fname);
    statusDiv.textContent = "Excel downloaded!";
  } catch (err) {
    statusDiv.textContent = "Error generating Excel: " + err.message;
  } finally {
    isExporting = false;
    excelBtn.disabled = false;
    pdfBtn.disabled  = false;
  }
};

  // --------- PDF EXPORT -----------
 pdfBtn.onclick = function() {
  if (isExporting) return;
  if (!selectedExamObj) {
    selectedExam = examSelected.dataset.value;
    selectedExamObj = examMap[selectedExam];
  }
  if (!selectedExamObj) { statusDiv.textContent = "Select an exam."; return; }

  isExporting = true;
  excelBtn.disabled = true;
  pdfBtn.disabled  = true;
  statusDiv.textContent = "Preparing PDF...";

  // --- Prepare marks data (unchanged; same as your current code) ---
  let subjectObjs = (selectedExamObj.subjects || []);
  let subjects = subjectObjs.map(s => s.name);
  let subjectShorts = subjectObjs.map(s => getShortSubjectName(s.name));
  let subjMaxs = (selectedExamObj.subjects || []).map(s => s.max || 100);

  let studentRows = [];
  let totalArr = [];
  students.forEach(stu => {
    let allMarks = (marksMap && marksMap[stu.id]) || {};
    let marks = allMarks[selectedExamObj.id] || {};
    let row = [stu.roll, stu.name];
    let total = 0, tmax = 0, allAbsent = true;
    for (let i = 0; i < subjects.length; ++i) {
      let subj = subjects[i];
      let v = marks[subj];
      if (v !== undefined && v !== null && v !== '' && typeof v === 'number' && !isNaN(v)) {
        allAbsent = false;
      }
      row.push((v !== undefined && v !== null && v !== '') ? v : 'Ab');
      let mmax = subjMaxs[i];
      if (typeof v === 'number' && !isNaN(v)) { total += mmax ? v : 0; tmax += mmax; }
      else { tmax += mmax; }
    }
    let percent = tmax ? (total / tmax) * 100 : 0;
    let grade = allAbsent ? '-' : getGrade(percent);
    let totalDisplay = allAbsent ? '-' : total;
    row.push(totalDisplay, grade, '');
    totalArr.push({ id: stu.id, total: totalDisplay, percent, allAbsent, row });
  });

  let ranks = {};
  let valid = totalArr.filter(x => x.total !== '-').sort((a, b) => Number(b.total) - Number(a.total));
  let currRank = 0, prevTotal = null, countSeen = 0;
  for (let item of valid) {
    countSeen += 1;
    if (item.total !== prevTotal) { currRank = countSeen; prevTotal = item.total; }
    ranks[item.id] = currRank;
  }
  totalArr.filter(x => x.total === '-').forEach(x => { ranks[x.id] = '-'; });
  for (let x of totalArr) x.row[x.row.length - 1] = ranks[x.id];

  let rankedRows = totalArr.sort((a, b) => {
    let rA = ranks[a.id], rB = ranks[b.id];
    if (rA === '-' && rB !== '-') return 1;
    if (rA !== '-' && rB === '-') return -1;
    if (rA === '-' && rB === '-') return 0;
    return rA - rB;
  }).map(x => x.row);

  // --- Build HTML for PDF (unchanged) ---
  let tableHeaders = `<th>ROLL</th><th style="text-align:left;padding-left:10px;min-width:110px;">NAME</th>` +
    subjects.map(s => s === "Spoken English"
      ? `<th><span>SPOKEN</span><br><span>ENGLISH</span></th>`
      : `<th>${s.toUpperCase()}</th>`).join('') +
    `<th>TOTAL</th><th>GRADE</th><th>RANK</th>`;

  function buildRowHtml(row, idx, rowPx) {
    const nameShrink = (name) => {
      let fsize = "1.14em";
      if (name.length > 22) fsize = "1.05em";
      if (name.length > 32) fsize = "0.93em";
      if (name.length > 40) fsize = "0.83em";
      if (name.length > 48) fsize = "0.73em";
      if (name.length > 55) fsize = "0.62em";
      if (name.length > 65) fsize = "0.54em";
      if (name.length > 75) fsize = "0.47em";
      return fsize;
    };

    let tds = '';
    for (let j = 0; j < row.length; ++j) {
      if (j === 0) {
        tds += `<td style="font-size:1.25em;font-weight:600;min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;
      } else if (j === 1) {
        let name = row[j] || '';
        let fsize = nameShrink(name);
        tds += `<td style="text-align:left;padding-left:10px;font-size:${fsize};white-space:nowrap;min-height:${rowPx}px;height:${rowPx}px;">${name}</td>`;
      } else if (j >= 2 && j < 2 + subjects.length) {
        let v = row[j];
        let subjMax = subjMaxs[j-2];
        if (v !== undefined && v !== null && v !== "" && typeof v === "number" && !isNaN(v) && subjMax && ((v / subjMax) * 100) < 40) {
          tds += `<td style="padding:0;vertical-align:middle;font-size:1.19em;min-height:${rowPx}px;height:${rowPx}px;">
            <div style="display:flex;align-items:center;justify-content:center;position:relative;min-height:${rowPx}px;min-width:${Math.max(24, rowPx)}px;">
              <span style="font-weight:bold;z-index:2;font-size:1.08em;">${v}</span>
              <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.24em;color:#c81929;z-index:1;">◯</span>
            </div>
          </td>`;
        } else {
          tds += `<td style="font-size:1.19em;min-height:${rowPx}px;height:${rowPx}px;">${(v !== undefined && v !== null && v !== "") ? v : 'Ab'}</td>`;
        }
      } else if (j === row.length - 3) {
        tds += `<td style="font-size:1.19em;font-weight:600;min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;
      } else if (j === row.length - 2) {
        tds += `<td style="font-size:1.19em;font-weight:600;min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;
      } else if (j === row.length - 1) {
        tds += `<td style="font-size:1.19em;font-weight:600;min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;
      } else {
        tds += `<td style="min-height:${rowPx}px;height:${rowPx}px;">${row[j]}</td>`;
      }
    }
    let bgcolor = idx % 2 ? "#eaf1fa" : "#f8fbff";
    return `<tr style="background:${bgcolor};min-height:${rowPx}px;height:${rowPx}px;">${tds}</tr>`;
  }

     // Page metrics (A4 landscape). Keep margins in sync with html2pdf.
const CM_TO_PX = 37.795;
const TOP_CM = 0, RIGHT_CM = 1, BOTTOM_CM = 1.27, LEFT_CM = 1; // keep top = 0
const HEADER_PULLUP_PX = 96;              // page-1 banner pull-up
const NON_FIRST_TOP_PAD_PX = 0;          // small gap before header on page 2+
const CONTENT_H_PX = (21 - TOP_CM - BOTTOM_CM) * CM_TO_PX;
const CONTENT_W_PX = (29.7 - LEFT_CM - RIGHT_CM) * CM_TO_PX;
const SAFETY_PX = 40;

// --- DYNAMIC ROW COUNTS (set after safety constants) ---
// placeholder; will assign after EXTRA_SAFETY_* are defined
let rowsOnFirstPage;
let rowsOnNextPages;


let studentCount = students.length;
let rowHeight = 26;
if (studentCount <= 35)      { rowHeight = 26; }
else if (studentCount <= 40) { rowHeight = 17; }
else if (studentCount <= 45) { rowHeight = 13; }
else if (studentCount <= 50) { rowHeight = 9.5; }
else if (studentCount <= 60) { rowHeight = 7.6; }
else                         { rowHeight = 5.8; }
const rowPx = Math.max(24, rowHeight);
// Extra safety so rows don't spill onto the next page before the header
// Bigger cushions + a small render fudge to account for html2pdf differences
const EXTRA_SAFETY_FIRST_PX = Math.round(rowPx * 1.8); // page 1 cushion
const EXTRA_SAFETY_NEXT_PX  = Math.round(rowPx * 1.2); // page 2+ cushion
const RENDER_FUDGE_PX       = Math.ceil(rowPx * 0.6);  // extra guard (~0.6 row)

/* Set dynamic rows per page (must come after EXTRA_SAFETY_* are defined) */
rowsOnFirstPage = countRowsFit(true, 0, EXTRA_SAFETY_FIRST_PX + RENDER_FUDGE_PX);
rowsOnNextPages = countRowsFit(false, NON_FIRST_TOP_PAD_PX, EXTRA_SAFETY_NEXT_PX + RENDER_FUDGE_PX);
// Spill guard: html2pdf can render a hair taller; drop 1 row on page 2+
rowsOnNextPages = Math.max(1, rowsOnNextPages - 1);

// Build the SAME heading HTML used on page 1
function headingHTML() {
  return `
    <div style="width:100%;text-align:center;margin-top:0;margin-bottom:8px;">
      <div style="display:inline-flex;align-items:center;justify-content:center;">
        <img src="schoollogo1.png" style="display:block;height:80px;width:auto;max-width:140px;border-radius:8px;margin-right:10px;" onerror="this.style.display='none';">
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:92px;line-height:1.09;">
          <span style="font-size:2.19em;font-weight:bold;letter-spacing:0.01em;font-family:'Times New Roman', Times, serif;color:#c81929;line-height:1.08;">
            St. Patrick's School
          </span>
          <span style="font-size:1.19em;font-weight:700;color:#224a74;letter-spacing:0.01em;line-height:1.06;">
            IIT & NEET FOUNDATION
          </span>
          <span style="font-size:1.17em;font-weight:bold;letter-spacing:0.01em;color:#187141;line-height:1.05;">
            ${className}${sectionName ? ' - ' + sectionName : ''}
          </span>
          <span style="font-size:1.12em;font-weight:bold;color:#b80000;letter-spacing:0.01em;line-height:1.05;">
            ${selectedExamObj.name} Results
          </span>
        </div>
        <img src="schoollogo2.png" style="display:block;height:80px;width:auto;max-width:140px;border-radius:8px;margin-left:10px;" onerror="this.style.display='none';">
      </div>
    </div>`;
}

// Measure how many rows fit given the actual DOM rendering
function countRowsFit(includeHeading, extraTopPx = 0, extraSafetyPx = 0) {
  const probe = document.createElement('div');
  probe.style.cssText = `position:absolute;visibility:hidden;left:-9999px;top:-9999px;width:${CONTENT_W_PX}px;`;
  probe.innerHTML = `
    <style>
      tr { page-break-inside: avoid !important; }
      td, th { border: 1px solid #444 !important; padding: 0 1px; white-space: nowrap; font-size: 0.98em; }
    </style>
    <div style="font-family:'Times New Roman', Times, serif; color:#1a1a1a; padding-top:${includeHeading ? 0 : extraTopPx}px; box-sizing:border-box;">
     ${includeHeading
  ? `<div style="margin-top:-${HEADER_PULLUP_PX}px;">${headingHTML()}</div>`
  : ``}
      <table cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%;font-size:0.70em;margin-top:0;text-align:center;line-height:1.12;table-layout:auto;word-break:break-word;margin-bottom:0;">
        <thead>
          <tr style="background:#1762a7;color:#fff;font-weight:bold;">${tableHeaders}</tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>`;
  document.body.appendChild(probe);
  const tbody = probe.querySelector('tbody');

  let fit = 0;
  for (let i = 0; i < rankedRows.length; i++) {
    tbody.insertAdjacentHTML('beforeend', buildRowHtml(rankedRows[i], i, rowPx));
    // stop when the total height exceeds the available content height
    if (probe.getBoundingClientRect().height > (CONTENT_H_PX - SAFETY_PX - extraSafetyPx)) {
      tbody.lastElementChild.remove();
      break;
    }
    fit++;
  }
  document.body.removeChild(probe);
  return Math.max(1, fit);
}

  let pagesHtml = [];
  let start = 0;
  let pageIndex = 0;

  while (start < rankedRows.length) {
    const perPage = pageIndex === 0 ? rowsOnFirstPage : rowsOnNextPages;
    const slice = rankedRows.slice(start, start + perPage);
    const rowsHtml = slice.map((row, idx) => buildRowHtml(row, start + idx, rowPx)).join('');

    
const tableHtml = `
  <table cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%;max-width:100%;font-size:0.70em;margin-top:0;text-align:center;line-height:1.12;table-layout:auto;word-break:break-word;margin-bottom:0;">
    <thead>
      <tr style="background:#1762a7;color:#fff;font-weight:bold;">${tableHeaders}</tr>
    </thead>
    <tbody>
  ${rowsHtml}
</tbody>
  </table>
`;

  pagesHtml.push(`
  <div class="pdf-page" style="box-sizing:border-box; padding-top:${pageIndex === 0 ? 0 : NON_FIRST_TOP_PAD_PX}px; ${pageIndex > 0 ? 'page-break-before:always;' : ''}">
    ${pageIndex === 0 ? `<div style="margin-top:-${HEADER_PULLUP_PX}px;">${headingHTML()}</div>` : ''}
    ${tableHtml}
  </div>
`);
    start += perPage;
    pageIndex += 1;
  }

  let pdfHTML = `
    <div style="font-family:'Times New Roman', Times, serif; color:#1a1a1a; margin:0; padding:0;">
      <style>
        tr { page-break-inside: avoid !important; }
        thead { display: table-header-group; }
        tfoot { display: table-footer-group; }
        td, th { border: 1px solid #444 !important; padding: 0 1px; white-space: nowrap; font-size:0.98em; }
      </style>
      ${pagesHtml.join('')}
    </div>
  `;

  let printable = document.createElement('div');
  printable.innerHTML = pdfHTML;
  document.body.appendChild(printable);

  html2pdf().set({
  margin: [TOP_CM, RIGHT_CM, BOTTOM_CM, LEFT_CM], // top, right, bottom, left
  filename: `Marks_${className}_${sectionName}_${selectedExamObj.name}_${academicYear}.pdf`,
  html2canvas: { scale: 2, useCORS: true },
  jsPDF: { unit: 'cm', format: 'a4', orientation: 'landscape' }
})
  .from(printable)
  .save()
  .then(() => {
    document.body.removeChild(printable);
    statusDiv.textContent = "PDF downloaded!";
  })
  .catch(err => {
    document.body.removeChild(printable);
    statusDiv.textContent = "Error generating PDF: " + err;
  })
  .finally(() => {
    isExporting = false;
    excelBtn.disabled = false;
    pdfBtn.disabled  = false;
  });
};
 </script>
