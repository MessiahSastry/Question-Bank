<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discipline Register - St. Patrick's School</title>

  <style>
    :root {
      --primary: #0f3d6b;
      --primary-light: #1762a7;
      --page-bg: #f4f8fc;
      --card-bg: #ffffff;
      --border: #d8e4ef;
      --muted: #687786;
      --late: #d97706;
      --uniform: #b42318;
      --sign: #7a3db8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--page-bg);
      color: #1f2933;
    }

    body {
      padding-bottom: 92px;
    }

    button,
    input {
      font: inherit;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      width: 100%;
      padding: 16px 12px 10px;
      text-align: center;
      color: #fff;
      background: var(--primary);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 4px 14px rgba(15, 61, 107, 0.2);
    }

    .school-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .school-subtitle {
      margin-top: 2px;
      color: #c9e4ff;
      font-size: 0.92rem;
    }

    .academic-year {
      min-height: 22px;
      margin-top: 4px;
      color: #fdc600;
      font-size: 1.03rem;
      font-weight: 700;
    }

    .main-content {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 116px 12px 28px;
    }

    .title-row {
      margin: 10px 2px 14px;
    }

    .page-title {
      margin: 0;
      color: var(--primary);
      font-size: 1.42rem;
      font-weight: 750;
    }

    .class-section {
      margin-top: 4px;
      color: #506171;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .date-card,
    .summary-card,
    .student-card,
    .message-card {
      background: var(--card-bg);
      border: 1px solid rgba(216, 228, 239, 0.95);
      border-radius: 13px;
      box-shadow: 0 2px 9px rgba(15, 61, 107, 0.09);
    }

    .date-card {
      padding: 13px;
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--primary);
      font-weight: 700;
    }

    .date-row {
      display: flex;
      align-items: stretch;
      gap: 9px;
    }

    .date-input {
      flex: 1;
      min-width: 0;
      padding: 10px 11px;
      border: 1.4px solid #c7d7ea;
      border-radius: 8px;
      background: #f8fbfe;
      color: #1f2933;
    }

    .load-btn {
      min-width: 86px;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      background: var(--primary-light);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .load-btn:disabled,
    .save-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .summary-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px;
      margin-bottom: 13px;
    }

    .summary-item {
      min-width: 0;
      padding: 8px 5px;
      text-align: center;
      border-radius: 9px;
      background: #f7fafc;
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.15;
    }

    .summary-count {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 1.18rem;
      font-weight: 800;
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .student-card {
      padding: 11px 12px 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .student-card.has-entry {
      border-color: #9ebbd6;
      box-shadow: 0 3px 12px rgba(15, 61, 107, 0.13);
    }

    .student-main {
      display: flex;
      align-items: center;
      min-width: 0;
      margin-bottom: 10px;
    }

    .avatar {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      margin-right: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e7f1fb;
      color: var(--primary);
      box-shadow: 0 0 0 2px #e9f2fb;
      font-weight: 750;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .student-text {
      flex: 1;
      min-width: 0;
    }

    .student-name {
      overflow: hidden;
      color: #1467b7;
      font-size: 1.04rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-roll {
      margin-top: 2px;
      color: #748291;
      font-size: 0.82rem;
    }

    .issue-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .issue-option {
      position: relative;
      min-width: 0;
    }

    .issue-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .issue-chip {
      min-height: 39px;
      padding: 7px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1.3px solid #cfd9e3;
      border-radius: 9px;
      background: #f8fafc;
      color: #526170;
      font-size: 0.83rem;
      font-weight: 700;
      line-height: 1.1;
      cursor: pointer;
      user-select: none;
      transition: 0.15s;
    }

    .issue-option input:focus-visible + .issue-chip {
      outline: 3px solid rgba(23, 98, 167, 0.22);
      outline-offset: 1px;
    }

    .issue-option.late input:checked + .issue-chip {
      border-color: var(--late);
      background: #fff4df;
      color: #9a4f00;
    }

    .issue-option.uniform input:checked + .issue-chip {
      border-color: var(--uniform);
      background: #fff0ee;
      color: #a4261d;
    }

        .issue-option.sign input:checked + .issue-chip {
      border-color: var(--sign);
      background: #f5edff;
      color: #6832a1;
    }

    .student-extra-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 40px;
      margin-top: 9px;
    }

    .late-minutes-wrap {
      display: none;
      align-items: center;
      gap: 7px;
      color: #9a4f00;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .late-minutes-wrap.show {
      display: flex;
    }

    .late-minutes-input {
      width: 76px;
      padding: 7px 8px;
      border: 1.3px solid var(--late);
      border-radius: 8px;
      background: #fffaf0;
      color: #7a4100;
      text-align: center;
      font-weight: 700;
    }

    .wa-student-btn {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-left: auto;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      background: #25d366;
      color: #fff;
      font-size: 0.86rem;
      font-weight: 750;
      cursor: pointer;
    }

    .wa-student-btn.show {
      display: inline-flex;
    }

    .wa-student-btn:active {
      background: #1ea952;
    }

    .message-card {

    .message-card {
      padding: 22px 14px;
      text-align: center;
      color: #71808e;
    }

    .message-card.error {
      color: #b42318;
    }

    .bottom-actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 11px 12px;
      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid #dce6f0;
      box-shadow: 0 -3px 13px rgba(15, 61, 107, 0.12);
      backdrop-filter: blur(5px);
    }

    .bottom-actions button {
      width: min(260px, 46%);
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      font-weight: 750;
      cursor: pointer;
    }

    .back-btn {
      background: #e5edf4;
      color: var(--primary);
    }

    .save-btn {
      background: var(--primary);
      color: #fff;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      z-index: 500;
      width: min(430px, calc(100% - 30px));
      padding: 11px 14px;
      border-radius: 10px;
      background: #17324d;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.24);
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: #a4261d;
    }

    @media (max-width: 390px) {
      .main-content {
        padding-left: 9px;
        padding-right: 9px;
      }

      .student-card {
        padding-left: 9px;
        padding-right: 9px;
      }

      .issue-grid {
        gap: 5px;
      }

      .issue-chip {
        padding-left: 2px;
        padding-right: 2px;
        font-size: 0.76rem;
      }
    }
  </style>
</head>

<body>
  <header class="fixed-header">
    <div class="school-title">St. Patrick's School</div>
    <div class="school-subtitle">IIT &amp; NEET FOUNDATION</div>
    <div class="academic-year" id="academicYearText"></div>
  </header>

  <main class="main-content">
    <div class="title-row">
      <h1 class="page-title">Discipline Register</h1>
      <div class="class-section" id="classSectionText"></div>
    </div>

    <section class="date-card">
      <label class="field-label" for="registerDate">Register Date</label>
      <div class="date-row">
        <input class="date-input" type="date" id="registerDate" required>
        <button class="load-btn" type="button" id="loadBtn">Load</button>
      </div>
    </section>

    <section class="summary-card" aria-label="Discipline summary">
      <div class="summary-item">
        <span class="summary-label">Late</span>
        <span class="summary-count" id="lateCount">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">No Uniform</span>
        <span class="summary-count" id="uniformCount">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">No Sign</span>
        <span class="summary-count" id="signCount">0</span>
      </div>
    </section>

    <section class="student-list" id="studentList">
      <div class="message-card">Loading students...</div>
    </section>
  </main>

  <div class="bottom-actions">
    <button class="back-btn" type="button" id="backBtn">Back</button>
    <button class="save-btn" type="button" id="saveBtn">Save Register</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.firebasestorage.app",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const auth = firebase.auth();

    const academicYear = localStorage.getItem("sp_selectedYear") || "";
    const currentClassId = localStorage.getItem("sp_selectedClassId") || "";
    const currentClassName = localStorage.getItem("sp_selectedClassName") || "";
    const currentSectionId = localStorage.getItem("sp_selectedSectionId") || "";
    const currentSectionName = localStorage.getItem("sp_selectedSectionName") || "";

    const academicYearText = document.getElementById("academicYearText");
    const classSectionText = document.getElementById("classSectionText");
    const registerDate = document.getElementById("registerDate");
    const studentList = document.getElementById("studentList");
    const loadBtn = document.getElementById("loadBtn");
    const saveBtn = document.getElementById("saveBtn");
    const backBtn = document.getElementById("backBtn");
    const lateCount = document.getElementById("lateCount");
    const uniformCount = document.getElementById("uniformCount");
    const signCount = document.getElementById("signCount");
    const toast = document.getElementById("toast");

    let students = [];
    let loadedDate = "";
    let toastTimer = null;

    academicYearText.textContent = academicYear;
    classSectionText.textContent = [currentClassName, currentSectionName]
      .filter(Boolean)
      .join(" – ");

    const today = getLocalDate();
    registerDate.value = today;
    registerDate.max = today;

    function getLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getInitials(name = "") {
      const parts = String(name).trim().split(/\s+/).filter(Boolean);
      const first = parts[0] ? parts[0][0] : "";
      const second = parts[1] ? parts[1][0] : "";
      return (first + second).toUpperCase() || "S";
    }

    function escapeHtml(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showToast(message, type = "success") {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", type === "error");
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function setBusy(isBusy, message = "Loading students...") {
      loadBtn.disabled = isBusy;
      saveBtn.disabled = isBusy;

      if (isBusy) {
        studentList.innerHTML = `<div class="message-card">${escapeHtml(message)}</div>`;
      }
    }

    function studentsCollection() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("students");
    }

    function disciplineDocument(date) {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("disciplineRegister").doc(date);
    }

    auth.onAuthStateChanged(async function (user) {
      if (!user) {
        window.location.replace("index.html");
        return;
      }

      if (!academicYear || !currentClassId || !currentSectionId) {
        studentList.innerHTML = `
          <div class="message-card error">
            Class or Section is not selected. Please go back and select it again.
          </div>
        `;
        loadBtn.disabled = true;
        saveBtn.disabled = true;
        return;
      }

      await loadRegister(registerDate.value);
    });

    async function loadRegister(date) {
      if (!date) {
        showToast("Please select a date.", "error");
        return;
      }

      loadedDate = date;
      setBusy(true, "Loading Discipline Register...");

      try {
        const [studentSnapshot, registerSnapshot] = await Promise.all([
          studentsCollection().orderBy("roll").get(),
          disciplineDocument(date).get()
        ]);

        students = [];
        studentSnapshot.forEach(doc => {
          const data = doc.data() || {};
          if (!data.isDeleted) {
            students.push({ id: doc.id, ...data });
          }
        });

        const savedData = registerSnapshot.exists
          ? (registerSnapshot.data() || {})
          : {};

        renderStudents(savedData);
      } catch (error) {
        console.error("Discipline Register load failed:", error);
        studentList.innerHTML = `
          <div class="message-card error">
            Unable to load the Discipline Register. Please try again.
          </div>
        `;
        showToast("Unable to load the register.", "error");
      } finally {
        loadBtn.disabled = false;
        saveBtn.disabled = false;
      }
    }

    function renderStudents(savedData) {
      if (!students.length) {
        studentList.innerHTML = `
          <div class="message-card">No students found.</div>
        `;
        updateCounts();
        return;
      }

      const html = students.map(student => {
        const entry = savedData[student.id] || {};
               const isLate = entry.late === true;
        const noUniform = entry.noUniform === true;
        const noSign = entry.noSign === true;

        const lateMinutes =
          isLate && Number(entry.lateMinutes) > 0
            ? Number(entry.lateMinutes)
            : "";

        const hasEntry = isLate || noUniform || noSign;
        const safeName = escapeHtml(student.name || "");
        const safePhoto = escapeHtml(student.photoUrl || "");

        const avatar = safePhoto
          ? `<div class="avatar"><img src="${safePhoto}" alt="${safeName}"></div>`
          : `<div class="avatar">${getInitials(student.name || "")}</div>`;

        return `
          <article class="student-card ${hasEntry ? "has-entry" : ""}" data-student-id="${student.id}">
            <div class="student-main">
              ${avatar}
              <div class="student-text">
                <div class="student-name">${safeName}</div>
                <div class="student-roll">Roll Number: ${escapeHtml(student.roll || "")}</div>
              </div>
            </div>

            <div class="issue-grid">
              <label class="issue-option late">
                <input
                  type="checkbox"
                  class="discipline-check"
                  data-student-id="${student.id}"
                  data-field="late"
                  ${isLate ? "checked" : ""}
                >
                <span class="issue-chip">Late</span>
              </label>

              <label class="issue-option uniform">
                <input
                  type="checkbox"
                  class="discipline-check"
                  data-student-id="${student.id}"
                  data-field="noUniform"
                  ${noUniform ? "checked" : ""}
                >
                <span class="issue-chip">No Uniform</span>
              </label>

                           <label class="issue-option sign">
                <input
                  type="checkbox"
                  class="discipline-check"
                  data-student-id="${student.id}"
                  data-field="noSign"
                  ${noSign ? "checked" : ""}
                >
                <span class="issue-chip">No Sign</span>
              </label>
            </div>

            <div class="student-extra-row">
              <label
                class="late-minutes-wrap ${isLate ? "show" : ""}"
                data-minutes-wrap="${student.id}"
              >
                Late by

                <input
                  type="number"
                  class="late-minutes-input"
                  data-student-id="${student.id}"
                  min="1"
                  max="180"
                  step="1"
                  inputmode="numeric"
                  value="${escapeHtml(lateMinutes)}"
                  ${isLate ? "" : "disabled"}
                >

                minutes
              </label>

              <button
                type="button"
                class="wa-student-btn ${hasEntry ? "show" : ""}"
                data-student-id="${student.id}"
              >
                WhatsApp
              </button>
            </div>
          </article>
        `;
      }).join("");

      studentList.innerHTML = html;

           document.querySelectorAll(".discipline-check").forEach(input => {
        input.addEventListener("change", function () {
          updateStudentCardState(this.dataset.studentId);
          updateCounts();
        });
      });

      document.querySelectorAll(".late-minutes-input").forEach(input => {
        input.addEventListener("input", function () {
          this.value = this.value.replace(/[^\d]/g, "");

          if (Number(this.value) > 180) {
            this.value = "180";
          }
        });
      });

      document.querySelectorAll(".wa-student-btn").forEach(button => {
        button.addEventListener("click", function () {
          openStudentWhatsApp(this.dataset.studentId);
        });
      });

      updateCounts();
    }

    function updateStudentCardState(studentId) {
      const card = document.querySelector(
        `.student-card[data-student-id="${studentId}"]`
      );

      if (!card) return;

      const lateCheckbox = card.querySelector(
        '.discipline-check[data-field="late"]'
      );

      const minutesWrap = card.querySelector(
        `[data-minutes-wrap="${studentId}"]`
      );

      const minutesInput = card.querySelector(
        `.late-minutes-input[data-student-id="${studentId}"]`
      );

      const whatsappButton = card.querySelector(
        `.wa-student-btn[data-student-id="${studentId}"]`
      );

      const selected = card.querySelectorAll(
        ".discipline-check:checked"
      ).length > 0;

      const isLate = lateCheckbox?.checked === true;

      card.classList.toggle("has-entry", selected);
      minutesWrap?.classList.toggle("show", isLate);
      whatsappButton?.classList.toggle("show", selected);

      if (minutesInput) {
        minutesInput.disabled = !isLate;

        if (!isLate) {
          minutesInput.value = "";
        }
      }
    }

    function updateCounts() {
      lateCount.textContent = document.querySelectorAll(
        '.discipline-check[data-field="late"]:checked'
      ).length;

      uniformCount.textContent = document.querySelectorAll(
        '.discipline-check[data-field="noUniform"]:checked'
      ).length;

      signCount.textContent = document.querySelectorAll(
        '.discipline-check[data-field="noSign"]:checked'
      ).length;
    }

       function collectRegisterData() {
      const registerData = {};

      for (const student of students) {
        const card = document.querySelector(
          `.student-card[data-student-id="${student.id}"]`
        );

        if (!card) continue;

        const late = card.querySelector(
          '.discipline-check[data-field="late"]'
        )?.checked === true;

        const noUniform = card.querySelector(
          '.discipline-check[data-field="noUniform"]'
        )?.checked === true;

        const noSign = card.querySelector(
          '.discipline-check[data-field="noSign"]'
        )?.checked === true;

        const minutesInput = card.querySelector(
          `.late-minutes-input[data-student-id="${student.id}"]`
        );

        const lateMinutes = late
          ? parseInt(minutesInput?.value || "", 10)
          : 0;

        if (late && (!Number.isFinite(lateMinutes) || lateMinutes < 1)) {
          showToast(
            `Enter late minutes for ${student.name || "the student"}.`,
            "error"
          );

          minutesInput?.focus();
          return null;
        }

        if (late || noUniform || noSign) {
          registerData[student.id] = {
            late,
            lateMinutes: late ? lateMinutes : null,
            noUniform,
            noSign
          };
        }
      }

      return registerData;
    }

       function formatRegisterDate(dateString) {
      if (!dateString) return "";

      const parts = dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    function normalizeWhatsAppNumber(phoneNumber) {
      let digits = String(phoneNumber || "").replace(/\D/g, "");

      if (digits.length === 10) {
        digits = `91${digits}`;
      } else if (digits.length === 11 && digits.startsWith("0")) {
        digits = `91${digits.substring(1)}`;
      }

      return digits;
    }

    function getStudentDisciplineEntry(studentId) {
      const card = document.querySelector(
        `.student-card[data-student-id="${studentId}"]`
      );

      if (!card) return null;

      const late = card.querySelector(
        '.discipline-check[data-field="late"]'
      )?.checked === true;

      const noUniform = card.querySelector(
        '.discipline-check[data-field="noUniform"]'
      )?.checked === true;

      const noSign = card.querySelector(
        '.discipline-check[data-field="noSign"]'
      )?.checked === true;

      const minutesInput = card.querySelector(
        `.late-minutes-input[data-student-id="${studentId}"]`
      );

      const lateMinutes = late
        ? parseInt(minutesInput?.value || "", 10)
        : 0;

      return {
        late,
        lateMinutes,
        noUniform,
        noSign
      };
    }

    function buildDisciplineWhatsAppMessage(student, entry) {
      const studentName = student.name || "Student";

      const classSection = [
        currentClassName,
        currentSectionName
      ].filter(Boolean).join(" – ");

      const selectedDate = formatRegisterDate(
        registerDate.value || loadedDate
      );

      const issueCount = [
        entry.late,
        entry.noUniform,
        entry.noSign
      ].filter(Boolean).length;

      if (
        issueCount === 1 &&
        entry.late
      ) {
        return `Dear Parent,

This is to inform you that your child, ${studentName} of ${classSection}, arrived at school ${entry.lateMinutes} minutes late on ${selectedDate}.

Kindly ensure that your child reaches school on time in the future.

ప్రియమైన తల్లిదండ్రులకు,

 ${studentName}, ${classSection}, ${selectedDate} తేదీన పాఠశాలకు ${entry.lateMinutes} నిమిషాలు ఆలస్యంగా వచ్చారని తెలియజేస్తున్నాము.

దయచేసి ఇకపై సమయానికి పాఠశాలకు వచ్చేలా చూసుకోండి.

St. Patrick's School`;
      }

      const englishIssues = [];
      const teluguIssues = [];

      if (entry.late) {
        englishIssues.push(
          `• Arrived ${entry.lateMinutes} minutes late`
        );

        teluguIssues.push(
          `• పాఠశాలకు ${entry.lateMinutes} నిమిషాలు ఆలస్యంగా వచ్చారు`
        );
      }

      if (entry.noUniform) {
        englishIssues.push(
          "• Came without the prescribed uniform"
        );

        teluguIssues.push(
          "• నిర్ణీత యూనిఫాం ధరించలేదు"
        );
      }

      if (entry.noSign) {
        englishIssues.push(
          "• Parent's signature was not found"
        );

        teluguIssues.push(
          "• తల్లిదండ్రుల సంతకం లేదు"
        );
      }

      return `Dear Parent,

This is to inform you that your child, ${studentName} of ${classSection}, was noted for the following on ${selectedDate}:

Issues Observed:
${englishIssues.join("\n")}

Kindly take note and ensure that these issues are not repeated.

ప్రియమైన తల్లిదండ్రులకు,

${studentName}, ${classSection}, ${selectedDate} తేదీన క్రింది విషయాలకు సంబంధించి నమోదు చేయబడ్డారు:

గమనించిన అంశాలు:
${teluguIssues.join("\n")}

దయచేసి ఈ విషయాలను గమనించి, భవిష్యత్తులో పునరావృతం కాకుండా చూసుకోగలరు.

St. Patrick's School`;
    }

    function openStudentWhatsApp(studentId) {
      const student = students.find(item => item.id === studentId);

      if (!student) {
        showToast("Student details were not found.", "error");
        return;
      }

      const entry = getStudentDisciplineEntry(studentId);

      if (
        !entry ||
        (!entry.late && !entry.noUniform && !entry.noSign)
      ) {
        showToast(
          "Select at least one discipline issue.",
          "error"
        );
        return;
      }

      if (
        entry.late &&
        (!Number.isFinite(entry.lateMinutes) || entry.lateMinutes < 1)
      ) {
        showToast(
          `Enter late minutes for ${student.name || "the student"}.`,
          "error"
        );

        document.querySelector(
          `.late-minutes-input[data-student-id="${studentId}"]`
        )?.focus();

        return;
      }

      const phoneNumber = normalizeWhatsAppNumber(
        student.parentPhone || student.phone || ""
      );

      if (phoneNumber.length < 12) {
        showToast(
          `Parent phone number is not available for ${student.name || "this student"}.`,
          "error"
        );
        return;
      }

      const message = buildDisciplineWhatsAppMessage(
        student,
        entry
      );

      const whatsappUrl =
        `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

      window.open(whatsappUrl, "_blank", "noopener,noreferrer");
    }

    async function saveRegister() {
      if (!loadedDate || loadedDate !== registerDate.value) {
        showToast("Load the selected date before saving.", "error");
        return;
      }

      loadBtn.disabled = true;
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

           try {
        const registerData = collectRegisterData();

        if (!registerData) {
          return;
        }

        registerData.__meta = {
          date: loadedDate,
          className: currentClassName,
          sectionName: currentSectionName,
          updatedBy: auth.currentUser ? auth.currentUser.email : "",
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await disciplineDocument(loadedDate).set(registerData);
        showToast("Discipline Register saved successfully.");
      } catch (error) {
        console.error("Discipline Register save failed:", error);
        showToast("Unable to save the register.", "error");
      } finally {
        loadBtn.disabled = false;
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Register";
      }
    }

    loadBtn.addEventListener("click", function () {
      loadRegister(registerDate.value);
    });

    registerDate.addEventListener("change", function () {
      loadedDate = "";
    });

    saveBtn.addEventListener("click", saveRegister);

    backBtn.addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "students.html";
      }
    });
  </script>
</body>
</html>
