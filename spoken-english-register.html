<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoken English Coin Register - St. Patrick's School</title>

  <style>
    :root {
      --primary: #0f3d6b;
      --primary-light: #1762a7;
      --page-bg: #f4f8fc;
      --card-bg: #ffffff;
      --border: #d8e4ef;
      --muted: #687786;
      --coin: #b7791f;
      --coin-light: #fff8df;
      --success: #1f7a4d;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--page-bg);
      color: #1f2933;
    }

    body {
      padding-bottom: 92px;
    }

    button,
    input {
      font: inherit;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      width: 100%;
      padding: 16px 12px 10px;
      text-align: center;
      color: #fff;
      background: var(--primary);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 4px 14px rgba(15, 61, 107, 0.2);
    }

    .school-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .school-subtitle {
      margin-top: 2px;
      color: #c9e4ff;
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: 0.35px;
    }

    .academic-year {
      min-height: 22px;
      margin-top: 4px;
      color: #fdc600;
      font-size: 1.03rem;
      font-weight: 700;
    }

    .main-content {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 116px 12px 28px;
    }

    .title-row {
      margin: 10px 2px 14px;
    }

    .page-title {
      margin: 0;
      color: var(--primary);
      font-size: 1.42rem;
      font-weight: 750;
    }

    .class-section {
      margin-top: 4px;
      color: #506171;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .date-card,
    .summary-card,
    .student-card,
    .message-card {
      background: var(--card-bg);
      border: 1px solid rgba(216, 228, 239, 0.95);
      border-radius: 13px;
      box-shadow: 0 2px 9px rgba(15, 61, 107, 0.09);
    }

    .date-card {
      padding: 13px;
      margin-bottom: 12px;
    }

    .settings-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 126px;
      gap: 10px;
      align-items: end;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--primary);
      font-weight: 700;
    }

    .date-row {
      display: flex;
      align-items: stretch;
      gap: 9px;
    }

    .date-input,
    .coin-limit-input {
      width: 100%;
      min-width: 0;
      padding: 10px 11px;
      border: 1.4px solid #c7d7ea;
      border-radius: 8px;
      background: #f8fbfe;
      color: #1f2933;
      outline: none;
    }

    .date-input:focus,
    .coin-limit-input:focus,
    .coin-input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(23, 98, 167, 0.12);
    }

    .load-btn {
      min-width: 86px;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      background: var(--primary-light);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .load-btn:disabled,
    .save-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .help-text {
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .summary-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px;
      margin-bottom: 13px;
    }

    .summary-item {
      min-width: 0;
      padding: 8px 5px;
      text-align: center;
      border-radius: 9px;
      background: #f7fafc;
    }

    .summary-item.coins {
      background: var(--coin-light);
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.15;
    }

    .summary-count {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 1.18rem;
      font-weight: 800;
    }

    .summary-item.coins .summary-count {
      color: var(--coin);
    }

    .remaining-ok {
      color: var(--success) !important;
    }

    .remaining-over {
      color: var(--danger) !important;
    }

    .status-note {
      min-height: 20px;
      margin: -3px 2px 10px;
      color: var(--muted);
      font-size: 0.84rem;
      text-align: right;
      font-weight: 650;
    }

    .status-note.saved {
      color: var(--success);
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .student-card {
      padding: 11px 12px;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .student-card.has-coins {
      border-color: #e2bd67;
      background: #fffdf6;
      box-shadow: 0 3px 12px rgba(183, 121, 31, 0.14);
    }

    .student-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .avatar {
      width: 40px;
      height: 40px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e7f1fb;
      color: var(--primary);
      box-shadow: 0 0 0 2px #e9f2fb;
      font-weight: 750;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .student-text {
      min-width: 0;
    }

    .student-name {
      overflow: hidden;
      color: #1467b7;
      font-size: 1.04rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-roll {
      margin-top: 2px;
      color: #748291;
      font-size: 0.82rem;
    }

    .coin-control {
      display: grid;
      grid-template-columns: 38px 58px 38px;
      gap: 5px;
      align-items: center;
    }

    .coin-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #d2deea;
      border-radius: 9px;
      background: #f2f7fb;
      color: var(--primary);
      font-size: 1.28rem;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
    }

    .coin-btn:active {
      transform: scale(0.96);
      background: #e6f0f8;
    }

    .coin-input {
      width: 58px;
      height: 38px;
      padding: 7px 5px;
      border: 1.4px solid #d2deea;
      border-radius: 9px;
      background: #fff;
      color: #7a5416;
      text-align: center;
      font-size: 1.02rem;
      font-weight: 800;
      outline: none;
    }

    .student-card.has-coins .coin-input {
      border-color: #d9ab45;
      background: #fff8df;
    }

    .message-card {
      padding: 22px 14px;
      text-align: center;
      color: #71808e;
    }

    .message-card.error {
      color: var(--danger);
    }

    .bottom-actions {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      z-index: 1000 !important;

      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 12px !important;

      width: 100% !important;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom)) !important;

      background: rgba(255, 255, 255, 0.98) !important;
      border-top: 1px solid #d7e3ee !important;
      box-shadow: 0 -5px 20px rgba(15, 61, 107, 0.16) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .bottom-actions button {
      appearance: none !important;
      -webkit-appearance: none !important;

      flex: 1 1 0 !important;
      width: auto !important;
      max-width: 300px !important;
      min-height: 48px !important;

      margin: 0 !important;
      padding: 12px 16px !important;

      border: none !important;
      border-radius: 12px !important;

      font-family: "Segoe UI", Arial, sans-serif !important;
      font-size: 1rem !important;
      font-weight: 700 !important;
      line-height: 1.2 !important;
      text-align: center !important;

      cursor: pointer !important;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease !important;
    }

    .back-btn {
      background: #e8f0f7 !important;
      color: #0f3d6b !important;
      border: 1px solid #bfd1e1 !important;
      box-shadow: 0 2px 7px rgba(15, 61, 107, 0.10) !important;
    }

    .save-btn {
      background: #0f3d6b !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(15, 61, 107, 0.28) !important;
    }

    .back-btn:active,
    .save-btn:active {
      transform: scale(0.98) !important;
    }

    .save-btn:disabled {
      opacity: 0.55 !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      z-index: 500;
      width: min(430px, calc(100% - 30px));
      padding: 11px 14px;
      border-radius: 10px;
      background: #17324d;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.24);
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: #a4261d;
    }

    @media (max-width: 460px) {
      .main-content {
        padding-left: 9px;
        padding-right: 9px;
      }

      .settings-row {
        grid-template-columns: 1fr;
      }

      .student-card {
        padding-left: 9px;
        padding-right: 9px;
      }

      .student-row {
        grid-template-columns: 40px minmax(0, 1fr) auto;
        gap: 8px;
      }

      .coin-control {
        grid-template-columns: 34px 50px 34px;
        gap: 4px;
      }

      .coin-btn {
        width: 34px;
        height: 36px;
      }

      .coin-input {
        width: 50px;
        height: 36px;
      }
    }
  </style>
</head>

<body>
  <header class="fixed-header">
    <div class="school-title">St. Patrick's School</div>
    <div class="school-subtitle">SPOKEN ENGLISH</div>
    <div class="academic-year" id="academicYearText"></div>
  </header>

  <main class="main-content">
    <div class="title-row">
      <h1 class="page-title">Spoken English Coin Register</h1>
      <div class="class-section" id="classSectionText"></div>
    </div>

    <section class="date-card">
      <div class="settings-row">
        <div>
          <label class="field-label" for="registerDate">Register Date</label>
          <div class="date-row">
            <input class="date-input" type="date" id="registerDate" required>
            <button class="load-btn" type="button" id="loadBtn">Load</button>
          </div>
        </div>

        <div>
          <label class="field-label" for="coinLimit">Section Coins</label>
          <input
            class="coin-limit-input"
            type="number"
            id="coinLimit"
            min="1"
            max="50"
            step="1"
            inputmode="numeric"
            value="6"
            aria-label="Total Spoken English coins allotted to this section"
          >
        </div>
      </div>

      <div class="help-text">
        Enter only the coins held by students at the end of the day. Saving fewer than the allotted coins is allowed; entering more is blocked.
      </div>
    </section>

    <section class="summary-card" aria-label="Spoken English coin summary">
      <div class="summary-item coins">
        <span class="summary-label">Coins Entered</span>
        <span class="summary-count" id="enteredCount">0</span>
      </div>

      <div class="summary-item">
        <span class="summary-label">Remaining</span>
        <span class="summary-count remaining-ok" id="remainingCount">6</span>
      </div>

      <div class="summary-item">
        <span class="summary-label">Students</span>
        <span class="summary-count" id="studentAwardCount">0</span>
      </div>
    </section>

    <div class="status-note" id="statusNote"></div>

    <section class="student-list" id="studentList">
      <div class="message-card">Loading students...</div>
    </section>
  </main>

  <div class="bottom-actions">
    <button type="button" id="backBtn" class="back-btn">
      ← Back
    </button>

    <button type="button" id="saveBtn" class="save-btn">
      Save Coins
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.firebasestorage.app",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const auth = firebase.auth();

    const academicYear = localStorage.getItem("sp_selectedYear") || "";
    const currentClassId = localStorage.getItem("sp_selectedClassId") || "";
    const currentClassName = localStorage.getItem("sp_selectedClassName") || "";
    const currentSectionId = localStorage.getItem("sp_selectedSectionId") || "";
    const currentSectionName = localStorage.getItem("sp_selectedSectionName") || "";

    const academicYearText = document.getElementById("academicYearText");
    const classSectionText = document.getElementById("classSectionText");
    const registerDate = document.getElementById("registerDate");
    const coinLimitInput = document.getElementById("coinLimit");
    const studentList = document.getElementById("studentList");
    const loadBtn = document.getElementById("loadBtn");
    const saveBtn = document.getElementById("saveBtn");
    const backBtn = document.getElementById("backBtn");
    const enteredCount = document.getElementById("enteredCount");
    const remainingCount = document.getElementById("remainingCount");
    const studentAwardCount = document.getElementById("studentAwardCount");
    const statusNote = document.getElementById("statusNote");
    const toast = document.getElementById("toast");

    let students = [];
    let loadedDate = "";
    let toastTimer = null;
    let currentUser = null;

    academicYearText.textContent = academicYear;
    classSectionText.textContent = [currentClassName, currentSectionName]
      .filter(Boolean)
      .join(" – ");

    const today = getLocalDate();
    registerDate.value = today;
    registerDate.max = today;

    function getLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getInitials(name = "") {
      const parts = String(name).trim().split(/\s+/).filter(Boolean);
      const first = parts[0] ? parts[0][0] : "";
      const second = parts[1] ? parts[1][0] : "";
      return (first + second).toUpperCase() || "S";
    }

    function escapeHtml(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safePositiveInt(value, fallback = 0) {
      const num = parseInt(value, 10);
      if (!Number.isFinite(num) || num < 0) return fallback;
      return num;
    }

    function showToast(message, type = "success") {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.toggle("error", type === "error");
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function setBusy(isBusy, message = "Loading students...") {
      loadBtn.disabled = isBusy;
      saveBtn.disabled = isBusy;

      if (isBusy) {
        studentList.innerHTML = `<div class="message-card">${escapeHtml(message)}</div>`;
      }
    }

    function studentsCollection() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("students");
    }

    function spokenEnglishCollection() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("spokenEnglishRegister");
    }

    function spokenEnglishDocument(date) {
      return spokenEnglishCollection().doc(date);
    }

    function spokenEnglishSettingsDocument() {
      return db.collection("years").doc(academicYear)
        .collection("classes").doc(currentClassId)
        .collection("sections").doc(currentSectionId)
        .collection("spokenEnglishSettings").doc("config");
    }

    function getCoinLimit() {
      const value = safePositiveInt(coinLimitInput.value, 0);
      return Math.max(1, value || 1);
    }

    function getCoinInputs() {
      return Array.from(studentList.querySelectorAll(".coin-input"));
    }

    function calculateSummary() {
      const inputs = getCoinInputs();
      const limit = getCoinLimit();

      let total = 0;
      let awardedStudents = 0;

      inputs.forEach(input => {
        const coins = safePositiveInt(input.value, 0);

        if (coins > 0) {
          total += coins;
          awardedStudents++;
        }

        const card = input.closest(".student-card");
        if (card) {
          card.classList.toggle("has-coins", coins > 0);
        }
      });

      const remaining = limit - total;

      enteredCount.textContent = `${total} / ${limit}`;
      remainingCount.textContent = String(remaining);
      studentAwardCount.textContent = String(awardedStudents);

      remainingCount.classList.toggle("remaining-over", remaining < 0);
      remainingCount.classList.toggle("remaining-ok", remaining >= 0);

      const overLimit = total > limit;

      saveBtn.disabled = overLimit;

      if (overLimit) {
        statusNote.textContent = `Coin limit exceeded by ${total - limit}. Reduce the entries before saving.`;
        statusNote.classList.remove("saved");
        statusNote.style.color = "var(--danger)";
      } else if (loadedDate && loadedDate === registerDate.value) {
        statusNote.style.color = "";
      }

      return {
        total,
        awardedStudents,
        limit,
        remaining,
        overLimit
      };
    }

    function setCoinValue(input, nextValue) {
      const next = Math.max(0, safePositiveInt(nextValue, 0));

      const summary = calculateSummary();
      const current = safePositiveInt(input.value, 0);
      const projectedTotal = summary.total - current + next;

      if (projectedTotal > summary.limit) {
        showToast(
          `Only ${summary.limit} coins are allotted to this section.`,
          "error"
        );
        return false;
      }

      input.value = next === 0 ? "" : String(next);
      calculateSummary();
      return true;
    }

    function renderStudents(savedData = {}) {
      if (!students.length) {
        studentList.innerHTML = `
          <div class="message-card">No students found.</div>
        `;
        calculateSummary();
        return;
      }

      studentList.innerHTML = students.map(student => {
        const rawSaved = savedData[student.id];

        let savedCoins = 0;

        if (typeof rawSaved === "number") {
          savedCoins = safePositiveInt(rawSaved, 0);
        } else if (
          rawSaved &&
          typeof rawSaved === "object" &&
          rawSaved.coins !== undefined
        ) {
          savedCoins = safePositiveInt(rawSaved.coins, 0);
        }

        const safeName = escapeHtml(student.name || "");
        const safePhoto = escapeHtml(student.photoUrl || "");

        const avatar = safePhoto
          ? `<div class="avatar"><img src="${safePhoto}" alt="${safeName}"></div>`
          : `<div class="avatar">${getInitials(student.name || "")}</div>`;

        return `
          <article
            class="student-card ${savedCoins > 0 ? "has-coins" : ""}"
            data-student-id="${escapeHtml(student.id)}"
          >
            <div class="student-row">
              ${avatar}

              <div class="student-text">
                <div class="student-name">${safeName}</div>
                <div class="student-roll">
                  Roll Number: ${escapeHtml(student.roll || "")}
                </div>
              </div>

              <div class="coin-control">
                <button
                  type="button"
                  class="coin-btn minus-btn"
                  data-student-id="${escapeHtml(student.id)}"
                  aria-label="Remove one coin from ${safeName}"
                >−</button>

                <input
                  type="number"
                  class="coin-input"
                  data-student-id="${escapeHtml(student.id)}"
                  min="0"
                  step="1"
                  inputmode="numeric"
                  value="${savedCoins > 0 ? savedCoins : ""}"
                  placeholder="0"
                  aria-label="Coins for ${safeName}"
                >

                <button
                  type="button"
                  class="coin-btn plus-btn"
                  data-student-id="${escapeHtml(student.id)}"
                  aria-label="Add one coin to ${safeName}"
                >+</button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      calculateSummary();
    }

    async function loadRegister(date) {
      if (!date) {
        showToast("Please select a date.", "error");
        return;
      }

      if (!academicYear || !currentClassId || !currentSectionId) {
        studentList.innerHTML = `
          <div class="message-card error">
            Class or Section is not selected. Please go back and select it again.
          </div>
        `;
        loadBtn.disabled = true;
        saveBtn.disabled = true;
        return;
      }

      setBusy(true, "Loading Spoken English Coin Register...");
      statusNote.textContent = "";
      statusNote.classList.remove("saved");

      try {
        const [
          studentSnapshot,
          registerSnapshot,
          settingsSnapshot
        ] = await Promise.all([
          studentsCollection().orderBy("roll").get(),
          spokenEnglishDocument(date).get(),
          spokenEnglishSettingsDocument().get()
        ]);

        students = [];

        studentSnapshot.forEach(doc => {
          const data = doc.data() || {};

          if (
            !data.isDeleted &&
            data.isDeleted !== "true" &&
            data.isDeleted !== 1
          ) {
            students.push({
              id: doc.id,
              ...data
            });
          }
        });

        const savedData = registerSnapshot.exists
          ? (registerSnapshot.data() || {})
          : {};

        const settings = settingsSnapshot.exists
          ? (settingsSnapshot.data() || {})
          : {};

        const savedMeta =
          savedData.__meta && typeof savedData.__meta === "object"
            ? savedData.__meta
            : {};

        const loadedLimit =
          safePositiveInt(savedMeta.coinLimit, 0) ||
          safePositiveInt(settings.coinLimit, 0) ||
          6;

        coinLimitInput.value = loadedLimit;

        loadedDate = date;

        renderStudents(savedData);

        if (registerSnapshot.exists) {
          statusNote.textContent = "Saved entry loaded. You can edit and save again.";
          statusNote.classList.add("saved");
        } else {
          statusNote.textContent = "No saved entry for this date.";
          statusNote.classList.remove("saved");
        }

        calculateSummary();

      } catch (error) {
        console.error("Spoken English register load failed:", error);

        studentList.innerHTML = `
          <div class="message-card error">
            Unable to load the Spoken English Coin Register.
          </div>
        `;

        showToast("Unable to load the register.", "error");

      } finally {
        loadBtn.disabled = false;

        const summary = calculateSummary();
        saveBtn.disabled = summary.overLimit;
      }
    }

    function collectRegisterData() {
      const data = {};

      getCoinInputs().forEach(input => {
        const studentId = input.dataset.studentId || "";
        const coins = safePositiveInt(input.value, 0);

        if (studentId && coins > 0) {
          data[studentId] = coins;
        }
      });

      return data;
    }

    async function saveRegister() {
      const date = registerDate.value;

      if (!date) {
        showToast("Please select a date.", "error");
        return;
      }

      if (loadedDate !== date) {
        showToast("Please press Load for the selected date first.", "error");
        return;
      }

      const summary = calculateSummary();

      if (summary.overLimit) {
        showToast(
          `Entered coins cannot be more than ${summary.limit}.`,
          "error"
        );
        return;
      }

      if (!Number.isInteger(summary.limit) || summary.limit < 1) {
        showToast("Please enter a valid section coin limit.", "error");
        return;
      }

      saveBtn.disabled = true;
      loadBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        const registerData = collectRegisterData();

        registerData.__meta = {
          date,
          academicYear,
          classId: currentClassId,
          className: currentClassName,
          sectionId: currentSectionId,
          sectionName: currentSectionName,
          coinLimit: summary.limit,
          totalCoinsEntered: summary.total,
          studentsAwarded: summary.awardedStudents,
          updatedByUid: currentUser ? currentUser.uid : "",
          updatedByEmail: currentUser ? (currentUser.email || "") : "",
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await Promise.all([
          spokenEnglishDocument(date).set(registerData),
          spokenEnglishSettingsDocument().set({
            coinLimit: summary.limit,
            academicYear,
            classId: currentClassId,
            sectionId: currentSectionId,
            updatedByUid: currentUser ? currentUser.uid : "",
            updatedByEmail: currentUser ? (currentUser.email || "") : "",
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true })
        ]);

        statusNote.textContent =
          `Saved: ${summary.total} of ${summary.limit} coins entered.`;
        statusNote.classList.add("saved");
        statusNote.style.color = "";

        showToast("Spoken English coins saved successfully.");

      } catch (error) {
        console.error("Spoken English register save failed:", error);
        showToast("Unable to save the register.", "error");

      } finally {
        loadBtn.disabled = false;

        const updatedSummary = calculateSummary();
        saveBtn.disabled = updatedSummary.overLimit;
        saveBtn.textContent = "Save Coins";
      }
    }

    studentList.addEventListener("click", function (event) {
      const plus = event.target.closest(".plus-btn");
      const minus = event.target.closest(".minus-btn");

      const button = plus || minus;
      if (!button) return;

      const studentId = button.dataset.studentId;
      const input = studentList.querySelector(
        `.coin-input[data-student-id="${CSS.escape(studentId)}"]`
      );

      if (!input) return;

      const current = safePositiveInt(input.value, 0);

      if (plus) {
        setCoinValue(input, current + 1);
      } else {
        setCoinValue(input, Math.max(0, current - 1));
      }
    });

    studentList.addEventListener("input", function (event) {
      const input = event.target.closest(".coin-input");
      if (!input) return;

      if (input.value === "") {
        calculateSummary();
        return;
      }

      let value = safePositiveInt(input.value, 0);

      if (String(value) !== String(input.value).trim()) {
        input.value = value > 0 ? value : "";
      }

      const summary = calculateSummary();

      if (summary.overLimit) {
        input.style.borderColor = "var(--danger)";
      } else {
        input.style.borderColor = "";
      }
    });

    studentList.addEventListener("change", function (event) {
      const input = event.target.closest(".coin-input");
      if (!input) return;

      if (input.value === "") {
        calculateSummary();
        return;
      }

      const value = safePositiveInt(input.value, 0);
      input.value = value > 0 ? value : "";

      calculateSummary();
    });

    coinLimitInput.addEventListener("input", function () {
      let value = safePositiveInt(coinLimitInput.value, 0);

      if (value > 50) {
        value = 50;
        coinLimitInput.value = "50";
      }

      calculateSummary();
    });

    coinLimitInput.addEventListener("change", function () {
      let value = safePositiveInt(coinLimitInput.value, 0);

      if (value < 1) value = 1;
      if (value > 50) value = 50;

      coinLimitInput.value = value;
      calculateSummary();
    });

    loadBtn.addEventListener("click", function () {
      loadRegister(registerDate.value);
    });

    registerDate.addEventListener("change", function () {
      loadedDate = "";
      statusNote.textContent = "Press Load to open this date.";
      statusNote.classList.remove("saved");
    });

    saveBtn.addEventListener("click", saveRegister);

    backBtn.addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "students.html";
      }
    });

    auth.onAuthStateChanged(async function (user) {
      if (!user) {
        window.location.replace("index.html");
        return;
      }

      currentUser = user;

      if (!academicYear || !currentClassId || !currentSectionId) {
        studentList.innerHTML = `
          <div class="message-card error">
            Class or Section is not selected. Please go back and select it again.
          </div>
        `;

        loadBtn.disabled = true;
        saveBtn.disabled = true;
        return;
      }

      await loadRegister(registerDate.value);
    });
  </script>
</body>
</html>
