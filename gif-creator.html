<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123d69">
<title>Educational GIF Creator | St. Patrick's School</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#173a58;background:#f3f7fc}
*{box-sizing:border-box}
body{margin:0;background:#f3f7fc;min-height:100vh}
header{padding:23px 16px 24px;text-align:center;color:#fff;background:linear-gradient(125deg,#123b68,#12769f);border-radius:0 0 23px 23px}
header h1{font-size:1.5rem;letter-spacing:.01em;margin:0 0 5px;font-weight:800}
header p{margin:0;font-size:.94rem;color:#d8ecfb}
nav{max-width:860px;margin:13px auto 0;padding:0 15px}
nav a{color:#1b5c91;text-decoration:none;font-size:.92rem;font-weight:750}
main{max-width:860px;margin:17px auto 50px;padding:0 14px}
.card{border:1px solid #dfebf5;border-radius:20px;background:#fff;padding:21px;margin-bottom:17px;box-shadow:0 8px 24px #1c446b0a}
.card h2{font-size:1.15rem;color:#113e66;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.field{position:relative;display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:.92rem;font-weight:730}
.field input,.field select,textarea{border:1.5px solid #ccdeeb;border-radius:12px;width:100%;padding:12px 14px;min-height:49px;font:inherit;color:#153a58;background:#f9fcff}
.field input:focus,textarea:focus{outline:3px solid #c7e7ff;border-color:#2e88b9}
textarea{min-height:230px;resize:vertical;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre;overflow:auto}
button,.download{border:none;border-radius:13px;min-height:51px;padding:13px 18px;cursor:pointer;text-decoration:none;text-align:center;font:inherit;font-weight:780;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:disabled{opacity:.6;cursor:not-allowed}
.primary{background:linear-gradient(125deg,#136f9e,#125b8e);color:#fff;box-shadow:0 4px 13px #125b8e23}
.generate{background:#087d76;color:#fff;box-shadow:0 4px 15px #087d7625}
.action{margin-top:18px;width:100%;font-size:1.01rem}
#status{padding:13px 15px;border-radius:12px;background:#edf6fc;color:#14577e;font-size:.92rem;line-height:1.5;margin-top:15px}
#status[data-state=error]{background:#fff0ed;color:#9e342b}
#status[data-state=success]{background:#e7f7f0;color:#176846}
[hidden]{display:none!important}
#previewArea[hidden],#download[hidden]{display:none}
#previewArea{margin-top:19px}
#previewArea h2{margin-bottom:8px}
#stageCanvas{width:100%;height:auto;max-width:410px;display:block;margin:12px auto 14px;background:white;border:1px solid #d8e5ef;border-radius:13px;touch-action:manipulation}
#download{display:flex;width:100%;background:#145e96;color:white}
footer{text-align:center;padding:15px;color:#7c8fa1;font-size:.82rem}
select.enhanced-native{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;border:0!important;opacity:0!important;pointer-events:none!important}
.smart-select{position:relative;width:100%}
.select-trigger{width:100%;border:1.5px solid #ccdeeb;background:#f9fcff;color:#153a58;display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:51px;padding:11px 14px;font-weight:530;border-radius:12px;box-shadow:none;gap:11px}
.select-trigger .value{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.select-trigger .chevron{display:inline-flex;align-items:center;justify-content:center;flex:none;width:23px;height:23px;border-radius:7px;background:#e9f3fa;color:#1a739d;transition:transform .2s}
.smart-select.open .chevron{transform:rotate(180deg)}
.smart-select.open .select-trigger,.select-trigger:focus-visible{border-color:#287eb4;outline:3px solid #d9effb}
.option-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:100;display:none;padding:7px;max-height:255px;overflow-y:auto;overscroll-behavior:contain;background:#fff;border:1px solid #cddfec;border-radius:15px;box-shadow:0 18px 32px #123a6127}
.smart-select.open .option-panel{display:block}
.option-item{width:100%;border:0;min-height:42px;padding:10px 11px;color:#1a4564;background:transparent;text-align:left;border-radius:9px;justify-content:flex-start;font-size:.93rem;font-weight:580}
.option-item[aria-selected=true]{color:#0c678e;background:#e5f3fa;font-weight:760}
.option-item:hover,.option-item:focus-visible{background:#eef7fc;outline:none}
.option-search{border:1px solid #d8e6f0;border-radius:9px;padding:10px 11px;width:100%;font:inherit;margin-bottom:5px}
.option-empty{padding:10px;color:#647d93;font-size:.87rem}
@media(max-width:590px){header h1{font-size:1.34rem}.grid{grid-template-columns:1fr}.field.full{grid-column:1}.card{padding:17px}.action{width:100%}#stageCanvas{max-width:100%}}
</style>
</head>
<body>
<header><h1>St. Patrick's School</h1><p>Educational GIF Creator</p></header>
<nav><a href="students.html">← Section Tools</a></nav>
<main>
<section class="card">
<h2>Create an Animated Lesson</h2>
<div class="grid">
<div class="field"><label for="class">Class</label><select id="class" data-modern="true"><option value="">Select Class</option><option>1st Class</option><option>2nd Class</option><option>3rd Class</option><option>4th Class</option><option>5th Class</option><option>6th Class</option><option>7th Class</option><option>8th Class</option><option>9th Class</option><option>10th Class</option></select></div>
<div class="field"><label for="subject">Subject</label><select id="subject" data-modern="true"><option value="">Select Subject</option><option>Biology</option><option>Physics</option><option>Chemistry</option><option>Science</option><option>Mathematics</option><option>Social Studies</option><option>English</option><option>Telugu</option><option>Hindi</option><option>Environmental Studies</option><option>Computer Science</option><option>Other</option></select></div>
<div class="field full"><label for="chapter">Chapter</label><input id="chapter" placeholder="Enter Chapter" maxlength="180" autocomplete="off"></div>
<div class="field full"><label for="topic">Topic</label><input id="topic" placeholder="Enter Topic" maxlength="180" autocomplete="off"></div>
<div class="field"><label for="resolution">Resolution</label><select id="resolution" data-modern="true"><option value="540x960">540 × 960 — Mobile</option><option value="720x1280" selected>720 × 1280 — HD</option><option value="1080x1920">1080 × 1920 — Full HD</option></select></div>
<div class="field"><label for="speed">Animation Speed</label><select id="speed" data-modern="true"><option value="0.5">0.5× — Slow</option><option value="0.75">0.75× — Gentle</option><option value="1" selected>1× — Normal</option><option value="1.5">1.5× — Fast</option><option value="2">2× — Very Fast</option></select></div>
</div>
<button id="getPrompt" class="primary action" type="button">✦ Get GIF Code</button>
</section>
<section class="card">
<h2>Paste Illustration Code</h2>
<textarea id="gifCode" aria-label="Paste SVG illustration JSON code" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Paste ChatGPT-generated SVG JSON code here..."></textarea>
<button id="generate" class="generate action" type="button">▶ Create GIF</button>
<div id="status" role="status" aria-live="polite"></div>
<div id="previewArea" hidden>
<h2>Animated GIF</h2>
<canvas id="stageCanvas" width="540" height="960" aria-label="Animated textbook diagram"></canvas>
<a id="download" class="download" download="Educational-GIF.gif" hidden>⬇ Download GIF</a>
</div>
</section>
</main>
<footer>St. Patrick's School</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="gif-svg.js?v=20261108-ui6"></script>
</body>
</html>
