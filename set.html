<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>St. Patrick's School – Set Key</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--brand:#0f3d6b}
  *{box-sizing:border-box} body{font-family:system-ui,Arial;margin:24px;color:#0b1320}
  .wrap{max-width:640px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  .school{font-weight:800;font-size:22px}
  .sub{color:#555;margin-top:4px;font-size:13px}
  .card{border:1px solid #e5e7eb;border-radius:16px;padding:22px}
  h1{margin:0 0 10px;color:var(--brand);font-size:26px;letter-spacing:.5px}
  p{margin:8px 0 16px;color:#374151}
  a.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--brand);
        border-radius:12px;color:var(--brand);text-decoration:none;font-weight:600}
  a.btn:hover{background:#f3f8ff}
  .warn{color:#a11;margin-top:14px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="school">St. Patrick's School</div>
    <div class="sub">IIT &amp; NEET Foundation</div>
  </header>

  <div class="card">
    <h1 id="setTitle">SET</h1>
    <p>Answer Key (PDF)</p>
    <p><a id="pdfBtn" class="btn" target="_blank" rel="noopener">Download Key (PDF)</a></p>
    <div class="warn" id="shareHint" style="display:none">
      If access is requested, set the document sharing to “Anyone with the link – Viewer”.
    </div>
  </div>
</div>

<script>
// Direct-download URLs (work on mobile):
// format: https://drive.google.com/uc?export=download&id=FILE_ID
const PDF = {
  A: "https://drive.google.com/uc?export=download&id=1hRudzdzyvXdTZv-7Vvro8p6PMZhnssI3",
  B: "https://drive.google.com/uc?export=download&id=1cH0gWgVXUZbkJfCL-__ExWxjk4_lO74P",
  C: "https://drive.google.com/uc?export=download&id=1Pv-I5-euCauZgd6GzpMqSDXw1wnVvP_t",
  D: "https://drive.google.com/uc?export=download&id=1cROhMgK0qeMe1rkFksP9M0n9J7KnYUTA",
  E: "https://drive.google.com/uc?export=download&id=1cGEtcY16IbPPOr360yA8t0nukDy8neZm",
  F: "https://drive.google.com/uc?export=download&id=1kEKFRbUDziZjUK7D_pht1cxZZ3bZntdG",
};
const set = (new URLSearchParams(location.search).get("set")||"").toUpperCase();
const title = document.getElementById("setTitle");
const btn = document.getElementById("pdfBtn");
const hint = document.getElementById("shareHint");

if (PDF[set]) { title.textContent = "SET " + set; btn.href = PDF[set]; }
else { title.textContent = "SET ?"; btn.style.pointerEvents="none"; btn.style.opacity=.5; hint.style.display="block"; hint.textContent="Missing or invalid ?set=A–F in URL."; }
</script>
</body>
</html>
