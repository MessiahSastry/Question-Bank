        // --- Modern dropdown for Auth Modal ---
        function setupModernDropdown(dropdownId, selectedId, listId) {
    const dropdown = document.getElementById(dropdownId);
    const selected = document.getElementById(selectedId);
    const list = document.getElementById(listId);
    if (!dropdown || !selected || !list) return;
    // Show/hide dropdown
    selected.onclick = function(e) {
        e.stopPropagation();
        list.style.display = (list.style.display === 'none' || list.style.display === '') ? 'block' : 'none';
    };
    // Select option
    list.querySelectorAll('div[data-value]').forEach(opt => {
        opt.onclick = function(e) {
            e.stopPropagation();
            selected.textContent = this.textContent;
            selected.dataset.value = this.dataset.value;
            list.style.display = 'none';
            fetchAndShowStudentName();
        };
    });
    // Hide on outside click
    document.addEventListener('click', function handler(e) {
        if (!dropdown.contains(e.target)) {
            list.style.display = 'none';
        }
    });
}

async function findStudentsByRegisteredPhone(phoneDigits) {
  const year = getActiveAcademicYear();

  const snapshot = await db
    .collectionGroup('students')
    .where('parentPhone', '==', phoneDigits)
    .get();

  const students = [];

  for (const studentDoc of snapshot.docs) {
    const pathParts = studentDoc.ref.path.split('/');

    if (
      pathParts.length !== 8 ||
      pathParts[0] !== 'years' ||
      pathParts[1] !== year ||
      pathParts[2] !== 'classes' ||
      pathParts[4] !== 'sections' ||
      pathParts[6] !== 'students'
    ) {
      continue;
    }

    const studentData = studentDoc.data() || {};

    if (studentData.isDeleted === true) {
      continue;
    }

    const classId = pathParts[3];
    const sectionId = pathParts[5];
    const studentId = pathParts[7];

    const classRef = db
      .collection('years')
      .doc(year)
      .collection('classes')
      .doc(classId);

    const sectionRef = classRef
      .collection('sections')
      .doc(sectionId);

    const documents = await Promise.all([
      classRef.get(),
      sectionRef.get()
    ]);

    const classDocument = documents[0];
    const sectionDocument = documents[1];

    if (!classDocument.exists || !sectionDocument.exists) {
      continue;
    }

    students.push({
      academicYear: year,
      classId,
      sectionId,
      studentId,

      name: String(studentData.name || '').trim(),

      className: String(
        classDocument.data()?.name || ''
      ).trim(),

      sectionName: String(
        sectionDocument.data()?.name || ''
      ).trim(),

      roll: Number(studentData.roll || 0),

      parentPhone: onlyDigits(
        studentData.parentPhone || ''
      ),

      registered: studentData.registered === true
    });
  }

  students.sort(function(a, b) {
    return (
      String(a.className).localeCompare(String(b.className)) ||
      String(a.sectionName).localeCompare(String(b.sectionName)) ||
      Number(a.roll) - Number(b.roll)
    );
  });

  return students;
}

async function sendParentOtp() {
  const phoneDigits = getEnteredPhone();

  const sendButton =
    document.getElementById('send-otp-btn');

  const otpArea =
    document.getElementById('otp-entry-area');

  if (!selectedStudent) {
    setAccessMessage('Select the student first.');
    return;
  }

  if (!/^\d{10}$/.test(phoneDigits)) {
    setAccessMessage(
      'Enter the registered 10-digit parent phone number.'
    );
    return;
  }

  if (selectedStudent.parentPhone !== phoneDigits) {
    setAccessMessage(
      'This phone number does not match the selected student.'

    return;
  }

  if (sendButton) {
    sendButton.disabled = true;
    sendButton.textContent = 'Sending OTP...';
  }

  try {
    const verifier = getRecaptchaVerifier();

    otpConfirmationResult =
      await auth.signInWithPhoneNumber(
        '+91' + phoneDigits,
        verifier
      );

    if (otpArea) otpArea.style.display = '';

    setAccessMessage(
      'OTP sent successfully. Enter the OTP.',
      'success'
    );

  } catch (error) {
    console.error('OTP sending failed:', error);

    setAccessMessage(
      error?.message || 'Unable to send OTP.'
    );

    if (recaptchaVerifier) {
      try {
        recaptchaVerifier.clear();
      } catch (clearError) {
        console.error(clearError);
      }

      recaptchaVerifier = null;
    }

  } finally {
    if (sendButton) {
      sendButton.disabled = false;
      sendButton.textContent = 'Send OTP';
    }
  }
}

  if (modal) modal.style.display = 'none';

window.onload = function() {
  try {
    const modal = document.getElementById('quiz-auth-modal');
    const header = document.getElementById('main-header');
    const container = document.querySelector('.quiz-container');
    const leaderboard = document.getElementById('leaderboard-modal');

    if (modal && header && modal.contains(header)) {
      document.body.appendChild(header);
    }

    if (modal && container && modal.contains(container)) {
      document.body.appendChild(container);
    }

    if (modal && leaderboard && modal.contains(leaderboard)) {
      document.body.appendChild(leaderboard);
    }

  } catch (error) {
    console.warn('Structure correction failed:', error);
  }

  const statusMsg =
    document.getElementById('otp-status-msg');

  const startButton =
    document.getElementById('start-quiz-btn');

  const activateButton =
    document.getElementById('activate-btn');

  const loginButton =
    document.getElementById('login-btn');

  const sendOtpButton =
    document.getElementById('send-otp-btn');

  const verifyOtpButton =
    document.getElementById('verify-otp-btn');

  attachPinToggle('pin1', 'pin1-eye');
  attachPinToggle('pin2', 'pin2-eye');
  attachPinToggle('pin-login', 'pin-login-eye');

  window.getShared = function() {
    return {
      cls: selectedStudent?.className || '',
      sec: selectedStudent?.sectionName || '',
      ph: selectedStudent?.parentPhone || getEnteredPhone(),
      studentId: selectedStudent?.studentId || '',
      roll: Number(selectedStudent?.roll || 0)
    };
  };

  function showError(text) {
    if (!statusMsg) return;

    statusMsg.style.display = '';
    statusMsg.style.color = '#c82333';
    statusMsg.textContent = text;
  }

  function showOk(text) {
    if (!statusMsg) return;

    statusMsg.style.display = '';
    statusMsg.style.color = '#126c30';
    statusMsg.textContent = text;
  }

  if (sendOtpButton) {
    sendOtpButton.onclick = sendParentOtp;
  }

  if (verifyOtpButton) {
    verifyOtpButton.onclick = verifyParentOtp;
  }

  if (startButton) {
    startButton.onclick = function() {
      if (!window.__studentAccessGranted || !selectedStudent) {
        showError('Verify student access before starting the quiz.');
        return;
      }

      startQuizNow();
    };
  }

  if (activateButton) {
    activateButton.onclick = async function() {
      const phoneDigits = getEnteredPhone();

      const pin1 = String(
        document.getElementById('pin1')?.value || ''
      ).trim();

      const pin2 = String(
        document.getElementById('pin2')?.value || ''
      ).trim();

      if (!selectedStudent) {
        showError('Select the student first.');
        return;
      }

      if (
        !isCurrentPhoneVerified(phoneDigits) &&
        otpVerifiedPhone !== phoneDigits
      ) {
        showError('Verify the registered phone number using OTP.');
        return;
      }

      if (!/^\d{6}$/.test(pin1)) {
        showError('PIN must contain exactly 6 digits.');
        return;
      }

      if (pin1 !== pin2) {
        showError('PIN and Confirm PIN must match.');
        return;
      }

      showOk('Saving PIN...');

      try {
        const studentRef =
          studentReference(selectedStudent);

        const secretRef =
          studentSecretReference(selectedStudent);

        const documents = await Promise.all([
          studentRef.get(),
          secretRef.get()
        ]);

        const studentDocument = documents[0];
        const secretDocument = documents[1];

        if (!studentDocument.exists) {
          showError('Student record was not found.');
          return;
        }

        const studentData = studentDocument.data() || {};

        if (
          onlyDigits(studentData.parentPhone || '') !== phoneDigits
        ) {
          showError('Phone number does not match school records.');
          return;
        }

        if (
          secretDocument.exists &&
          /^\d{6}$/.test(
            String(secretDocument.data()?.pinPlain || '')
          )
        ) {
          showError('PIN already exists. Use Login.');
          await prepareSelectedStudentAccess();
          return;
        }

        await secretRef.set({
          pinPlain: pin1,
          parentPhone: phoneDigits,
          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()
        }, {
          merge: true
        });

        await studentRef.set({
          registered: true,
          failedAttempts: 0,
          lockedUntil: null,
          lastLogin:
            firebase.firestore.FieldValue.serverTimestamp()
        }, {
          merge: true
        });

        window.studentName = selectedStudent.name;
        window.__studentAccessGranted = true;

        document.getElementById('activate-pane').style.display = 'none';
        document.getElementById('login-pane').style.display = 'none';

        startButton.style.display = '';

        showOk(
          'Phone verified and PIN created. Tap "Start Practice Quiz".'
        );

      } catch (error) {
        console.error('Activation failed:', error);

        showError(
          error?.message || 'Unable to activate student access.'
        );
      }
    };
  }

  if (loginButton) {
    loginButton.onclick = async function() {
      const phoneDigits = getEnteredPhone();

      const pin = String(
        document.getElementById('pin-login')?.value || ''
      ).trim();

      if (!selectedStudent) {
        showError('Select the student first.');
        return;
      }

      if (!/^\d{10}$/.test(phoneDigits)) {
        showError('Enter the registered 10-digit phone number.');
        return;
      }

      if (!/^\d{6}$/.test(pin)) {
        showError('Enter the 6-digit PIN.');
        return;
      }

      showOk('Verifying PIN...');

      try {
        const studentRef =
          studentReference(selectedStudent);

        const secretRef =
          studentSecretReference(selectedStudent);

        const documents = await Promise.all([
          studentRef.get(),
          secretRef.get()
        ]);

        const studentDocument = documents[0];
        const secretDocument = documents[1];

        if (!studentDocument.exists || !secretDocument.exists) {
          showError('PIN is not registered. Complete first-time OTP verification.');
          return;
        }

        const studentData = studentDocument.data() || {};
        const secretData = secretDocument.data() || {};

        const lockedUntilMilliseconds =
          studentData.lockedUntil?.toDate
            ? studentData.lockedUntil.toDate().getTime()
            : null;

        if (
          lockedUntilMilliseconds &&
          lockedUntilMilliseconds > Date.now()
        ) {
          const minutes = Math.ceil(
            (lockedUntilMilliseconds - Date.now()) / 60000
          );

          showError(
            `Account locked. Try again in ${minutes} minute(s).`
          );

          return;
        }

        const phoneMatches =
          onlyDigits(studentData.parentPhone || '') === phoneDigits &&
          onlyDigits(secretData.parentPhone || '') === phoneDigits;

        const pinMatches =
          String(secretData.pinPlain || '') === pin;

        if (phoneMatches && pinMatches) {
          await studentRef.set({
            failedAttempts: 0,
            lockedUntil: null,
            lastLogin:
              firebase.firestore.FieldValue.serverTimestamp()
          }, {
            merge: true
          });

          window.studentName = selectedStudent.name;
          window.__studentAccessGranted = true;

          document.getElementById('activate-pane').style.display = 'none';
          document.getElementById('login-pane').style.display = 'none';

          startButton.style.display = '';

          showOk(
            'PIN verified. Tap "Start Practice Quiz".'
          );

          return;
        }

        const failedAttempts =
          Number(studentData.failedAttempts || 0) + 1;

        const updates = {
          failedAttempts
        };

        if (failedAttempts >= 5) {
          updates.lockedUntil =
            new Date(Date.now() + 15 * 60000);
        }

        await studentRef.set(updates, {
          merge: true
        });

        const attemptsLeft = Math.max(0, 5 - failedAttempts);

        if (attemptsLeft > 0) {
          showError(
            `Wrong PIN. ${attemptsLeft} attempt(s) remaining.`
          );
        } else {
          showError(
            'Too many wrong attempts. Account locked for 15 minutes.'
          );
        }

      } catch (error) {
        console.error('PIN login failed:', error);

        showError(
          error?.message || 'Unable to verify PIN.'
        );
      }
    };
  }
};

// --- Leaderboard logic (no changes needed) ---
function fetchAndShowLeaderboard() {
  const usp    = new URLSearchParams(window.location.search);
  const quizId = window.quizId || usp.get("quiz") || "";
const academicYear = getActiveAcademicYear();
  // Read Class & Section from the auth modal (even if it's hidden)
  const cls = (document.getElementById('selected-class')?.dataset.value || '').trim();
  const sec = (document.getElementById('selected-section')?.dataset.value || '').trim();

  // Build Firestore query: quiz + class + section + visible
  let q = db.collection("quizResults")
  .where("quizId", "==", quizId)
  .where("academicYear", "==", academicYear);
  if (cls) q = q.where("class", "==", cls);
  if (sec) q = q.where("section", "==", sec);
  
  q.get()
   .then((querySnapshot) => {
      // Collect all results
     const byStudent = {};

querySnapshot.forEach(doc => {
  const d = doc.data() || {};

  const key =
    d.studentId ||
    `${d.class || ''}__${d.section || ''}__${d.name || ''}`;

  if (!byStudent[key]) {
    byStudent[key] = [];
  }

  byStudent[key].push({
    studentId: d.studentId || '',
          name: (d.name && d.name.trim() && d.name !== "Student") ? d.name : (d.phone || "Student"),
          phone: d.phone || "",
          score: Number(d.score || 0),
          time: Number(d.time || d.timeTaken || d.timer || 0),
          _ts: d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().getTime() : 0
        });
      });

      // Pick best attempt per student
     let leaderboard = Object.values(byStudent).map(arr => {
        arr.sort((a,b) => (b.score - a.score) || (a.time - b.time) || (a._ts - b._ts));
        const best = arr[0];
        const min = Math.max(1, Math.ceil((best.time || 0) / 60));
       return {
  studentId: best.studentId || '',
  name: best.name,
  phone: best.phone,
  score: best.score,
  attempts: arr.length,
  timeMinutes: String(min)
};
      });

      // Final ordering (client-side)
      leaderboard.sort((a,b) => (b.score - a.score) || (parseInt(a.timeMinutes) - parseInt(b.timeMinutes)));

      function getMedal(rank) {
        if (rank === 1) return '<span style="font-size:1.5em;">🥇</span>';
        if (rank === 2) return '<span style="font-size:1.5em;">🥈</span>';
        if (rank === 3) return '<span style="font-size:1.5em;">🥉</span>';
        return `<span style="font-size:1.3em;font-weight:bold;color:#fff;background:#0f3d6b;border-radius:50%;display:inline-block;width:1.8em;height:1.8em;text-align:center;line-height:1.8em;">${rank}</span>`;
      }

      const currentStudentId =
  selectedStudent?.studentId || '';

const rows = leaderboard.map((d, idx) => `
  <div class="leader-row${d.studentId === currentStudentId ? ' current-user' : ''}">
          <span class="leader-medal">${getMedal(idx+1)}</span>
          <span class="leader-name" title="${d.name}">${d.name}</span>
          <span class="leader-score">${d.score} /${d.timeMinutes} (${d.attempts})</span>
        </div>
      `);

      const html = `
        <div class="leaderboard-box">
          <div class="leaderboard-title" style="font-size:1.14em;text-align:left;font-weight:600;">
            St. Patrick's Challengers
            <span style="float:right;font-size:0.95em;color:#e0eaff;font-weight:400;">Score / time (attempts)</span>
          </div>
          <div class="leaderboard-list">
            ${rows.join("") || `<div style="background:#fff;border-radius:12px;padding:14px;text-align:center;color:#185496;">No attempts yet.</div>`}
          </div>
        </div>`;
      showLeaderboard(html);
    })
    .catch(err => {
      console.error('Leaderboard error:', err);
      showLeaderboard(
        `<div class="leaderboard-box">
           <div class="leaderboard-title">St. Patrick's Challengers</div>
           <div style="background:#fff;border-radius:12px;padding:14px;text-align:center;color:#c82333;">
             Couldn't load leaderboard.<br>${err && err.message ? err.message : err}
           </div>
         </div>`
      );
    });
}
