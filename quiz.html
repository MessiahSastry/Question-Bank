    <script>
        // --- Modern dropdown for Auth Modal ---
        function setupModernDropdown(dropdownId, selectedId, listId) {
    const dropdown = document.getElementById(dropdownId);
    const selected = document.getElementById(selectedId);
    const list = document.getElementById(listId);
    if (!dropdown || !selected || !list) return;
    // Show/hide dropdown
    selected.onclick = function(e) {
        e.stopPropagation();
        list.style.display = (list.style.display === 'none' || list.style.display === '') ? 'block' : 'none';
    };
    // Select option
    list.querySelectorAll('div[data-value]').forEach(opt => {
        opt.onclick = function(e) {
            e.stopPropagation();
            selected.textContent = this.textContent;
            selected.dataset.value = this.dataset.value;
            list.style.display = 'none';
            fetchAndShowStudentName();
        };
    });
    // Hide on outside click
    document.addEventListener('click', function handler(e) {
        if (!dropdown.contains(e.target)) {
            list.style.display = 'none';
        }
    });
}
        // Setup dropdowns when DOM ready
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Fill classes
            const classList = [
                "3rd Class", "4th Class", "5th Class", "6th Class",
                "7th Class", "8th Class", "9th Class", "10th Class"
            ];
            const classDropdown = document.getElementById("dropdown-class-list");
            classDropdown.innerHTML = ""; // Clear
            classList.forEach(cls => {
                const div = document.createElement("div");
                div.className = "dropdown-option";
                div.setAttribute("data-value", cls);
                div.textContent = cls;
                classDropdown.appendChild(div);
            });
        
            // 2. Fill sections
            const sectionList = [
                "A Section", "A Section (IPD)", "B Section", "C Section"
            ];
            const sectionDropdown = document.getElementById("dropdown-section-list");
            sectionDropdown.innerHTML = ""; // Clear
            sectionList.forEach(sec => {
                const div = document.createElement("div");
                div.className = "dropdown-option";
                div.setAttribute("data-value", sec);
                div.textContent = sec;
                sectionDropdown.appendChild(div);
            });
        
            // 3. Setup dropdown functionality
            setupModernDropdown('class-dropdown', 'selected-class', 'dropdown-class-list');
            setupModernDropdown('section-dropdown', 'selected-section', 'dropdown-section-list');
            document.getElementById('student-phone').addEventListener('input', fetchAndShowStudentName);
        });
        // Firebase config (reuse from your app)
        const firebaseConfig = {
            apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
            authDomain: "stpatricks-questionbank.firebaseapp.com",
            projectId: "stpatricks-questionbank",
            storageBucket: "stpatricks-questionbank.appspot.com",
            messagingSenderId: "917615322861",
            appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
        };
        firebase.initializeApp(firebaseConfig);

        // --- Add this function below! ---
    async function fetchAndShowStudentName() {
    const year = "2025-26"; // Or fetch from dropdown if dynamic
    const cls = document.getElementById('selected-class').dataset.value || "";
    const sec = document.getElementById('selected-section').dataset.value || "";
    const ph = document.getElementById('student-phone').value.trim() || "";
    const msg = document.getElementById('student-name-msg');

    if (cls && sec && ph.length === 10) {
        try {
            // 1. Find class document
            const classSnap = await db.collection('years').doc(year)
                .collection('classes').where('name', '==', cls).limit(1).get();
            if (classSnap.empty) {
                msg.style.color = '#c82333';
                msg.textContent = "Class not found.";
                window.studentName = "Student";
                return;
            }
            const classDocId = classSnap.docs[0].id;

            // 2. Find section document
            const sectionSnap = await db.collection('years').doc(year)
                .collection('classes').doc(classDocId)
                .collection('sections').where('name', '==', sec).limit(1).get();
            if (sectionSnap.empty) {
                msg.style.color = '#c82333';
                msg.textContent = "Section not found.";
                window.studentName = "Student";
                return;
            }
            const sectionDocId = sectionSnap.docs[0].id;

            // 3. Find student
            const studentSnap = await db.collection('years').doc(year)
                .collection('classes').doc(classDocId)
                .collection('sections').doc(sectionDocId)
                .collection('students').where('parentPhone', '==', ph).limit(1).get();

            if (!studentSnap.empty) {
                const name = studentSnap.docs[0].data().name || "Student";
                msg.style.color = '#126c30';
                msg.textContent = "Welcome, " + name;
                window.studentName = name;
                console.log("DEBUG: Loaded student name", name);
            } else {
                msg.style.color = '#c82333';
                msg.textContent = "No student found for given details.";
                window.studentName = "Student";
            }
        } catch (e) {
            msg.style.color = '#c82333';
            msg.textContent = "Error fetching student.";
            window.studentName = "Student";
        }
    } else {
        msg.textContent = "";
        window.studentName = "Student";
    }
}

        // --- Quiz State ---
        let quiz = null;
        let userAnswers = [];
        let revealed = [];
        let currentIdx = 0;
        let quizStart = null;
        let timerInterval = null;

        // Helper: format timer
        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return (m<10?"0":"") + m + ":" + (sec<10?"0":"") + sec;
        }

        // Start timer
        function startTimer() {
            quizStart = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - quizStart)/1000);
                document.getElementById('quiz-timer').textContent = formatTime(elapsed);
            }, 1000);
        }

        // Stop timer
        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        // --- Load Quiz ---
        async function loadQuiz() {
            const params = new URLSearchParams(window.location.search);
            const quizId = params.get("quiz");
            if (!quizId) {
                document.getElementById("quiz-main").innerHTML = "<div style='color:#c82333;text-align:center;'>No quiz found. Please check your link.</div>";
                return;
            }
            const snap = await db.collection("quizzes").doc(quizId).get();
            if (!snap.exists) {
                document.getElementById("quiz-main").innerHTML = "<div style='color:#c82333;text-align:center;'>Quiz not found or expired.</div>";
                return;
            }
            quiz = snap.data();
            // Shuffle options for each question and update answer index
            quiz.questions.forEach(q => {
                const origOptions = q.options.map(opt => opt);
                const correctIdx = letterToIdx(q.answer);
                const paired = origOptions.map((opt, i) => ({ opt, i }));
                shuffleArray(paired);
                q.shuffledOptions = paired.map(p => p.opt);
                q.shuffledAnswerIdx = paired.findIndex(p => p.i === correctIdx);
            });
            if (!quiz.questions || quiz.questions.length === 0) {
                document.getElementById("quiz-main").innerHTML = "<div style='color:#c82333;text-align:center;'>No questions found in this quiz.</div>";
                return;
            }
            document.getElementById("quiz-level").textContent = quiz.level ? ("Level: " + quiz.level) : "";
            userAnswers = Array(quiz.questions.length).fill(null);
            revealed = Array(quiz.questions.length).fill(false);
            currentIdx = 0;
            renderQuestionNumbers();
            renderQuestion();
            startTimer();
        }

        // --- Render Question Numbers ---
        function renderQuestionNumbers() {
            const cont = document.getElementById("question-number-list");
            cont.innerHTML = "";
            quiz.questions.forEach((q, i) => {
                const btn = document.createElement("div");
                btn.className = "qn-circle" + (i === currentIdx ? " selected" : "") + (userAnswers[i] !== null ? " answered" : "");
                btn.textContent = (i + 1);
                btn.onclick = () => { currentIdx = i; renderQuestionNumbers(); renderQuestion(); };
                cont.appendChild(btn);
            });
        }

        // --- Render One Question ---
        function renderQuestion(showResult = false) {
            const q = quiz.questions[currentIdx];
            const main = document.getElementById("quiz-main");
            if (!q) return;
            let isRevealed = showResult || revealed[currentIdx];
            let optionsHTML = '';
            const opts = q.shuffledOptions || q.options;
            const answerIdx = (typeof q.shuffledAnswerIdx === "number") ? q.shuffledAnswerIdx : letterToIdx(q.answer);
            if (Array.isArray(opts)) {
                optionsHTML = opts.map((opt, idx) => {
                    let selected = userAnswers[currentIdx] === idx ? "selected" : "";
                    let correct = (isRevealed && idx === answerIdx) ? "correct" : "";
                    let wrong = (isRevealed && userAnswers[currentIdx] === idx && userAnswers[currentIdx] !== answerIdx) ? "wrong" : "";
                    return `<label class="option-label ${selected} ${correct} ${wrong}" data-idx="${idx}">
                        <input type="radio" class="option-radio" name="opt" value="${idx}" ${userAnswers[currentIdx] === idx ? "checked" : ""} ${(isRevealed) ? "disabled" : ""}>
                        <span style="font-weight:600;">${String.fromCharCode(65+idx)})</span> &nbsp; ${opt.replace(/^[A-D]\)\s*/, '')}
                    </label>`;
                }).join("");
            }
            main.innerHTML = `
                   <div class="question-block">
                    <div style="margin-bottom:7px;font-weight:600;color:#777;">Question ${currentIdx+1} of ${quiz.questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <form id="opt-form" class="option-block">${optionsHTML}</form>
                </div>
                <div class="nav-btns">
                    <button class="nav-btn" id="prev-btn" ${currentIdx === 0 ? "disabled" : ""}><i class="fa fa-arrow-left"></i> Previous</button>
                    <button class="nav-btn" id="next-btn" ${currentIdx === quiz.questions.length-1 ? "disabled" : ""}>Next <i class="fa fa-arrow-right"></i></button>
                </div>
                <button class="submit-btn" id="finish-btn" ${showResult ? "disabled" : ""}>Finish & See Result</button>
            `;
            if (window.MathJax) MathJax.typeset();

            // Option selection - only if not revealed for this question
            if (!showResult && !revealed[currentIdx]) {
                main.querySelectorAll('.option-label').forEach(lbl => {
                    lbl.onclick = (e) => {
                        if (revealed[currentIdx]) return;
                        const idx = Number(lbl.getAttribute("data-idx"));
                        userAnswers[currentIdx] = idx;
                        revealed[currentIdx] = true;
                        renderQuestionNumbers();
                        renderQuestion();
            
                        // --- Show leaderboard after each question (except last) ---
                        // --- Save progress after each answer ---
                    saveCurrentProgress();
                    
                    // --- Show leaderboard after each question (except last) ---
                    if (currentIdx < quiz.questions.length - 1) {
                        setTimeout(fetchAndShowLeaderboard, 350);
                    }

                    };
                });
            }
            document.getElementById("prev-btn").onclick = (e) => {
                e.preventDefault();
                if (currentIdx > 0) { currentIdx--; renderQuestionNumbers(); renderQuestion(); }
            };
            document.getElementById("next-btn").onclick = (e) => {
                e.preventDefault();
                if (currentIdx < quiz.questions.length-1) { currentIdx++; renderQuestionNumbers(); renderQuestion(); }
            };
            document.getElementById("finish-btn").onclick = (e) => {
                e.preventDefault();
                finishQuiz();
            };
        }

        // Shuffle utility
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        function letterToIdx(ans) {
            if (!ans) return null;
            let matches = ans.match(/[A-D]/gi);
            if (!matches || matches.length === 0) return null;
            let ch = matches[matches.length - 1].toUpperCase();
            return ch.charCodeAt(0) - 65;
        }
        function finishQuiz() {
    stopTimer();
    renderQuestion(true);
    document.getElementById("quiz-main").innerHTML += renderResult();
    document.querySelectorAll(".nav-btn, #finish-btn").forEach(btn => btn.disabled = true);
    renderQuestionNumbers();

    // --- Leaderboard: Save quiz result to Firestore ---
    try {
        const classVal = document.getElementById('selected-class').dataset.value;
        const sectionVal = document.getElementById('selected-section').dataset.value;
        const phoneVal = document.getElementById('student-phone').value;
        const quizId = new URLSearchParams(window.location.search).get("quiz");
        // Calculate score
        let correct = 0;
        quiz.questions.forEach((q, i) => {
            let ansIdx = (typeof q.shuffledAnswerIdx === "number") ? q.shuffledAnswerIdx : letterToIdx(q.answer);
            if (userAnswers[i] === ansIdx) correct++;
        });
        db.collection("quizResults").add({
            quizId: quizId,
            class: classVal,
            section: sectionVal,
            phone: phoneVal,
            name: window.studentName,
            score: correct,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (e) {
        // ignore, for first setup
        console.error(e);
    }
}
        function renderResult() {
            let correct = 0, wrong = 0, missed = 0;
            quiz.questions.forEach((q, i) => {
                let ansIdx = (typeof q.shuffledAnswerIdx === "number") ? q.shuffledAnswerIdx : letterToIdx(q.answer);
                if (userAnswers[i] === ansIdx) correct++;
                else if (userAnswers[i] === null) missed++;
                else wrong++;
            });
            let html = `<div class="result-block">
                <div class="score-line">Your Score: ${correct} / ${quiz.questions.length}</div>
                <div class="answer-review">`;
            quiz.questions.forEach((q, i) => {
                let user = userAnswers[i], ans = (typeof q.shuffledAnswerIdx === "number") ? q.shuffledAnswerIdx : letterToIdx(q.answer);
                html += `<div>
                    Q${i+1}: `;
                if (user === ans) {
                    html += `<span class="correct">Correct</span>`;
                } else if (user === null) {
                    html += `<span class="missed">Not Answered</span> (Answer: <b>${String.fromCharCode(65+ans)})</b>)`;
                } else {
                    html += `<span class="wrong">Wrong</span> (Your: <b>${String.fromCharCode(65+user)})</b>, Answer: <b>${String.fromCharCode(65+ans)})</b>)`;
                }
                html += `</div>`;
            });
            html += `</div></div>`;
            return html;
        }

    // --- Gatekeep with Modal (fetch student name from Firestore, bypass OTP for testing) ---
window.onload = function() {

// --- Leaderboard logic (no changes needed) ---
function fetchAndShowLeaderboard() {
    const quizId = new URLSearchParams(window.location.search).get("quiz");
    db.collection("quizResults")
        .where("quizId", "==", quizId)
        .orderBy("score", "desc")
        .orderBy("timestamp", "asc")
        .get()
        .then((querySnapshot) => {
            // Group all attempts per student (by phone)
            let byPhone = {};
            querySnapshot.forEach(doc => {
                const d = doc.data();
                const key = d.phone || d.name; // fallback if phone is missing
                if (!byPhone[key]) byPhone[key] = [];
                byPhone[key].push({ ...d, _timestamp: doc.data().timestamp?.toDate?.() || new Date(0) });
            });

            // Get best attempt for each student
            let leaderboard = Object.values(byPhone).map(attemptsArr => {
                // Sort by score DESC, then by fastest time (lowest), then by earliest timestamp
                attemptsArr.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    if ((a.time || 99999) !== (b.time || 99999)) return (a.time || 99999) - (b.time || 99999);
                    return (a._timestamp - b._timestamp);
                });
                 let best = attemptsArr[0];
                // Only first two words of the name
                let shortName = (best.name && best.name.trim() && best.name !== "Student")
                  ? best.name
                  : (best.phone || "Student");
                // Format time
                let timeTaken = best.time || best.timeTaken || best.timer || 0;
            let min = Math.max(1, Math.ceil(timeTaken / 60)); // show at least 1 minute if attempted
            let timeMinutes = `${min}`;
            return {
                name: shortName,
                score: best.score,
                attempts: attemptsArr.length,
                timeMinutes
            };
            });
            console.log("Leaderboard mapping:", leaderboard);
            // Sort leaderboard by score DESC, then time ASC
            leaderboard.sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            // For ties, show fastest time first
            return parseInt(a.timeMinutes) - parseInt(b.timeMinutes);
        });

            // Render rows
            function getMedal(rank) {
                if (rank === 1) return '<span style="font-size:1.5em;">🥇</span>';
                if (rank === 2) return '<span style="font-size:1.5em;">🥈</span>';
                if (rank === 3) return '<span style="font-size:1.5em;">🥉</span>';
                return `<span style="font-size:1.3em;font-weight:bold;color:#fff;background:#0f3d6b;border-radius:50%;display:inline-block;width:1.8em;height:1.8em;text-align:center;line-height:1.8em;">${rank}</span>`;
            }

         let rows = leaderboard.map((d, idx) => `
  <div class="leader-row">
    <div class="leader-medal">${getMedal(idx+1)}</div>
    <div class="leader-box">
      <span class="leader-name">${d.name}</span>
      <span class="leader-score">${d.score} /${d.timeMinutes} (${d.attempts})</span>
    </div>
  </div>
`);


            // Show with new title and header color
           const html = `
              <div class="leaderboard-box">
                <div class="leaderboard-title" style="font-size:1.14em;text-align:left;font-weight:600;">
                  St. Patrick's Challengers
                  <span style="float:right;font-size:0.95em;color:#e0eaff;font-weight:400;">
                    Score / time (attempts)
                  </span>
                </div>
                <div class="leaderboard-list">
                  ${rows.join("")}
                </div>
              </div>
            `;
            showLeaderboard(html);
        });
}
// ---- Leaderboard Modal Show/Hide ----
function showLeaderboard(html) {
    document.getElementById('leaderboard-popup-block').innerHTML = html || '';
    document.getElementById('leaderboard-modal').style.display = 'flex';
}
document.getElementById('close-leaderboard-btn').onclick = function() {
    document.getElementById('leaderboard-modal').style.display = 'none';
};
function saveCurrentProgress() {
    const classVal = document.getElementById('selected-class').dataset.value;
    const sectionVal = document.getElementById('selected-section').dataset.value;
    const phoneVal = document.getElementById('student-phone').value;
    const quizId = new URLSearchParams(window.location.search).get("quiz");
    let correct = 0;
    quiz.questions.forEach((q, i) => {
        let ansIdx = (typeof q.shuffledAnswerIdx === "number") ? q.shuffledAnswerIdx : letterToIdx(q.answer);
        if (userAnswers[i] === ansIdx) correct++;
    });

    // This will update the user's result after every question
    db.collection("quizResults")
      .where("quizId", "==", quizId)
      .where("phone", "==", phoneVal)
      .get()
      .then(snapshot => {
          if (!snapshot.empty) {
              // Update the existing result (keep only latest one per user)
              snapshot.docs[0].ref.update({
                  name: window.studentName,
                  class: classVal,
                  section: sectionVal,
                  score: correct,
                  timestamp: firebase.firestore.FieldValue.serverTimestamp()
              });
          } else {
              // Add a new result (first time answering)
              db.collection("quizResults").add({
                  quizId: quizId,
                  class: classVal,
                  section: sectionVal,
                  phone: phoneVal,
                  name: window.studentName,
                  score: correct,
                  timestamp: firebase.firestore.FieldValue.serverTimestamp()
              });
          }
      });
}
