<script>
  function stripMetaLine(str) {
  if (!str) return '';
  // Remove meta info lines like "Q4: Level 1, 1 Mark [Descriptive]"
  return str.replace(/^Q\d+:\s*[^A-Za-z0-9]*[\[\]A-Za-z0-9, ]*\s*/i, '').trim();
}
  function stripMetaTags(str) {
  if (!str) return '';
  // Remove tags anywhere in the text, not only at the beginning
  return str.replace(/\s*\[(?:Descriptive|MCQ|Multiple|Single)\]\s*/gi, '').trim();
}
  function getExamPaper() {
    try {
      return JSON.parse(sessionStorage.getItem("examPaper") || "null");
    } catch {
      return null;
    }
  }
  function setExamPaper(paper) {
    sessionStorage.setItem("examPaper", JSON.stringify(paper));
  }
// --------- Robust parser for AI output ---------
function parseAIBlocks(text, expectedCount) {
  if (!text) return [];
  // normalize
  let t = String(text).replace(/\r/g, '');
  // strip code fences if present
  t = t.replace(/```(?:\w+)?\n([\s\S]*?)```/g, '$1');

  // 1) Primary: "Q<number> ... :"  (allow ANY chars, including nested parens, until the colon)
  //    No newline before the colon to avoid over-greedy spans.
  let matches = [...t.matchAll(/Q\s*\d+[^\n:]*:/gi)];

  // 2) Fallback: plain numbered lists like "1. " or "2) "
  if (matches.length === 0) {
    matches = [...t.matchAll(/(^|\n)\s*\d+\s*[\.\)]\s+/g)];
  }

  if (matches.length === 0) return [];

  // Build block slices
  const starts = matches.map(m => m.index + (t[m.index] === '\n' ? 1 : 0)).sort((a,b)=>a-b);
  const blocks = [];
  for (let i = 0; i < starts.length; i++) {
    const start = starts[i];
    const end = i + 1 < starts.length ? starts[i + 1] : t.length;
    const chunk = t.slice(start, end).trim();
    if (chunk) blocks.push(chunk);
  }

  // Trim extras if AI returned more than asked
  if (blocks.length > expectedCount) return blocks.slice(0, expectedCount);
  return blocks;
}
  function renderExam() {
    const paper = getExamPaper();
    const area = document.getElementById('exam-review-area');
         if (!paper) {
      area.innerHTML = `<div style="color:#b00;padding:16px;font-size:1.11em;">No exam paper found!<br>Please go back and generate one first.</div>`;
      document.getElementById("save-review-btn").disabled = true;
      document.getElementById("preview-btn").disabled = true;
      return;
    }

    let html = '';
    (paper.subjects || []).forEach((subjectBlock, subjIdx) => {
      if (paper.instructions) {
  html += `<div class="paper-global-instructions" style="color:#12416c;font-size:1.1em; font-weight:600; background:#f7fafd; padding:10px 18px; border-radius:9px; margin-bottom:22px; text-align:center;">
    ${paper.instructions}
  </div>`;
}
      html += `<h3 style="color:#0f3d6b; margin:22px 0 8px 0;">Subject: ${subjectBlock.subject}</h3>`;
      let qCounter = 0;
      (subjectBlock.sections || []).forEach((section, sIdx) => {
        // Section Header (centered)
       html += `
  <div class="section-block" style="margin-bottom: 18px;">
    <!-- Centered Section Header -->
    <div class="section-header"
        style="text-align:center; justify-content: center;"
        contenteditable="true"
        spellcheck="true"
        data-subject="${subjIdx}"
        data-section="${sIdx}">
      ${(
  section.label && section.mcqType &&
  !section.label.toUpperCase().includes(section.mcqType.toUpperCase()) &&
  section.mcqType.toUpperCase() !== 'DESCRIPTIVE'
    ? section.label + ` (${section.mcqType})`
    : (section.label || 'Section')
).replace(/\s*\(?\s*descriptive\s*\)?/i, '').trim()
}
      <i class="fas fa-pen edit-icon"></i>
    </div>
    <!-- Instructions and Total in one row -->
    <div class="section-flex-row" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0; padding:7px 18px 7px 18px;">
  <div style="font-weight: 600; color: #1762a7; font-size: 1.08em; text-align:left;">
    ${
      section.type === "all"
        ? `Answer all ${section.numQuestions} questions`
        : section.type === "any"
          ? `Answer any ${section.attemptAny || section.numQuestions} questions`
          : section.type === "internal"
            ? `Answer all ${section.numPairs} pairs`
            : ""
    }
  </div>
    <div style="font-weight:600; color:#1762a7; font-size:1.08em; text-align:right; min-width:120px;">
    <span contenteditable="plaintext-only" tabindex="0" class="num-questions no-mjx" data-subject="${subjIdx}" data-section="${sIdx}" style="outline:1.2px solid #bcd6ef; border-radius:5px; padding:1px 6px; margin-right:2px;">
      ${section.numQuestions}
    </span>
    x
    <span contenteditable="plaintext-only" tabindex="0" class="marks-per-question no-mjx" data-subject="${subjIdx}" data-section="${sIdx}" style="outline:1.2px solid #bcd6ef; border-radius:5px; padding:1px 6px; margin:0 2px;">
      ${section.marksPerQuestion}
    </span>
    = ${(section.numQuestions * section.marksPerQuestion)} Marks
  </div>
</div>
`;
        (section.questions || []).forEach((q, qIdx) => {
        html += `<div class="question-row" data-subject="${subjIdx}" data-section="${sIdx}" data-question="${qIdx}">
  <span class="question-number">${(++qCounter)}.</span>

  <!-- Editable question text -->
  <span class="question-text" contenteditable="true">
    ${stripMetaTags(stripMetaLine(q.text || q.body || q.question || ''))}
  </span>

  <!-- MCQ options (editable) + answer key (editable) -->
  ${
    (q.options && q.options.length === 4)
      ? `
        <div class="mcq-block" style="display:flex;flex-direction:column;gap:6px;margin-left:8px;flex:1 1 100%;">
          ${['A','B','C','D'].map((L, i) => `
            <div class="mcq-row" data-idx="${i}" style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:700;color:#185496;min-width:18px;">${L})</span>
              <span class="mcq-opt no-mjx" contenteditable="plaintext-only" tabindex="0" style="flex:1 1 auto;border:1px dashed #bcd6ef;border-radius:6px;padding:3px 8px;">
                ${(q.options[i] || '').toString()}
              </span>
            </div>
          `).join('')}
          <div class="mcq-ans-row" style="display:flex;align-items:center;gap:8px;margin-top:4px;">
            <span class="marks-label" style="min-width:62px;">Answer</span>
            <span class="answer-box no-mjx" contenteditable="plaintext-only" tabindex="0" style="border:1px solid #bcd6ef;border-radius:6px;padding:3px 8px;min-width:80px;">
              ${ (q.answer || '').toString() }
            </span>
            <span class="marks-label" style="opacity:.8;">(use letters like A or A,C)</span>
          </div>
        </div>
      `
      : ''
  }

  <span class="marks-box no-mjx" contenteditable="plaintext-only" tabindex="0">${q.marks || section.marksPerQuestion || ''}</span>
  <span class="marks-label">Marks</span>
</div>`;
        });
        html += `</div>`;
      });
    });
    area.innerHTML = html;
    // Instantly update total marks on edit
area.querySelectorAll('.num-questions, .marks-per-question').forEach(el => {
  el.addEventListener('input', function() {
    const subjIdx = +this.dataset.subject, secIdx = +this.dataset.section;
    // Find the other span
    const block = this.closest('.section-flex-row');
    const numQ = parseInt(block.querySelector('.num-questions').textContent.trim()) || 0;
    const marksQ = parseInt(block.querySelector('.marks-per-question').textContent.trim()) || 0;
    // Find the = ... Marks part (it’s always plain text, after the two spans)
    const totalNode = block.childNodes[block.childNodes.length - 1];
    if (totalNode && totalNode.nodeType === 3) {
      totalNode.textContent = ` = ${numQ * marksQ} Marks`;
    }
  });
});
    MathJax.typesetPromise();

    // Inline editing indicators for all [contenteditable]
    area.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('input', function() {
        this.classList.add('edited');
        // Remove existing edit-indicator
        const parent = this.parentNode;
        const existing = parent.querySelector('.edit-indicator');
        if (existing) existing.remove();
        // Add new one
        const ind = document.createElement('span');
        ind.className = 'edit-indicator';
        ind.textContent = 'Edited';
        parent.appendChild(ind);
      });
      el.addEventListener('blur', function() {
        this.classList.remove('edited');
        if (this.parentNode && this.parentNode.querySelector('.edit-indicator')) {
          setTimeout(() => {
            if (this.parentNode) {
              const indicator = this.parentNode.querySelector('.edit-indicator');
              if (indicator) indicator.remove();
            }
          }, 600);
        }
      });
    });
  }
  function saveEdits() {
    const paper = getExamPaper();
    if (!paper) return;
    // Section names
    document.querySelectorAll('.section-header').forEach(sec => {
      const subjIdx = +sec.dataset.subject, secIdx = +sec.dataset.section;
      paper.subjects[subjIdx].sections[secIdx].label = sec.textContent.replace(/<[^>]+>/g,'').replace(/Edited$/,'').trim();
    });
      // Number of Questions and Marks Per Question (editable)
  document.querySelectorAll('.num-questions').forEach(span => {
    const subjIdx = +span.dataset.subject, secIdx = +span.dataset.section;
    let val = parseInt(span.textContent.trim());
    if (!isNaN(val) && val > 0) paper.subjects[subjIdx].sections[secIdx].numQuestions = val;
  });
  document.querySelectorAll('.marks-per-question').forEach(span => {
    const subjIdx = +span.dataset.subject, secIdx = +span.dataset.section;
    let val = parseInt(span.textContent.trim());
    if (!isNaN(val) && val > 0) paper.subjects[subjIdx].sections[secIdx].marksPerQuestion = val;
  });
    // Instructions (editable flex row)
    document.querySelectorAll('.section-instructions').forEach(ins => {
      const subjIdx = +ins.dataset.subject, secIdx = +ins.dataset.section;
      paper.subjects[subjIdx].sections[secIdx].instructions = ins.innerText.trim();
    });
 // Questions — update text, options (if MCQ), answer key, and marks
document.querySelectorAll('.question-row').forEach(qr => {
  const subjIdx = +qr.dataset.subject, secIdx = +qr.dataset.section, qIdx = +qr.dataset.question;

  // Marks
  const newMarks = qr.querySelector('.marks-box')?.innerText?.trim() ?? '';
  paper.subjects[subjIdx].sections[secIdx].questions[qIdx].marks = newMarks;

  // Text
  const newText = qr.querySelector('.question-text')?.innerText?.trim() ?? '';
  if (newText) paper.subjects[subjIdx].sections[secIdx].questions[qIdx].text = newText;

  // Options (if present)
  const optNodes = qr.querySelectorAll('.mcq-opt');
  if (optNodes && optNodes.length === 4) {
    const updatedOpts = Array.from(optNodes).map(n => (n.innerText || '').trim());
    paper.subjects[subjIdx].sections[secIdx].questions[qIdx].options = updatedOpts;
  }

  // Answer key (letters like A or A,C)
  const ansNode = qr.querySelector('.answer-box');
  if (ansNode) {
    let raw = (ansNode.innerText || '').toUpperCase().replace(/[^A-D,]/g,'').replace(/\s+/g,'');
    // Normalize duplicates & order: A,B,C,D unique, keep original order
    const seen = new Set();
    const letters = raw.split(',').filter(x => /^[A-D]$/.test(x) && !seen.has(x) && seen.add(x));
    paper.subjects[subjIdx].sections[secIdx].questions[qIdx].answer = letters.join(letters.length > 1 ? ',' : '');
  }
});

    // Re-number questions continuously within each subject
paper.subjects.forEach(subj => {
  let n = 1;
  (subj.sections || []).forEach(sec => {
    (sec.questions || []).forEach(q => { q.number = n++; });
  });
});
    setExamPaper(paper);
    alert('Changes saved!');
  }

  document.getElementById('save-review-btn').onclick = saveEdits;
  window.onload = renderExam;
  document.getElementById('preview-btn').onclick = function() {
    saveEdits();
    const paper = getExamPaper();
    if (paper) {
      sessionStorage.setItem('finalExamData', JSON.stringify(paper));
      window.location.href = 'exam-preview.html';
    } else {
      alert('No exam paper found!');
    }
  };
 // --- Add this code at the end of your <script> ---
document.getElementById('randomize-numbers-btn').onclick = async function() {
  saveEdits();
  const paper = getExamPaper();
  if (!paper) {
    alert('No exam paper found!');
    return;
  }
  // Gather all eligible questions
  let allQuestions = [];
  paper.subjects.forEach((subjectBlock, subjIdx) => {
    (subjectBlock.sections || []).forEach((section, sIdx) => {
      (section.questions || []).forEach((q, qIdx) => {
        const isProbSubject = ["math", "math 1", "math 2", "physics", "chemistry"].some(
          s => subjectBlock.subject.toLowerCase().includes(s)
        );
        if (!isProbSubject) return;
        const hasNumber = /\d/.test(q.text);
        if (!hasNumber) return;
        allQuestions.push({
          subjIdx, sIdx, qIdx,
          subject: subjectBlock.subject,
          sectionLabel: section.label,
          question: q.text,
          options: q.options || [],
        });
      });
    });
  });

  if (allQuestions.length === 0) {
    alert("No numerical problem-solving questions found in Math/Physics/Chemistry.");
    return;
  }

  // --- Batch processing ---
  const BATCH_SIZE = 10;
  const totalBatches = Math.ceil(allQuestions.length / BATCH_SIZE);
  let updatedBlocks = [];
  let aiFailed = false;

  const btn = document.getElementById('randomize-numbers-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Randomizing...';

  for (let b = 0; b < totalBatches; b++) {
    const batchQuestions = allQuestions.slice(b * BATCH_SIZE, (b + 1) * BATCH_SIZE);
    const prompt = `
    For each question below, if it is a numerical/problem-solving question, change all numbers in the question and all options to new reasonable values, without changing the concept or difficulty.

**Instructions for MCQs:**
- For "MCQ (Single)": Ensure only one correct answer is present, and shuffle the options. Randomly place the correct answer.
- For "MCQ (Multiple)":
    - Randomly assign the number of correct options for each question as follows:
        - 20% questions: 1 correct option
        - 30% questions: 2 correct options
        - 30% questions: 3 correct options
        - 20% questions: 4 correct options (all correct)
    - For each question, actually solve the problem, and ensure that the answer key corresponds exactly to the correct options based on your new numbers.
    - **Never return a question where none of the options are correct. Double-check that at least one, and only the specified number, of correct options are present.**
    - Shuffle the options and the correct answer(s) every time. Make sure the answer key matches.
- For all questions, double-check that the answer key matches the new numbers and options, and that only the specified number of answers is marked correct.
- **Never include options like "All of the above", "None of the above", "None of these", or similar phrases. All options must be concrete, meaningful answers.**
- Do not change anything for theory or conceptual questions.
Input:
${batchQuestions.map((q, idx) => 
`Q${idx+1} (Subject: ${q.subject}, Section: ${q.sectionLabel}${q.options.length === 4 ? (q.options.filter(opt => opt.includes("(Multiple)")).length ? ", MCQ (Multiple)" : ", MCQ (Single)") : ""}):
${q.question}
${q.options && q.options.length ? q.options.map((o,i)=>String.fromCharCode(65+i)+') '+o).join('\n') : ''}` 
).join('\n\n')}

Return ONLY the updated questions in the same order and format as above. For each MCQ, at the end, add a line: "Answer: A,B" (for multiple correct), or "Answer: C" (for single correct).
`;
    let aiResult;
    try {
      const response = await fetch('https://question-bank-lqsu.onrender.com/api/v1/generate', {
        method: 'POST',
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const data = await response.json();
      if (!response.ok || !data.result) throw new Error(data.error || "AI Error");
      aiResult = data.result;
    } catch (e) {
      alert("AI error: " + e.message);
      aiFailed = true;
      break;
    }
    const qBlocks = parseAIBlocks(aiResult, batchQuestions.length);

// If fewer than expected, stop and show a helpful message.
// If more than expected, parseAIBlocks already truncates safely.
if (qBlocks.length < batchQuestions.length) {
  console.warn("AI raw output for batch", b + 1, aiResult);
  alert(`AI returned ${qBlocks.length} of ${batchQuestions.length} questions in batch ${b+1}. Please check AI output text (console has the raw output).`);
  aiFailed = true;
  break;
}
    updatedBlocks.push(qBlocks);
  }

  if (aiFailed) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-random"></i> Randomize Numbers in Problems';
    return;
  }

  // Apply AI results back to paper
  let applied = 0;
  for (let b = 0; b < updatedBlocks.length; b++) {
  let batchQuestions = allQuestions.slice(b * BATCH_SIZE, (b + 1) * BATCH_SIZE);
  for (let i = 0; i < updatedBlocks[b].length; i++) {
    const { subjIdx, sIdx, qIdx } = batchQuestions[i];
    let lines = updatedBlocks[b][i].split('\n').filter(x => x.trim());
// Remove any AI metadata/header lines before the real question
while (
  lines.length &&
  (
    /^Q\d+(\s*\(.*\))?\s*:/i.test(lines[0]) ||          // "Q1 (Subject ...):"
    /^Q\d+\s*$/i.test(lines[0]) ||                      // lonely "Q1"
    /^Math [^:]+:.*Section/i.test(lines[0]) ||          // noisy subject lines
    /Section:.*\(MCQ/i.test(lines[0]) ||
    /^[A-Za-z0-9 ]+,\s*Section:.*$/i.test(lines[0]) ||
    /^\s*(Subject|Section)\s*:/i.test(lines[0])         // even more generic junk
  )
) {
  lines.shift();
}
// Additional: If still not a question, keep shifting until a line looks like a question
while (
  lines.length && (
    lines[0].length < 8 ||
    /^[A-Za-z0-9 ]+, Section:.*$/i.test(lines[0]) ||
    /^[A-Z][a-zA-Z0-9 ]*:$/.test(lines[0]) ||
    /^[A-Z ]+\(.*\):$/i.test(lines[0]) ||
    !/[\?\.\)]/.test(lines[0])
  )
) {
  lines.shift();
}

if (lines.length === 0) continue;
const questionText = lines[0].trim();
let options = [];
for (let j = 1; j < lines.length; j++) {
  const m = lines[j].match(/^[A-Da-d][\)\.\:]\s*(.+)$/);
  if (m) options.push(m[1].trim());
}
    // Only update with real questions (not metadata)
    if (
      questionText &&
      questionText.length > 10 &&
      !/^Q\d+/.test(questionText) &&
      !/^Math [^:]+:.*Section/i.test(questionText) &&
      !/Section:.*\(MCQ/.test(questionText)
    ) {
      paper.subjects[subjIdx].sections[sIdx].questions[qIdx].text = questionText;
    }
    if (options.length)
      paper.subjects[subjIdx].sections[sIdx].questions[qIdx].options = options;
    applied++;
  }
}
  setExamPaper(paper);
  renderExam();
  alert("Numbers in all numerical problems have been randomized!");
  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-random"></i> Randomize Numbers in Problems';
};
