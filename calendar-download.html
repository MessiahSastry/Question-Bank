<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Download Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- Firebase v8 (matches your db.collection style) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<!-- PDF-Lib (for multi-page PDF export) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <style>
    body{ margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#f4f7fb; color:#123; }
    .topbar{
      background:#0f3d6b; color:#fff; padding:14px 12px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      position:sticky; top:0; z-index:10;
    }
    .topbar .t{ font-weight:800; letter-spacing:.3px; text-align:center; flex:1; }
    .topbar button{
      border:none; background:#ffffff22; color:#fff;
      padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:700;
      min-width:74px;
    }
    .wrap{ max-width:1100px; margin:14px auto 40px; padding:0 12px; }
    .grid{ display:grid; grid-template-columns: 360px 1fr; gap:12px; align-items:start; }
    @media (max-width: 900px){ .grid{ grid-template-columns:1fr; } }
    .card{
      background:#fff; border:1px solid #d6e2ef; border-radius:16px;
      box-shadow:0 8px 22px rgba(15,61,107,0.08);
      padding:12px;
    }
    .card h3{ margin:0 0 10px; color:#0f3d6b; }
    label{ display:block; font-size:.9rem; font-weight:700; margin:10px 0 6px; }
    .custom-dropdown{ position:relative; }
    .dropdown-selected{
      border:1px solid #ccd7e1; border-radius:12px; padding:10px 12px;
      background:#fff; cursor:pointer; user-select:none;
    }
    .dropdown-list{
      position:absolute; left:0; right:0; top:46px;
      border:1px solid #ccd7e1; background:#fff; border-radius:12px;
      max-height:240px; overflow:auto; z-index:20; display:none;
      box-shadow:0 12px 26px rgba(0,0,0,0.10);
    }
    .dropdown-option{ padding:10px 12px; cursor:pointer; }
    .dropdown-option:hover{ background:#eef5ff; }
    .btnRow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .btn{
      border:none; border-radius:12px; padding:11px 14px; cursor:pointer;
      font-weight:800;
    }
    .btn.primary{ background:#0f3d6b; color:#fff; }
    .btn.gray{ background:#e9eef5; color:#123; }
    .hint{ font-size:.86rem; color:#556; line-height:1.35; margin-top:10px; }
    .warn{ color:#b3261e; font-weight:700; margin-top:10px; display:none; }
    .previewBox{ background:#fff; border:1px solid #d6e2ef; border-radius:16px; padding:10px; overflow:auto; }
    canvas{ width:100%; height:auto; display:block; border-radius:12px; }
  </style>
</head>
<body>

  <div class="topbar">
    <button id="backBtn">Back</button>
    <div class="t">Download Calendar</div>
    <button id="homeBtn">Home</button>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card">
        <h3>Select Student</h3>

        <label>Class</label>
        <div class="custom-dropdown" id="calClassDropdown">
          <div class="dropdown-selected" id="calClassSelected" data-value="">--Select--</div>
          <div class="dropdown-list" id="calClassList"></div>
        </div>

        <label>Section</label>
        <div class="custom-dropdown" id="calSectionDropdown">
          <div class="dropdown-selected" id="calSectionSelected" data-value="">--Select Class First--</div>
          <div class="dropdown-list" id="calSectionList"></div>
        </div>

           <div class="btnRow">
          <button class="btn primary" id="generateBtn">Generate & Download</button>
          <button class="btn gray" id="previewBtn">Preview Only</button>
        </div>

       <div id="warn" class="warn"></div>
      </div>

      <div class="card">
        <h3>Preview</h3>
        <div class="previewBox">
          <canvas id="calCanvas" width="2000" height="1414"></canvas>
        </div>
      </div>
    </div>
  </div>

<script>
  // ====== PASTE SAME FIREBASE CONFIG USED IN YOUR APP ======
      const firebaseConfig = {
      apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
      authDomain: "stpatricks-questionbank.firebaseapp.com",
      projectId: "stpatricks-questionbank",
      storageBucket: "stpatricks-questionbank.firebasestorage.app",
      messagingSenderId: "917615322861",
      appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
    };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();
  const storage = firebase.storage();

  let academicYear = '';

async function resolveAcademicYear() {
  // 1) Try local/session storage (different pages may use different keys)
  const keys = [
    'academicYear',
    'selectedAcademicYear',
    'activeAcademicYear',
    'currentAcademicYear',
    'year',
    'selectedYear'
  ];

  for (const k of keys) {
    const v = (localStorage.getItem(k) || sessionStorage.getItem(k) || '').trim();
    if (v) return v;
  }

  // 2) Try URL param: ?year=2025-26
  const qp = (new URLSearchParams(location.search).get('year') || '').trim();
  if (qp) return qp;

  // 3) Firestore fallback: use isActive/active if present, else pick latest by start-year
  const snap = await db.collection('years').get();
  const years = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) }));
  if (!years.length) return '';

  const active = years.find(y => y.isActive === true || y.active === true);
  if (active) return active.id;

  const startYear = (s) => {
    const m = String(s || '').match(/(\d{4})/);
    return m ? parseInt(m[1], 10) : 0;
  };

  years.sort((a, b) => startYear(b.id || b.name) - startYear(a.id || a.name));
  return years[0].id;
}

  const canvas = document.getElementById('calCanvas');
  const ctx = canvas.getContext('2d');

  // ====== REQUIRED COORDINATES / SIZE ======
    const BG_SRC   = "https://raw.githubusercontent.com/MessiahSastry/Question-Bank/main/calender.png";
  // ✅ Move photo UP + LEFT
const PHOTO_X  = 1600;   // left (reduce X)
const PHOTO_Y  = 160;    // up   (reduce Y)

// keep size (change later if needed)
// ✅ Reduce photo size
const PHOTO_W  = 180;
const PHOTO_H  = 210;

// ✅ Name + Father name BELOW photo (centered under photo)
const TEXT_CENTER_X = PHOTO_X + (PHOTO_W / 2);

const NAME_Y   = PHOTO_Y + PHOTO_H + 14;
const FATHER_Y = NAME_Y + 42;

    let bgImg = null;
  let selected = { classId:'', className:'', sectionId:'', sectionName:'' };
  let studentsInSection = [];


  function warn(msg){
    const w = document.getElementById('warn');
    w.style.display = msg ? 'block' : 'none';
    w.textContent = msg || '';
  }

  const decodeImg = (img) =>
    ("decode" in img) ? img.decode() : new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

  async function loadBg(){
    if (bgImg) return bgImg;
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.src = BG_SRC;
    await decodeImg(im);
    bgImg = im;
    return bgImg;
  }

  // same cropping idea as certificate (cover-fit inside a rectangle)
  function drawImageCover(img, x, y, w, h){
    const sw = img.naturalWidth || img.width;
    const sh = img.naturalHeight || img.height;
    const ir = sw / sh;
    const br = w / h;

    let sx=0, sy=0, sww=sw, shh=sh;
    if (ir > br) {
      shh = sh;
      sww = sh * br;
      sx = (sw - sww) / 2;
      sy = 0;
    } else {
      sww = sw;
      shh = sw / br;
      sx = 0;
      sy = (sh - shh) / 2;
    }
    ctx.drawImage(img, sx, sy, sww, shh, x, y, w, h);
  }

  async function resolveStudentPhoto(stu){
    if (!stu) return null;
    if (stu.photoUrl) return stu.photoUrl;
    if (stu.photoURL) return stu.photoURL;
    if (stu.photoPath) {
      try {
        const url = await storage.ref().child(stu.photoPath).getDownloadURL();
        return url;
      } catch(e) {}
    }
    return null;
  }

  async function loadPhoto(url){
    if (!url) return null;
    try{
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.referrerPolicy = "no-referrer";
      im.src = url;
      await decodeImg(im);
      return im;
    }catch(e){
      return null;
    }
  }

    async function drawCalendarForStudent(stu){
    warn('');
    if (!academicYear) { warn('academicYear not found in localStorage.'); return false; }
    if (!stu) { warn('No student found in this section.'); return false; }

    await loadBg();

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bgImg, 0, 0, 2000, 1414);

    // photo
    const url = await resolveStudentPhoto(stu);
    const pimg = await loadPhoto(url);
        if (pimg) {
      drawImageCover(pimg, PHOTO_X, PHOTO_Y, PHOTO_W, PHOTO_H);

      // border
      ctx.save();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#ff7a00"; // orange
      
      // rounded border
      const r = 16; // corner radius
      const x = PHOTO_X, y = PHOTO_Y, w = PHOTO_W, h = PHOTO_H;
      
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

       // text
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "top";

       const maxTextW = Math.max(260, PHOTO_W + 60); // safe width under photo

function drawOneLineFitFill(text, x, y, maxW, fontBold, startSize, minSize){
  text = (text || '').trim();
  if (!text) return;

  let size = startSize;
  while (size >= minSize) {
    ctx.font = `${fontBold} ${size}px 'Segoe UI'`;
    if (ctx.measureText(text).width <= maxW) break;
    size -= 1;
  }
  ctx.fillText(text, x, y);
}

// SAME TEXT BUT OUTLINE INSTEAD OF FILL
function drawOneLineFitOutline(text, x, y, maxW, fontBold, startSize, minSize){
  text = (text || '').trim();
  if (!text) return;

  let size = startSize;
  while (size >= minSize) {
    ctx.font = `${fontBold} ${size}px 'Segoe UI'`;
    if (ctx.measureText(text).width <= maxW) break;
    size -= 1;
  }
  ctx.strokeText(text, x, y);
}
  const nameText = (stu.name || '').trim();

// ORANGE OUTLINE
ctx.lineWidth = 6;
ctx.strokeStyle = "#ff7a00";
drawOneLineFitOutline(nameText, TEXT_CENTER_X, NAME_Y, maxTextW, "800", 44, 24);

// BLUE FILL
ctx.fillStyle = "#0f3d6b";
drawOneLineFitFill(nameText, TEXT_CENTER_X, NAME_Y, maxTextW, "800", 44, 24);

    const fatherRaw = (stu.fatherName || stu.father || '').trim();
    const fatherText = fatherRaw ? fatherRaw : '';
    ctx.fillStyle = "#222";
    drawOneLineFitFill(fatherText, TEXT_CENTER_X, FATHER_Y, maxTextW, "700", 28, 18);
    ctx.restore();
    return true;
  }

  function downloadPNG(){
    const a = document.createElement('a');
    const stu = selected.student || {};
    a.download = `Calendar_${(stu.roll||'')}_${(stu.name||'Student')}.png`.replace(/[^\w\-\. ]+/g,'_');
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // custom dropdown helper (same style you use)
  function setupDropdown(dropdownId, selectedId, listId, onSelect) {
    const dropdown = document.getElementById(dropdownId);
    const selectedEl = document.getElementById(selectedId);
    const list = document.getElementById(listId);
    if (!dropdown || !selectedEl || !list) return;

    selectedEl.onclick = () => {
      list.style.display = (list.style.display === "block" ? "none" : "block");
    };

    list.querySelectorAll(".dropdown-option").forEach(opt => {
      opt.onclick = () => {
        selectedEl.textContent = opt.textContent;
        selectedEl.dataset.value = opt.dataset.id || opt.dataset.value || "";
        list.style.display = "none";
        if (onSelect) onSelect(opt.dataset.id || opt.dataset.value, opt.textContent);
      };
    });

    document.addEventListener("click", function handler(e) {
      if (!dropdown.contains(e.target)) {
        list.style.display = "none";
        document.removeEventListener("click", handler);
      }
    });
  }

  async function loadClasses(){
    const classSnap = await db.collection('years').doc(academicYear)
      .collection('classes').orderBy('name').get();

    const list = document.getElementById('calClassList');
    const classes = [];
    classSnap.forEach(d => classes.push({id:d.id, ...(d.data()||{})}));

    list.innerHTML = classes.map(c => `<div class="dropdown-option" data-id="${c.id}">${c.name || c.id}</div>`).join('');
    setupDropdown('calClassDropdown','calClassSelected','calClassList', async (classId, className) => {
      selected.classId = classId; selected.className = className;
      selected.sectionId=''; selected.sectionName='';
      selected.studentId=''; selected.student=null;

      document.getElementById('calSectionSelected').textContent = '--Select--';
      document.getElementById('calSectionSelected').dataset.value = '';
            studentsInSection = [];

      await loadSections(classId);
    });
  }

  async function loadSections(classId){
    const secSnap = await db.collection('years').doc(academicYear)
      .collection('classes').doc(classId)
      .collection('sections').orderBy('name').get();

    const list = document.getElementById('calSectionList');
    const secs = [];
    secSnap.forEach(d => secs.push({id:d.id, ...(d.data()||{})}));

    list.innerHTML = secs.map(s => `<div class="dropdown-option" data-id="${s.id}">${s.name || s.id}</div>`).join('');
    setupDropdown('calSectionDropdown','calSectionSelected','calSectionList', async (sectionId, sectionName) => {
      selected.sectionId = sectionId; selected.sectionName = sectionName;
      selected.studentId=''; selected.student=null;

            studentsInSection = [];
      await loadStudentsForSection(selected.classId, sectionId);
    });
  }

  async function loadStudentsForSection(classId, sectionId){
    const stuSnap = await db.collection('years').doc(academicYear)
      .collection('classes').doc(classId)
      .collection('sections').doc(sectionId)
      .collection('students').orderBy('roll').get();

    const students = [];
    stuSnap.forEach(d => {
      const x = d.data() || {};
      if (x.isDeleted) return;
      students.push({ id: d.id, ...x });
    });

    studentsInSection = students;
    return studentsInSection;
  }

  document.getElementById('backBtn').onclick = () => window.history.back();
  document.getElementById('homeBtn').onclick = () => window.location.href = "dashboard.html";

    document.getElementById('previewBtn').onclick = async () => {
    if (!selected.classId || !selected.sectionId) { warn('Please select Class and Section.'); return; }
    if (!studentsInSection.length) await loadStudentsForSection(selected.classId, selected.sectionId);
    if (!studentsInSection.length) { warn('No students found in this section.'); return; }
    await drawCalendarForStudent(studentsInSection[0]); // preview first student
  };

  document.getElementById('generateBtn').onclick = async () => {
    if (!selected.classId || !selected.sectionId) { warn('Please select Class and Section.'); return; }
    if (!studentsInSection.length) await loadStudentsForSection(selected.classId, selected.sectionId);
    if (!studentsInSection.length) { warn('No students found in this section.'); return; }

    const statusMsg = `Generating PDF (${studentsInSection.length} students)...`;
    warn(statusMsg);

    const { PDFDocument } = PDFLib;
    const pdf = await PDFDocument.create();

    for (let i = 0; i < studentsInSection.length; i++) {
      warn(`Generating PDF... ${i+1} / ${studentsInSection.length}`);

      const ok = await drawCalendarForStudent(studentsInSection[i]);
      if (!ok) continue;

      const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
      const imgBytes = Uint8Array.from(atob(dataUrl.split(",")[1]), c => c.charCodeAt(0));

      const jpg = await pdf.embedJpg(imgBytes);
      const page = pdf.addPage([842, 595]); // A4 landscape

      const s = Math.min(842 / jpg.width, 595 / jpg.height);
      page.drawImage(jpg, {
        x: (842 - jpg.width * s) / 2,
        y: (595 - jpg.height * s) / 2,
        width: jpg.width * s,
        height: jpg.height * s
      });
    }

    const bytes = await pdf.save();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    a.download = `Calendars_${selected.className || 'Class'}_${selected.sectionName || 'Section'}.pdf`.replace(/[^\w\-\. ]+/g,'_');
    a.click();

    warn('');
  };


   firebase.auth().onAuthStateChanged(async (user) => {
  try {
    // if your Firestore rules require login, we must stop here when not logged in
    if (!user) {
      warn('Please login first.');
      return;
    }

    // ✅ auto-pick year (not fixed)
    academicYear = await resolveAcademicYear();

    if (!academicYear) {
      warn('Unable to detect Academic Year from Firestore.');
      return;
    }

    await loadClasses();
    await loadBg();
    ctx.drawImage(bgImg, 0, 0, 2000, 1414);
    warn('');
  } catch (e) {
    console.error(e);
    warn('Unable to load Classes: ' + (e && e.message ? e.message : e));
  }
});

</script>

</body>
</html>
