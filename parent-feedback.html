<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parent Feedback - St. Patrick's School</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f8fc;
      color: #222;
    }

    .page-header {
      background: #0f3d6b;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    .school-name {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .page-title {
      font-size: 19px;
      font-weight: 600;
    }

    .class-info {
      font-size: 15px;
      margin-top: 7px;
      color: #dbeafe;
    }

    .container {
      max-width: 950px;
      margin: 20px auto;
      padding: 0 12px 40px;
    }

    .top-box {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .exam-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .exam-row label {
      font-weight: 700;
      color: #0f3d6b;
      font-size: 16px;
    }

    .modern-dropdown {
  position: relative;
  flex: 1;
  min-width: 220px;
}

.modern-dropdown-trigger {
  width: 100%;
  min-height: 48px;
  background: #fff;
  border: 1.5px solid #c8d7e6;
  border-radius: 12px;
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: #0f3d6b;
  text-align: left;
  transition: all .18s ease;
  box-shadow: 0 2px 7px rgba(15,61,107,.06);
}

.modern-dropdown-trigger:hover {
  border-color: #1762a7;
  box-shadow: 0 3px 10px rgba(15,61,107,.12);
}

.modern-dropdown.open .modern-dropdown-trigger {
  border-color: #1762a7;
  box-shadow: 0 0 0 3px rgba(23,98,167,.10);
}

.modern-dropdown-arrow {
  font-size: 13px;
  color: #1762a7;
  transition: transform .2s ease;
}

.modern-dropdown.open .modern-dropdown-arrow {
  transform: rotate(180deg);
}

.modern-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 7px);
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid #d8e3ed;
  border-radius: 12px;
  box-shadow: 0 10px 28px rgba(15,61,107,.16);
  z-index: 1000;
  overflow: hidden;
  max-height: 300px;
  overflow-y: auto;
  padding: 6px;
}

.modern-dropdown.open .modern-dropdown-menu {
  display: block;
}

.modern-dropdown-option {
  width: 100%;
  border: none;
  background: transparent;
  color: #27384a;
  padding: 11px 12px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  font-size: 15px;
  font-weight: 500;
}

.modern-dropdown-option:hover {
  background: #edf5fd;
  color: #0f3d6b;
}

.modern-dropdown-option.selected {
  background: #1762a7;
  color: #fff;
  font-weight: 700;
}

    .summary {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .summary-box {
      flex: 1;
      min-width: 150px;
      border-radius: 8px;
      padding: 11px 12px;
      text-align: center;
      font-weight: 700;
    }

    .total-box {
      background: #eaf3ff;
      color: #0f3d6b;
    }

    .saved-box {
      background: #e9f8ef;
      color: #167144;
    }

    .pending-box {
      background: #fff4e5;
      color: #b35c00;
    }

    #status {
      margin: 15px 0;
      text-align: center;
      color: #e26c17;
      font-weight: 600;
    }

    .student-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      overflow: hidden;
      border: 1px solid #e6edf5;
    }

    .student-header {
      padding: 14px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .student-left {
      text-align: left;
      flex: 1;
    }

    .student-name {
      font-size: 17px;
      font-weight: 700;
      color: #0f3d6b;
    }

    .roll-no {
      font-size: 14px;
      color: #666;
      margin-top: 3px;
    }

    .feedback-status {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .not-saved {
      background: #fff1e5;
      color: #b54708;
    }

    .saved {
      background: #e8f7ed;
      color: #14753d;
    }

    .open-btn {
      border: none;
      background: #1762a7;
      color: white;
      padding: 9px 14px;
      font-weight: 700;
      font-size: 14px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }

    .open-btn:hover {
      background: #0f4f8b;
    }

    .feedback-form {
      display: none;
      border-top: 1px solid #e4eaf0;
      padding: 18px 15px 20px;
      background: #fbfdff;
    }

    .feedback-form.show {
      display: block;
    }

    .field {
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #193c5a;
      margin-bottom: 8px;
    }

    .required {
      color: #d92d20;
    }

    select.feedback-select,
    input.hours-input {
      width: 100%;
      padding: 10px 11px;
      border-radius: 7px;
      border: 1.3px solid #b8c8d8;
      background: white;
      font-size: 15px;
    }

    .radio-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .radio-option {
      position: relative;
    }

    .radio-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio-option label {
      display: inline-block;
      padding: 8px 14px;
      background: #fff;
      border: 1.4px solid #b6c7d8;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      min-width: 65px;
      text-align: center;
    }

    .radio-option input:checked + label {
      background: #1762a7;
      color: white;
      border-color: #1762a7;
    }

    .yes-no-hours {
      display: grid;
      grid-template-columns: auto 160px;
      gap: 18px;
      align-items: end;
    }

    .hours-block {
      min-width: 130px;
    }

    .hours-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }

    .save-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 20px auto 0;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      background: #178754;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #126d44;
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .save-message {
      text-align: center;
      margin-top: 10px;
      min-height: 20px;
      font-weight: 700;
      color: #14753d;
    }

    .back-btn {
      border: none;
      background: white;
      color: #0f3d6b;
      border-radius: 7px;
      padding: 8px 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    @media(max-width: 650px) {

      .school-name {
        font-size: 22px;
      }

      .student-header {
        align-items: flex-start;
      }

      .open-btn {
        font-size: 13px;
        padding: 8px 10px;
      }

      .yes-no-hours {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .radio-option label {
        padding: 8px 11px;
      }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body>

  <div class="page-header">

    <div class="school-name">
      St. Patrick's School
    </div>

    <div class="page-title">
      Parent Feedback
    </div>

    <div class="class-info" id="classInfo"></div>

    <button class="back-btn" onclick="history.back()">
      ← Back
    </button>

  </div>


  <div class="container">

    <div class="top-box">

      <div class="exam-row">

        <label for="examDropdown">
          Select Exam:
        </label>

        <div class="modern-dropdown" id="examDropdown">

  <button
    type="button"
    class="modern-dropdown-trigger"
    id="examDropdownTrigger">

    <span id="examSelectedText">
      Select Exam
    </span>

    <span class="modern-dropdown-arrow">
      ▼
    </span>

  </button>

  <div
    class="modern-dropdown-menu"
    id="examDropdownMenu">
  </div>

</div>

      </div>


      <div class="summary">

        <div class="summary-box total-box">
          Students:
          <span id="totalStudents">0</span>
        </div>

        <div class="summary-box saved-box">
          Feedback Saved:
          <span id="savedCount">0</span>
        </div>

        <div class="summary-box pending-box">
          Pending:
          <span id="pendingCount">0</span>
        </div>

      </div>

    </div>


    <div id="status">
      Loading...
    </div>

    <div id="studentList"></div>

  </div>


<script>

  // ============================================================
  // FIREBASE
  // ============================================================

  const firebaseConfig = {

    apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",

    authDomain: "stpatricks-questionbank.firebaseapp.com",

    projectId: "stpatricks-questionbank",

    storageBucket: "stpatricks-questionbank.appspot.com",

    messagingSenderId: "917615322861",

    appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"

  };


  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();



  // ============================================================
  // CLASS GROUP
  // ============================================================

  const CLASS_GROUP_MAP = {

    "Nursery": "nursery-lkg-ukg",
    "LKG": "nursery-lkg-ukg",
    "UKG": "nursery-lkg-ukg",

    "1st Class": "class-1-2",
    "2nd Class": "class-1-2",

    "3rd Class": "class-3-5",
    "4th Class": "class-3-5",
    "5th Class": "class-3-5",

    "6th Class": "class-6-9",
    "7th Class": "class-6-9",
    "8th Class": "class-6-9",
    "9th Class": "class-6-9",

    "10th Class": "class-10"

  };


  function getClassGroupName(className) {

    return CLASS_GROUP_MAP[className] || "default";

  }



  // ============================================================
  // SELECTED CLASS INFORMATION
  // ============================================================

  const academicYear =
    localStorage.getItem("sp_selectedYear") || "";

  const classId =
    localStorage.getItem("sp_selectedClassId") || "";

  const className =
    localStorage.getItem("sp_selectedClassName") || "";

  const sectionId =
    localStorage.getItem("sp_selectedSectionId") || "";

  const sectionName =
    localStorage.getItem("sp_selectedSectionName") || "";



  document.getElementById("classInfo").textContent =
    `${className} – ${sectionName} (${academicYear})`;



  // ============================================================
  // VARIABLES
  // ============================================================

  let students = [];

  let exams = [];

  let currentExamId = "";

  let currentExamName = "";



  const studentList =
    document.getElementById("studentList");

  const examDropdown =
  document.getElementById("examDropdown");

const examDropdownTrigger =
  document.getElementById("examDropdownTrigger");

const examDropdownMenu =
  document.getElementById("examDropdownMenu");

const examSelectedText =
  document.getElementById("examSelectedText");
  const statusDiv =
    document.getElementById("status");



  // ============================================================
  // SAFE TEXT
  // ============================================================

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }



  // ============================================================
  // START PAGE
  // ============================================================

  window.onload = async function () {

    if (
      !academicYear ||
      !classId ||
      !sectionId
    ) {

      statusDiv.textContent =
        "Class or section is not selected.";

      return;

    }


    try {

      statusDiv.textContent =
        "Loading students and exams...";


      await loadStudents();

      await loadExams();


      document.getElementById("totalStudents").textContent =
        students.length;


      if (exams.length === 0) {

        statusDiv.textContent =
          "No exams found.";

        return;

      }


     examDropdownMenu.innerHTML =

  exams.map(exam => `

    <button
      type="button"
      class="modern-dropdown-option"
      data-id="${escapeHtml(exam.id)}"
      data-name="${escapeHtml(exam.name)}">

      ${escapeHtml(exam.name)}

    </button>

  `).join("");


examDropdownTrigger.onclick = function(e) {

  e.stopPropagation();

  examDropdown.classList.toggle("open");

};


examDropdownMenu
  .querySelectorAll(".modern-dropdown-option")
  .forEach(option => {

    option.onclick = async function(e) {

      e.stopPropagation();

      currentExamId =
        this.dataset.id;

      currentExamName =
        this.dataset.name;


      examSelectedText.textContent =
        currentExamName;


      examDropdownMenu
        .querySelectorAll(".modern-dropdown-option")
        .forEach(item =>
          item.classList.remove("selected")
        );


      this.classList.add("selected");

      examDropdown.classList.remove("open");


      await loadFeedback();

    };

  });


document.addEventListener("click", function(e) {

  if (!examDropdown.contains(e.target)) {

    examDropdown.classList.remove("open");

  }

});


      statusDiv.textContent =
        "Please select an exam.";


    }

    catch (error) {

      console.error(error);

      statusDiv.textContent =
        "Error: " + error.message;

    }

  };



  // ============================================================
  // LOAD STUDENTS
  // ============================================================

  async function loadStudents() {

    const snapshot =

      await db
        .collection("years")
        .doc(academicYear)
        .collection("classes")
        .doc(classId)
        .collection("sections")
        .doc(sectionId)
        .collection("students")
        .orderBy("roll")
        .get();


    students = [];


    snapshot.forEach(doc => {

      const data = doc.data();

      if (!data.isDeleted) {

        students.push({

          id: doc.id,

          ...data

        });

      }

    });

  }



  // ============================================================
  // LOAD EXAMS
  // ============================================================

  async function loadExams() {

    const classGroup =
      getClassGroupName(className);


    const snapshot =

      await db
        .collection("years")
        .doc(academicYear)
        .collection("exams")
        .doc("classGroups")
        .collection(classGroup)
        .orderBy("name")
        .get();


    exams = [];


    snapshot.forEach(doc => {

      const data = doc.data();

      exams.push({

        id: doc.id,

        name: data.name || doc.id

      });

    });

  }


  // ============================================================
  // LOAD FEEDBACK FOR ALL STUDENTS
  // ============================================================

  async function loadFeedback() {

    statusDiv.textContent =
      "Loading parent feedback...";


    studentList.innerHTML = "";


    const feedbackResults =

      await Promise.all(

        students.map(async student => {

          try {

            const feedbackDoc =

              await db
                .collection("years")
                .doc(academicYear)
                .collection("classes")
                .doc(classId)
                .collection("sections")
                .doc(sectionId)
                .collection("students")
                .doc(student.id)
                .collection("parentFeedback")
                .doc(currentExamId)
                .get();


            return {

              student,

              feedback:
                feedbackDoc.exists
                  ? feedbackDoc.data()
                  : null

            };

          }

          catch (error) {

            console.error(
              "Feedback loading error:",
              student.id,
              error
            );


            return {

              student,

              feedback: null

            };

          }

        })

      );


    feedbackResults.forEach(
      (item, index) => {

        createStudentCard(
          item.student,
          item.feedback,
          index
        );

      }
    );


    statusDiv.textContent = "";

    updateCounts();

  }



  // ============================================================
  // CREATE STUDENT CARD
  // ============================================================

  function createStudentCard(
    student,
    feedback,
    index
  ) {

    const studentName =
      student.name ||
      student.studentName ||
      student.fullName ||
      "Student";


    const roll =
      student.roll ?? "-";


    const isSaved =
      !!feedback;


    const card =
      document.createElement("div");


    card.className =
      "student-card";


    card.dataset.studentId =
      student.id;


    card.dataset.saved =
      isSaved ? "true" : "false";


    card.innerHTML = `

      <div class="student-header">

        <div class="student-left">

          <div class="student-name">
            ${escapeHtml(studentName)}
          </div>

          <div class="roll-no">
            Roll No: ${escapeHtml(roll)}
          </div>

          <span class="
            feedback-status
            ${isSaved ? "saved" : "not-saved"}
          ">

            ${
              isSaved
                ? "Saved ✓"
                : "Pending"
            }

          </span>

        </div>


        <button
          type="button"
          class="open-btn">

          ${
            isSaved
              ? "Edit Feedback"
              : "Take Feedback"
          }

        </button>

      </div>


      <div class="feedback-form">


        <!-- RELATION -->

        <div class="field">

          <label class="field-label">

            Relation
            <span class="required">*</span>

          </label>

          <select
            class="feedback-select"
            data-field="relation">

            <option value="">
              Select Relation
            </option>

            <option value="Father"
              ${
                feedback?.relation === "Father"
                  ? "selected"
                  : ""
              }>
              Father
            </option>

            <option value="Mother"
              ${
                feedback?.relation === "Mother"
                  ? "selected"
                  : ""
              }>
              Mother
            </option>

            <option value="Guardian"
              ${
                feedback?.relation === "Guardian"
                  ? "selected"
                  : ""
              }>
              Guardian
            </option>

          </select>

        </div>



        <!-- TEACHING -->

        <div class="field">

          <label class="field-label">

            Teaching & Learning
            <span class="required">*</span>

          </label>

          <select
            class="feedback-select"
            data-field="teachingLearning">

            <option value="">
              Select
            </option>

            ${ratingOptions(
              feedback?.teachingLearning
            )}

          </select>

        </div>



        <!-- COMMUNICATION -->

        <div class="field">

          <label class="field-label">

            Communication from School
            <span class="required">*</span>

          </label>

          <select
            class="feedback-select"
            data-field="communication">

            <option value="">
              Select
            </option>

            ${ratingOptions(
              feedback?.communication
            )}

          </select>

        </div>



        <!-- HOMEWORK -->

        <div class="field">

          <label class="field-label">

            Homework at Home
            <span class="required">*</span>

          </label>


          <div class="yes-no-hours">

            <div class="radio-group">

              ${yesNoRadio(
                "homework",
                index,
                feedback?.homeworkAtHome
              )}

            </div>


            <div class="hours-block">

              <span class="hours-title">
                Hours per day
              </span>

              <input
                type="number"
                class="hours-input"
                data-field="homeworkHours"
                min="0"
                max="24"
                step="0.5"
                placeholder="Hours"
                value="${
                  feedback?.homeworkHours ??
                  ""
                }">

            </div>

          </div>

        </div>



        <!-- MOBILE -->

        <div class="field">

          <label class="field-label">

            Student Using Mobile
            <span class="required">*</span>

          </label>


          <div class="yes-no-hours">

            <div class="radio-group">

              ${yesNoRadio(
                "mobile",
                index,
                feedback?.mobileUsage
              )}

            </div>


            <div class="hours-block">

              <span class="hours-title">
                Hours per day
              </span>

              <input
                type="number"
                class="hours-input"
                data-field="mobileHours"
                min="0"
                max="24"
                step="0.5"
                placeholder="Hours"
                value="${
                  feedback?.mobileHours ??
                  ""
                }">

            </div>

          </div>

        </div>



        <!-- RESPECTING PARENTS -->

        <div class="field">

          <label class="field-label">

            Respecting Parents
            <span class="required">*</span>

          </label>

          <div class="radio-group">

            ${yesNoRadio(
              "respect",
              index,
              feedback?.respectingParents
            )}

          </div>

        </div>



        <!-- SPEAKING ENGLISH -->

        <div class="field">

          <label class="field-label">

            Speaking English at Home
            <span class="required">*</span>

          </label>

          <div class="radio-group">

            ${yesNoRadio(
              "english",
              index,
              feedback?.speakingEnglishAtHome
            )}

          </div>

        </div>



        <button
          type="button"
          class="save-btn">

          ${
            isSaved
              ? "Update Feedback"
              : "Save Feedback"
          }

        </button>


        <div class="save-message"></div>

      </div>

    `;


    studentList.appendChild(card);



    // OPEN / CLOSE

    const openButton =
      card.querySelector(".open-btn");


    const form =
      card.querySelector(".feedback-form");


    openButton.addEventListener(
      "click",

      function () {

        const isOpen =
          form.classList.contains("show");


        document
          .querySelectorAll(".feedback-form.show")
          .forEach(openForm => {

            if (openForm !== form) {

              openForm.classList.remove("show");

            }

          });


        if (isOpen) {

          form.classList.remove("show");

        }

        else {

          form.classList.add("show");

          form.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
          });

        }

      }

    );



    // YES / NO HOURS

    setupHourControl(
      card,
      "homework",
      "homeworkHours"
    );


    setupHourControl(
      card,
      "mobile",
      "mobileHours"
    );



    // SAVE

    card
      .querySelector(".save-btn")
      .addEventListener(
        "click",

        function () {

          saveFeedback(
            student,
            card
          );

        }

      );

  }



  // ============================================================
  // RATING OPTIONS
  // ============================================================

  function ratingOptions(selectedValue) {

    const ratings = [

      "Excellent",
      "Good",
      "Satisfactory",
      "Needs Improvement"

    ];


    return ratings.map(value =>

      `<option
        value="${value}"
        ${
          selectedValue === value
            ? "selected"
            : ""
        }>
        ${value}
       </option>`

    ).join("");

  }



  // ============================================================
  // YES / NO RADIO BUTTON
  // ============================================================

  function yesNoRadio(
    field,
    index,
    selectedValue
  ) {

    const radioName =
      `${field}_${index}`;


    return `

      <div class="radio-option">

        <input
          type="radio"
          id="${radioName}_yes"
          name="${radioName}"
          data-field="${field}"
          value="Yes"
          ${
            selectedValue === "Yes"
              ? "checked"
              : ""
          }>

        <label for="${radioName}_yes">
          Yes
        </label>

      </div>


      <div class="radio-option">

        <input
          type="radio"
          id="${radioName}_no"
          name="${radioName}"
          data-field="${field}"
          value="No"
          ${
            selectedValue === "No"
              ? "checked"
              : ""
          }>

        <label for="${radioName}_no">
          No
        </label>

      </div>

    `;

  }



  // ============================================================
  // HOURS CONTROL
  // ============================================================

  function setupHourControl(
    card,
    radioField,
    hourField
  ) {

    const radios =
      card.querySelectorAll(
        `input[data-field="${radioField}"]`
      );


    const hoursInput =
      card.querySelector(
        `[data-field="${hourField}"]`
      );


    function updateHours() {

      const checked =
        card.querySelector(
          `input[data-field="${radioField}"]:checked`
        );


      if (
        checked &&
        checked.value === "No"
      ) {

        hoursInput.value = "";

        hoursInput.disabled = true;

      }

      else {

        hoursInput.disabled = false;

      }

    }


    radios.forEach(radio => {

      radio.addEventListener(
        "change",
        updateHours
      );

    });


    updateHours();

  }



  // ============================================================
  // GET RADIO VALUE
  // ============================================================

  function getRadioValue(
    card,
    field
  ) {

    const checked =

      card.querySelector(
        `input[data-field="${field}"]:checked`
      );


    return checked
      ? checked.value
      : "";

  }



  // ============================================================
  // SAVE FEEDBACK
  // ============================================================

  async function saveFeedback(
    student,
    card
  ) {

    if (!currentExamId) {

      alert("Please select an exam.");

      return;

    }



    const relation =

      card.querySelector(
        '[data-field="relation"]'
      ).value;


    const teachingLearning =

      card.querySelector(
        '[data-field="teachingLearning"]'
      ).value;


    const communication =

      card.querySelector(
        '[data-field="communication"]'
      ).value;


    const homeworkAtHome =

      getRadioValue(
        card,
        "homework"
      );


    const mobileUsage =

      getRadioValue(
        card,
        "mobile"
      );


    const respectingParents =

      getRadioValue(
        card,
        "respect"
      );


    const speakingEnglishAtHome =

      getRadioValue(
        card,
        "english"
      );


    const homeworkHoursInput =

      card.querySelector(
        '[data-field="homeworkHours"]'
      );


    const mobileHoursInput =

      card.querySelector(
        '[data-field="mobileHours"]'
      );



    // REQUIRED FIELDS

    if (!relation) {

      alert("Please select Relation.");

      return;

    }


    if (!teachingLearning) {

      alert(
        "Please select Teaching & Learning."
      );

      return;

    }


    if (!communication) {

      alert(
        "Please select Communication from School."
      );

      return;

    }


    if (!homeworkAtHome) {

      alert(
        "Please select Homework at Home - Yes or No."
      );

      return;

    }


    if (!mobileUsage) {

      alert(
        "Please select Student Using Mobile - Yes or No."
      );

      return;

    }


    if (!respectingParents) {

      alert(
        "Please select Respecting Parents - Yes or No."
      );

      return;

    }


    if (!speakingEnglishAtHome) {

      alert(
        "Please select Speaking English at Home - Yes or No."
      );

      return;

    }



    // HOURS VALIDATION

    if (
      homeworkAtHome === "Yes" &&
      homeworkHoursInput.value === ""
    ) {

      alert(
        "Please enter Homework Hours."
      );

      homeworkHoursInput.focus();

      return;

    }


    if (
      mobileUsage === "Yes" &&
      mobileHoursInput.value === ""
    ) {

      alert(
        "Please enter Mobile Usage Hours."
      );

      mobileHoursInput.focus();

      return;

    }



    const homeworkHours =

      homeworkAtHome === "Yes"
        ? Number(homeworkHoursInput.value)
        : 0;


    const mobileHours =

      mobileUsage === "Yes"
        ? Number(mobileHoursInput.value)
        : 0;



    if (
      homeworkHours < 0 ||
      homeworkHours > 24
    ) {

      alert(
        "Homework hours must be between 0 and 24."
      );

      return;

    }


    if (
      mobileHours < 0 ||
      mobileHours > 24
    ) {

      alert(
        "Mobile hours must be between 0 and 24."
      );

      return;

    }



    const saveButton =
      card.querySelector(".save-btn");


    const message =
      card.querySelector(".save-message");


    saveButton.disabled = true;

    saveButton.textContent =
      "Saving...";


    message.textContent = "";



    try {

      const studentName =

        student.name ||
        student.studentName ||
        student.fullName ||
        "";


      const feedbackData = {

        academicYear:
          academicYear,

        classId:
          classId,

        className:
          className,

        sectionId:
          sectionId,

        sectionName:
          sectionName,

        studentId:
          student.id,

        studentName:
          studentName,

        roll:
          student.roll ?? "",

        examId:
          currentExamId,

        examName:
          currentExamName,

        relation:
          relation,

        teachingLearning:
          teachingLearning,

        communication:
          communication,

        homeworkAtHome:
          homeworkAtHome,

        homeworkHours:
          homeworkHours,

        mobileUsage:
          mobileUsage,

        mobileHours:
          mobileHours,

        respectingParents:
          respectingParents,

        speakingEnglishAtHome:
          speakingEnglishAtHome,

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      };



      await db
        .collection("years")
        .doc(academicYear)
        .collection("classes")
        .doc(classId)
        .collection("sections")
        .doc(sectionId)
        .collection("students")
        .doc(student.id)
        .collection("parentFeedback")
        .doc(currentExamId)
        .set(
          feedbackData,
          { merge: true }
        );



      card.dataset.saved =
        "true";


      const statusBadge =
        card.querySelector(
          ".feedback-status"
        );


      statusBadge.textContent =
        "Saved ✓";


      statusBadge.classList.remove(
        "not-saved"
      );


      statusBadge.classList.add(
        "saved"
      );



      card.querySelector(
        ".open-btn"
      ).textContent =
        "Edit Feedback";


      saveButton.textContent =
        "Update Feedback";


      message.textContent =
        "Feedback saved successfully ✓";


      updateCounts();



      setTimeout(() => {

        message.textContent = "";

      }, 2500);


    }

    catch (error) {

      console.error(error);


      message.style.color =
        "#d92d20";


      message.textContent =
        "Error saving feedback: " +
        error.message;


      saveButton.textContent =
        card.dataset.saved === "true"
          ? "Update Feedback"
          : "Save Feedback";

    }

    finally {

      saveButton.disabled =
        false;

    }

  }



  // ============================================================
  // UPDATE COUNTS
  // ============================================================

  function updateCounts() {

    const cards =

      document.querySelectorAll(
        ".student-card"
      );


    let saved = 0;


    cards.forEach(card => {

      if (
        card.dataset.saved === "true"
      ) {

        saved++;

      }

    });


    document.getElementById(
      "totalStudents"
    ).textContent =
      students.length;


    document.getElementById(
      "savedCount"
    ).textContent =
      saved;


    document.getElementById(
      "pendingCount"
    ).textContent =
      Math.max(
        students.length - saved,
        0
      );

  }

</script>
