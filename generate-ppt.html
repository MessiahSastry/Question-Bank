<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate PPT | St. Patrick's School</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3d6b">
  <link rel="apple-touch-icon" href="scimentra-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    :root{
      --header-height: 90px;
      --primary: #0f3d6b;
      --primary2: #1762a7;
      --bg: #f4f8fc;
      --card: #ffffff;
      --line: #bcd6ef;
      --soft: #f7fafd;
      --text: #12416c;
    }

    html{
      height:-webkit-fill-available;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:0;
      font-family:'Inter','Segoe UI',Arial,sans-serif;
      background-color:var(--bg);
      min-height:100vh;
      height:auto;
      overflow-y:auto;
    }

    body::after{
      content:"St. Patrick's School\A IIT & NEET FOUNDATION";
      white-space:pre;
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      font-size:5vw;
      font-weight:bold;
      color:rgba(15,61,107,0.04);
      z-index:-1;
      text-align:center;
      pointer-events:none;
      line-height:1.2;
    }

    .page-wrapper{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    #main-header{
      background:linear-gradient(90deg,var(--primary2),var(--primary));
      color:#fff;
      border-bottom-left-radius:28px;
      border-bottom-right-radius:28px;
      min-height:var(--header-height);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:15px 10px 18px 10px;
      position:sticky;
      top:0;
      z-index:1200;
      box-shadow:0 4px 18px rgba(0,27,68,0.12);
    }

    #main-header .school-title{
      font-size:1.8em;
      font-weight:bold;
      margin:0;
      text-align:center;
    }

    #main-header .subtitle{
      font-size:1.05em;
      color:#e0eaff;
      margin-top:5px;
      text-align:center;
    }

    main{
      flex-grow:1;
      display:flex;
      flex-direction:column;
    }

    .review-container{
      width:100%;
      max-width:860px;
      margin:20px auto;
      background:var(--card);
      border-radius:16px;
      box-shadow:0 4px 18px rgba(0,27,68,0.1);
      display:flex;
      flex-direction:column;
      overflow:visible;
    }

    .setup-form-container{
      padding:25px 30px 30px;
    }

    .setup-form-container h2{
      text-align:center;
      color:var(--primary);
      margin-top:0;
      margin-bottom:10px;
    }

    .setup-form-container .subtext{
      text-align:center;
      color:#5b6b7a;
      margin:0 0 22px;
      line-height:1.5;
      font-size:14px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .form-group{
      margin-bottom:15px;
    }

    .form-group.full{
      grid-column:1 / -1;
    }

    label{
      font-weight:600;
      margin-bottom:6px;
      color:#185496;
      display:block;
    }

    input[type="text"],
    input[type="number"],
    textarea{
      width:100%;
      padding:11px 12px;
      border-radius:8px;
      border:1.3px solid var(--line);
      font-size:1em;
      background:var(--soft);
      color:var(--text);
      outline:none;
    }

    textarea{
      min-height:110px;
      resize:vertical;
      line-height:1.55;
    }

    input:focus,
    textarea:focus,
    .custom-dropdown.open .selected-option{
      border-color:#6aa7db;
      box-shadow:0 0 0 3px rgba(23,98,167,0.10);
    }

    .custom-dropdown{
      position:relative;
    }

    .selected-option{
      padding:11px 12px;
      color:var(--text);
      background:var(--soft);
      border-radius:8px;
      border:1.3px solid var(--line);
      cursor:pointer;
      user-select:none;
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .selected-option::after{
      content:"▾";
      color:#527a9d;
      font-size:14px;
      flex-shrink:0;
    }

    .dropdown-options{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:0;
      background:#fff;
      border:1.3px solid var(--line);
      border-top:none;
      border-radius:0 0 8px 8px;
      box-shadow:0 6px 15px rgba(0,27,68,0.1);
      z-index:2000;
      max-height:min(280px,45vh);
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
    }

    .custom-dropdown.open .dropdown-options{
      display:block;
    }

    .dropdown-options div[data-value]{
      padding:10px 15px;
      cursor:pointer;
      color:var(--text);
    }

    .dropdown-options div[data-value]:hover{
      background:#e0eaff;
    }

    .toggle-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
      margin-top:4px;
    }

    .toggle-card{
      display:flex;
      align-items:center;
      gap:10px;
      background:#f8fbff;
      border:1px solid #d7e6f5;
      border-radius:12px;
      padding:10px 12px;
    }

    .toggle-card input{
      width:18px;
      height:18px;
      accent-color:var(--primary);
      margin:0;
      flex-shrink:0;
    }

    .toggle-card span{
      color:var(--text);
      font-weight:600;
      font-size:14px;
      line-height:1.35;
    }

    .button-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:6px;
    }

    button{
      background:linear-gradient(90deg,var(--primary2),var(--primary));
      color:#fff;
      font-weight:bold;
      cursor:pointer;
      padding:13px 14px;
      width:100%;
      border-radius:10px;
      border:none;
      font-size:1.02em;
      box-shadow:0 6px 16px rgba(15,61,107,0.18);
      transition:transform .12s ease, opacity .2s ease;
    }

    button:hover{
      transform:translateY(-1px);
    }

    button:disabled{
      opacity:0.7;
      cursor:not-allowed;
      transform:none;
    }

    .secondary-btn{
      background:#edf5fd;
      color:var(--primary);
      border:1.2px solid #c7dbef;
      box-shadow:none;
    }

    .helper-note{
      margin-top:12px;
      font-size:12px;
      color:#5b6b7a;
      line-height:1.6;
      text-align:center;
    }

    .result-box{
      display:none;
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      background:#f6fbff;
      border:1px solid #d9e8f7;
      color:var(--text);
    }

    .result-box.show{
      display:block;
    }

    .result-box a{
      color:var(--primary);
      font-weight:700;
      word-break:break-word;
    }

    .status-text{
      font-size:14px;
      color:#5b6b7a;
      margin-top:8px;
      text-align:center;
      min-height:20px;
    }

    .app-toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:24px;
      background:var(--primary);
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      box-shadow:0 4px 16px rgba(0,0,0,.2);
      z-index:100000;
      font-weight:600;
      font-size:14px;
      opacity:0.98;
      text-align:center;
      max-width:min(92vw,520px);
    }

    @media (max-width:768px){
      .review-container{
        max-width:calc(100% - 20px);
        margin:15px auto;
      }

      .setup-form-container{
        padding:20px 16px 24px;
      }

      #main-header .school-title{
        font-size:1.55em;
      }

      #main-header .subtitle{
        font-size:0.95em;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .toggle-grid{
        grid-template-columns:1fr;
      }

      .button-row{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header id="main-header">
      <h1 class="school-title">St. Patrick's School</h1>
      <div class="subtitle">IIT & NEET FOUNDATION</div>
    </header>

    <main>
      <div id="ppt-container" class="review-container">
        <div class="setup-form-container">
          <h2>Generate PPT</h2>
          <p class="subtext">
            Fill the details and generate a Google Slides presentation automatically.
          </p>

          <form id="ppt-form" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label>Class</label>
                <div id="class-dropdown" class="custom-dropdown">
                  <input type="hidden" id="class-value" value="6th Class">
                  <div class="selected-option">6th Class</div>
                  <div class="dropdown-options"></div>
                </div>
              </div>

              <div class="form-group">
                <label>Name of the Board</label>
                <div id="board-dropdown" class="custom-dropdown">
                  <input type="hidden" id="board-value" value="CBSE">
                  <div class="selected-option">CBSE</div>
                  <div class="dropdown-options"></div>
                </div>
                <div id="board-other-wrap" style="display:none; margin-top:10px;">
                  <label style="font-size:0.95em;">Type Board Name</label>
                  <input type="text" id="board-other-input" placeholder="Enter Board Name">
                </div>
              </div>

              <div class="form-group">
                <label>Subject</label>
                <div id="subject-dropdown" class="custom-dropdown">
                  <input type="hidden" id="subject-value" value="English">
                  <div class="selected-option">English</div>
                  <div class="dropdown-options"></div>
                </div>
                <div id="subject-other-wrap" style="display:none; margin-top:10px;">
                  <label style="font-size:0.95em;">Type Subject Name</label>
                  <input type="text" id="subject-other-input" placeholder="Enter Subject Name">
                </div>
              </div>

              <div class="form-group">
                <label>Presentation Type</label>
                <div id="ptype-dropdown" class="custom-dropdown">
                  <input type="hidden" id="ptype-value" value="Lesson Explanation">
                  <div class="selected-option">Lesson Explanation</div>
                  <div class="dropdown-options"></div>
                </div>
              </div>

              <div class="form-group full">
                <label>Presentation Title</label>
                <input type="text" id="title-value" placeholder="Example: The Solar System">
              </div>

              <div class="form-group full">
                <label>Topic / Chapter</label>
                <input type="text" id="topic-value" placeholder="Example: Heat, Motion, Fractions, The French Revolution">
              </div>

              <div class="form-group">
                <label>Audience</label>
                <div id="audience-dropdown" class="custom-dropdown">
                  <input type="hidden" id="audience-value" value="Students">
                  <div class="selected-option">Students</div>
                  <div class="dropdown-options"></div>
                </div>
              </div>

              <div class="form-group">
                <label>Language</label>
                <div id="language-dropdown" class="custom-dropdown">
                  <input type="hidden" id="language-value" value="English">
                  <div class="selected-option">English</div>
                  <div class="dropdown-options"></div>
                </div>
              </div>

              <div class="form-group">
                <label>Number of Slides</label>
                <input type="number" id="slides-value" min="4" max="20" value="8">
              </div>

              <div class="form-group">
                <label>Level / Standard</label>
                <div id="level-dropdown" class="custom-dropdown">
                  <input type="hidden" id="level-value" value="Classroom Standard">
                  <div class="selected-option">Classroom Standard</div>
                  <div class="dropdown-options"></div>
                </div>
              </div>

              <div class="form-group full">
                <label>Learning Objectives</label>
                <textarea id="objectives-value" placeholder="Write one point per line&#10;Example:&#10;Understand the meaning of evaporation&#10;Identify daily life examples&#10;Explain the process clearly"></textarea>
              </div>

              <div class="form-group full">
                <label>Key Points / Main Content</label>
                <textarea id="points-value" placeholder="Write important points, one per line&#10;Example:&#10;Definition&#10;Causes&#10;Examples&#10;Applications&#10;Important formula"></textarea>
              </div>

              <div class="form-group full">
                <label>Teacher Notes / Extra Instructions</label>
                <textarea id="notes-value" placeholder="Example: Use simple language, include one activity slide, add 2 real-life examples, avoid too much text"></textarea>
              </div>

              <div class="form-group full">
                <label>Include Slides</label>
                <div class="toggle-grid">
                  <label class="toggle-card">
                    <input type="checkbox" id="opt-title" checked>
                    <span>Title Slide</span>
                  </label>

                  <label class="toggle-card">
                    <input type="checkbox" id="opt-objectives" checked>
                    <span>Objectives Slide</span>
                  </label>

                  <label class="toggle-card">
                    <input type="checkbox" id="opt-concepts" checked>
                    <span>Concept / Explanation Slides</span>
                  </label>

                  <label class="toggle-card">
                    <input type="checkbox" id="opt-examples" checked>
                    <span>Examples Slide</span>
                  </label>

                  <label class="toggle-card">
                    <input type="checkbox" id="opt-activity">
                    <span>Activity Slide</span>
                  </label>

                  <label class="toggle-card">
                    <input type="checkbox" id="opt-summary" checked>
                    <span>Summary Slide</span>
                  </label>

                  <label class="toggle-card">
                    <input type="checkbox" id="opt-homework">
                    <span>Homework Slide</span>
                  </label>

                  <label class="toggle-card">
                    <input type="checkbox" id="opt-thankyou" checked>
                    <span>Thank You / Questions Slide</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="button-row">
              <button type="button" id="generate-ppt-btn">Generate PPT</button>
              <button type="button" id="copy-json-btn" class="secondary-btn">Copy Request Data</button>
            </div>

            <div class="status-text" id="status-text"></div>
            <div class="helper-note">
              Replace the Apps Script URL inside this file before using the Generate PPT button.
            </div>

            <div id="result-box" class="result-box"></div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    const APP_CONFIG = {
      // Replace this later with your deployed Google Apps Script Web App URL
      APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwLPUamfqQKAu3WfkFJcNSRqpoW72mZ3NsfxibeXQETHIMgh4vqfgc2j699KAFQ3Emdag/exec",

      classes: [
        "3rd Class", "4th Class", "5th Class", "6th Class",
        "7th Class", "8th Class", "9th Class", "10th Class",
        "11th Class", "12th Class"
      ],

      boards: [
        "CBSE",
        "ICSE",
        "Olympiad",
        "IIT & NEET Foundation",
        "JEE Mains",
        "JEE Advance",
        "NEET",
        "AP State Board (SCERT)",
        "Other"
      ],

      boardSubjectMappings: {
        "CBSE": [
          "English",
          "Hindi",
          "Mathematics",
          "Science",
          "Social Science",
          "Computer Science / IT",
          "Sanskrit",
          "Physical Education",
          "General Knowledge",
          "Environmental Studies",
          "Other"
        ],
        "ICSE": [
          "English Language",
          "English Literature",
          "Second Language",
          "Mathematics",
          "Physics",
          "Chemistry",
          "Biology",
          "History & Civics",
          "Geography",
          "Computer Applications",
          "Environmental Education",
          "Commercial Studies / Economics",
          "Other"
        ],
        "Olympiad": [
          "Mathematics",
          "Science",
          "English",
          "Reasoning",
          "General Knowledge",
          "Cyber / Computer",
          "Other"
        ],
        "IIT & NEET Foundation": [
          "Math IIT",
          "Physics IIT & NEET",
          "Chemistry IIT & NEET",
          "Biology NEET",
          "Reasoning IIT & NEET",
          "Other"
        ],
        "JEE Mains": [
          "Physics (Mains)",
          "Chemistry (Mains)",
          "Mathematics (Mains)",
          "Other"
        ],
        "JEE Advance": [
          "Physics (Advance)",
          "Chemistry (Advance)",
          "Mathematics (Advance)",
          "Other"
        ],
        "NEET": [
          "Physics (NEET)",
          "Chemistry (NEET)",
          "Biology (NEET)",
          "Other"
        ],
        "AP State Board (SCERT)": [
          "Telugu",
          "Hindi",
          "English",
          "Mathematics",
          "Physical Science",
          "Biological Science",
          "Social Studies",
          "General Science",
          "Computer / ICT",
          "Other"
        ],
        "Other": [
          "Other"
        ]
      },

      presentationTypes: [
        "Lesson Explanation",
        "Concept Teaching",
        "Revision PPT",
        "Seminar PPT",
        "Project Presentation",
        "Exam Preparation",
        "Parent Orientation",
        "Teacher Meeting",
        "Morning Assembly",
        "Other"
      ],

      audiences: [
        "Students",
        "Teachers",
        "Parents",
        "Mixed Audience"
      ],

      languages: [
        "English",
        "Telugu",
        "Hindi",
        "Bilingual (English + Telugu)",
        "Bilingual (English + Hindi)"
      ],

      levels: [
        "Classroom Standard",
        "Easy",
        "Moderate",
        "Advanced",
        "Foundation / Competitive"
      ],

      getSubjectsForBoard(boardName) {
        const b = (boardName || "").trim();
        const map = this.boardSubjectMappings || {};
        return Array.isArray(map[b]) ? map[b] : ["Other"];
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      buildDropdownOptions();
      setupCustomDropdowns();
      syncOtherToggles();
      bindEvents();
    });

    function buildDropdownOptions() {
      fillDropdown("class-dropdown", APP_CONFIG.classes);
      fillDropdown("board-dropdown", APP_CONFIG.boards);
      fillDropdown("ptype-dropdown", APP_CONFIG.presentationTypes);
      fillDropdown("audience-dropdown", APP_CONFIG.audiences);
      fillDropdown("language-dropdown", APP_CONFIG.languages);
      fillDropdown("level-dropdown", APP_CONFIG.levels);

      const initialBoard = document.getElementById("board-value").value || "CBSE";
      updateSubjectDropdown(initialBoard);
    }

    function fillDropdown(dropdownId, items) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      const optionsWrap = dropdown.querySelector(".dropdown-options");
      optionsWrap.innerHTML = (items || [])
        .map(item => `<div data-value="${escapeHtml(item)}">${escapeHtml(item)}</div>`)
        .join("");
    }

    function bindEvents() {
      document.getElementById("board-other-input")?.addEventListener("input", syncOtherToggles);
      document.getElementById("subject-other-input")?.addEventListener("input", syncOtherToggles);

      document.getElementById("generate-ppt-btn")?.addEventListener("click", generatePPT);
      document.getElementById("copy-json-btn")?.addEventListener("click", copyRequestData);

      document.addEventListener("click", function(event) {
        document.querySelectorAll(".custom-dropdown.open").forEach(dropdown => {
          if (!dropdown.contains(event.target)) {
            dropdown.classList.remove("open");
          }
        });
      });
    }

    function setupCustomDropdowns() {
      setupCustomDropdown("class-dropdown", "class-value");

      setupCustomDropdown("board-dropdown", "board-value", selectedBoard => {
        updateSubjectDropdown(selectedBoard);
        syncOtherToggles();
      });

      setupCustomDropdown("subject-dropdown", "subject-value", () => {
        syncOtherToggles();
      });

      setupCustomDropdown("ptype-dropdown", "ptype-value");
      setupCustomDropdown("audience-dropdown", "audience-value");
      setupCustomDropdown("language-dropdown", "language-value");
      setupCustomDropdown("level-dropdown", "level-value");
    }

    function setupCustomDropdown(dropdownId, inputId, callback) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;

      const selected = dropdown.querySelector(".selected-option");
      const options = dropdown.querySelector(".dropdown-options");
      const input = document.getElementById(inputId);

      selected.onclick = e => {
        e.stopPropagation();
        toggleDropdown(dropdownId);
      };

      bindDropdownOptions(options, selected, input, dropdown, callback);
    }

    function bindDropdownOptions(options, selected, input, dropdown, callback) {
      options.querySelectorAll("div[data-value]").forEach(option => {
        option.onclick = () => {
          selected.textContent = option.dataset.value;
          input.value = option.dataset.value;
          dropdown.classList.remove("open");
          if (typeof callback === "function") callback(input.value);
        };
      });
    }

    function toggleDropdown(dropdownId) {
      const currentDropdown = document.getElementById(dropdownId);
      if (!currentDropdown) return;

      const currentlyOpen = currentDropdown.classList.contains("open");

      document.querySelectorAll(".custom-dropdown.open").forEach(d => {
        if (d.id !== dropdownId) d.classList.remove("open");
      });

      if (!currentlyOpen) currentDropdown.classList.add("open");
    }

    function updateSubjectDropdown(selectedBoard) {
      const subjectDropdown = document.getElementById("subject-dropdown");
      if (!subjectDropdown) return;

      const subjectOptions = subjectDropdown.querySelector(".dropdown-options");
      const subjectSelected = subjectDropdown.querySelector(".selected-option");
      const subjectInput = document.getElementById("subject-value");

      const newSubjects = APP_CONFIG.getSubjectsForBoard(selectedBoard);
      subjectOptions.innerHTML = newSubjects
        .map(s => `<div data-value="${escapeHtml(s)}">${escapeHtml(s)}</div>`)
        .join("");

      const firstValue = newSubjects[0] || "Other";
      subjectSelected.textContent = firstValue;
      subjectInput.value = firstValue;

      bindDropdownOptions(subjectOptions, subjectSelected, subjectInput, subjectDropdown, syncOtherToggles);
    }

    function syncOtherToggles() {
      const boardVal = document.getElementById("board-value")?.value || "";
      const subjectVal = document.getElementById("subject-value")?.value || "";

      const boardWrap = document.getElementById("board-other-wrap");
      const boardOther = document.getElementById("board-other-input");

      const subjectWrap = document.getElementById("subject-other-wrap");
      const subjectOther = document.getElementById("subject-other-input");

      const subjectSelected = document.querySelector("#subject-dropdown .selected-option");
      const subjectHidden = document.getElementById("subject-value");

      const boardIsOther = boardVal === "Other";
      const subjectIsOther = subjectVal === "Other";

      if (boardWrap) boardWrap.style.display = boardIsOther ? "block" : "none";
      if (!boardIsOther && boardOther) boardOther.value = "";

      const showSubjectOther = boardIsOther || subjectIsOther;
      if (subjectWrap) subjectWrap.style.display = showSubjectOther ? "block" : "none";
      if (!showSubjectOther && subjectOther) subjectOther.value = "";

      if (boardIsOther && subjectHidden && subjectHidden.value !== "Other") {
        subjectHidden.value = "Other";
        if (subjectSelected) subjectSelected.textContent = "Other";
      }
    }

    function getFinalBoard() {
      const rawBoard = document.getElementById("board-value")?.value || "";
      const otherBoard = (document.getElementById("board-other-input")?.value || "").trim();
      return rawBoard === "Other" ? (otherBoard || "Other") : rawBoard;
    }

    function getFinalSubject() {
      const rawSubject = document.getElementById("subject-value")?.value || "";
      const otherSubject = (document.getElementById("subject-other-input")?.value || "").trim();
      return rawSubject === "Other" ? (otherSubject || "Other") : rawSubject;
    }

    function getLines(text) {
      return String(text || "")
        .split(/\r?\n/)
        .map(v => v.trim())
        .filter(Boolean);
    }

    function buildPayload() {
      return {
        schoolName: "St. Patrick's School",
        schoolSubtitle: "IIT & NEET FOUNDATION",
        className: document.getElementById("class-value")?.value || "",
        board: getFinalBoard(),
        subject: getFinalSubject(),
        presentationType: document.getElementById("ptype-value")?.value || "",
        title: (document.getElementById("title-value")?.value || "").trim(),
        topic: (document.getElementById("topic-value")?.value || "").trim(),
        audience: document.getElementById("audience-value")?.value || "",
        language: document.getElementById("language-value")?.value || "",
        level: document.getElementById("level-value")?.value || "",
        slideCount: parseInt(document.getElementById("slides-value")?.value || "8", 10) || 8,
        objectives: getLines(document.getElementById("objectives-value")?.value || ""),
        keyPoints: getLines(document.getElementById("points-value")?.value || ""),
        teacherNotes: (document.getElementById("notes-value")?.value || "").trim(),
        includeSlides: {
          title: !!document.getElementById("opt-title")?.checked,
          objectives: !!document.getElementById("opt-objectives")?.checked,
          concepts: !!document.getElementById("opt-concepts")?.checked,
          examples: !!document.getElementById("opt-examples")?.checked,
          activity: !!document.getElementById("opt-activity")?.checked,
          summary: !!document.getElementById("opt-summary")?.checked,
          homework: !!document.getElementById("opt-homework")?.checked,
          thankYou: !!document.getElementById("opt-thankyou")?.checked
        },
        createdAt: new Date().toISOString()
      };
    }

    function validatePayload(payload) {
      if (!payload.className || !payload.board || !payload.subject) {
        return "Please fill Class, Board, and Subject.";
      }
      if (!payload.title) {
        return "Please enter Presentation Title.";
      }
      if (!payload.topic) {
        return "Please enter Topic / Chapter.";
      }
      if (payload.slideCount < 4 || payload.slideCount > 20) {
        return "Slides should be between 4 and 20.";
      }
      if (!payload.objectives.length && !payload.keyPoints.length && !payload.teacherNotes) {
        return "Please add Learning Objectives, Key Points, or Teacher Notes.";
      }
      return "";
    }

    async function generatePPT() {
      const btn = document.getElementById("generate-ppt-btn");
      const status = document.getElementById("status-text");
      const resultBox = document.getElementById("result-box");

      const payload = buildPayload();
      const error = validatePayload(payload);

      if (error) {
        toast(error);
        return;
      }

      if (!APP_CONFIG.APPS_SCRIPT_URL || APP_CONFIG.APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL") {
        toast("First add your Apps Script Web App URL in the file.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating...";
      status.textContent = "Creating presentation...";
      resultBox.classList.remove("show");
      resultBox.innerHTML = "";

      try {
        // text/plain avoids unnecessary preflight issues in many setups
        const res = await fetch(APP_CONFIG.APPS_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const rawText = await res.text();
        let data = {};

        try {
          data = JSON.parse(rawText);
        } catch (e) {
          throw new Error("Invalid response from Apps Script.");
        }

        if (!data || !data.success || !data.url) {
          throw new Error(data.message || "Presentation URL not received.");
        }

        status.textContent = "Presentation created successfully.";
        resultBox.innerHTML = `
          <div style="font-weight:700; margin-bottom:8px;">PPT created successfully.</div>
          <div style="margin-bottom:8px;">Open the presentation:</div>
          <a href="${escapeAttribute(data.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(data.url)}</a>
        `;
        resultBox.classList.add("show");

        toast("PPT created successfully.");
        window.open(data.url, "_blank", "noopener,noreferrer");
      } catch (err) {
        console.error(err);
        status.textContent = "Could not create presentation.";
        resultBox.innerHTML = `
          <div style="font-weight:700; margin-bottom:8px; color:#9b1c1c;">Generation failed.</div>
          <div style="line-height:1.6;">${escapeHtml(err.message || "Unknown error")}</div>
        `;
        resultBox.classList.add("show");
        toast("PPT generation failed.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate PPT";
      }
    }

    async function copyRequestData() {
      const payload = buildPayload();
      const error = validatePayload(payload);

      if (error) {
        toast(error);
        return;
      }

      try {
        await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
        toast("Request data copied.");
      } catch (e) {
        toast("Could not copy request data.");
      }
    }

    function toast(msg) {
      const t = document.createElement("div");
      t.className = "app-toast";
      t.textContent = msg;
      document.body.appendChild(t);

      setTimeout(() => {
        t.style.transition = "opacity .35s";
        t.style.opacity = "0";
      }, 1200);

      setTimeout(() => t.remove(), 1700);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttribute(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
