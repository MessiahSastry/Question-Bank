<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Explain It • Chat handoff</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f6fbff;font-family:system-ui,Segoe UI,Arial}
    .card{background:#fff;border:1px solid #dbe9ff;border-radius:14px;box-shadow:0 6px 22px rgba(23,98,167,.12);padding:24px 20px;max-width:540px;width:92%}
    h1{margin:0 0 10px;font-size:1.2rem;color:#0f3d6b}
    p{margin:6px 0 0;color:#134579;line-height:1.5}
    .mono{white-space:pre-wrap;background:#f7fbff;border:1px dashed #cfe0f7;border-radius:8px;padding:10px;margin-top:12px;font-size:.95rem;color:#1b4676}
    .row{display:flex;gap:8px;margin-top:14px}
    button{border:none;border-radius:10px;padding:10px 14px;font-weight:700;color:#fff;background:linear-gradient(90deg,#1762a7,#0f3d6b);cursor:pointer}
    a.btn{display:inline-block;text-decoration:none}
    .ghost{background:#eef4ff;color:#175799}
  </style>
</head>
<body>
  <div class="card">
    <h1>Opening ChatGPT…</h1>
    <p id="status">Copying your prompt and launching ChatGPT.</p>
    <div id="preview" class="mono" style="display:none;"></div>
    <div class="row">
      <button id="copyBtn" class="ghost" type="button">Copy again</button>
      <a id="openBtn" class="btn" href="https://chatgpt.com/?model=gpt-4o" target="_blank" rel="noopener">Open ChatGPT</a>
    </div>
  </div>

  <script>
    // read ?prompt=... from URL
    const params = new URLSearchParams(location.search);
    const prompt = params.get('prompt') || '';
    const statusEl = document.getElementById('status');
    const previewEl = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const openBtn = document.getElementById('openBtn');

    if (prompt) {
      previewEl.textContent = prompt;
      previewEl.style.display = 'block';
    }

    async function copyPrompt() {
      try {
        await navigator.clipboard.writeText(prompt);
        statusEl.textContent = 'Prompt copied. If ChatGPT opened, just paste and send.';
      } catch {
        statusEl.textContent = 'Clipboard blocked. Tap “Copy again”, then open ChatGPT and paste.';
      }
    }

    // Auto-copy, then try to open ChatGPT in same tab by default
    (async () => {
      await copyPrompt();

      // SAME TAB handoff (feels most “in-app”): replace current page with ChatGPT
      // If you prefer popup, swap to window.open(...) below.
      location.href = 'https://chatgpt.com/?model=gpt-4o';
    })();

    copyBtn.onclick = copyPrompt;
    // openBtn already points to ChatGPT (new tab) as a fallback
  </script>
</body>
</html>
