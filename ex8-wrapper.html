<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Examin8 inside — St. Patrick's</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body { margin:0; padding:0; height:100%; background:#f4f8fc; font-family:'Segoe UI', Arial, sans-serif; }
    header{
      background:linear-gradient(90deg,#1762a7,#0f3d6b); color:#fff; text-align:center;
      padding:14px 10px 10px; position:sticky; top:0; z-index:10;
      border-bottom-left-radius:18px; border-bottom-right-radius:18px;
    }
    header h1{margin:0;font-size:1.25rem;font-weight:800}
    header p{margin:4px 0 0;color:#cfe5ff;font-weight:600;font-size:.95rem}
    .bar{position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between;}
    .btn{
      background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.35);
      padding:8px 10px; border-radius:10px; font-weight:700; cursor:pointer; backdrop-filter:blur(2px);
    }
    .btn:hover{background:rgba(255,255,255,.28)}
    .frame-wrap{ height:calc(100dvh - 86px); }
    iframe{ width:100%; height:100%; border:0; background:#fff; }

    /* loading + fallback */
    #loading,#fallback{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(244,248,252,.95); z-index:9; text-align:center; padding:20px;
    }
    #loading .spinner{
      width:36px;height:36px;border:4px solid #d7e8ff;border-top-color:#0f3d6b;border-radius:50%;
      animation:spin 1s linear infinite;margin:0 auto 12px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    #fallback{display:none}
    #fallback .card{background:#fff;border:1px solid #e4ecf6;border-radius:12px;padding:16px;max-width:420px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    #fallback h3{margin:0 0 8px;color:#0f3d6b}
    #fallback p{margin:0 0 12px;color:#355b86}
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <button class="btn" id="backBtn">← Back</button>
      <button class="btn" id="openNew">Open in new tab ↗</button>
    </div>
    <h1>St. Patrick's School</h1>
    <p>IIT &amp; NEET FOUNDATION • Examin8</p>
  </header>

  <div class="frame-wrap">
    <iframe id="ex8" title="Examin8"></iframe>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div>
      <div class="spinner"></div>
      <div style="color:#355b86;font-weight:700;">Loading Examin8…</div>
    </div>
  </div>

  <!-- Fallback if Examin8 blocks iframes -->
  <div id="fallback">
    <div class="card">
      <h3>Can’t show Examin8 inside the page</h3>
      <p>The site is blocking embedding. Tap below to continue in a new tab.</p>
      <button class="btn" id="fallbackOpen">Open Examin8 ↗</button>
    </div>
  </div>

  <script>
    // Try the app URL first; switch to the main site if you prefer.
    const EXAMIN8_URL = 'https://app.examin8.com/'; // or 'https://examin8.com/'

    const frame = document.getElementById('ex8');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');

    // Set iframe src
    frame.src = EXAMIN8_URL;

    // Mark loaded (note: some blocked pages still fire 'load', so we also keep a timeout)
    let loaded = false;
    frame.addEventListener('load', () => { loaded = true; loading.style.display = 'none'; });

    // If nothing seems to load in ~2.5s, assume X-Frame-Options/CSP blocking and show fallback.
    setTimeout(() => {
      if (!loaded) { loading.style.display = 'none'; fallback.style.display = 'flex'; }
    }, 2500);

    // Controls
    const openNew = () => window.open(EXAMIN8_URL, '_blank', 'noopener');
    document.getElementById('openNew').onclick = openNew;
    document.getElementById('fallbackOpen').onclick = openNew;
    document.getElementById('backBtn').onclick = () => history.back();
  </script>
</body>
</html>
