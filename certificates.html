<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Certificates | St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Icons / libs -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <!-- PDF + XLSX -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root{
      --primary-blue:#0f3d6b;
      --secondary-blue:#1762a7;
      --light-blue-bg:#f4f8fc;
      --border:#bcd6ef;
      --ink:#12416c;
    }
    html{height:-webkit-fill-available;}
    body{
      margin:0; padding:0; font-family:'Segoe UI',Arial,sans-serif;
      background:#f4f8fc; min-height:100vh; height:-webkit-fill-available;
    }
    .page{display:flex; flex-direction:column; min-height:100vh;}
    header{
      background:linear-gradient(90deg,#1762a7,#0f3d6b); color:#fff;
      border-bottom-left-radius:28px; border-bottom-right-radius:28px;
      min-height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:15px 10px 18px; position:sticky; top:0; z-index:10;
    }
    header .title{font-size:1.8em; font-weight:700; margin:0;}
    header .sub{font-size:1.05em; color:#e0eaff; margin-top:5px;}
    main{flex:1 1 0%; min-height:0; overflow:auto; padding:18px; display:grid; gap:18px;}
    .card{
      background:#fff; border-radius:16px; box-shadow:0 4px 18px rgba(0,27,68,.11);
      padding:20px 16px; max-width:980px; margin:0 auto;
    }
    .card h2{margin:0 0 14px 0; color:var(--primary-blue); font-size:1.2em}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
    .row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
    .fg{display:flex; flex-direction:column; gap:6px;}
    .fg label{font-weight:600; color:#185496; font-size:.95em}
    input[type="text"], input[type="number"], input[type="file"], textarea, select{
      width:100%; box-sizing:border-box; border:1.3px solid var(--border); border-radius:8px;
      background:#f7fafd; padding:10px 12px; font-size:1em;
    }
    input[type="color"]{height:42px; padding:2px}
    textarea{min-height:90px; resize:vertical}
    .btn{
      background:linear-gradient(90deg,#1762a7,#0f3d6b); color:#fff; font-weight:700; border:none;
      padding:10px 14px; border-radius:8px; cursor:pointer;
      box-shadow:0 2px 8px rgba(15,61,107,.15);
    }
    .btn:active{transform:scale(.98)}
    .btn-ghost{background:#e9f2fb; color:#0f3d6b; border:1px solid #cfe3f7}
    .btn-danger{background:#c0392b}
    .hint{color:#54656f; font-size:.9em}
    .table{width:100%; border-collapse:collapse}
    .table th,.table td{border:1px solid #eef3f9; padding:8px 10px; text-align:left}
    .table th{background:#f4f8fc}
    .bar{display:flex; gap:8px; flex-wrap:wrap}
    .right{display:flex; justify-content:flex-end}
    .split{display:grid; grid-template-columns:1fr 480px; gap:18px;}
    .preview-wrap{background:#fff; border-radius:16px; box-shadow:0 4px 18px rgba(0,27,68,.11); padding:12px}
    canvas{width:100%; height:auto; background:#fff; border-radius:12px; border:1px solid #e7eef7}
    /* spinner overlay */
    #spinner{display:none; position:fixed; z-index:9999; inset:0; background:rgba(255,255,255,.8); align-items:center; justify-content:center}
    #spinner .dot{width:52px;height:52px;border:6px solid #1762a7;border-top:6px solid #bcd6ef;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:980px){ .split{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1 class="title">St. Patrick's School</h1>
      <div class="sub">IIT & NEET FOUNDATION</div>
    </header>

    <main class="split">
      <div>
        <!-- Recipients -->
        <div class="card">
          <h2>Recipients</h2>
          <div class="bar">
            <button class="btn" id="addRowBtn">Add Row</button>
            <button class="btn-ghost" id="clearRowsBtn">Clear</button>
            <button class="btn-ghost" id="downloadCsvSampleBtn">CSV Sample</button>
            <label class="btn-ghost" style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
              <i class="fa fa-file-import"></i> Import CSV/XLSX
              <input type="file" id="importCsvInput" accept=".csv,.xlsx,.xls" style="display:none">
            </label>
          </div>
          <div style="overflow:auto; margin-top:10px">
            <table class="table" id="recipientsTable">
              <thead>
                <tr>
                  <th>#</th><th>Name</th><th>Father</th><th>Class</th><th>Section</th><th>Rank</th><th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <div>
        <div class="preview-wrap">
          <h2 style="margin:0 0 8px 6px; color:#0f3d6b">Preview</h2>
          <canvas id="previewCanvas" width="2480" height="1754"></canvas>
        </div>

        <div class="card" style="margin-top:12px">
          <h2>Generate PDF</h2>
          <div class="bar">
            <button class="btn" id="genOnePdfBtn">Generate One PDF (top 3 only)</button>
            <button class="btn-ghost" id="genManyPdfBtn">Generate Separate PDFs (top 3 only)</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Spinner -->
  <div id="spinner"><div class="dot"></div></div>

<script>
const recipients = [];
const tbody = document.querySelector('#recipientsTable tbody');
const canvas = document.querySelector('#previewCanvas');
const ctx = canvas.getContext('2d');

function redrawTable(){
  tbody.innerHTML = '';
  recipients.forEach((r,idx)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx+1}</td>
      <td><input type="text" value="${r.name||''}" data-k="name"></td>
      <td><input type="text" value="${r.father||''}" data-k="father"></td>
      <td><input type="text" value="${r.cls||''}" data-k="cls"></td>
      <td><input type="text" value="${r.sec||''}" data-k="sec"></td>
      <td><input type="number" value="${r.rank||''}" data-k="rank" style="width:60px"></td>
      <td><button class="btn-ghost" data-del="${idx}">Remove</button></td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('input').forEach(inp=>{
    inp.oninput = e=>{
      const tr = e.target.closest('tr');
      const index = [...tbody.children].indexOf(tr);
      const key = e.target.dataset.k;
      recipients[index][key] = e.target.value;
    };
  });
  tbody.querySelectorAll('button[data-del]').forEach(b=>{
    b.onclick = e=>{
      const idx = +e.target.dataset.del;
      recipients.splice(idx,1);
      redrawTable();
    };
  });
}
document.getElementById('addRowBtn').onclick=()=>{recipients.push({}); redrawTable();};
document.getElementById('clearRowsBtn').onclick=()=>{recipients.length=0; redrawTable();};

document.getElementById('downloadCsvSampleBtn').onclick=()=>{
  const csv="Name,Father,Class,Section,Rank\nJohn Paul,David,10th,A,1\nAsha,,9th,B,2\n";
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="sample.csv"; a.click();
};

document.getElementById('importCsvInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f)return;
  const ab=await f.arrayBuffer(); let rows=[];
  if(f.name.endsWith('.csv')){
    const text=new TextDecoder().decode(ab);
    rows=text.split(/\r?\n/).map(l=>l.split(','));
  }else{
    const wb=XLSX.read(ab,{type:'array'});
    rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  }
  const header=rows[0].map(h=>h.toString().trim().toLowerCase());
  const iName=header.indexOf('name');
  const iFather=header.indexOf('father');
  const iClass=header.indexOf('class');
  const iSec=header.indexOf('section');
  const iRank=header.indexOf('rank');
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r[iName])continue;
    recipients.push({
      name:r[iName], father:r[iFather]||'', cls:r[iClass]||'', sec:r[iSec]||'', rank:+r[iRank]||''
    });
  }
  redrawTable(); e.target.value='';
});

function drawCertificate(r){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000'; ctx.font="40px Arial"; ctx.textAlign='center';
  ctx.fillText("Certificate of Merit",canvas.width/2,200);
  ctx.font="32px Arial"; ctx.fillText(`${r.name}`,canvas.width/2,300);
  ctx.font="24px Arial"; ctx.fillText(`Class ${r.cls}-${r.sec}`,canvas.width/2,380);
  ctx.fillText(`Rank ${r.rank}`,canvas.width/2,430);
}

async function buildOnePdf(){
  const top3=recipients.filter(r=>[1,2,3].includes(+r.rank));
  if(!top3.length)return alert("No rank 1,2,3 students found.");
  const {PDFDocument}=PDFLib; const pdfDoc=await PDFDocument.create();
  for(const r of top3){
    drawCertificate(r);
    const jpgUrl=canvas.toDataURL('image/jpeg',0.95);
    const page=pdfDoc.addPage([842,595]);
    const jpg=await pdfDoc.embedJpg(jpgUrl);
    const {width,height}=jpg.scale(1);
    const ratio=Math.min(842/width,595/height);
    const w=width*ratio,h=height*ratio;
    const x=(842-w)/2,y=(595-h)/2;
    page.drawImage(jpg,{x,y,width:w,height:h});
  }
  const bytes=await pdfDoc.save();
  const blob=new Blob([bytes],{type:'application/pdf'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="Certificates_Top3.pdf"; a.click();
}

async function buildManyPdfs(){
  const top3=recipients.filter(r=>[1,2,3].includes(+r.rank));
  if(!top3.length)return alert("No rank 1,2,3 students found.");
  const {PDFDocument}=PDFLib;
  for(const r of top3){
    drawCertificate(r);
    const jpgUrl=canvas.toDataURL('image/jpeg',0.95);
    const pdfDoc=await PDFDocument.create();
    const page=pdfDoc.addPage([842,595]);
    const jpg=await pdfDoc.embedJpg(jpgUrl);
    const {width,height}=jpg.scale(1);
    const ratio=Math.min(842/width,595/height);
    const w=width*ratio,h=height*ratio;
    const x=(842-w)/2,y=(595-h)/2;
    page.drawImage(jpg,{x,y,width:w,height:h});
    const bytes=await pdfDoc.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`Certificate_${r.name}_Rank${r.rank}.pdf`;
    a.click();
    await new Promise(res=>setTimeout(res,100));
  }
}

document.getElementById('genOnePdfBtn').onclick=buildOnePdf;
document.getElementById('genManyPdfBtn').onclick=buildManyPdfs;
</script>
</body>
</html>
