<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certificates - St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- PDF Lib -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

  <!-- Choices.js for nice dropdowns -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <style>
    body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f4f8fc; }
    .container { max-width:800px; margin:20px auto; background:#fff; padding:20px; border-radius:12px;
                 box-shadow:0 4px 12px rgba(0,0,0,.1); }
    h1 { text-align:center; color:#0f3d6b; }
    .section { margin-bottom:20px; }
    label { font-weight:600; color:#0f3d6b; display:block; margin-bottom:6px; }
    select { width:100%; }
    .actions { display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
    button { flex:1; padding:12px; border:none; border-radius:6px; font-weight:600; cursor:pointer; }
    .btn-main { background:#0f3d6b; color:#fff; }
    .btn-ghost { background:#e9f2fb; color:#0f3d6b; }
    canvas { width:100%; border:1px solid #ccc; border-radius:8px; margin-top:16px; }
  /* Student photo style for certificates */
.student-photo {
  position: absolute; /* so it can float in a fixed place if needed */
  top: 160px;  /* adjust to your design */
  left: 160px; /* adjust to your design */
  width: 200px;
  height: 240px;
  border: 3px solid #0f3d6b;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
}

.student-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>Certificate Generator</h1>

    <div class="section">
      <label for="yearSel">Academic Year</label>
      <select id="yearSel"></select>
    </div>

    <div class="section">
      <label for="classSel">Class</label>
      <select id="classSel"></select>
    </div>

    <div class="section">
      <label for="sectionSel">Section</label>
      <select id="sectionSel"></select>
    </div>

    <div class="section">
      <label for="examSel">Exam</label>
      <select id="examSel"></select>
    </div>

    <div class="actions">
      <button class="btn-main" id="previewBtn">Preview Top 3</button>
      <button class="btn-ghost" id="downloadOneBtn">Download One PDF</button>
      <button class="btn-ghost" id="downloadManyBtn">Download Separate PDFs</button>
    </div>

    <canvas id="previewCanvas" width="2480" height="1754"></canvas>
  </div>

<script>
// ---------- FIREBASE INIT ----------
const firebaseConfig = {
  apiKey: "AIzaSyAszVhWXUUOYLQ7VimKmPKf1yEu_CI9RCE",
  authDomain: "stpatricks-questionbank.firebaseapp.com",
  projectId: "stpatricks-questionbank",
  storageBucket: "stpatricks-questionbank.appspot.com",
  messagingSenderId: "917615322861",
  appId: "1:917615322861:web:c6c890aa2184dd395b8ee4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ---------- UI ----------
const yearSel = new Choices('#yearSel',{searchEnabled:false});
const classSel = new Choices('#classSel',{searchEnabled:false});
const sectionSel = new Choices('#sectionSel',{searchEnabled:false});
const examSel = new Choices('#examSel',{searchEnabled:false});
const previewBtn = document.getElementById('previewBtn');
const downloadOneBtn = document.getElementById('downloadOneBtn');
const downloadManyBtn = document.getElementById('downloadManyBtn');
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');

let years=[], classes=[], sections=[], exams=[], students=[];
let bgImage=null;

// Load certificate.png from repo
(async()=>{
  bgImage=new Image();
  bgImage.crossOrigin="anonymous";
  bgImage.src="https://raw.githubusercontent.com/MessiahSastry/Question-Bank/main/certificate.png";
  await new Promise(res=>bgImage.onload=res);
  renderPreview({});
})();

// ---------- LOAD DATA ----------
async function loadYears(){
  let snap=await db.collection('years').orderBy('name','desc').get();
  years=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
  yearSel.setChoices(years.map(y=>({value:y.id,label:y.id})), 'value','label', true);
  await loadClasses();
}
async function loadClasses(){
  let year=yearSel.getValue(true);
  if(!year) return;
  let snap=await db.collection('years').doc(year).collection('classes').orderBy('name').get();
  classes=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
  classSel.setChoices(classes.map(c=>({value:c.id,label:c.name})), 'value','label', true);
  await loadSections();
}
async function loadSections(){
  let year=yearSel.getValue(true), classId=classSel.getValue(true);
  if(!year||!classId) return;
  let snap=await db.collection('years').doc(year).collection('classes').doc(classId).collection('sections').orderBy('name').get();
  sections=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
  sectionSel.setChoices(sections.map(s=>({value:s.id,label:s.name})), 'value','label', true);
  await loadExams();
}
async function loadExams(){
  let year=yearSel.getValue(true), classId=classSel.getValue(true);
  if(!year||!classId) return;
  let snap=await db.collection('years').doc(year).collection('exams').doc('classGroups').collection('class-10').get(); // adjust class-group if needed
  exams=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
  examSel.setChoices(exams.map(e=>({value:e.id,label:e.name})), 'value','label', true);
  await loadStudents();
}
async function loadStudents(){
  let year=yearSel.getValue(true), classId=classSel.getValue(true), sectionId=sectionSel.getValue(true);
  if(!year||!classId||!sectionId) return;
  let snap=await db.collection('years').doc(year).collection('classes').doc(classId).collection('sections').doc(sectionId).collection('students').orderBy('roll').get();
  students=[];
  snap.forEach(doc=>{let d=doc.data(); if(!d.isDeleted) students.push({id:doc.id,...d});});
}

// ---------- FETCH MARKS + RANK ----------
async function fetchStudentData(stu){
  let year=yearSel.getValue(true), classId=classSel.getValue(true), sectionId=sectionSel.getValue(true), examId=examSel.getValue(true);
  let examObj=exams.find(e=>e.id===examId);
  let marksDoc=await db.collection('years').doc(year).collection('classes').doc(classId).collection('sections').doc(sectionId).collection('students').doc(stu.id).collection('marks').doc(examId).get();
  let marks=marksDoc.exists ? marksDoc.data() : {};
  let subjects=(examObj && Array.isArray(examObj.subjects)) ? examObj.subjects : [];
  let totalMarks=0,totalMax=0;
  subjects.forEach(sub=>{
    let m=marks[sub.name] ?? '';
    if(m!=='' && !isNaN(m)){ totalMarks+=+m; }
    if(sub.max && !isNaN(sub.max)){ totalMax+=+sub.max; }
  });
    return {
    name: stu.name,
    father: stu.father,
    class: classes.find(c=>c.id===classId)?.name || '',
    section: sections.find(s=>s.id===sectionId)?.name || '',
    totalMarks,totalMax,
    percentage: totalMax? Math.round((totalMarks/totalMax)*100):'',
    photoUrl: stu.photoUrl || ''  // ✅ include photo
  };
}

async function getTop3Students(){
  let arr=[];
  for(let stu of students){
    let dat=await fetchStudentData(stu);
    arr.push(dat);
  }
  arr.sort((a,b)=>b.totalMarks-a.totalMarks);
  let lastMark=null,lastRank=0;
  arr.forEach((d,i)=>{
    if(d.totalMarks!==lastMark){ lastRank=i+1; lastMark=d.totalMarks; }
    d.rank=lastRank;
  });
  return arr.filter(d=>d.rank<=3);
}

// ---------- CERTIFICATE DRAW ----------
async function drawCertificate(stu, examName){
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (bgImage) ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#000";
  ctx.textAlign = "center";

 // ✅ Draw student photo (robust) + always show a frame / fallback
const P_X = 300, P_Y = 600, P_W = 200, P_H = 240;

// Always draw the frame so you can see the slot
ctx.strokeStyle = "#0f3d6b";
ctx.lineWidth = 6;
ctx.strokeRect(P_X, P_Y, P_W, P_H);

if (stu.photoUrl) {
  try {
    // light fill while loading
    ctx.fillStyle = "#eef5ff";
    ctx.fillRect(P_X + 2, P_Y + 2, P_W - 4, P_H - 4);

    // Fetch then draw (more reliable with CORS and caching)
    const res = await fetch(stu.photoUrl, { mode: "cors", cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const blob = await res.blob();
    const bmp  = await createImageBitmap(blob);
    ctx.drawImage(bmp, P_X, P_Y, P_W, P_H);
  } catch (e) {
    // fallback text if fetch/draw failed
    ctx.fillStyle = "#999";
    ctx.font = "28px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText("No Photo", P_X + P_W/2, P_Y + P_H/2 + 10);
    console.warn("Photo draw failed:", stu.name, stu.photoUrl, e);
  }
} else {
  // no URL present
  ctx.fillStyle = "#999";
  ctx.font = "28px Segoe UI";
  ctx.textAlign = "center";
  ctx.fillText("No Photo", P_X + P_W/2, P_Y + P_H/2 + 10);
}
  ctx.font = "48px Segoe UI Bold";
  ctx.fillText(examName || "", 1211, 549);

  ctx.font = "64px Segoe Script";
  ctx.fillText(stu.name || "", 1223, 751);

  ctx.font = "40px Segoe UI";
  ctx.fillText(stu.father ? "S/o " + stu.father : "", 1214, 893);

  ctx.font = "40px Segoe UI";
  ctx.fillText(`Class ${stu.class || ""} - ${stu.section || ""}`, 1214, 800);

  ctx.font = "48px Segoe UI Bold";
  ctx.fillText(stu.rank ? `Rank ${stu.rank}` : "", 2112, 772);

  ctx.font = "32px Segoe UI Italic";
  ctx.fillText("Director", 772, 1400);

  ctx.font = "32px Segoe UI Italic";
  ctx.fillText("Class Teacher", 1759, 1412);
}

async function renderPreview(stu){
  await drawCertificate(stu || {}, examSel.getValue(true));
}

// ---------- PDF GENERATION ----------
async function downloadOnePDF(){
  const top3=await getTop3Students();
  if(!top3.length) return alert("No top 3 students.");
  const {PDFDocument}=PDFLib;
  const pdfDoc=await PDFDocument.create();
for (const stu of top3) {
  await drawCertificate(stu, examSel.getValue(true));
  const jpgUrl = canvas.toDataURL("image/jpeg", 0.95);
  const jpg = await pdfDoc.embedJpg(jpgUrl);
    const page=pdfDoc.addPage([842,595]);
    const {width,height}=jpg.scale(1);
    const ratio=Math.min(842/width,595/height);
    page.drawImage(jpg,{x:(842-width*ratio)/2,y:(595-height*ratio)/2,width:width*ratio,height:height*ratio});
  }
  const bytes=await pdfDoc.save();
  const blob=new Blob([bytes],{type:"application/pdf"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Certificates_Top3.pdf";
  a.click();
}

async function downloadManyPDFs(){
  const top3=await getTop3Students();
  if(!top3.length) return alert("No top 3 students.");
  const {PDFDocument}=PDFLib;
 for (const stu of top3) {
  await drawCertificate(stu, examSel.getValue(true));
  const jpgUrl = canvas.toDataURL("image/jpeg", 0.95);
  const pdfDoc = await PDFDocument.create();
    const jpg=await pdfDoc.embedJpg(jpgUrl);
    const page=pdfDoc.addPage([842,595]);
    const {width,height}=jpg.scale(1);
    const ratio=Math.min(842/width,595/height);
    page.drawImage(jpg,{x:(842-width*ratio)/2,y:(595-height*ratio)/2,width:width*ratio,height:height*ratio});
    const bytes=await pdfDoc.save();
    const blob=new Blob([bytes],{type:"application/pdf"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`Certificate_${stu.name}.pdf`;
    a.click();
    await new Promise(res=>setTimeout(res,100));
  }
}

// ---------- HOOKS ----------
previewBtn.onclick = async () => {
  const top3 = await getTop3Students();
  if (top3.length) await renderPreview(top3[0]);
};
downloadOneBtn.onclick=downloadOnePDF;
downloadManyBtn.onclick=downloadManyPDFs;

// INIT
loadYears();
</script>
</body>
</html>
