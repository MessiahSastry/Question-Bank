<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Certificates | St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Icons / libs -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#f4f8fc}
    .page{padding:20px}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:20px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #ccc;padding:6px;text-align:left}
    .btn{padding:8px 14px;border:none;border-radius:6px;cursor:pointer}
    .btn-main{background:#0f3d6b;color:#fff}
    .btn-ghost{background:#e9f2fb;color:#0f3d6b}
    canvas{width:100%;max-width:800px;border:1px solid #ccc;border-radius:8px;display:block;margin:10px auto}
  </style>
</head>
<body>
<div class="page">
  <div class="card">
    <h2>Recipients</h2>
    <button class="btn btn-main" id="addRowBtn">Add Row</button>
    <button class="btn btn-ghost" id="clearRowsBtn">Clear</button>
    <button class="btn btn-ghost" id="downloadCsvSampleBtn">CSV Sample</button>
    <label class="btn btn-ghost">
      Import CSV/XLSX
      <input type="file" id="importCsvInput" accept=".csv,.xlsx,.xls" style="display:none">
    </label>
    <table id="recipientsTable">
      <thead>
        <tr><th>#</th><th>Name</th><th>Father</th><th>Class</th><th>Section</th><th>Rank</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Preview</h2>
    <canvas id="previewCanvas" width="2480" height="1754"></canvas>
  </div>

  <div class="card">
    <h2>Generate PDF</h2>
    <button class="btn btn-main" id="genOnePdfBtn">One PDF (Top 3)</button>
    <button class="btn btn-ghost" id="genManyPdfBtn">Separate PDFs (Top 3)</button>
  </div>
</div>

<script>
const recipients=[]; 
const tbody=document.querySelector('#recipientsTable tbody');
const canvas=document.getElementById('previewCanvas');
const ctx=canvas.getContext('2d');
let bgImage=null;

// 🔹 Load certificate.png from GitHub main branch
async function loadBackground(){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>resolve(img);
    img.onerror=reject;
    // change YOUR_USERNAME/REPO to your actual GitHub username and repo name
    img.src="https://raw.githubusercontent.com/MessiahSastry/Question-Bank/main/certificate.png";
  });
}
loadBackground().then(img=>{bgImage=img;renderPreview();});

// ---------- Table Handling ----------
function redrawTable(){
  tbody.innerHTML='';
  recipients.forEach((r,idx)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${idx+1}</td>
      <td><input type="text" value="${r.name||''}" data-k="name"></td>
      <td><input type="text" value="${r.father||''}" data-k="father"></td>
      <td><input type="text" value="${r.cls||''}" data-k="cls"></td>
      <td><input type="text" value="${r.sec||''}" data-k="sec"></td>
      <td><input type="number" value="${r.rank||''}" data-k="rank" style="width:60px"></td>
      <td><button data-del="${idx}">X</button></td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('input').forEach(inp=>{
    inp.oninput=e=>{
      const tr=e.target.closest('tr');
      const index=[...tbody.children].indexOf(tr);
      recipients[index][e.target.dataset.k]=e.target.value;
      renderPreview();
    };
  });
  tbody.querySelectorAll('button[data-del]').forEach(b=>{
    b.onclick=e=>{recipients.splice(+b.dataset.del,1);redrawTable();renderPreview();}
  });
}
document.getElementById('addRowBtn').onclick=()=>{recipients.push({});redrawTable();};
document.getElementById('clearRowsBtn').onclick=()=>{recipients.length=0;redrawTable();};
document.getElementById('downloadCsvSampleBtn').onclick=()=>{
  const csv="Name,Father,Class,Section,Rank\nJohn Paul,David,10,A,1\nAsha,,9,B,2\n";
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="sample.csv";a.click();
};

// ---------- Certificate Drawing ----------
function drawCertificate(r){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if(bgImage) ctx.drawImage(bgImage,0,0,canvas.width,canvas.height);

  ctx.fillStyle="#000"; 
  ctx.textAlign="center";

  // Exam Name
  ctx.font="48px Segoe UI Bold";
  ctx.fillText(r.exam || "Exam Name", 1211, 549);

  // Student Name
  ctx.font="64px Segoe Script";
  ctx.fillText(r.name || "", 1223, 751);

  // Father Name
  ctx.font="40px Segoe UI";
  ctx.fillText(r.father ? "S/o " + r.father : "", 1214, 893);

  // Class & Section
  ctx.font="40px Segoe UI";
  ctx.fillText(`Class ${r.cls || ""} - ${r.sec || ""}`, 1214, 800);

  // Rank Badge
  ctx.font="48px Segoe UI Bold";
  if(r.rank) ctx.fillText(`Rank ${r.rank}`, 2112, 772);

  // Director Signature
  ctx.font="32px Segoe UI Italic";
  ctx.fillText("Director", 772, 1400);

  // Teacher Signature
  ctx.font="32px Segoe UI Italic";
  ctx.fillText("Class Teacher", 1759, 1412);
}

// ---------- PDF Generation ----------
async function buildOnePdf(){
  const top3=recipients.filter(r=>[1,2,3].includes(+r.rank));
  if(!top3.length)return alert("No rank 1,2,3 students found.");
  const {PDFDocument}=PDFLib; const pdfDoc=await PDFDocument.create();
  for(const r of top3){
    drawCertificate(r);
    const jpgUrl=canvas.toDataURL("image/jpeg",0.95);
    const page=pdfDoc.addPage([842,595]);
    const jpg=await pdfDoc.embedJpg(jpgUrl);
    const {width,height}=jpg.scale(1);
    const ratio=Math.min(842/width,595/height);
    const w=width*ratio,h=height*ratio;
    const x=(842-w)/2,y=(595-h)/2;
    page.drawImage(jpg,{x,y,width:w,height:h});
  }
  const bytes=await pdfDoc.save();
  const blob=new Blob([bytes],{type:"application/pdf"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Certificates_Top3.pdf";a.click();
}
async function buildManyPdfs(){
  const top3=recipients.filter(r=>[1,2,3].includes(+r.rank));
  if(!top3.length)return alert("No rank 1,2,3 students found.");
  const {PDFDocument}=PDFLib;
  for(const r of top3){
    drawCertificate(r);
    const jpgUrl=canvas.toDataURL("image/jpeg",0.95);
    const pdfDoc=await PDFDocument.create();
    const page=pdfDoc.addPage([842,595]);
    const jpg=await pdfDoc.embedJpg(jpgUrl);
    const {width,height}=jpg.scale(1);
    const ratio=Math.min(842/width,595/height);
    const w=width*ratio,h=height*ratio;
    const x=(842-w)/2,y=(595-h)/2;
    page.drawImage(jpg,{x,y,width:w,height:h});
    const bytes=await pdfDoc.save();
    const blob=new Blob([bytes],{type:"application/pdf"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`Certificate_${r.name}_Rank${r.rank}.pdf`;
    a.click();
    await new Promise(res=>setTimeout(res,100));
  }
}
document.getElementById('genOnePdfBtn').onclick=buildOnePdf;
document.getElementById('genManyPdfBtn').onclick=buildManyPdfs;
</script>
<script>
// 🔹 Helper: Show coordinates when clicking on canvas
canvas.addEventListener("click", function(e){
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) * (canvas.width / rect.width));
  const y = Math.round((e.clientY - rect.top) * (canvas.height / rect.height));
  alert(`Clicked at X=${x}, Y=${y}`);
});
</script>
</body>
</html>
