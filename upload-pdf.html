<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Import Questions from PDF | St. Patrick's School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --primary-blue: #0f3d6b;
      --secondary-blue: #1762a7;
      --light-blue-bg: #f4f8fc;
      --border-color: #bcd6ef;
      --text-dark: #12416c;
      --text-light: #54656f;
    }
    html { height: -webkit-fill-available; }
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f8fc;
      min-height: 100vh;
      height: -webkit-fill-available;
    }
    .page-wrapper {
      display: flex; flex-direction: column; min-height: 100vh;
    }
    #main-header {
      background: linear-gradient(90deg, #1762a7, #0f3d6b);
      color: #fff;
      border-bottom-left-radius: 28px; border-bottom-right-radius: 28px;
      min-height: 84px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 15px 10px 18px 10px;
      box-sizing: border-box; flex-shrink: 0;
      position: sticky; top: 0; z-index: 10;
    }
    #main-header .school-title { font-size: 1.8em; font-weight: bold; margin: 0;}
    #main-header .subtitle { font-size: 1.05em; color: #e0eaff; margin-top: 5px; }
    main {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    .form-container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto 22px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 27, 68, 0.11);
      padding: 28px 18px 24px 18px;
      flex-shrink: 0;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #0f3d6b;
      margin-top: 0;
      margin-bottom: 22px;
      font-size: 1.45em;
    }
    .form-group { margin-bottom: 17px; }
    .form-group label {
      font-weight: 600;
      color: #185496;
      display: block;
      margin-bottom: 7px;
      font-size: 1em;
    }
    .form-group input[type="file"] {
      width: 100%;
      padding: 8px 4px;
      border-radius: 6px;
      border: 1.3px solid #bcd6ef;
      font-size: 1em;
      background: #f7fafd;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .submit-btn {
      background: linear-gradient(90deg, #1762a7, #0f3d6b);
      color: #fff; font-weight: bold; cursor: pointer; padding: 13px 0;
      margin-top: 12px; width: 100%; border-radius: 8px; border: none; font-size: 1.09em;
      box-shadow: 0 2px 10px #0f3d6b0a;
    }
    .submit-btn:active { transform: scale(0.98);}
    #progress-msg {
      margin-top: 16px; color: #1762a7; font-weight: 500; text-align: center; min-height: 22px;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header id="main-header">
      <h1 class="school-title">St. Patrick's School</h1>
      <div class="subtitle">IIT & NEET FOUNDATION</div>
    </header>
    <main>
      <div class="form-container">
        <h2>Import Questions from PDF</h2>
        <form id="pdf-upload-form">
          <div class="form-group">
            <label for="pdfFile">Select a PDF file with questions:</label>
            <input type="file" id="pdfFile" accept=".pdf" required />
          </div>
          <button class="submit-btn" type="submit"><i class="fa fa-upload"></i> Upload & Extract</button>
        </form>
        <div id="progress-msg"></div>
      </div>
    </main>
  </div>
  <script>
    // Next: Connect to backend API
    document.getElementById('pdf-upload-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('progress-msg').textContent = "Feature coming soon: File will be sent to server for extraction!";
      // Next step: Use fetch() to send to backend (Flask/FastAPI).
    });
  </script>
</body>
</html>
